// Groq API anahtarı artık burada DEĞİL. İstekler /api/groq (Vercel serverless function) üzerinden
// yapılıyor; anahtar yalnızca Vercel'in Environment Variables ayarında (GROQ_API_KEY) tutuluyor.
// Bkz. /api/groq.js

// ── Groq kota yardımcıları ───────────────────────────────────────────────
// Groq "2m59.56s", "7.66s", "1h2m3s" veya "500ms" gibi süre string'leri döner; saniyeye çeviririz.
function groqSureCevir(str){
  if(!str) return null;
  str = String(str).trim();
  if(/^[\d.]+ms$/.test(str)) return parseFloat(str)/1000;
  let toplam = 0, bulundu = false;
  const saat = str.match(/([\d.]+)h/);
  const dakika = str.match(/([\d.]+)m(?!s)/);
  const saniye = str.match(/([\d.]+)s/);
  if(saat){ toplam += parseFloat(saat[1])*3600; bulundu = true; }
  if(dakika){ toplam += parseFloat(dakika[1])*60; bulundu = true; }
  if(saniye){ toplam += parseFloat(saniye[1]); bulundu = true; }
  if(!bulundu){
    const n = parseFloat(str);
    if(!isNaN(n)) toplam = n; else return null;
  }
  return toplam;
}
// Şu andan itibaren N saniye sonrasının saatini okunaklı yazar
function groqSaatFormatla(saniyeSonra){
  if(saniyeSonra===null || isNaN(saniyeSonra)) return '—';
  return new Date(Date.now() + saniyeSonra*1000).toLocaleTimeString('tr-TR');
}
// N saniyeyi "X dk Y sn" gibi yazar
function groqSureFormatla(saniye){
  if(saniye===null || isNaN(saniye)) return '';
  saniye = Math.max(0, Math.round(saniye));
  const dk = Math.floor(saniye/60), sn = saniye%60;
  return dk>0 ? `${dk} dk ${sn} sn` : `${sn} sn`;
}

// Groq, günlük istek hakkını (RPD) her zaman header'da vermeyebilir.
// Bu yüzden "bugün kaç şiir Groq ile yorumlandı / kaçı yerel algoritmaya düştü" bilgisini
// tarayıcıda ayrıca sayıyoruz; sayfa yenilense de kaybolmaz, her gün otomatik sıfırlanır.
const GROQ_GUNLUK_ANAHTAR = 'yo_groq_gunluk';
function groqGunlukDurum(){
  const bugun = new Date().toLocaleDateString('tr-TR');
  let kayit = lsGet(GROQ_GUNLUK_ANAHTAR, null);
  if(!kayit || kayit.tarih !== bugun){
    kayit = { tarih: bugun, basarili: 0, yerel: 0 };
    lsSet(GROQ_GUNLUK_ANAHTAR, kayit);
  }
  return kayit;
}
function groqGunlukArttir(basariliMi){
  const k = groqGunlukDurum();
  if(basariliMi) k.basarili++; else k.yerel++;
  lsSet(GROQ_GUNLUK_ANAHTAR, k);
  return k;
}

// Groq rate limit takibi (canlı, oturum bazlı)
// Kota süresi dolduğunda arka planda otomatik test isteği atılırken aynı anda
// birden fazla kontrolün üst üste binmesini engelleyen kilit.
let groqOtomatikKontrolDevamEdiyor = false;

const groqKota = {
  limitIstek: null,          // Groq'un bildirdiği istek limiti
  kalanIstek: null,          // kalan istek hakkı
  istekSifirlanmaSn: null,   // istek kotasının kaç saniye sonra yenileneceği
  limitToken: null,          // dakikalık token limiti
  kalanToken: null,          // kalan token
  tokenSifirlanmaSn: null,   // token kotasının kaç saniye sonra yenileneceği
  toplamIstek: 0,            // bu oturumda Groq'a yapılan toplam istek
  sonGuncelleme: null,       // son güncelleme saati
  sonKaynak: null,           // 'groq' | 'yerel' — son şiir yorumu nereden geldi
  sonModel: null,            // en son başarılı isteği hangi model karşıladı
  sonHata: null,             // son hata mesajı (varsa) — admin panelinde gösterilir
  kotaDolduMu: false,        // 429 (kota doldu) durumuna geçildi mi
  kotaAcilmaZamani: null,    // kota tekrar açılacağı an (Date.now() + saniye)
  kotaTuru: null,            // 'RPM' | 'RPD' | 'TPM' | 'TPD' — Groq'un hata mesajından okunur
  kotaLimit: null,           // ilgili kotanın toplam limiti
  kotaKullanilan: null,      // ilgili kotadan kullanılan miktar
  kotaMesaj: null,           // Groq'un ham hata mesajı
};

function groqKotaGuncelle(headers) {
  const get = k => headers.get(k);
  if (get('x-ratelimit-limit-requests'))     groqKota.limitIstek = parseInt(get('x-ratelimit-limit-requests'));
  if (get('x-ratelimit-remaining-requests')) groqKota.kalanIstek = parseInt(get('x-ratelimit-remaining-requests'));
  if (get('x-ratelimit-reset-requests'))     groqKota.istekSifirlanmaSn = groqSureCevir(get('x-ratelimit-reset-requests'));
  if (get('x-ratelimit-limit-tokens'))       groqKota.limitToken = parseInt(get('x-ratelimit-limit-tokens'));
  if (get('x-ratelimit-remaining-tokens'))   groqKota.kalanToken = parseInt(get('x-ratelimit-remaining-tokens'));
  if (get('x-ratelimit-reset-tokens'))       groqKota.tokenSifirlanmaSn = groqSureCevir(get('x-ratelimit-reset-tokens'));
  groqKota.sonGuncelleme = new Date().toLocaleTimeString('tr-TR');
  groqKota.toplamIstek++;
}

// Ham hata mesajını (sonHata) admin için anlaşılır bir teşhise çevirir.
function groqHataTanisi(hata){
  if(!hata) return null;
  if(/GEMINI_API_KEY tanımlı değil/i.test(hata))
    return '🔑 GEMINI_API_KEY Vercel\'de tanımlı değil. aistudio.google.com/apikey üzerinden anahtar alıp Vercel → Settings → Environment Variables\'a ekleyip yeniden deploy edin.';
  if(/ANTHROPIC_API_KEY tanımlı değil/i.test(hata))
    return '🔑 ANTHROPIC_API_KEY Vercel\'de tanımlı değil. console.anthropic.com/settings/keys üzerinden anahtar alıp Vercel → Settings → Environment Variables\'a ekleyip yeniden deploy edin.';
  if(/^429:/.test(hata)) return '⏳ Gerçek kota doldu. Yukarıdaki "Yenilenme" saatini bekleyin.';
  if(/^401:/.test(hata) || /invalid.?api.?key/i.test(hata) || /invalid_api_key/i.test(hata))
    return '🔑 API anahtarı geçersiz veya devre dışı bırakılmış. Not: API anahtarları kod içinde (ör. GitHub\'da) herkese açık paylaşılırsa sağlayıcı bunu otomatik olarak iptal edebilir. Yeni bir anahtar oluşturup Vercel\'de güncelleyin.';
  if(/^403:/.test(hata)) return '🚫 Erişim reddedildi (403) — API anahtarının bu modele/organizasyona erişim izni olmayabilir.';
  if(/model_decommissioned/i.test(hata) || /has been decommissioned/i.test(hata))
    return '🔁 Kullanılan model artık desteklenmiyor. Kodda model adını güncel bir modelle (ör. openai/gpt-oss-120b) değiştirin.';
  if(/^400:/.test(hata)) return '⚠️ İstek hatalı (400) — model adı, parametreler veya istek formatı reddedildi.';
  if(/^JSON_HATASI/.test(hata)) return '🤖 Yapay zeka geçerli JSON formatında yanıt vermedi (genelde geçici bir model tutarsızlığı) — tekrar denendiğinde genelde düzelir.';
  if(/^BOS_YANIT/.test(hata)) return '📭 Model boş içerik döndürdü — tekrar deneyin.';
  if(/Failed to fetch|NetworkError|TypeError/i.test(hata))
    return '🌐 Bağlanılamadı — ağ engeli, CORS kısıtlaması veya internet bağlantı sorunu olabilir.';
  return null;
}

// Groq, kota dolduğunda (429) response body'sinde şu formatta bir mesaj döner:
// "Rate limit reached for model `...` on requests per day (RPD): Limit 1000, Used 1000,
//  Requested 1. Please try again in 6m 11.52s. Visit ..."
// Bu bilgi, tarayıcının CORS nedeniyle engelleyebileceği x-ratelimit-* header'larının
// aksine HER ZAMAN okunabilir (response body serbestçe okunur), bu yüzden asıl
// güvenilir kota bilgisi kaynağımız burasıdır.
function groqHataAyristir(mesaj){
  if(!mesaj) return null;
  const turEsleme = {
    'requests per minute':'RPM (dakikalık istek)',
    'requests per day':'RPD (günlük istek)',
    'tokens per minute':'TPM (dakikalık token)',
    'tokens per day':'TPD (günlük token)'
  };
  let tur = null;
  for(const anahtar in turEsleme){ if(mesaj.toLowerCase().includes(anahtar)){ tur = turEsleme[anahtar]; break; } }
  const sayilar = mesaj.match(/Limit ([\d,]+),\s*Used ([\d,]+),\s*Requested ~?([\d,]+)/i);
  const sureEslesme = mesaj.match(/Please try again in\s*((?:[\d.]+h\s*)?(?:[\d.]+m\s*)?(?:[\d.]+s)?)/i);
  const bekleSn = sureEslesme ? groqSureCevir(sureEslesme[1].trim()) : null;
  return {
    tur,
    limit: sayilar ? parseInt(sayilar[1].replace(/,/g,'')) : null,
    kullanilan: sayilar ? parseInt(sayilar[2].replace(/,/g,'')) : null,
    bekleSn,
  };
}

// 429 (Too Many Requests) geldiğinde çağrılır: kota doldu bilgisini işaretler.
// mesaj: Groq'un response body'sindeki error.message alanı (varsa)
function groqKota429Isaretle(headers, mesaj){
  groqKota.kotaDolduMu = true;
  groqKota.kotaMesaj = mesaj || null;
  const ayristirilmis = groqHataAyristir(mesaj);
  let bekleSn = ayristirilmis?.bekleSn;
  if(bekleSn===null || bekleSn===undefined){
    const retryAfter = headers?.get ? parseFloat(headers.get('retry-after')) : null;
    bekleSn = (retryAfter && !isNaN(retryAfter)) ? retryAfter : 60;
  }
  groqKota.kotaAcilmaZamani = Date.now() + bekleSn*1000;
  groqKota.kotaTuru = ayristirilmis?.tur ?? null;
  groqKota.kotaLimit = ayristirilmis?.limit ?? null;
  groqKota.kotaKullanilan = ayristirilmis?.kullanilan ?? null;
}

// Aynı Groq API anahtarıyla, her modelin kendine ait AYRI bir günlük kotası vardır.
// Bu yüzden tek bir modele bağlı kalmak yerine, kota dolduğunda otomatik olarak
// bir sonraki modele geçiyoruz. Toplamda çok daha yüksek bir günlük kapasiteye
// (yaklaşık 800.000 token/gün) ulaşmış oluyoruz — yeni anahtar veya yeni sağlayıcı gerekmez.

// ── Hece (syllable) ön-hesaplaması ─────────────────────────────────────────
// Büyük dil modelleri Türkçe hece ölçüsünü (özellikle openai/gpt-oss-120b gibi
// modeller) sıkça yanlış sayıyor. Bunu modele bırakmak yerine, Türkçenin büyük
// ölçüde sesli harf = hece kuralına dayanarak KOD İÇİNDE kesin olarak hesaplayıp
// prompt'a "ön-hesaplanmış, değiştirilemez gerçek" olarak veriyoruz. Model artık
// saymıyor, sadece bu hazır veriyi yorumluyor — hata payı ortadan kalkıyor.
const TURKCE_UNLULER = 'aeıioöuüAEIİOÖUÜ';
function heceSay(kelime){
  let sayac=0;
  for(const harf of kelime){ if(TURKCE_UNLULER.includes(harf)) sayac++; }
  return Math.max(sayac,1);
}
function siirHeceOzetiOlustur(text){
  const satirlar = text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!satirlar.length) return '';
  const ozetSatirlari = satirlar.slice(0,24).map((satir,i)=>{
    const hece = satir.split(/\s+/).filter(Boolean).reduce((t,k)=>t+heceSay(k),0);
    return `${i+1}. dize (${hece} hece): "${satir}"`;
  });
  return `\n\n[HECE ÖLÇÜSÜ — programatik olarak kesin hesaplanmıştır, KENDİN TEKRAR SAYMA, olduğu gibi kullan]\n${ozetSatirlari.join('\n')}`;
}

const AI_SISTEM_PROMPTU = 'Sen deneyimli bir Türk edebiyat eleştirmenisin. Şiirleri derinlemesine analiz eder, doğrudan söylenmese bile ima edilen duygu ve anlatıyı kavrayabilirsin. Yanıtlarını SADECE geçerli JSON formatında verirsin.';

function aiKullaniciPromptuOlustur(text){
  const heceBilgisi = siirHeceOzetiOlustur(text);
  return `Aşağıdaki şiiri analiz et:\n\n"""\n${text}\n"""\n${heceBilgisi}\n\nDikkat et:\n- Aynı kelimenin tekrarını kafiye sayma\n- Kısa ve tekrarlı şiirlere düşük puan ver\n- Doğrudan söylenmese bile ima edilen duyguyu, temayı, anlatıyı kavra\n- Şiirden gerçek dize alıntısı yap\n- Hece ölçüsü hakkında konuşurken YUKARIDA VERİLEN sayıları kullan, kendi başına sayma\n- Günlük konuşma dili ve klişelere eksi puan ver\n\nSADECE şu JSON ile yanıtla, başka hiçbir şey yazma:\n{\n  "score": <2.0-9.8 arası gerçekçi puan>,\n  "yorum": "<5-7 cümle: şiirden ne anlaşıldığı, tema, imge, dil kalitesi, ses uyumu>",\n  "gucluYonler": "<tek cümle, şiirden somut örnek>",\n  "gelistirmeOnerisi": "<tek cümle, somut ve uygulanabilir>"\n}`;
}

// Ham model çıktısından (olası ```json çitleri, olası ekstra metinle birlikte) JSON'u ayıklar ve doğrular
function jsonAyikla(raw){
  const clean = raw.replace(/```json|```/g,'').trim();
  const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
  const result = JSON.parse(jsonStr);
  result.score = Math.min(9.8, Math.max(2.0, parseFloat(result.score)));
  result.score = Math.round(result.score * 10) / 10;
  return result;
}

async function scorePoemTekModel(text, model){
  // openai/gpt-oss-* modelleri "akıl yürütme" (reasoning) modelleridir; varsayılan
  // ayarlarla yanıt vermeden önce uzun bir iç düşünme süreci üretebilir ve bu da
  // max_tokens sınırını tüketip asıl JSON'a hiç sıra gelmeden yanıtı kesebilir.
  // reasoning_effort:'low' bunu en aza indirir. response_format json_object ise
  // Groq'un resmi JSON modu — sözdizimsel olarak geçerli JSON garantisi verir.
  const govde = {
    model: model,
    max_tokens: 1024,
    temperature: 0.7,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: AI_SISTEM_PROMPTU },
      { role: 'user', content: aiKullaniciPromptuOlustur(text) }
    ]
  };
  if(model.startsWith('openai/gpt-oss')){
    govde.reasoning_effort = 'low';
    govde.include_reasoning = false;
  }
  const res = await fetch('/api/groq', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(govde)
  });
  groqKotaGuncelle(res.headers);
  if(res.status===429){
    let mesaj = '';
    try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
    groqKota429Isaretle(res.headers, mesaj);
    throw new Error('429: '+(mesaj || 'Groq kota doldu'));
  }
  groqKota.kotaDolduMu = false;
  if(!res.ok){
    let mesaj = '';
    try{
      const errBody = await res.json();
      mesaj = errBody?.error?.message || '';
      if(errBody?.error?.teshis){
        const t = errBody.error.teshis;
        mesaj += ` [çalışan ortam: ${t.calisan_ortam}; bulunan GROQ değişkenleri: ${t.groq_ile_ilgili_bulunan_degisken_isimleri?.length ? t.groq_ile_ilgili_bulunan_degisken_isimleri.join(', ') : 'yok'}]`;
      }
    }catch(_){}
    throw new Error(res.status+': '+(mesaj || 'Groq hatası'));
  }
  const data = await res.json();
  if(!data.choices?.[0]?.message?.content) throw new Error('BOS_YANIT: Groq içerik döndürmedi');
  const raw = data.choices[0].message.content.trim();
  try{
    return jsonAyikla(raw);
  } catch(parseErr){
    throw new Error('JSON_HATASI: Yapay zeka geçersiz format döndürdü → "'+raw.slice(0,150)+(raw.length>150?'...':'')+'"');
  }
}

async function scorePoem(text, saglayici='auto'){
  if(!text||text.trim().length<3)return null;
  if(saglayici==='gemini') return await scorePoemGeminiIle(text);
  if(saglayici==='claude') return await scorePoemClaudeIle(text);
  // 'groq:model-adi' formatı: admin, Groq kademesindeki belirli bir modeli zorlar
  // (kademe/cascade devreye girmez, sadece o tek model denenir).
  if(saglayici && saglayici.startsWith('groq:')){
    const secilenModel = saglayici.slice(5);
    try{
      const result = await scorePoemTekModel(text, secilenModel);
      groqKota.sonKaynak = 'groq';
      groqKota.sonModel = secilenModel;
      groqKota.sonHata = null;
      groqGunlukArttir(true);
      return result;
    } catch(e){
      console.warn(`Groq (${secilenModel}) başarısız:`, e.message);
      groqKota.sonKaynak = 'yerel';
      groqKota.sonModel = null;
      groqKota.sonHata = e.message;
      groqGunlukArttir(false);
      return scorePoemYerel(text);
    }
  }
  // 'auto': mevcut kademe (openai/gpt-oss-120b → llama-3.3-70b-versatile → llama-3.1-8b-instant)
  let sonHataMesaji = null;
  for(const model of GROQ_MODEL_KADEMESI){
    try{
      const result = await scorePoemTekModel(text, model);
      groqKota.sonKaynak = 'groq';
      groqKota.sonModel = model;
      groqKota.sonHata = null;
      groqGunlukArttir(true);
      return result;
    } catch(e){
      sonHataMesaji = e.message;
      console.warn(`Groq (${model}) başarısız, sıradaki modele geçiliyor:`, e.message);
      // sıradaki modele geç
    }
  }
  console.warn('Tüm Groq modelleri başarısız oldu, yerel algoritma kullanılıyor:', sonHataMesaji);
  groqKota.sonKaynak = 'yerel';
  groqKota.sonModel = null;
  groqKota.sonHata = sonHataMesaji;
  groqGunlukArttir(false);
  return scorePoemYerel(text);
}

function scorePoemYerel(text){
  if(!text||text.trim().length<3)return null;

  const satirlar = text.split('\n').filter(s=>s.trim().length>0);
  const lc = satirlar.length;
  const tumKelimeler = text.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const len = tumKelimeler.length;
  const tL = text.toLowerCase();
  const hash = text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd = n => Math.abs(hash) % n;

  // Tam kelime eşleşme
  const varMi = w => tumKelimeler.includes(w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));

  // ── BENZERSIZ KELİME ZENGİNLİĞİ ─────────────────────────────────────────
  const benzersiz = new Set(tumKelimeler.filter(k=>k.length>0)).size;
  const zenginlik = benzersiz / Math.max(len, 1);

  // ── TEKRAR ANALİZİ ───────────────────────────────────────────────────────
  const kelSay = {};
  tumKelimeler.forEach(w=>{ if(w.length>0) kelSay[w]=(kelSay[w]||0)+1; });
  // Çok tekrar edenler (3+ kez)
  const cokTekrar = Object.entries(kelSay).filter(([,v])=>v>=3).sort((a,b)=>b[1]-a[1]);
  // Tüm kelimelerin kaçta kaçı tekrar?
  const tekrarOrani = len>0 ? (len - benzersiz) / len : 0;
  // Şiir aslında sadece tekrarlı kelimelerden mi oluşuyor?
  const tekrarAgirlikli = tekrarOrani > 0.40;

  // ── HECE ÖLÇÜSÜ (gerçek analiz) ─────────────────────────────────────────
  const heceHesapla = w => (w.match(/[aeıioöuüAEIİOÖUÜ]/g)||[]).length;
  const satirHece = satirlar.map(s => {
    const ws = s.trim().split(/\s+/);
    const toplam = ws.reduce((t,w)=>t+heceHesapla(w), 0);
    return toplam;
  });
  const heceMean = satirHece.reduce((a,b)=>a+b,0) / Math.max(satirHece.length,1);
  const heceVar = satirHece.length > 1
    ? Math.sqrt(satirHece.reduce((s,h)=>s+(h-heceMean)**2,0)/satirHece.length)
    : 99;

  // Hece ölçüsü GERÇEKTEN VAR MI?
  // Kriterler: en az 4 dize, varyans < 1.5, her dize en az 5 hece, ortalama > 6
  const sifirVeyaAzHece = satirHece.filter(h=>h<3).length;
  const heceOlcusu = (
    heceVar < 1.5 &&
    lc >= 4 &&
    sifirVeyaAzHece === 0 &&
    heceMean >= 6 &&
    satirHece.every(h=>h>=5)
  );

  // ── KAFİYE ANALİZİ (aynı kelime tekrarı = kafiye DEĞİL) ─────────────────
  const satirSon = satirlar.map(l=>{
    const ws = l.trim().split(/\s+/);
    const tam = ws[ws.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'') || '';
    return { tam, son3: tam.slice(-3), son2: tam.slice(-2) };
  });

  // Gerçek kafiye: FARKLI kelimeler ama aynı son ek
  const gercekKafiyeParlari = [];
  for(let i=0;i<satirSon.length;i++){
    for(let j=i+1;j<satirSon.length;j++){
      const k1 = satirSon[i].tam;
      const k2 = satirSon[j].tam;
      // Aynı kelime değil, ama son 3 harf aynı
      if(k1 !== k2 && k1.length>2 && k2.length>2 && satirSon[i].son3 === satirSon[j].son3 && satirSon[i].son3.length>1){
        gercekKafiyeParlari.push({k1, k2, ek: satirSon[i].son3});
      }
    }
  }
  const kafiyeVar = gercekKafiyeParlari.length > 0;
  const kafiyeOrani = gercekKafiyeParlari.length / Math.max(lc, 1);

  // Aynı kelimenin satır sonunda tekrarı — bu kafiye DEĞİL
  const ayniKelimeTekrar = [];
  const sonKelimeSayisi = {};
  satirSon.forEach(s=>{ if(s.tam) sonKelimeSayisi[s.tam]=(sonKelimeSayisi[s.tam]||0)+1; });
  Object.entries(sonKelimeSayisi).forEach(([k,v])=>{ if(v>=2) ayniKelimeTekrar.push({kelime:k, sayi:v}); });

  // Zorlamalı kafiye
  const tekEkSayisi = {};
  satirSon.forEach(s=>{ if(s.son3) tekEkSayisi[s.son3]=(tekEkSayisi[s.son3]||0)+1; });
  const maxEkTekrar = Math.max(...Object.values(tekEkSayisi).concat([0]));
  const zorlamaKafiye = kafiyeVar && maxEkTekrar >= Math.ceil(lc*0.6);

  // ── ALİTERASYON ───────────────────────────────────────────────────────────
  const alitSatirlar = satirlar.map(s=>{
    const harfler = s.trim().split(/\s+/).map(w=>w[0]?.toLowerCase()).filter(Boolean);
    if(harfler.length < 3) return null; // çok kısa satırlarda anlamsız
    const hs = {};
    harfler.forEach(h=>{hs[h]=(hs[h]||0)+1;});
    const guclu = Object.entries(hs).filter(([,v])=>v>=3);
    return guclu.length>0 ? {satir:s.trim(), harf:guclu[0][0], sayi:guclu[0][1]} : null;
  }).filter(Boolean);
  const aliterasyonVar = alitSatirlar.length > 0;

  // ── ASONANS ───────────────────────────────────────────────────────────────
  const unluler = tL.match(/[aeıioöuü]/g)||[];
  const unluHS = {};
  unluler.forEach(u=>{unluHS[u]=(unluHS[u]||0)+1;});
  const domUnlu = Object.entries(unluHS).sort((a,b)=>b[1]-a[1])[0];
  // Sadece uzun şiirlerde (12+ ünlü) ve gerçek hâkimiyet (%45+)
  const asonansVar = domUnlu && unluler.length>=12 && (domUnlu[1]/unluler.length)>0.45;

  // ── GÜNLÜK DİL ───────────────────────────────────────────────────────────
  const gunlukListe = [
    'tamam','evet','hayır','neyse','yani','aslında','işte','şimdi','hadi',
    'sanırım','bilmiyorum','noolur','olur','olmaz','aa','off','vay','hey',
    'ee','hmm','peki','madem','belki','galiba','bence','sence','nasıl',
    'neden','niçin','niye','seviyorum','seviyordum','sevmiyorum','istiyorum',
    'istemiyorum','yapıyorum','gidiyorum','geliyorum','bakıyorum',
    'gel','git','bak','dur','kalk','ver','al','koş'
  ];
  const gunlukBulunan = [...new Set(tumKelimeler.filter(w=>gunlukListe.includes(w)))];

  // ── DİDAKTİK ─────────────────────────────────────────────────────────────
  const didaktikListe = ['çünkü','dolayısıyla','bu nedenle','sonuç olarak','demek ki','özetle','kısaca','şunu söyleyeyim','anlayacağın'];
  const didaktikBulunan = didaktikListe.filter(d=>tL.includes(d));

  // ── KLİŞE ────────────────────────────────────────────────────────────────
  const kliseCiftler = [
    {kelimeler:['saç','rüzgar'], ifade:'saçları rüzgar'},
    {kelimeler:['göz','yıldız'], ifade:'gözleri yıldız'},
    {kelimeler:['aşk','ateş'], ifade:'aşk ateşi'},
    {kelimeler:['yürek','yan'], ifade:'yürek yangını'},
    {kelimeler:['kalp','kır'], ifade:'kırık kalp'},
    {kelimeler:['bülbül','gül'], ifade:'bülbül ve gül'},
    {kelimeler:['göz','deniz'], ifade:'gözlerin denizi'},
    {kelimeler:['sevgi','ışık'], ifade:'sevginin ışığı'},
  ];
  const kliseBulunan = kliseCiftler.filter(c=>c.kelimeler.every(k=>tL.includes(k)));
  const kliseTekListe = ['aşkından yandım','sensiz olmaz','hasret kaldım','kırık kalp','seni bekliyorum','gözlerin yıldız','saçların rüzgar'];
  const kliseTekBulunan = kliseTekListe.filter(k=>tL.includes(k));

  // ── İMGE ─────────────────────────────────────────────────────────────────
  const benzetmeImleri = ['gibi','sanki','andır','tıpkı','adeta','misali'];
  const benzetmeSatirlari = satirlar.filter(s=>benzetmeImleri.some(b=>s.toLowerCase().includes(b)));

  const insanFiilleri = ['söyler','bakar','ağlar','güler','uçar','koşar','fısıldar','haykırır','titrer','sarılır','bekler','özler','düşünür'];
  const dogaKelime = ['güneş','ay','yıldız','deniz','dağ','rüzgar','yaprak','bulut','ağaç','nehir','kar','çiçek','toprak','taş','su'];
  const kisilesMeSatirlari = satirlar.filter(s=>{
    const sL=s.toLowerCase();
    return dogaKelime.some(d=>sL.includes(d)) && insanFiilleri.some(f=>sL.includes(f));
  });

  const sembolListe = ['labirent','kafes','zincir','perde','kök','tohum','kül','yankı','gölge','iz','boşluk','uçurum','köprü','sis','çıkmaz','zindan','kanat','ayna'];
  const sembolBulunan = sembolListe.filter(w=>varMi(w));

  const ozgunMetafor = benzetmeSatirlari.length>0 && kliseBulunan.length===0;

  // ── ŞİİRSEL DİL ─────────────────────────────────────────────────────────
  const siirselListe = ['hüzün','keder','figan','gurbet','özlem','hasret','gönül','yürek','ruh','mehtap','şebnem','seher','canan','yar','efkar','hicran','viran','şevk','baht','felek','naz','niyaz','dert','derman'];
  const siirselBulunan = siirselListe.filter(w=>varMi(w));

  const modernSozler = ['telefon','internet','bilgisayar','araba','market','ofis','toplantı','şirket','uygulama','instagram','whatsapp','sosyal','wifi'];
  const modernBulunan = modernSozler.filter(w=>tL.includes(w));

  // ── TEMA ─────────────────────────────────────────────────────────────────
  const temalar = {
    'hüzün ve keder':      ['hüzün','keder','ağlamak','gözyaşı','yalnız','acı','solmak','yas','figan'],
    'umut ve yenilenme':   ['umut','ışık','sabah','doğmak','güneş','bahar','yeşermek','sevinç'],
    'aşk ve özlem':        ['sevgi','aşk','sevda','yürek','canan','yar','beklemek','özlemek','hasret'],
    'doğa ve evren':       ['deniz','dağ','orman','nehir','rüzgar','yaprak','toprak','bulut','kar','çiçek'],
    'varoluş ve anlam':    ['ölüm','yaşam','sonsuz','zaman','anlam','gerçek','boşluk','hiçlik'],
    'özgürlük ve isyan':   ['özgür','kanat','uçmak','zindan','kafes','kurtulmak','engel','zincir'],
    'gurbet ve yalnızlık': ['gurbet','yalnız','uzak','ayrılık','hasret','yurt','memleket'],
  };
  const temaAgirliklari = Object.entries(temalar).map(([isim,kelimeler])=>({
    isim, agirlik: kelimeler.filter(k=>varMi(k)).length,
    bulunanlar: kelimeler.filter(k=>varMi(k))
  })).sort((a,b)=>b.agirlik-a.agirlik);

  const anaTema = temaAgirliklari[0];
  const ikinciTema = temaAgirliklari[1]?.agirlik>0 ? temaAgirliklari[1] : null;

  // Tema dizelerinden alıntı
  const temaOrnekSatirlar = satirlar.filter(s=>
    anaTema.bulunanlar.some(k=>s.toLowerCase().includes(k))
  ).slice(0,2).map(s=>s.trim());

  const punct = (text.match(/[,;:!?—–.]/g)||[]).length;

  // ── PUAN HESAPLAMA ───────────────────────────────────────────────────────
  let p = 5.0;

  // Uzunluk — çok kısa sert ceza
  if(len < 5)        p -= 3.5;
  else if(len < 10)  p -= 2.0;
  else if(len < 15)  p -= 0.8;
  else if(len <= 60) p += 0.8;
  else if(len <= 120)p += 0.4;

  // Dize sayısı
  if(lc < 2)         p -= 2.0;
  else if(lc === 2)  p -= 1.0;
  else if(lc === 3)  p -= 0.3;
  else if(lc>=4&&lc<=20) p += 0.5;

  // Kelime tekrarı — çok tekrar eden şiire sert ceza
  if(tekrarAgirlikli)        p -= 1.5;
  if(cokTekrar.length >= 3)  p -= 1.0;
  else if(cokTekrar.length >= 2) p -= 0.5;

  // Kelime zenginliği
  if(zenginlik > 0.85)       p += 1.5;
  else if(zenginlik > 0.70)  p += 0.8;
  else if(zenginlik > 0.55)  p += 0.2;
  else if(zenginlik < 0.40)  p -= 1.0;
  else                        p -= 0.4;

  // Günlük dil
  const gd = gunlukBulunan.length;
  if(gd >= 5)      p -= 2.5;
  else if(gd >= 3) p -= 1.5;
  else if(gd >= 2) p -= 0.9;
  else if(gd >= 1) p -= 0.4;

  // Didaktik
  const dd = didaktikBulunan.length;
  if(dd >= 2) p -= 1.5;
  else if(dd >= 1) p -= 0.7;

  // Klişe
  p -= kliseBulunan.length * 0.7;
  p -= kliseTekBulunan.length * 0.5;

  // Şiirsel dil
  if(siirselBulunan.length >= 3) p += 0.8;
  else if(siirselBulunan.length >= 1) p += 0.3;

  // Modern kelime
  p -= modernBulunan.length * 0.4;

  // Kafiye — GERÇEK kafiye
  if(zorlamaKafiye)            p -= 1.0;
  else if(kafiyeOrani > 0.4)   p += 0.9;
  else if(kafiyeOrani > 0.2)   p += 0.4;

  // Aynı kelime tekrarı kafiye sayılmaz, hafif ceza
  if(ayniKelimeTekrar.length > 0 && !kafiyeVar) p -= 0.3;

  // Hece ölçüsü
  if(heceOlcusu) p += 0.8;

  // Ses araçları
  if(aliterasyonVar)  p += 0.4;
  if(asonansVar)      p += 0.3;

  // İmge
  if(ozgunMetafor)                  p += 0.6;
  else if(benzetmeSatirlari.length) p += 0.2;
  if(kisilesMeSatirlari.length)     p += 0.5;
  if(sembolBulunan.length)          p += 0.3;

  // Noktalama
  if(punct >= 2 && punct <= 12) p += 0.2;

  const sapma = ((Math.abs(hash)%9)-4)*0.07;
  p = Math.min(9.6, Math.max(2.0, p+sapma));
  p = Math.round(p*10)/10;

  // ── YORUM ÜRETİMİ ────────────────────────────────────────────────────────
  const P = [];

  // 1. Kısa/tekrarlı şiir uyarısı
  if(len < 10 || lc < 3){
    P.push(`Bu metin çok kısa — ${lc} dize, ${len} kelime. Şiirsel derinlik için çok az alan var; tema yüzeyde kalmak zorunda.`);
  }
  if(tekrarAgirlikli){
    const enCokTekrar = cokTekrar[0];
    P.push(`Şiirde kelime tekrarı çok yoğun: "${enCokTekrar?.[0]}" gibi sözcükler ${enCokTekrar?.[1]} kez geçiyor. Bu tekrar bilinçli bir anafora dönüşmüyor, yalnızca söz azlığını açığa çıkarıyor.`);
  } else if(cokTekrar.length > 0){
    P.push(`"${cokTekrar[0][0]}" kelimesi ${cokTekrar[0][1]} kez tekrarlanmış; bu bilinçli bir yineleme ise güçlü olabilir, değilse şiiri yataylaştırıyor.`);
  }

  // 2. Tema
  if(anaTema.agirlik > 0){
    let temaMetni = `Şiirde ${anaTema.isim} teması seziliyor`;
    if(ikinciTema) temaMetni += `, ${ikinciTema.isim} de ikincil olarak hissediliyor`;
    if(temaOrnekSatirlar.length > 0){
      temaMetni += `. "${temaOrnekSatirlar[0]}" dizesi temayı en açık taşıyan yer.`;
    } else {
      temaMetni += `; temayı taşıyan kelimeler: ${anaTema.bulunanlar.slice(0,3).map(k=>`"${k}"`).join(', ')}.`;
    }
    P.push(temaMetni);
  } else {
    P.push(`Şiirde belirgin bir tema yok; içerik belirsiz, okuyucuya tutunacak bir duygu ekseni sunulmuyor.`);
  }

  // 3. İmge ve metafor
  if(benzetmeSatirlari.length > 0){
    const orn = benzetmeSatirlari[0].trim();
    const k = orn.length > 65 ? orn.slice(0,65)+'…' : orn;
    P.push(ozgunMetafor
      ? `"${k}" dizesinde özgün bir benzetme var; beklenmedik imgeler şiiri sıradanlıktan kurtarıyor.`
      : `"${k}" dizesinde benzetme denenmiş ama kullanılan imgeler alışılagelen kalıplardan uzaklaşamıyor.`);
  }
  if(kisilesMeSatirlari.length > 0){
    const k = kisilesMeSatirlari[0].trim().slice(0,65);
    P.push(`"${k}" dizesinde doğaya insan özelliği yükleniyor — kişileştirme şiire derinlik katıyor.`);
  }
  if(sembolBulunan.length > 0){
    P.push(`"${sembolBulunan[0]}" sözcüğü sembolik anlam taşıyor${sembolBulunan.length>1?`; "${sembolBulunan[1]}" de bu katmanı destekliyor`:''}.`);
  }
  if(kliseBulunan.length > 0){
    P.push(`"${kliseBulunan[0].ifade}" Türk şiirinde çok kullanılmış bir kalıp; okuyucu bunu zaten biliyor, özgünlük zedeleniyor.`);
  }
  if(kliseTekBulunan.length > 0){
    P.push(`"${kliseTekBulunan[0]}" çok yıpranmış bir ifade; yerine özgün bir söyleyiş şiiri canlandırır.`);
  }

  // 4. Hece ölçüsü — gerçekçi
  P.push(heceOlcusu
    ? `Hece ölçüsüyle yazılmış; her dize yaklaşık ${Math.round(heceMean)} hece taşıyor ve bu denge tutarlı (varyans: ${heceVar.toFixed(1)}).`
    : heceMean < 4 && lc > 0
      ? `Dizeler çok kısa (ort. ${Math.round(heceMean)} hece); hece ölçüsü yok, serbest nazım da değil — yalnızca kelime parçaları sıralanmış.`
      : `Serbest nazım tercih edilmiş${heceVar < 4 ? `; dize uzunlukları birbirine yakın (ort. ${Math.round(heceMean)} hece), belli bir ritim hissettiriyor` : `; dize uzunlukları oldukça değişken, ritmik bir kural gözetilmemiş`}.`
  );

  // 5. Kafiye — aynı kelime tekrarını kafiye saymaz
  if(ayniKelimeTekrar.length > 0 && !kafiyeVar){
    const orn = ayniKelimeTekrar[0].kelime;
    P.push(`"${orn}" sözcüğü satır sonlarında ${ayniKelimeTekrar[0].sayi} kez tekrarlanmış; bu kafiye değil, yalnızca aynı kelimenin tekrarı. Kafiye farklı kelimeler arasında ses benzerliği gerektirir.`);
  } else if(zorlamaKafiye){
    P.push(`Kafiye düzeni zorlamalı; aynı ek çok sayıda dizede tekrarlanarak mekanik bir ses uyumu oluşturuluyor.`);
  } else if(kafiyeVar && gercekKafiyeParlari.length > 0){
    P.push(`Gerçek kafiye var: "${gercekKafiyeParlari[0].k1}" ve "${gercekKafiyeParlari[0].k2}" eşleşmesi ses uyumunu güçlendiriyor.`);
  } else {
    P.push(`Kafiye kullanılmamış; ses uyumu tamamen serbest bırakılmış.`);
  }

  // 6. Ses araçları
  if(aliterasyonVar){
    const orn = alitSatirlar[0];
    const k = orn.satir.length > 55 ? orn.satir.slice(0,55)+'…' : orn.satir;
    P.push(`"${k}" dizesinde "${orn.harf}" harfinin ${orn.sayi} kez tekrarıyla aliterasyon yaratılmış.`);
  }
  if(asonansVar){
    P.push(`"${domUnlu[0]}" ünlüsünün hâkimiyeti (%${Math.round(domUnlu[1]/unluler.length*100)}) şiire asonans katıyor.`);
  }

  // 7. Dil kalitesi
  if(gd >= 4){
    P.push(`Şiir büyük ölçüde günlük konuşma diline dayanıyor: "${gunlukBulunan.slice(0,3).join('", "')}" gibi sözcükler şiirsel gerilimi büsbütün kırıyor.`);
  } else if(gd >= 2){
    P.push(`"${gunlukBulunan.slice(0,2).join('" ve "')}" gibi konuşma dili sözcükleri şiirsel tonu zayıflatıyor.`);
  } else if(gd === 1){
    P.push(`"${gunlukBulunan[0]}" sözcüğü şiirin havasından uzaklaşıyor.`);
  } else if(siirselBulunan.length >= 2){
    P.push(`Dil şiirsel ve özenli: "${siirselBulunan.slice(0,2).join('" ve "')}" sözcükleri şiire derinlik katıyor.`);
  }

  if(modernBulunan.length > 0){
    P.push(`"${modernBulunan[0]}" gibi modern sözcükler şiirsel atmosferi kırıyor.`);
  }

  if(dd >= 1){
    P.push(`"${didaktikBulunan[0]}" gibi açıklayıcı bağlaçlar şiiri didaktik bir anlatıma itiyor; şiir açıklamaz, hissettirir.`);
  }

  // 8. Kelime zenginliği
  if(zenginlik < 0.45 && len >= 8){
    P.push(`${len} kelimelik şiirde yalnızca ${benzersiz} farklı sözcük var; yani kelimelerin büyük çoğunluğu tekrar. Bu şiiri daraltıyor.`);
  } else if(zenginlik > 0.82 && len >= 12){
    P.push(`Kelime zenginliği yüksek (${benzersiz} farklı sözcük); söz dağarcığı özgün.`);
  }

  // 9. Kapanış
  if(p >= 8.5){
    P.push(`Ses ve anlam dengesi kurulmuş, olgun bir şiir.`);
  } else if(p >= 7.0){
    P.push(`Güçlü potansiyel var; birkaç kritik değişiklikle çok daha etkili olabilir.`);
  } else if(p >= 5.5){
    P.push(`Şiir kendi sesini henüz bulamamış; ham malzeme var ama işçilik derinleştirilmeli.`);
  } else if(p >= 4.0){
    P.push(`Şiirsel bir niyet var; ancak dil, imge ve ses araçları açısından köklü bir yeniden yazım gerekiyor.`);
  } else {
    P.push(`Bu metin henüz şiir sayılamaz; temel şiir tekniklerine odaklanıp yeniden denemek gerekiyor.`);
  }

  const yorum = P.join(' ');

  // Güçlü yön
  const gucluH = [];
  if(ozgunMetafor && benzetmeSatirlari.length>0) gucluH.push(`Özgün imge: "${benzetmeSatirlari[0].trim().slice(0,35)}…"`);
  if(heceOlcusu) gucluH.push(`${Math.round(heceMean)} heceli tutarlı hece ölçüsü`);
  if(kafiyeOrani>0.35&&!zorlamaKafiye&&gercekKafiyeParlari.length>0) gucluH.push(`"${gercekKafiyeParlari[0].k1}-${gercekKafiyeParlari[0].k2}" kafiyesi doğal`);
  if(aliterasyonVar) gucluH.push(`"${alitSatirlar[0].harf}" sesindeki aliterasyon`);
  if(kisilesMeSatirlari.length>0) gucluH.push('Kişileştirme şiire canlılık katıyor');
  if(sembolBulunan.length>0) gucluH.push(`"${sembolBulunan[0]}" sembolik anlam katıyor`);
  if(zenginlik>0.82&&len>=12) gucluH.push('Kelime zenginliği yüksek');
  if(siirselBulunan.length>=2) gucluH.push('Şiirsel dil özenli');
  if(asonansVar) gucluH.push(`"${domUnlu[0]}" ünlüsüyle asonans`);
  if(gucluH.length===0) gucluH.push('Ham bir duygu yoğunluğu taşıyor; bu zemin geliştirilebilir');
  const guclu = gucluH[rnd(gucluH.length)];

  // Öneri
  const oneriH = [];
  if(len<12||lc<4)                    oneriH.push(`Şiir çok kısa (${len} kelime, ${lc} dize); en az 20-30 kelimeye genişletilmeli`);
  if(tekrarAgirlikli)                 oneriH.push('Aynı kelimelerin tekrarı yerine farklı sözcükler ve imgeler aranmalı');
  if(zorlamaKafiye)                   oneriH.push('Zorlamalı kafiyeden vazgeçilip doğal ses uyumu denenebilir');
  if(kliseBulunan.length>0)           oneriH.push(`"${kliseBulunan[0].ifade}" klişesi yerine özgün imgeler üretilmeli`);
  if(gd>=2)                           oneriH.push(`"${gunlukBulunan.slice(0,2).join('", "')}" gibi konuşma dili kelimeleri şiirsel karşılıklarıyla değiştirilmeli`);
  if(dd>=1)                           oneriH.push('"Göster, anlatma" ilkesiyle duygular imgelerle aktarılmalı');
  if(benzetmeSatirlari.length===0)    oneriH.push('Somut imgeler ve metaforlar eklenerek şiir görselleştirilebilir');
  if(zenginlik<0.45&&len>=8)          oneriH.push('Kelime tekrarı çok fazla; sinonimler ve yeni sözcükler denenebilir');
  if(!aliterasyonVar&&!kafiyeVar)     oneriH.push('Aliterasyon veya ses tekrarı eklenerek ritim güçlendirilebilir');
  if(modernBulunan.length>0)          oneriH.push(`"${modernBulunan[0]}" yerine şiirsel bir karşılık bulunmalı`);
  if(oneriH.length===0)               oneriH.push('Son dize daha çarpıcı bir kapanışla güçlendirilebilir');
  const oneri = oneriH[rnd(oneriH.length)];

  return { score:p, yorum, gucluYonler:guclu, gelistirmeOnerisi:oneri };
}

// ── BOT YORUMLARI İÇİN YEREL YEDEK ─────────────────────────────────────────
// Groq'un 3 modeli de (kademe) başarısız olursa botDuyuPuan/botKatliPuan/botAriPuan
// artık null dönüp yorumu tamamen atlamak yerine, kısa ve o botun temasına uygun
// bir yerel yorum üretir. Böylece kota tamamen dolsa bile 3 bot da yorum bırakır.
function _yerelYardimci(text){
  const satirlar = text.split('\n').filter(s=>s.trim().length>0);
  const lc = satirlar.length;
  const kelimeler = text.trim().split(/\s+/);
  const len = kelimeler.length;
  const hash = text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd = n => Math.abs(hash) % n;
  const satirSon = satirlar.map(l=>{
    const ws = l.trim().split(/\s+/);
    const tam = ws[ws.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'') || '';
    return tam.slice(-3);
  });
  const ekSayisi = {};
  satirSon.forEach(s=>{ if(s) ekSayisi[s]=(ekSayisi[s]||0)+1; });
  const kafiyeVar = Object.values(ekSayisi).some(v=>v>=2);
  const benzetmeImleri = ['gibi','sanki','andır','tıpkı','adeta','misali'];
  const imgeVar = satirlar.some(s=>benzetmeImleri.some(b=>s.toLowerCase().includes(b)));
  const benzersiz = new Set(kelimeler.map(w=>w.toLowerCase())).size;
  const zenginlik = benzersiz / Math.max(len,1);
  return { lc, len, rnd, kafiyeVar, imgeVar, zenginlik };
}

function botDuyuPuanYerel(text){
  const { rnd, len } = _yerelYardimci(text);
  const yorumlar = [
    'Satırlarda belli bir duygu akışı var ama daha derinleşebilir.',
    'Duygusal ton okurken hissediliyor, samimi bir hava taşıyor.',
    'Duygu güçlü verilmiş ama biraz daha katmanlı olabilirdi.',
    'İçtenlik var, fakat duygu bazı yerlerde yüzeyde kalmış.',
  ];
  const taban = 5.5 + (len>=20?0.8:0) + rnd(20)/10;
  const p = Math.round(Math.min(9.5,Math.max(2.0,taban))*10)/10;
  return { puan: p, yorum: yorumlar[rnd(yorumlar.length)], kullanici: 'bot_duyu_yorum', ad: 'duyu-yorum' };
}

function botKatliPuanYerel(text){
  const { rnd, kafiyeVar, lc } = _yerelYardimci(text);
  const yorumlar = kafiyeVar
    ? ['Ses uyumu ve kafiye düzeni fark edilir şekilde işlenmiş.', 'Dizeler arasında hoş bir ritim yakalanmış.']
    : ['Serbest bir yapı tercih edilmiş, kafiyeye dayanmıyor.', 'Ritim daha çok anlam akışına dayanıyor, kafiye zorlanmamış.'];
  const taban = (kafiyeVar?6.2:5.0) + (lc>=6?0.5:0) + rnd(15)/10;
  const p = Math.round(Math.min(9.5,Math.max(2.0,taban))*10)/10;
  return { puan: p, yorum: yorumlar[rnd(yorumlar.length)], kullanici: 'bot_katli_yorum', ad: 'katlı-yorum' };
}

function botAriPuanYerel(text){
  const { rnd, imgeVar, zenginlik } = _yerelYardimci(text);
  const yorumlar = imgeVar
    ? ['Benzetmeler şiire özgün bir görsellik katmış.', 'İmgeler dikkat çekici, emek verilmiş bir dil var.']
    : ['İmge kullanımı sınırlı, daha somut betimlemeler eklenebilir.', 'Metaforlar yerine daha doğrudan bir anlatım tercih edilmiş.'];
  const taban = (imgeVar?6.0:4.8) + zenginlik*2 + rnd(10)/10;
  const p = Math.round(Math.min(9.5,Math.max(2.0,taban))*10)/10;
  return { puan: p, yorum: yorumlar[rnd(yorumlar.length)], kullanici: 'bot_ari_yorum', ad: 'arı-yorum' };
}

// go(): ekran değiştirir VE tarayıcı geçmişine (history) bir kayıt ekler, böylece
// fiziksel "geri" tuşu bir önceki ziyaret edilen ekrana döner (her zaman anasayfaya değil).
// profileId/postId gibi ekrana özgü alanlar, yeni ekran onları belirtmediyse sıfırlanır
// (aksi halde bir önceki ekrandan kalan eski id'ler sızabilir).
function go(screen,extra={}){
  S.screen = screen;
  S.profileId = 'profileId' in extra ? extra.profileId : null;
  S.postId = 'postId' in extra ? extra.postId : null;
  render();
  history.pushState({screen:S.screen, profileId:S.profileId, postId:S.postId}, '', '#'+screen);
}
window.addEventListener('popstate', (e)=>{
  const st = e.state;
  if(st){
    S.screen = st.screen;
    S.profileId = st.profileId ?? null;
    S.postId = st.postId ?? null;
  } else {
    S.screen = 'feed';
    S.profileId = null;
    S.postId = null;
  }
  render();
});

// Giriş yapılmamış bir kullanıcı, giriş gerektiren bir eyleme (paylaşım/yorum/puan/tepki/
// takip/mesaj) teşebbüs ettiğinde çağrılır. Giriş ekranına yönlendirir ve true döner
// (çağıran taraf true dönerse asıl işlemi yapmadan durmalıdır). Zaten girişliyse false döner.
function girisGerekli(){
  if(!S.me){ go('login'); return true; }
  return false;
}

// Sadece ilgili kartı günceller, sayfa kaymaz
function refreshCard(pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const oldCard=document.querySelector(`[data-pid="${pid}"]`);
  if(!oldCard)return;
  // Mevcut durumu kaydet
  const wasExpanded=oldCard.querySelector('.post-full')?.style.display==='block';
  const cmtsOpen=oldCard.querySelector('.cmt-body')?.style.display==='block';
  const scrollY=window.scrollY;
  const cardTop=oldCard.getBoundingClientRect().top;
  // Eski kartın yüksekliğini sabit tut — layout shift önle
  oldCard.style.minHeight=oldCard.offsetHeight+'px';
  // Yeni kartı oluştur
  const newCard=postCard(post, wasExpanded);
  newCard.setAttribute('data-pid',pid);
  oldCard.replaceWith(newCard);
  // Yorumlar açıksa yeni kartta da aç
  if(cmtsOpen){
    const b=newCard.querySelector('.cmt-body');
    if(b)b.style.display='block';

async function groqBotCallTekModel(systemPrompt, userPrompt, model) {
  const govde = {
    model: model,
    max_tokens: 400,
    temperature: 0.8,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ]
  };
  if(model.startsWith('openai/gpt-oss')){
    govde.reasoning_effort = 'low';
    govde.include_reasoning = false;
  }
  const res = await fetch('/api/groq', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(govde)
  });
  groqKotaGuncelle(res.headers);
  if (res.status === 429) {
    let mesaj = '';
    try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
    groqKota429Isaretle(res.headers, mesaj);
    throw new Error('429: '+(mesaj || 'Groq kota doldu'));
  }
  groqKota.kotaDolduMu = false;
  if (!res.ok){
    let mesaj = '';
    try{
      const errBody = await res.json();
      mesaj = errBody?.error?.message || '';
      if(errBody?.error?.teshis){
        const t = errBody.error.teshis;
        mesaj += ` [çalışan ortam: ${t.calisan_ortam}; bulunan GROQ değişkenleri: ${t.groq_ile_ilgili_bulunan_degisken_isimleri?.length ? t.groq_ile_ilgili_bulunan_degisken_isimleri.join(', ') : 'yok'}]`;
      }
    }catch(_){}
    throw new Error(res.status+': '+(mesaj || 'Groq hatası'));
  }
  const data = await res.json();
  const raw = data.choices?.[0]?.message?.content?.trim();
  if (!raw) throw new Error('BOS_YANIT: Groq içerik döndürmedi');
  const clean = raw.replace(/```json|```/g, '').trim();
  const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}') + 1);
  try{
    return JSON.parse(jsonStr);
  } catch(parseErr){
    throw new Error('JSON_HATASI: Yapay zeka geçersiz format döndürdü → "'+raw.slice(0,150)+(raw.length>150?'...':'')+'"');
  }
}

// zorunluModel verilirse (ör. ana AI'ın kullandığı model), kademe/cascade DEVREYE GİRMEZ,
// sadece o tek model denenir. Bu sayede aynı şiiri değerlendiren 3 bot + ana AI hepsi
// AYNI modeli kullanır — art arda atılan istekler yüzünden birinin akıllı modele,
// diğerinin zayıf modele düşüp tutarsız yorum vermesi önlenmiş olur.
async function groqBotCall(systemPrompt, userPrompt, zorunluModel=null) {
  if(zorunluModel){
    try{
      const result = await groqBotCallTekModel(systemPrompt, userPrompt, zorunluModel);
      groqKota.sonHata = null;
      sonBasariliBotModeli = zorunluModel;
      return result;
    } catch(e){
      console.warn(`groqBotCall (zorunlu: ${zorunluModel}) başarısız:`, e.message);
      groqKota.sonHata = e.message;
      sonBasariliBotModeli = null;
      return null;
    }
  }
  let sonHataMesaji = null;
  for(const model of GROQ_MODEL_KADEMESI){
    try{
      const result = await groqBotCallTekModel(systemPrompt, userPrompt, model);
      groqKota.sonHata = null;
      sonBasariliBotModeli = model;
      return result;
    } catch(e){
      sonHataMesaji = e.message;
      console.warn(`groqBotCall (${model}) başarısız, sıradaki modele geçiliyor:`, e.message);
    }
  }
  console.warn('groqBotCall: tüm Groq modelleri başarısız oldu:', sonHataMesaji);
  groqKota.sonHata = sonHataMesaji;
  sonBasariliBotModeli = null;
  return null;
}

async function botDuyuPuan(text, zorunluModel=null) {
  if (!text || text.trim().length < 5) return null;
  const system = 'Sen "duyu-yorum" adlı bir şiir eleştirmensin. YALNIZCA şiirin duygusallığını, duygu yoğunluğunu ve duygusal etkisini değerlendirirsin. Teknik unsurları değil, sadece duyguyu analiz et. Yanıtlarını SADECE JSON formatında ver.';
  const user = 'Şu şiirin duygusallığını değerlendir:\n\n"""\n' + text + '\n"""\n\nSADECE şu JSON ile yanıtla:\n{"puan": <2.0-9.5 arasi sayi>, "yorum": "<2-3 cumle duygu analizi>"}';
  const result = await groqBotCall(system, user, zorunluModel);
  if (!result) return botDuyuPuanYerel(text);
  let p = Math.min(9.5, Math.max(2.0, parseFloat(result.puan)));
  p = Math.round(p * 10) / 10;
  return { puan: p, yorum: result.yorum, kullanici: 'bot_duyu_yorum', ad: 'duyu-yorum' };
}

A.addPost = async function(pd){
    if(!S.me) return;
    // Bot puanları hesapla (önce bots, sonra async AI)
    const botRatings={};
    const botYorumlar={};
    const hasText=pd.text&&pd.text.trim().length>10;
    let b1=null,b2=null,b3=null,ortakModel=null;
    if(hasText){
      // İlk botu 'auto' kademeyle çalıştırıp hangi modelin başarılı olduğunu öğreniyoruz,
      // sonra diğer 2 botu VE ana AI'ı aynı modele zorluyoruz — böylece 4 değerlendirme
      // de (3 bot + ana AI) her zaman aynı modeli kullanır, birbirinden farklı
      // modellere düşüp tutarsız yorum vermezler.
      b1 = await botDuyuPuan(pd.text);
      ortakModel = sonBasariliBotModeli;
      [b2,b3] = await Promise.all([botKatliPuan(pd.text, ortakModel), botAriPuan(pd.text, ortakModel)]);
    }
    if(b1){botRatings[b1.kullanici]=b1.puan;botYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};}
    if(b2){botRatings[b2.kullanici]=b2.puan;botYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};}
    if(b3){botRatings[b3.kullanici]=b3.puan;botYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};}

    // Şiiri önce botsuz kaydet (hızlı görünüm için)
    const np={...pd,id:uid(),authorId:S.me.id,ts:Date.now(),
      userRatings:{...botRatings},
      botYorumlar:{...botYorumlar},
      aiScore:null,aiYorum:null,aiGuclu:null,aiOneri:null,
      comments:[],date:now()};
    S.posts.unshift(np);
    save();render();

    // Claude AI değerlendirmesini async bekle
    if(pd.text&&pd.text.trim().length>10){
      // Botlar hangi Groq modelini kullandıysa (ortakModel), ana AI da AYNI modeli
      // kullansın — tutarlılık için. Botlar tamamen başarısız olup yerel algoritmaya
      // düştüyse (ortakModel=null), ana AI kendi 'auto' kademesini normal şekilde dener.
      const r = await scorePoem(pd.text, ortakModel ? ('groq:'+ortakModel) : 'auto');
      const kullanilanModel = groqKota.sonKaynak==='yerel' ? 'yerel' : (groqKota.sonModel||groqKota.sonKaynak);
      if(r){
        const idx=S.posts.findIndex(p=>p.id===np.id);
        if(idx>-1){
          S.posts[idx].aiScore=r.score;
          S.posts[idx].aiYorum=r.yorum;
          S.posts[idx].aiGuclu=r.gucluYonler;
          S.posts[idx].aiOneri=r.gelistirmeOnerisi;
          S.posts[idx].aiModel=kullanilanModel;
          S.posts[idx].userRatings['bot_ai_yorum']=r.score;
          save();
          refreshCard(np.id);
          db.collection("posts").doc(np.id).update({
            aiScore:r.score,aiYorum:r.yorum,aiGuclu:r.gucluYonler,aiOneri:r.gelistirmeOnerisi,aiModel:kullanilanModel,
            userRatings:S.posts[idx].userRatings
          }).catch(err=>console.error(err));
        }
      }
    }
    db.collection("posts").doc(np.id).set(np).catch(err=>console.error("Kaydetme hatası:",err));

    // Takipçilere yeni paylaşım bildirimi gönder
    const takipciler = Object.keys(S.follows).filter(uid => (S.follows[uid]||[]).includes(S.me.id));
    if(takipciler.length){
      const baslik = np.title || np.text?.slice(0,20) || 'yeni bir şiir';
      const paylasan = S.me.name||S.me.username;
      takipciler.forEach(fid => A.addNotif(fid, `${paylasan} yeni bir şiir paylaştı: "${baslik}"`, {postId:np.id}));
    }
};

// tur: 'like' | 'dislike' | 'heart'. like/dislike birbirini dışlar (biri seçilince öteki kalkar),
// kalp bunlardan bağımsızdır. Aynı butona tekrar basmak tepkiyi kaldırır (toggle).
A.react = function(pid, tur){
    if(!S.me) return;
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex<0) return;
    const post = S.posts[pIndex];
    if(!post.reactions) post.reactions = {like:[],dislike:[],heart:[]};
    ['like','dislike','heart'].forEach(t=>{ if(!post.reactions[t]) post.reactions[t]=[]; });
    const meId = S.me.id;
    const zatenVar = post.reactions[tur].includes(meId);
    if(zatenVar){
      post.reactions[tur] = post.reactions[tur].filter(id=>id!==meId);
    } else {
      post.reactions[tur] = [...post.reactions[tur], meId];
      if(tur==='like')    post.reactions.dislike = post.reactions.dislike.filter(id=>id!==meId);
      if(tur==='dislike') post.reactions.like    = post.reactions.like.filter(id=>id!==meId);
      if(tur!=='dislike'){
        const postTitle=post.title||post.text?.slice(0,20)||'şiirinize';
        const eylem = tur==='like' ? 'beğendi' : 'kalp attı';
        A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinizi ${eylem}.`, {postId:post.id});
      }
    }
    save();
    refreshCard(pid);
    db.collection("posts").doc(pid).update({reactions:post.reactions}).catch(err=>console.error("Tepki hatası:",err));
};

function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  return e;
}

  ub.onclick=()=>{ub.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';ub.style.color='#fff';ub.style.border='none';pb.style.background='#1a0f2e';pb.style.color='#a78bfa';pb.style.border='1px solid #2d1b52';showU();};
