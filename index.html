<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Ozanlar 🪶</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0a1a;color:#f0e8ff;font-family:'Crimson Text',Georgia,serif;min-height:100vh}
    
    /* YENİ TASARIM: Kartlar geniş ve YouTube videosu boyutunda */
    .card{background:linear-gradient(135deg,#1a0f2e,#160d28);border:1px solid #2d1b52;border-radius:20px;padding:24px;margin-bottom:24px;width:95%;max-width:800px;margin-left:auto;margin-right:auto;min-height:400px;position:relative}
    
    .btn{cursor:pointer;border:none;outline:none;transition:all .2s;font-family:'Crimson Text',serif}
    .pb{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:12px 24px;border-radius:50px;font-weight:600}
    .nav-bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(15,10,26,.98);border-top:1px solid #2d1b52;display:flex;justify-content:space-around;padding:12px}
    .page{padding:80px 16px 100px}
    .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;background:#3d1f6e}
    .notify-msg{border-left:4px solid #a855f7 !important;background:#1e1b4b !important}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// Firebase Config - Sizin bilgileriniz
const firebaseConfig = { apiKey: "AIzaSyC6sshBjUU7xZf_KgjwW2yWuvE1ZG9oZWY", authDomain: "yeniozanlar-68b49.firebaseapp.com", projectId: "yeniozanlar-68b49", storageBucket: "yeniozanlar-68b49.firebasestorage.app", messagingSenderId: "99003509618", appId: "1:99003509618:web:e4f36d85378f2e554fcbeb" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Uygulama State'i
let S = { posts: [], me: null, screen: 'feed', msgs: [], pageLimit: 3 };

// BİLDİRİM SİSTEMİ
const A = {
  sendSystemNotification(toId, text) {
    const msg = {id:Math.random().toString(36).slice(2), fromId:"system", toId, text, date:new Date().toLocaleString('tr-TR')};
    S.msgs.unshift(msg);
    localStorage.setItem('yo_msgs', JSON.stringify(S.msgs));
  },
  addComment(pid, text) {
    const post = S.posts.find(p => p.id === pid);
    if(post && post.authorId !== S.me.id) A.sendSystemNotification(post.authorId, `${S.me.name} şiirinize yorum yaptı: "${text.slice(0,20)}..."`);
    // ... geri kalan yorum kaydetme kodlarınız ...
  },
  ratePost(pid, score) {
    const post = S.posts.find(p => p.id === pid);
    if(post && post.authorId !== S.me.id) A.sendSystemNotification(post.authorId, `${S.me.name} şiirinize ${score} puan verdi.`);
    // ... geri kalan puanlama kodlarınız ...
  }
};

// RENDER: 3 ŞİİR SINIRI
function Feed(){
  const wrap = document.createElement('div');
  const gorunurPostlar = S.posts.slice(0, S.pageLimit);
  
  gorunurPostlar.forEach(p => wrap.appendChild(postCard(p)));
  
  if (S.posts.length > S.pageLimit) {
    const btn = document.createElement('button');
    btn.className = 'pb btn';
    btn.innerText = 'Daha Fazla Şiir Göster';
    btn.onclick = () => { S.pageLimit += 3; render(); };
    wrap.appendChild(btn);
  }
  return wrap;
}

// MESAJLAR SAYFASINDA BİLDİRİMLERİ GÖSTERME
function Messages() {
  const container = document.createElement('div');
  S.msgs.forEach(m => {
    const div = document.createElement('div');
    div.className = m.fromId === 'system' ? 'card notify-msg' : 'card';
    div.innerHTML = m.fromId === 'system' ? `🔔 <b>Sistem:</b> ${m.text}` : m.text;
    container.appendChild(div);
  });
  return container;
}
</script>
</body>
</html>
