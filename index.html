const ADMIN_USERNAME = "admin";

const db = firebase.firestore();

const adminProfileObj = {
  id: "admin_root",
  name: "Yönetici (Admin)",
  username: ADMIN_USERNAME,
  bio: "Sistem Yöneticisi Paneli",
  avatar: "👑",

};

// STATE
let S = {
  users: lsGet('yo_users', []),
  posts: lsGet('yo_posts', []),
  me: lsGet('yo_me', null),
  screen: 'landing',
  profileId: null,
  postId: null,
  follows: lsGet('yo_follows', {}),
  msgs: lsGet('yo_msgs', []),
  notifs: lsGet('yo_notifs', []),
  loading: true 
};

async function verileriYukle() {
  try {
    const usersSnapshot = await db.collection("users").get().catch(() => ({ docs: [] }));
    S.users = usersSnapshot.docs.length ? usersSnapshot.docs.map(doc => doc.data()) : [];

    if (!S.users.find(u => u.username === ADMIN_USERNAME)) {
      S.users.push(adminProfileObj);
    }

    const postsSnapshot = await db.collection("posts").get().catch(() => ({ docs: [] }));
    const tumPostlar = postsSnapshot.docs.length ? postsSnapshot.docs.map(doc => doc.data()) : [];
    const parseDate=d=>{if(!d)return 0;try{const p=d.split(' ');const dmy=p[0].split('.');const hms=p[1]?.split(':');return new Date(dmy[2],dmy[1]-1,dmy[0],hms?.[0]||0,hms?.[1]||0,hms?.[2]||0).getTime();}catch{return 0;}};
    S.posts = tumPostlar.sort((a,b)=>(b.ts||parseDate(b.date))-(a.ts||parseDate(a.date)));

    // Mesajları Firebase'den yükle
    if(S.me) {
      const msgsSnapshot = await db.collection("msgs").get().catch(() => ({ docs: [] }));
      S.msgs = msgsSnapshot.docs.length ? msgsSnapshot.docs.map(doc => doc.data()) : [];
      lsSet('yo_msgs', S.msgs);

      // Bildirimleri Firebase'den yükle
      const notifsSnapshot = await db.collection("notifs").where("toId","==",S.me.id).get().catch(() => ({ docs: [] }));
      S.notifs = notifsSnapshot.docs.length ? notifsSnapshot.docs.map(doc => doc.data()).sort((a,b)=>b.date.localeCompare(a.date)) : [];
      lsSet('yo_notifs', S.notifs);
    }

    if (S.me && S.me.username === ADMIN_USERNAME) {
      S.me = adminProfileObj;
    } else if (S.me && S.users.length) {
      const guncelBen = S.users.find(u => u.id === S.me.id);
      if (guncelBen) S.me = guncelBen;
    }
  } catch (error) {
    console.log("Bağlantı hatası:", error);
  } finally {
    S.loading = false;
    render();
  }
}

const uid=()=>Math.random().toString(36).slice(2,9);

const ytId=url=>{const m=url?.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
const calcAvg=(r,ai)=>{const v=Object.values(r||{});const u=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;if(u===null&&(ai===null||ai===undefined))return null;if(u===null)return+parseFloat(ai).toFixed(2);if(ai===null||ai===undefined)return+u.toFixed(2);return+(u*.6+ai*.4).toFixed(2)};
const scoreColor=s=>{if(!s)return'#6b5b8a';if(s>=8.5)return'#fbbf24';if(s>=7)return'#34d399';if(s>=5)return'#c084fc';return'#f87171'};
const scoreBadge=s=>{if(!s)return'';if(s>=9)return'🏆 Başyapıt';if(s>=8)return'⭐ Muhteşem';if(s>=7)return'✨ Güzel';if(s>=5)return'👍 İyi';return'📝 Gelişiyor'};


function scorePoem(text){
  if(!text||text.trim().length<5)return null;
  const lines=text.split('\n').filter(s=>s.trim().length>0);
  const words=text.trim().split(/\s+/);
  const tL=text.toLowerCase();
  const lc=lines.length, len=words.length;

  // Benzersiz kelime oranı
  const uniqW=new Set(words.map(k=>k.toLowerCase().replace(/[^a-züğışöçâîûÂÎÛ]/gi,''))).size;
  const zenginlik=uniqW/Math.max(words.length,1);

  // Hash — çeşitlilik için
  const hash=text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd=n=>hash%n;

  /* ── KAFIYE ANALİZİ ──────────────────────────────────── */
  const sonSes=lines.map(l=>{
    const w=l.trim().split(/\s+/);
    return w[w.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'')?.slice(-3)||'';
  });
  let kafSayisi=0, ciftKafiye=0;
  for(let i=0;i<sonSes.length-1;i++){
    if(sonSes[i].length>1&&sonSes[i]===sonSes[i+1]){kafSayisi++;ciftKafiye++;}
    else if(sonSes[i].length>1&&i+2<sonSes.length&&sonSes[i]===sonSes[i+2])kafSayisi++;
  }
  const kafOrani=kafSayisi/Math.max(lc-1,1);

  // Zorlamalı kafiye (aynı ek 3+ kez)
  const zorlamaEkler=['miş','mış','muş','müş','lar','ler','dan','den','den','tan','ten','nak','nek','mak','mek'];
  const zorlamaKafiye=zorlamaEkler.filter(ek=>sonSes.filter(s=>s.endsWith(ek)).length>=Math.max(lc*0.4,2)).length>0;

  // Kıta yapısı (4'lü gruplar)
  const kitaSayisi=Math.floor(lc/4);
  let kitaKafiyeDuzeni=false;
  if(kitaSayisi>=2){
    const son4=lines.map(l=>l.trim().split(/\s+/).pop()?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'')?.slice(-3)||'');
    let duzHalk=0;
    for(let i=0;i+3<son4.length;i+=4){if(son4[i+3]===son4[i+7]||son4[i+1]===son4[i+5])duzHalk++;}
    kitaKafiyeDuzeni=duzHalk>0;
  }

  /* ── HECE ÖLÇÜSÜ ─────────────────────────────────────── */
  const heceArr=lines.map(l=>l.trim().split(/\s+/).reduce((s,w)=>(w.match(/[aeıioöuüAEIİOÖUÜ]/g)||[]).length+s,0));
  const heceMean=heceArr.reduce((a,b)=>a+b,0)/Math.max(heceArr.length,1);
  const heceVar=heceArr.length>1?Math.sqrt(heceArr.reduce((s,h)=>s+(h-heceMean)**2,0)/heceArr.length):5;
  const heceOlcusu=heceVar<2.2;
  const serbestSiir=!heceOlcusu;

  /* ── ALİTERASYON & ASONANS ───────────────────────────── */
  const ilkHarf=words.map(w=>w[0]?.toLowerCase()).filter(Boolean);
  const ilkHS={};ilkHarf.forEach(h=>{ilkHS[h]=(ilkHS[h]||0)+1});
  const aliterasyon=Object.values(ilkHS).filter(v=>v>=3).length>0;
  const aliterasyonHarf=Object.entries(ilkHS).filter(([,v])=>v>=3).map(([k])=>k).join(', ');

  // Asonans (iç ünlü tekrarları)
  const unlular=tL.match(/[aeıioöuü]/g)||[];
  const unluHS={};unlular.forEach(u=>{unluHS[u]=(unluHS[u]||0)+1});
  const asonans=Object.values(unluHS).some(v=>v/unlular.length>0.35);
  const asonansUnlu=Object.entries(unluHS).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';

  /* ── İMGE & METAFOR ──────────────────────────────────── */
  const benzetmeImleri=['gibi','sanki','andır','tıpkı','adeta','sanırsın','misali'];
  const eylemMetafor=['söyler','bakar','ağlar','uçar','akar','solar','doğar','yanar','fısıldar','haykırır','titrer','büküldü','eridi','aktı','esti','sardı','yıkadı','çekti','bağladı'];
  const benzetmeSayisi=benzetmeImleri.filter(w=>tL.includes(w)).length;
  const eylemMetSayisi=eylemMetafor.filter(w=>tL.includes(w)).length;

  // KLİŞE metafor/imge havuzu
  const kliseMetaforlar=['gözlerin yıldız','saçların ipek','dudakların gül','kalbin ayna','aşk bir ateş','yürek yanar','gönül kuş','kalp kırık','sevda ateş','gözler deniz','yüz ay gibi','gül yüzlü','bülbül gibi öt','aşkın ateş','mevsim döner'];
  const kliseImgeler=['ayna metafor','sevgili gül','aşk ateş','özlem yağmur','hüzün gece','ağlayan göz','kırık kalp','sarı yaprak','solmuş çiçek'];
  const kliseSayisi=[...kliseMetaforlar,...kliseImgeler].filter(k=>tL.includes(k.split(' ')[0])&&tL.includes(k.split(' ').pop())).length;

  // ŞİİRSEL sembol kelimeler (artı puan)
  const sembolKelimeler=['labirent','kıyamet','sessizlik','yokluk','sonsuzluk','uçurum','köprü','barikat','kafes','zincir','perde','kök','tohum','kül','yankı','ayna','gölge','iz','yankı'];
  const sembolSayisi=sembolKelimeler.filter(w=>tL.includes(w)).length;

  // Özgün metafor tespiti (basit: sık kullanılmayan kelime + eylem)
  const ozgunKelimeler=words.filter(w=>{const k=w.toLowerCase();return k.length>5&&!kliseMetaforlar.join(' ').includes(k)&&!['gibi','sanki','benim','senim','onun','bana','sana','olan','eden','için','bile','dahi'].includes(k);});
  const ozgunMetaforVar=ozgunKelimeler.length>3&&eylemMetSayisi>0;

  /* ── DİL ANALİZİ ─────────────────────────────────────── */
  const modernSozler=['telefon','internet','bilgisayar','araba','market','para','fatura','hastane','ofis','toplantı','proje','şirket','uygulama','instagram','whatsapp','sosyal medya','mesaj','wifi'];
  const modernKelime=modernSozler.filter(w=>tL.includes(w));

  // Günlük konuşma dili
  const gunlukDil=['tamam','evet','hayır','artık','işte','şimdi','hadi','sanırım','bilmiyorum','neyse','yani','aslında'];
  const gunlukSayisi=gunlukDil.filter(w=>tL.includes(w)).length;

  // Didaktik/açıklayıcı cümleler
  const didaktik=['çünkü','dolayısıyla','bu nedenle','sonuç olarak','şöyle ki','demek ki','özetle','şunu söyleyeyim','anlayacağın'];
  const didaktikSayisi=didaktik.filter(w=>tL.includes(w)).length;

  // Eski/arkaik Türkçe kelimeler (artı puan — uyumluysa)
  const eskiKelimeler=['bade','dil','gönül','canan','yar','efkar','hicran','dert','gariplik','gurbet','nigah','bakış','viran','zülüf','kadem','servi','mehtap','şebnem','damen','peyam','yare','çeşm','leb'];
  const eskiKelimeBul=eskiKelimeler.filter(w=>tL.includes(w));
  const eskiKelimeSayisi=eskiKelimeBul.length;

  // Eski kelime uyumu: kafiye düzeniyle birlikte kullanılmışsa uyumlu
  const eskiKelimeUyumlu=eskiKelimeSayisi>0&&(kafOrani>0.2||kitaKafiyeDuzeni);

  // Tekrar eden kelimeler
  const kelSay={};words.forEach(w=>{const k=w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'');if(k.length>3)kelSay[k]=(kelSay[k]||0)+1});
  const tekrarSayisi=Object.values(kelSay).filter(v=>v>=3).length;

  // İmla/anlatım bozukluğu (basit: çok kısa veya anlamsız satırlar)
  const cokKisaLine=lines.filter(l=>l.trim().split(/\s+/).length<2).length;

  /* ── ANA DUYGU / TEMA ────────────────────────────────── */
  const temalar={
    hüzün:{kelimeler:['hüzün','keder','ağlamak','gözyaşı','yalnız','özlem','hasret','acı','solmak','yas','matem','figan'],label:'hüzün ve keder'},
    umut:{kelimeler:['umut','ışık','sabah','doğmak','yeni','güneş','başlamak','sevinç','bahar','açılmak','yeşermek'],label:'umut ve yenilenme'},
    aşk:{kelimeler:['sevgi','aşk','yürek','gözler','beklemek','özlemek','sevgili','canan','yar','sevda'],label:'aşk ve özlem'},
    doğa:{kelimeler:['deniz','dağ','orman','nehir','rüzgar','yaprak','toprak','bulut','yağmur','kar','çiçek','ağaç'],label:'doğa ve evren'},
    varoluş:{kelimeler:['ölüm','yaşam','sonsuz','zaman','anlam','gerçek','boşluk','sessizlik','yokluk','hiçlik','ölümlü'],label:'varoluş ve anlam arayışı'},
    özgürlük:{kelimeler:['özgür','kanat','uçmak','zindan','kafes','kurtulmak','sınır','engel','yol','gitmek'],label:'özgürlük ve başkaldırı'},
  };
  let anaTema='genel', maxTema=0;
  for(const[t,{kelimeler}]of Object.entries(temalar)){
    const s=kelimeler.filter(k=>tL.includes(k)).length;
    if(s>maxTema){maxTema=s;anaTema=t;}
  }
  const temaLabel=temalar[anaTema]?.label||'karma duygular';
  const temaOrnekKelimeler=(temalar[anaTema]?.kelimeler||[]).filter(k=>tL.includes(k)).slice(0,3);

  // Şiirden imge örnekleri bul
  const imgeOrnekleri=[];
  lines.forEach(l=>{
    if(benzetmeImleri.some(b=>l.toLowerCase().includes(b))&&l.length>15)imgeOrnekleri.push(l.trim());
  });

  /* ── PUAN HESAPLAMA ──────────────────────────────────── */
  let p=4.5;

  // Uzunluk ve yapı
  if(len>=8&&len<=60)p+=0.8;else if(len>60&&len<=120)p+=0.4;else if(len<5){p-=2.5;}else if(len<8){p-=1.2;}else if(len>150)p-=0.3;
  if(lc>=4&&lc<=20)p+=0.6;else if(lc===3)p-=0.3;else if(lc<3){p-=1.0;}

  // Kelime zenginliği
  if(zenginlik>0.85)p+=1.5;else if(zenginlik>0.70)p+=0.9;else if(zenginlik>0.55)p+=0.3;else p-=0.4;

  // Kafiye puanı
  if(kafOrani>0.5&&!zorlamaKafiye)p+=0.8;
  else if(kafOrani>0.25&&!zorlamaKafiye)p+=0.4;
  if(zorlamaKafiye)p-=1.0;
  if(kitaKafiyeDuzeni&&!zorlamaKafiye)p+=0.3;

  // Hece
  if(heceOlcusu&&lc>=4)p+=0.6;

  // Ses araçları
  if(aliterasyon)p+=0.4;
  if(asonans)p+=0.3;

  // İmge/metafor
  if(benzetmeSayisi>=2)p+=0.5;else if(benzetmeSayisi>=1)p+=0.2;
  if(eylemMetSayisi>=3)p+=0.6;else if(eylemMetSayisi>=1)p+=0.2;
  if(sembolSayisi>=2)p+=0.5;else if(sembolSayisi>=1)p+=0.2;

  // Özgün metafor bonus
  if(ozgunMetaforVar)p+=0.6;

  // Klişe ceza
  p-=kliseSayisi*0.5;

  // Eski kelimeler
  if(eskiKelimeSayisi>0&&eskiKelimeUyumlu)p+=Math.min(eskiKelimeSayisi*0.2,0.6);
  else if(eskiKelimeSayisi>0&&!eskiKelimeUyumlu)p-=0.3;

  // Dil cezaları
  p-=modernKelime.length*0.5;
  if(gunlukSayisi>2)p-=(gunlukSayisi-2)*0.3;
  if(didaktikSayisi>0)p-=didaktikSayisi*0.5;

  // Tekrar ceza
  if(tekrarSayisi>1)p-=(tekrarSayisi-1)*0.25;

  // Çok kısa satır
  if(cokKisaLine>1)p-=(cokKisaLine-1)*0.2;

  // Noktalama
  const punct=(text.match(/[,;:!?—–.]/g)||[]).length;
  if(punct>=2&&punct<=12)p+=0.3;else if(punct===0&&lc>4)p-=0.2;

  // Çeşitlilik sapmacası
  const sapma=((hash%11)-5)*0.08;
  p=Math.min(9.6,Math.max(2.5,p+sapma));
  p=Math.round(p*10)/10;

  /* ── YORUM ÜRETİMİ ───────────────────────────────────── */
  let parcalar=[];

  // 1. Genel izlenim ve şiirden ne anlaşıldı
  if(len<6||lc<3){
    parcalar.push(`Şiir çok kısa; birkaç kelime veya dize bir şiir için yeterli bir zemin oluşturmuyor. Tema ancak yüzeysel işlenebilmiş.`);
  } else {
    const genelIzlenimler=[
      `Bu şiirde ${temaLabel} temasını işleyen lirik bir ses öne çıkıyor.`,
      `Şiir, ${temaLabel} ekseninde kurulmuş içe dönük bir anlatım sunuyor.`,
      `Okuyucu şiirde ${temaLabel} duygusunu yoğun biçimde hissediyor.`,
      `Şiir, ${temaLabel} üzerine kurulu kişisel bir iç sesi yansıtıyor.`,
    ];
    parcalar.push(genelIzlenimler[rnd(genelIzlenimler.length)]);
  }

  // 2. Ana konu ve tema
  if(temaOrnekKelimeler.length>0){
    parcalar.push(`Ana tema olan "${temaLabel}", şiirde ${temaOrnekKelimeler.map(k=>`"${k}"`).join(', ')} gibi kelimelerle somutlaşıyor.`);
  }

  // 3. İmge ve metafor örnekleri
  if(imgeOrnekleri.length>0){
    parcalar.push(`Şiirde dikkat çeken imge: "${imgeOrnekleri[0].slice(0,60)}${imgeOrnekleri[0].length>60?'…':''}" — bu benzetme temayı görselleştiriyor.`);
  }
  if(eylemMetSayisi>=2){
    parcalar.push(`Doğaya veya nesnelere insan özelliği yükleyen kişileştirme figürleri şiire derinlik katıyor.`);
  }
  if(kliseSayisi>0){
    parcalar.push(`Ancak bazı imgeler çok sık kullanılmış klişelere yakın; özgün söyleyiş bu şablonların dışına çıkmalı.`);
  }
  if(ozgunMetaforVar){
    parcalar.push(`Şiirde çarpıcı ve özgün bir metafor kullanımı göze çarpıyor — bu, şiiri sıradanlıktan kurtaran en güçlü unsur.`);
  }
  if(sembolSayisi>0){
    parcalar.push(`"${sembolKelimeler.filter(w=>tL.includes(w))[0]}" gibi sembolik bir kullanım şiire anlam katmanı ekliyor.`);
  }

  // 4. Ses araçları
  if(heceOlcusu&&lc>=4){
    parcalar.push(`Hece ölçüsüyle yazılmış; dizeler arasındaki hece dengesi (ort. ~${Math.round(heceMean)} hece) tutarlı ve ritim belirgin.`);
  } else {
    parcalar.push(`Serbest nazım tercih edilmiş; ${aliterasyon?`"${aliterasyonHarf}" harflerindeki aliterasyon ses dokusunu güçlendiriyor`:'ses araçlarından yeterince yararlanılmamış'}.`);
  }
  if(asonans){
    parcalar.push(`"${asonansUnlu}" ünlüsünün yoğun kullanımıyla asonans yaratılmış; bu iç ses uyumu şiire akıcılık kazandırıyor.`);
  }

  // 5. Kafiye
  if(zorlamaKafiye){
    parcalar.push(`Kafiye düzeni zorlamalı; aynı ekin tekrarı ses zenginliği yerine tekdüzelik oluşturuyor, şiirselliği zedeliyor.`);
  } else if(kafOrani>0.4){
    parcalar.push(`Kafiye düzeni sağlam ve doğal akışa uygun${kitaKafiyeDuzeni?'; halk edebiyatı geleneğine yakın kıta yapısı başarıyla uygulanmış':''}.`);
  } else if(kafOrani>0.1){
    parcalar.push(`Kısmi kafiyeler var; bu serbest bir tercih olabilir, ancak ses uyumu daha tutarlı olabilirdi.`);
  }
  if(kitaKafiyeDuzeni&&!zorlamaKafiye){
    parcalar.push(`Kıta sonlarındaki kafiye düzeni halk şiiri geleneğine uygun; bu uyum şiire sözlü edebiyat dokusu katıyor.`);
  }

  // 6. Dil analizi
  if(eskiKelimeSayisi>0){
    if(eskiKelimeUyumlu){
      parcalar.push(`"${eskiKelimeBul.slice(0,2).join('", "')}" gibi arkaik kelimeler şiirin havasıyla bütünleşiyor; divan edebiyatı etkisi hissediliyor.`);
    } else {
      parcalar.push(`"${eskiKelimeBul.slice(0,2).join('", "')}" gibi eski kelimeler şiirin modern tonuyla çelişiyor; bu kopukluk dil bütünlüğünü zedeliyor.`);
    }
  }
  if(modernKelime.length>0){
    parcalar.push(`"${modernKelime.slice(0,2).join('", "')}" gibi gündelik/modern kelimeler şiirsel atmosferi kırıyor.`);
  }
  if(didaktikSayisi>0){
    parcalar.push(`Bazı dizeler açıklayıcı/didaktik bir anlatıma kayıyor; şiirde "göster, anlatma" ilkesi esas olmalı.`);
  } else if(gunlukSayisi<=1&&modernKelime.length===0){
    parcalar.push(`Dil şiirsel ve özenli; gündelik konuşmadan uzak, şiire has bir söyleyiş var.`);
  }

  // 7. Kelime zenginliği ve tekrar
  if(tekrarSayisi>1){
    parcalar.push(`Bazı kelimeler fazla tekrar ediyor; bu tekrar bilinçli bir stil tercihi değilse şiiri yataylaştırıyor.`);
  } else if(zenginlik>0.75){
    parcalar.push(`Kelime zenginliği yüksek; söz dağarcığı özgün ve taze.`);
  }

  // 8. Genel değerlendirme kapanış
  if(p>=8){
    parcalar.push(`Bütünlüklü ve olgun bir şiir; biçim ve içerik birbirini destekliyor.`);
  } else if(p>=6){
    parcalar.push(`Potansiyelini tam açan bir şiir değil henüz; birkaç kritik düzenlemeyle çok daha güçlü olabilir.`);
  } else {
    parcalar.push(`Şiir ham malzeme sunuyor; daha özenli bir işçilikle büyük dönüşüm mümkün.`);
  }

  const yorum=parcalar.join(' ');

  /* ── GÜÇLÜ YÖN ───────────────────────────────────────── */
  const gucluH=[];
  if(kafOrani>0.3&&!zorlamaKafiye)gucluH.push('Kafiye düzeni doğal ve ses uyumu başarılı');
  if(aliterasyon)gucluH.push(`"${aliterasyonHarf}" harflerindeki aliterasyon müzikal akış sağlıyor`);
  if(asonans)gucluH.push(`"${asonansUnlu}" ünlüsünün tekrarıyla asonans yaratılmış`);
  if(heceOlcusu)gucluH.push('Hece ölçüsü dengeli ve ritim tutarlı');
  if(ozgunMetaforVar)gucluH.push('Özgün ve taze bir metafor kullanımı var');
  if(sembolSayisi>=1)gucluH.push('Sembolik kelime kullanımı anlam derinleştiriyor');
  if(benzetmeSayisi>=2)gucluH.push('Benzetmeler şiiri görselleştiriyor');
  if(zenginlik>0.75)gucluH.push('Kelime seçimleri taze ve özgün');
  if(eskiKelimeUyumlu)gucluH.push('Arkaik kelimeler şiirin havasıyla bütünleşiyor');
  if(kitaKafiyeDuzeni&&!zorlamaKafiye)gucluH.push('Kıta yapısı halk şiiri geleneğine uygun');
  if(gucluH.length===0)gucluH.push('Ham bir duygu yoğunluğu taşıyor; bu zemin üzerine inşa edilebilir');
  const guclu=gucluH[rnd(gucluH.length)];

  /* ── GELİŞTİRME ÖNERİSİ ─────────────────────────────── */
  const oneriH=[];
  if(zorlamaKafiye)oneriH.push('Zorlamalı kafiyelerden vazgeçilip doğal ses uyumu aranmalı');
  if(kliseSayisi>0)oneriH.push('Klişe imge ve metaforlar çıkarılıp özgün söyleyiş bulunmalı');
  if(modernKelime.length>0)oneriH.push(`"${modernKelime[0]}" gibi günlük kelimeler şiirsel karşılıklarıyla değiştirilmeli`);
  if(didaktikSayisi>0)oneriH.push('"Göster, anlatma" ilkesiyle duygu doğrudan imgelerle verilmeli');
  if(benzetmeSayisi===0&&eylemMetSayisi===0)oneriH.push('Somut imgeler ve metaforlar eklenerek şiir görselleştirilmeli');
  if(zenginlik<0.6)oneriH.push('Kelime dağarcığı genişletilmeli, tekrarlar azaltılmalı');
  if(lc<4)oneriH.push('Şiir çok kısa; en az 4-6 dize ile tema tam ve derinlikli işlenebilir');
  if(!aliterasyon&&kafOrani<0.2)oneriH.push('Aliterasyon veya iç kafiyeyle ses dokusu zenginleştirilebilir');
  if(tekrarSayisi>1)oneriH.push('Tekrarlayan kelimeler yerine sinonimler kullanılmalı');
  if(oneriH.length===0)oneriH.push('Son dize daha kalıcı ve çarpıcı bir kapanışla güçlendirilebilir');
  const oneri=oneriH[rnd(oneriH.length)];

  return{score:p, yorum, gucluYonler:guclu, gelistirmeOnerisi:oneri};
}

// Sadece ilgili kartı günceller, sayfa kaymaz
function refreshCard(pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const oldCard=document.querySelector(`[data-pid="${pid}"]`);
  if(!oldCard)return;
  // Kartın genişletilmiş mi olduğunu kaydet
  const wasExpanded=oldCard.querySelector('.post-full')?.style.display==='block';
  // Yorumlar açık mıydı
  const cmtBodyEl=oldCard.querySelector('.cmt-body');
  const cmtsOpen=cmtBodyEl?.style.display==='block';
  // Mevcut scroll pozisyonunu kaydet
  const scrollY=window.scrollY;
  // Yeni kartı oluştur — her zaman genişletilmiş tut
  const newCard=postCard(post, wasExpanded);
  newCard.setAttribute('data-pid',pid);
  oldCard.replaceWith(newCard);
  // Yorumlar açıksa yeni kartta da aç
  if(cmtsOpen){
    const newCmtBody=newCard.querySelector('.cmt-body');
    if(newCmtBody)newCmtBody.style.display='block';
  }
  // Scroll pozisyonunu geri yükle — sayfa kaymaz
  window.scrollTo({top:scrollY,behavior:'instant'});
}

function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  return e;
}

function postCard(post, forceExpand=false){
  const author=byId(post.authorId);
  const vid=ytId(post.youtube);
  const avg=calcAvg(post.userRatings,post.aiScore);
  const ucnt=Object.keys(post.userRatings||{}).length;
  const myR=post.userRatings?.[S.me?.id]??null;
  const isOwn = post.authorId === S.me?.id;
  const isAdmin = S.me?.username === ADMIN_USERNAME;
  let expanded = !!forceExpand;

  const card=h('div',{class:'card fade','data-pid':post.id,style:{padding:'14px 16px',cursor:'default'}});

  // SİLME BUTONU
  if(isAdmin || isOwn){
    const delBtn=h('button',{class:'absolute-del-post',onclick:(e)=>{e.stopPropagation();A.deletePost(post.id);}},['Sil ✕']);
    card.appendChild(delBtn);
  }

  // ── ÖNZLEME ───────────────────────────────────────────────────────────────
  const preview=h('div',{style:{cursor:'pointer'}});
  // görsel varsa üstte
  if(post.image){
    preview.appendChild(h('img',{src:post.image,style:{width:'100%',borderRadius:'10px',marginBottom:'10px',height:'300px',objectFit:'cover'}}));
  } else if(vid){
    const yt=h('div',{style:{width:'100%',height:'300px',borderRadius:'10px',marginBottom:'10px',overflow:'hidden',position:'relative',background:'#000'}});
    yt.innerHTML=`<img src="https://img.youtube.com/vi/${vid}/mqdefault.jpg" style="width:100%;height:100%;object-fit:cover;opacity:.8"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="font-size:2.5rem">▶️</span></div>`;
    preview.appendChild(yt);
  }
  // yazar
  const phdr=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'6px',paddingRight:'60px'}});
  phdr.appendChild(av(author,32,null));
  const pinfo=h('div',{style:{flex:'1',minWidth:'0'}});
  pinfo.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontWeight:'700',color:'#e9d5ff',fontSize:'.9rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},author?.name||''));
  pinfo.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.72rem'}},`@${author?.username||''} · ${post.date}`));
  phdr.appendChild(pinfo);
  if(avg!==null) phdr.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(avg)}44`,minWidth:'40px',padding:'4px 6px'}},[h('p',{style:{fontSize:'1rem',fontWeight:'700',color:scoreColor(avg),lineHeight:'1'}},avg.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
  preview.appendChild(phdr);
  // başlık
  if(post.title) preview.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'.95rem',color:'#e9d5ff',fontStyle:'italic',marginBottom:'4px'}},`"${post.title}"`));
  // metin snippet
  if(post.text){
    const snip=post.text.length>80?post.text.slice(0,80)+'…':post.text;
    preview.appendChild(h('p',{style:{fontFamily:"'Crimson Text',serif",fontSize:'.9rem',color:'#a78bfa',lineHeight:'1.5',whiteSpace:'pre-wrap'}},snip));
  }
  // alt bilgi
  const pfoot=h('div',{style:{display:'flex',gap:'12px',marginTop:'8px',paddingTop:'8px',borderTop:'1px solid #2d1b5244',alignItems:'center'}});
  pfoot.appendChild(h('span',{style:{fontSize:'.75rem',color:'#6b5b8a'}},`💬 ${(post.comments||[]).length}`));
  pfoot.appendChild(h('span',{style:{fontSize:'.75rem',color:'#6b5b8a'}},`⭐ ${ucnt} oy`));
  if(avg!==null) pfoot.appendChild(h('span',{style:{fontSize:'.75rem',color:scoreColor(avg)}},scoreBadge(avg)));
  const expandLabel=h('span',{style:{fontSize:'.75rem',color:'#7c3aed',marginLeft:'auto'}},'Devamını gör ▼');
  pfoot.appendChild(expandLabel);

      const info=h('div',{style:{flex:'1'}});
      const n=h('p',{style:{fontFamily:"'Playfair Display',serif",fontWeight:'700',color:'#e9d5ff',cursor:'pointer'},onclick:()=>go('profile',{profileId:u.id})},u.name);
      info.appendChild(n);info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},`@${u.username} · ${u.cnt} şiir`));
      card.appendChild(info);
      card.appendChild(h('div',{style:{textAlign:'center'}},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.4rem',fontWeight:'700',color:scoreColor(u.avg)}},u.avg.toFixed(1)),h('p',{style:{fontSize:'.63rem',color:'#6b5b8a'}},'ort. puan')]));
      ct.appendChild(card);
    });
  }
  pb.onclick=()=>{pb.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';pb.style.color='#fff';pb.style.border='none';ub.style.background='#1a0f2e';ub.style.color='#a78bfa';ub.style.border='1px solid #2d1b52';showP();};
  ub.onclick=()=>{ub.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';ub.style.color='#fff';ub.style.border='none';pb.style.background='#1a0f2e';pb.style.color='#a78bfa';pb.style.border='1px solid #2d1b52';showU();};
  showP();page.appendChild(ct);wrap.appendChild(page);return wrap;
}

function Explore(){
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',marginBottom:'16px',fontSize:'1.4rem'}},'Keşfet'));
  const list=h('div');
  const si=inp('Ozan ara...');si.style.marginBottom='16px';
  function renderList(q=''){
    list.innerHTML='';
    const filtered = S.users.filter(u=>u.id!==S.me?.id&&(u.name.toLowerCase().includes(q.toLowerCase())||u.username.toLowerCase().includes(q.toLowerCase())));
    if (filtered.length === 0) {
      list.appendChild(h('p', {style:{color:'#6b5b8a', fontStyle:'italic', textAlign:'center', marginTop:'20px'}}, 'Aranan kriterde ozan bulunamadı.'));
      return;
    }
    filtered.forEach(u=>{
      if(u.username === ADMIN_USERNAME) return; 
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'14px'}});
      card.appendChild(av(u,50,()=>go('profile',{profileId:u.id})));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontWeight:'700',color:'#e9d5ff',cursor:'pointer'},onclick:()=>go('profile',{profileId:u.id})},u.name));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.83rem'}},`@${u.username}`));
      if(u.bio)info.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.87rem',fontStyle:'italic',marginTop:'2px'}},u.bio));
      card.appendChild(info);
      const fl=isF(u.id);
      const fb=h('button',{class:'btn',style:{background:fl?'#3d1f6e':'linear-gradient(135deg,#7c3aed,#a855f7)',color:'#fff',padding:'7px 16px',borderRadius:'20px',fontSize:'.85rem',border:'none'},onclick:()=>{A.toggleFollow(u.id);renderList(si.value);}},fl?'Takip Ediliyor':'Takip Et');
      card.appendChild(fb);list.appendChild(card);
    });
  }
  si.oninput=e=>renderList(e.target.value);renderList();
  page.appendChild(si);page.appendChild(list);wrap.appendChild(page);return wrap;
}

function Profile(){
  const tid=S.profileId||S.me?.id;
  const user=byId(tid);
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  if(S.profileId && S.profileId !== S.me?.id){
    page.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'16px',fontSize:'.9rem'},onclick:()=>go('feed')},'← Geri'));
  }
  if(!user){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Kullanıcı bulunamadı.'));
    wrap.appendChild(page);return wrap;
  }
  const ups=S.posts.filter(p=>p.authorId===tid);
  const sp=ups.filter(p=>calcAvg(p.userRatings,p.aiScore)!==null);
  const avg=sp.length?(sp.reduce((s,p)=>s+calcAvg(p.userRatings,p.aiScore),0)/sp.length).toFixed(1):null;
  const fc=Object.values(S.follows).filter(l=>l.includes(tid)).length;
  const fg=(S.follows[tid]||[]).length;
  const isMe=tid===S.me?.id;
  const card=h('div',{class:'card fade',style:{textAlign:'center'}});
  card.appendChild(h('div',{style:{display:'flex',justifyContent:'center',marginBottom:'12px'}},[av(user,72)]));
  card.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.5rem',color:'#e9d5ff'}},user.name));
  card.appendChild(h('p',{style:{color:'#6b5b8a',marginBottom:'6px'}},`@${user.username}`));
  if(user.bio)card.appendChild(h('p',{style:{color:'#c4b5fd',fontStyle:'italic',marginBottom:'10px'}},user.bio));
  if(avg)card.appendChild(h('p',{style:{color:scoreColor(+avg),marginBottom:'12px'}},`Ort. Puan: ${avg}/10 ${scoreBadge(+avg)}`));
  const stats=h('div',{style:{display:'flex',justifyContent:'center',gap:'28px',marginBottom:'16px'}});
  [['Şiir',ups.length],['Takipçi',fc],['Takip',fg]].forEach(([l,v])=>stats.appendChild(h('div',{},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.3rem',color:'#e9d5ff'}},String(v)),h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},l)])));
  card.appendChild(stats);
  if(!isMe && user.username !== ADMIN_USERNAME){
    const fb=h('button',{class:'pb btn',onclick:()=>{A.toggleFollow(user.id);render();}},isF(user.id)?'Takibi Bırak':'Takip Et');
    card.appendChild(fb);
  }
  page.appendChild(card);
  page.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#a78bfa',marginBottom:'12px',fontSize:'1.1rem'}},'Şiirler'));
  if(!ups.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Henüz şiir paylaşılmadı.'));
  } else {
    ups.forEach(p=>{
      const a=calcAvg(p.userRatings,p.aiScore);
      const pc=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'center',cursor:'pointer'},onclick:()=>go('postdetail',{postId:p.id})});
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:'#e9d5ff',fontStyle:'italic'}},`"${p.title||p.text?.slice(0,30)+(p.text?.length>30?'…':'')||'İsimsiz'}"`));
      info.appendChild(h('p',{style:{fontSize:'.78rem',color:'#6b5b8a',marginTop:'4px'}},`${p.date} · ${(p.comments||[]).length} yorum`));
      pc.appendChild(info);
      if(a!==null)pc.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(a)}44`}},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',fontWeight:'700',color:scoreColor(a)}},a.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
      page.appendChild(pc);
    });
  }
  wrap.appendChild(page);return wrap;
}

function PostDetail(){
  const post=S.posts.find(p=>p.id===S.postId);
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'16px'},onclick:()=>go('feed')},'← Akışa Dön'));
  if(post)page.appendChild(postCard(post,true));
  else page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Şiir bulunamadı.'));
  wrap.appendChild(page);return wrap;
}

function Messages(){
  let chat=null;
  let activeTab='msgs'; // msgs | notifs
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});

  // Sekmeler
  const unreadCount=(S.notifs||[]).filter(n=>!n.read).length;
  const msgsBtn=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'linear-gradient(135deg,#7c3aed,#a855f7)',color:'#fff',border:'none'}},'✉️ Mesajlar');
  const notifBtn=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'#1a0f2e',color:'#a78bfa',border:'1px solid #2d1b52',position:'relative'}});
  notifBtn.appendChild(document.createTextNode('🔔 Bildirimler'));
  if(unreadCount>0){const badge=h('span',{style:{position:'absolute',top:'-4px',right:'-4px',background:'#e879f9',color:'#fff',borderRadius:'50%',width:'18px',height:'18px',fontSize:'.6rem',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unreadCount>9?'9+':unreadCount));notifBtn.appendChild(badge);}
  const tabRow=h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}},[msgsBtn,notifBtn]);
  page.appendChild(tabRow);

  const ct=h('div');page.appendChild(ct);wrap.appendChild(page);

  function showMsgs(){
    ct.innerHTML='';
    // Sadece mesajlaşılan kişileri göster
    const contactedIds=new Set();
    S.msgs.forEach(m=>{
      if(m.fromId===S.me?.id)contactedIds.add(m.toId);
      if(m.toId===S.me?.id)contactedIds.add(m.fromId);
    });
    const contacts=S.users.filter(u=>contactedIds.has(u.id)&&u.id!==S.me?.id);

    // Mesaj yazılabilecek tüm kullanıcılar için "Yeni Mesaj" butonu
    const newMsgBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'12px',background:'linear-gradient(135deg,#1e0a3e,#2d1060)',border:'1px dashed #5b21b6',borderRadius:'12px',padding:'12px',color:'#a78bfa',fontSize:'.9rem',fontFamily:"'Crimson Text',serif",display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'},onclick:()=>showUserList()});
    newMsgBtn.appendChild(document.createTextNode('✏️ Yeni Mesaj'));
    ct.appendChild(newMsgBtn);

    if(!contacts.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'20px'}},'Henüz mesajlaşma yok. Yukarıdaki butona basarak yeni mesaj gönderebilirsin.'));
      return;
    }
    contacts.forEach(u=>{
      const last=[...S.msgs].reverse().find(m=>(m.fromId===S.me?.id&&m.toId===u.id)||(m.fromId===u.id&&m.toId===S.me?.id));
      const unread=S.msgs.filter(m=>m.fromId===u.id&&m.toId===S.me?.id&&!m.read).length;
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,44));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      if(last)info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.83rem'}},last.text.slice(0,40)+(last.text.length>40?'…':'')));
      card.appendChild(info);
      if(unread>0)card.appendChild(h('span',{style:{background:'#c084fc',color:'#fff',borderRadius:'50%',width:'20px',height:'20px',fontSize:'.7rem',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unread)));
      ct.appendChild(card);
    });
  }

  function showUserList(){
    ct.innerHTML='';
    ct.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'12px',fontSize:'.9rem'},onclick:()=>showMsgs()},'← Geri'));
    ct.appendChild(h('p',{style:{color:'#a78bfa',fontFamily:"'Crimson Text',serif",fontSize:'.9rem',marginBottom:'12px',fontStyle:'italic'}},'Mesaj göndermek istediğin kişiyi seç:'));
    const others=S.users.filter(u=>u.id!==S.me?.id&&u.username!==ADMIN_USERNAME);
    others.forEach(u=>{
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,40));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},`@${u.username}`));
      card.appendChild(info);
      ct.appendChild(card);
    });
  }

  function showNotifs(){
    ct.innerHTML='';
    const unread=(S.notifs||[]).filter(n=>!n.read);
    if(unread.length>0){
      unread.forEach(n=>{n.read=true;db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});});
      lsSet('yo_notifs',S.notifs);
    }
    const notifs=S.notifs||[];
    if(!notifs.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
      return;
    }
    notifs.forEach(n=>{
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      card.appendChild(h('span',{style:{fontSize:'1.4rem',flexShrink:'0'}},n.text.includes('yorum')?'💬':'⭐'));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px',display:'inline-block'}}));
      ct.appendChild(card);
    });
  }

  function showChat(){
    ct.innerHTML='';
    const chatUser=S.users.find(u=>u.id===chat);
    const hdr=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
    hdr.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',fontSize:'.9rem'},onclick:()=>{chat=null;showMsgs();}},'←'));
    hdr.appendChild(av(chatUser,36));
    hdr.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},chatUser?.name||''));
    ct.appendChild(hdr);
    const msgs=h('div',{style:{height:'55vh',overflowY:'auto',display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'8px'}});
    S.msgs.filter(m=>(m.fromId===S.me?.id&&m.toId===chat)||(m.fromId===chat&&m.toId===S.me?.id)).forEach(m=>{
      const mine=m.fromId===S.me?.id;
      msgs.appendChild(h('div',{style:{display:'flex',justifyContent:mine?'flex-end':'flex-start'}},[h('div',{style:{maxWidth:'70%',background:mine?'linear-gradient(135deg,#7c3aed,#a855f7)':'#1a0f2e',borderRadius:mine?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'10px 14px',border:mine?'none':'1px solid #2d1b52'}},[h('p',{style:{color:'#f0e8ff',fontSize:'.95rem'}},m.text),h('p',{style:{color:mine?'#ddd6fe':'#6b5b8a',fontSize:'.7rem',marginTop:'4px',textAlign:mine?'right':'left'}},m.date)])]));
    });
    msgs.scrollTop=msgs.scrollHeight;
    const mi=inp('Mesajını yaz...');mi.style.borderRadius='20px';mi.style.flex='1';
    const sendMsg=()=>{if(!mi.value.trim())return;A.sendMsg(chat,mi.value.trim());mi.value='';showChat();};
    mi.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
    ct.appendChild(msgs);
    ct.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},[mi,h('button',{class:'pb btn',style:{padding:'10px 18px'},onclick:sendMsg},'↩')]));
  }

  msgsBtn.onclick=()=>{activeTab='msgs';msgsBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';msgsBtn.style.color='#fff';msgsBtn.style.border='none';notifBtn.style.background='#1a0f2e';notifBtn.style.color='#a78bfa';notifBtn.style.border='1px solid #2d1b52';showMsgs();};
  notifBtn.onclick=()=>{activeTab='notifs';notifBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';notifBtn.style.color='#fff';notifBtn.style.border='none';msgsBtn.style.background='#1a0f2e';msgsBtn.style.color='#a78bfa';msgsBtn.style.border='1px solid #2d1b52';showNotifs();};

  showMsgs();
  return wrap;
}

function Notifs(){
  // Bildirimleri okundu olarak işaretle
  const unread=(S.notifs||[]).filter(n=>!n.read);
  if(unread.length>0){
    unread.forEach(n=>{
      n.read=true;
      db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});
    });
    lsSet('yo_notifs',S.notifs);
  }
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',marginBottom:'16px',fontSize:'1.4rem'}},'🔔 Bildirimler'));
  const notifs=S.notifs||[];
  if(!notifs.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
  } else {
    notifs.forEach(n=>{
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      card.appendChild(h('span',{style:{fontSize:'1.5rem',flexShrink:'0'}},n.text.includes('yorum')? '💬':'⭐'));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px'}}));
      page.appendChild(card);
    });
  }
  wrap.appendChild(page);return wrap;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  
  if (S.loading) {
    app.appendChild(h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#0f0a1a'}},[
      h('div',{style:{fontSize:'32px'}},'🪶'),
      h('p',{style:{color:'#a78bfa',marginTop:'12px',fontStyle:'italic',fontSize:'1rem'}},'Ozanlar Meclisi Yükleniyor...')
    ]));
    return;
  }

  if(!S.me){
    const screens={
      landing:Landing,
      login:()=>authPage('Hoş geldin','Hesabınla giriş yap',[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'}],'Giriş Yap',v=>A.login(v.u||'',v.p||''),'Hesabın yok mu?',()=>go('register')),
      register:()=>authPage('Katıl',"Yeni Ozanlar'a üye ol",[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'},{label:'Şifre tekrar',type:'password',ph:'••••••••',k:'p2'}],'Hesap Oluştur',v=>{if(!v.u||!v.p)return'Tüm alanları doldurun.';if(v.p!==v.p2)return'Şifreler eşleşmiyor.';if((v.p||'').length<6)return'Şifre en az 6 karakter.';return A.register(v.u.trim(),v.p);},'Zaten üye misin?',()=>go('login'))
    };
    const Screen=screens[S.screen]||Landing;
    app.appendChild(Screen());
    return;
  }
  const screens={feed:Feed,leaderboard:Leaderboard,explore:Explore,profile:Profile,postdetail:PostDetail,messages:Messages,notifs:Notifs};
  const Screen=screens[S.screen]||Feed;
  app.appendChild(Screen());
}

verileriYukle();
</script>
