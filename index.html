// PROFİL / KAPAK / YORUM / SES YÜKLEMELERİ artık Cloudinary yerine kendi R2 depomuza
// (/api/flux-image, action:'upload') gider — Cloudinary kotası doldu. Vercel gövde
// sınırı yüzünden dosya en fazla ~3 MB olabilir.
const YUKLEME_MAX_BAYT = 3*1024*1024;
function blobDataUrlOku(blob){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=()=>reject(new Error('Dosya okunamadı'));
    fr.readAsDataURL(blob);
  });
}
async function depoyaYukle(dataUrlOrBlob, klasor){
  const dataUrl = typeof dataUrlOrBlob==='string' ? dataUrlOrBlob : await blobDataUrlOku(dataUrlOrBlob);
  const res = await fetch('/api/flux-image',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ action:'upload', dataUrl, folder:klasor, userId:S.me?.id||'' })
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok || !data.url) throw new Error(data?.error || `HTTP ${res.status}`);
  if(data.storage && data.storage!=='r2') console.warn(`⚠️ Dosya R2'ye değil "${data.storage}" yedeğine yüklendi. R2 hatası: ${data.r2Error||'(bilinmiyor)'}`);
  return data.url;
}

async function cloudinaryMedyaYukle(file, klasor='comments', maxImageSide=1280){
  if(!file || !S.me) return null;
  const isImage=file.type?.startsWith('image/');
  const isVideo=file.type?.startsWith('video/');
  if(!isImage && !isVideo){ toastGoster('Sadece resim veya video ekleyebilirsin.'); return null; }
  if(isImage && file.size>10*1024*1024){ toastGoster('Resim en fazla 10 MB olabilir.'); return null; }
  if(isVideo && file.size>YUKLEME_MAX_BAYT){ toastGoster('Video en fazla 3 MB olabilir.'); return null; }

  try{
    let kaynak=file;
    if(isImage){
      kaynak=await resimSikistir(file,maxImageSide,0.8);
      if(!kaynak || typeof kaynak!=='string') throw new Error('Resim dönüştürülemedi');
    }
    const url=await depoyaYukle(kaynak,'comments');
    return {type:isImage?'image':'video',url,name:file.name};
  }catch(err){
    console.error('Medya yükleme hatası:',err);
    toastGoster('Medya yüklenemedi: '+(err?.message||'bağlantıyı kontrol edin'));
    return null;
  }
}

// Yorum resmi/video R2 depoya gider (bkz. depoyaYukle).
async function yorumDosyasiYukle(file){
  return cloudinaryMedyaYukle(file,'comments',1280);
}

async function yorumIcinGifGetir(post){
  try{
    const metin=[post?.title||'',post?.text||''].join(' ').slice(0,700);
    const result=await groqBotCall(
      'Sen şiir temalarından GIPHY araması için kısa İngilizce anahtar kelimeler üreten asistansın. Yalnızca JSON döndür.',
      `Şu şiirin ruhuna uygun, GIPHY aramasında işe yarayacak 2-4 İngilizce kelime üret. Genel meme yerine sinematik/duygusal görselleri hedefle. JSON: {"query":"..."}\nŞiir: ${metin}`
    );
    const query=(result?.query||'poetry emotional aesthetic').toString().slice(0,100);
    const r=await fetch('/api/giphy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});
    const data=await r.json();
    if(!r.ok) throw new Error(data?.error?.message||'GIPHY hatası');
    return {type:'gif',url:data.gifUrl,title:data.title||'',query};
  }catch(err){
    console.warn('Yorum GIF hatası:',err);
    toastGoster('GIF getirilemedi; tekrar deneyin.');
    return null;
  }
}

async function yorumAIonerileriGetir(post){
  try{
    const result=await groqBotCall(
      'Sen Yeni Ozanlar için şiirsel ama doğal yorumlar üreten bir asistansın. Kısa, özgün, klişeden uzak yorumlar yaz. Yalnızca JSON döndür.',
      `Şu şiire uygun 3 kısa kullanıcı yorumu üret. Her biri 1 cümle, en fazla 14 kelime olsun. Şiirin içeriğini gerçekten dikkate al; sadece "çok güzel" deme. JSON: {"yorumlar":["...","...","..."]}\nBaşlık: ${post?.title||''}\nŞiir: ${(post?.text||'').slice(0,1800)}`
    );
    return Array.isArray(result?.yorumlar) ? result.yorumlar.filter(x=>String(x).trim()).slice(0,3).map(x=>String(x).trim()) : [];
  }catch(err){
    console.warn('Yorum AI öneri hatası:',err);
    return [];
  }
}

function yorumMedyaGoster(media){
  if(!media?.url) return null;
  const wrap=h('div',{class:'comment-media'});
  if(media.type==='image') wrap.appendChild(h('img',{src:media.url,loading:'lazy',alt:'Yorum görseli'}));
  else if(media.type==='video') wrap.appendChild(h('video',{src:media.url,controls:true,preload:'metadata'}));
  else if(media.type==='youtube'){
    const id=ytId(media.url);
    if(id) wrap.appendChild(ytOynatici(id));
    else return null;
  } else if(media.type==='gif'){
    wrap.appendChild(h('img',{src:media.url,loading:'lazy',alt:'GIF yorum'}));
    wrap.appendChild(h('div',{class:'comment-gif-credit'},'Powered by GIPHY'));
  }
  return wrap;
}

// PROFİL, KAPAK VE YORUM MEDYALARI CLOUDINARY'YE YÜKLENİR.
// Firebase Storage'daki CORS/preflight sorunlarını bu medya akışında kullanmıyoruz.
const CLOUDINARY_CLOUD_NAME = 'f2iuce5z';
const CLOUDINARY_PROFILE_PRESET = 'site_unsigned';

async function cloudinaryProfilYukle(file,tip){
  if(!file || !S.me) return null;
  if(!file.type || !file.type.startsWith('image/')){
    toastGoster('Profil resmi ve kapak fotoğrafı yalnızca resim olabilir.');
    return null;
  }
  if(file.size > 10*1024*1024){
    toastGoster('Resim en fazla 10 MB olabilir.');
    return null;
  }

  try{
    const maks = tip==='avatar' ? 640 : 1600;
    const dataUrl=await resimSikistir(file,maks,0.82);
    if(!dataUrl || typeof dataUrl !== 'string') throw new Error('Resim dönüştürülemedi');
    return await depoyaYukle(dataUrl, tip==='avatar' ? 'profiles/avatar' : 'profiles/cover');
  }catch(err){
    console.error('Profil resmi yükleme hatası:',err);
    toastGoster('Profil fotoğrafı yüklenemedi: '+(err?.message||'bağlantıyı kontrol edin'));
    return null;
  }
}

async function profilMedyaYukle(file,tip){
  return cloudinaryProfilYukle(file,tip);
}

A.updateProfile = async function(fields, avatarFile=null, coverFile=null){
  if(!S.me) return false;
  const idx=S.users.findIndex(u=>u.id===S.me.id);
  if(idx<0) return false;

  const btnFields={...fields};

  if(avatarFile){
    const url=await profilMedyaYukle(avatarFile,'avatar');
    if(!url) return false;
    btnFields.avatarUrl=url;
  }

  if(coverFile){
    const url=await profilMedyaYukle(coverFile,'cover');
    if(!url) return false;
    btnFields.coverUrl=url;
  }

  const updated={...S.users[idx],...btnFields};
  S.users[idx]=updated;
  S.me=updated;
  save();

  // Firestore'a profil bilgileri ve Cloudinary URL'leri yazılır.
  await db.collection('users').doc(updated.id).set(updated,{merge:true});
  return true;
};

function kapakKirpModal(file){
  return new Promise(resolve=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const modal=h('div',{class:'modal-bg'});
      const panel=h('div',{class:'modal',style:{maxWidth:'820px',width:'min(96vw,820px)',padding:'18px',background:'linear-gradient(145deg,#120a20,#1b0d2d)',border:'1px solid #7c3aed'}});
      const title=h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#eadcff',margin:'0 0 7px'}},'✂️ Kapak Fotoğrafını Ayarla');
      const info=h('p',{style:{color:'#bda7e8',fontSize:'.82rem',margin:'0 0 10px',lineHeight:'1.5'}},'Fotoğrafı yakınlaştırıp uzaklaştır. Fotoğrafın üzerine basılı tutup sağa-sola veya yukarı-aşağı sürükle. Mor çerçevenin içi kapak olarak kullanılacak.');

      const stage=h('div',{style:{position:'relative',width:'100%',height:'min(56vh,460px)',minHeight:'280px',overflow:'hidden',background:'#07040d',borderRadius:'14px',userSelect:'none',touchAction:'none',border:'1px solid #4c1d95',cursor:'grab'}});
      const canvas=document.createElement('canvas');
      canvas.style.display='block';canvas.style.width='100%';canvas.style.height='100%';canvas.style.touchAction='none';
      stage.appendChild(canvas);
      const ctx=canvas.getContext('2d');
      const frame=h('div',{style:{position:'absolute',left:'0',top:'50%',transform:'translateY(-50%)',width:'100%',aspectRatio:'3 / 1',border:'2px solid #c084fc',boxShadow:'0 0 0 9999px rgba(0,0,0,.58)',boxSizing:'border-box',pointerEvents:'none'}});
      stage.appendChild(frame);

      const controls=h('div',{style:{display:'flex',alignItems:'center',gap:'9px',marginTop:'12px',padding:'10px 12px',borderRadius:'12px',background:'rgba(124,58,237,.12)',border:'1px solid rgba(192,132,252,.25)'}});
      const zoomOut=h('button',{type:'button',class:'btn',style:{minWidth:'42px',padding:'7px 11px',background:'linear-gradient(135deg,#14532d,#166534)',color:'#ecfdf5',border:'1px solid #22c55e',borderRadius:'10px'},onclick:()=>setZoom(zoom-0.1)},'−');
      const zoomRange=h('input',{type:'range',min:'0.5',max:'3',step:'0.01',value:'1',style:{flex:'1',accentColor:'#a855f7'}});
      const zoomIn=h('button',{type:'button',class:'btn',style:{minWidth:'42px',padding:'7px 11px',background:'linear-gradient(135deg,#6d28d9,#9333ea)',color:'#fff',border:'1px solid #c084fc',borderRadius:'10px'},onclick:()=>setZoom(zoom+0.1)},'+');
      const zoomText=h('span',{style:{minWidth:'58px',textAlign:'right',color:'#d8b4fe',fontSize:'.78rem',fontWeight:'600'}},'100%');
      controls.appendChild(h('span',{style:{color:'#c4b5fd',fontSize:'.8rem'}},'🔍'));controls.appendChild(zoomOut);controls.appendChild(zoomRange);controls.appendChild(zoomIn);controls.appendChild(zoomText);

      let zoom=1, scale=0, baseScale=1, offsetX=0, offsetY=0, dragging=null, stageW=0, stageH=0;
      const targetW=1500,targetH=500;

      function metrics(){
        const fw=stageW, fh=stageW/3;
        return {fw,fh,fx:0,fy:(stageH-fh)/2};
      }
      function coverScale(){
        const {fw,fh}=metrics();
        return Math.max(fw/img.naturalWidth,fh/img.naturalHeight);
      }
      function clampOffsets(){
        const {fw,fh,fx,fy}=metrics();
        const iw=img.naturalWidth*scale, ih=img.naturalHeight*scale;
        if(iw>=fw){
          offsetX=Math.min(fx,Math.max(fx+fw-iw,offsetX));
        }else{
          offsetX=fx+(fw-iw)/2;
        }
        if(ih>=fh){
          offsetY=Math.min(fy,Math.max(fy+fh-ih,offsetY));
        }else{
          offsetY=fy+(fh-ih)/2;
        }
      }
      function draw(){
        const rect=stage.getBoundingClientRect();
        stageW=Math.max(1,rect.width);stageH=Math.max(1,rect.height);
        const dpr=window.devicePixelRatio||1;
        canvas.width=Math.round(stageW*dpr);canvas.height=Math.round(stageH*dpr);
        canvas.style.width=stageW+'px';canvas.style.height=stageH+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        baseScale=coverScale();
        if(!scale){
          // İlk açılışta fotoğrafın tamamını görmeye çalış; minimum kapak ölçeğine ihtiyaç olduğunda
          // kullanıcı yakınlaştırarak çerçevenin tamamını doldurabilir.
          const containScale=Math.min(stageW/img.naturalWidth,stageH/img.naturalHeight);
          scale=containScale;
          zoom=Math.max(.5,Math.min(3,scale/baseScale));
          if(!Number.isFinite(zoom)||zoom<.5){zoom=.5;scale=baseScale*.5;}
          offsetX=(stageW-img.naturalWidth*scale)/2;
          offsetY=(stageH-img.naturalHeight*scale)/2;
        }
        clampOffsets();
        ctx.clearRect(0,0,stageW,stageH);
        ctx.fillStyle='#07040d';ctx.fillRect(0,0,stageW,stageH);
        ctx.drawImage(img,offsetX,offsetY,img.naturalWidth*scale,img.naturalHeight*scale);
        const m=metrics();
        frame.style.height=m.fh+'px';
        zoomRange.value=String(Math.max(.5,Math.min(3,zoom)));
        zoomText.textContent=Math.round(zoom*100)+'%';
      }
      function setZoom(z,cx=null,cy=null){
        const oldScale=scale||baseScale;
        zoom=Math.max(.5,Math.min(3,z));
        const newScale=baseScale*zoom;
        const px=cx==null?stageW/2:cx, py=cy==null?stageH/2:cy;
        const ix=(px-offsetX)/oldScale, iy=(py-offsetY)/oldScale;
        offsetX=px-ix*newScale;offsetY=py-iy*newScale;
        scale=newScale;
        clampOffsets();draw();
      }
      zoomRange.oninput=e=>setZoom(parseFloat(e.target.value));
      stage.addEventListener('pointerdown',e=>{
        dragging={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY};
        stage.style.cursor='grabbing';
        stage.setPointerCapture?.(e.pointerId);
      });
      stage.addEventListener('pointermove',e=>{
        if(!dragging)return;
        offsetX=dragging.ox+(e.clientX-dragging.x);
        offsetY=dragging.oy+(e.clientY-dragging.y);
        clampOffsets();draw();
      });
      const stopDrag=()=>{dragging=null;stage.style.cursor='grab';};
      stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);stage.addEventListener('pointerleave',()=>{if(dragging)stage.style.cursor='grabbing';});
      stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();setZoom(zoom+(e.deltaY<0?.08:-.08),e.clientX-r.left,e.clientY-r.top);},{passive:false});

      const actions=h('div',{style:{display:'flex',justifyContent:'flex-end',gap:'8px',marginTop:'14px'}},[]);
      const vazgec=h('button',{type:'button',class:'btn',style:{padding:'9px 16px',background:'rgba(255,255,255,.06)',color:'#d8c8ef',border:'1px solid #6b5b8a',borderRadius:'12px'},onclick:()=>{URL.revokeObjectURL(url);modal.remove();resolve(null);}},'İptal');
      const kullan=h('button',{type:'button',class:'pb btn',style:{padding:'10px 18px',background:'linear-gradient(135deg,#7c3aed,#a855f7)',color:'#fff',border:'1px solid #c084fc',boxShadow:'0 4px 14px rgba(168,85,247,.25)',borderRadius:'12px'},onclick:()=>{
        // Kullanıcının son gördüğü kırpma konumunu ve zoom seviyesini aynen kullan.
        // Kırp ve Kullan'a basınca resmi tekrar büyütme/kaydırma yapma.
        const m=metrics();
        const srcX=(m.fx-offsetX)/scale;
        const srcY=(m.fy-offsetY)/scale;
        const srcW=m.fw/scale;
        const srcH=m.fh/scale;
        const out=document.createElement('canvas');out.width=targetW;out.height=targetH;
        const octx=out.getContext('2d');
        octx.fillStyle='#0f0a1a';octx.fillRect(0,0,targetW,targetH);
        octx.drawImage(img,srcX,srcY,srcW,srcH,0,0,targetW,targetH);
        out.toBlob(blob=>{URL.revokeObjectURL(url);modal.remove();if(blob)resolve(new File([blob],(file.name||'kapak').replace(/\.[^.]+$/,'')+'_kapak.jpg',{type:'image/jpeg'}));else resolve(null);},'image/jpeg',.92);
      }},'✂️ Kırp ve Kullan');
      actions.appendChild(vazgec);actions.appendChild(kullan);
      panel.appendChild(title);panel.appendChild(info);panel.appendChild(stage);panel.appendChild(controls);panel.appendChild(actions);modal.appendChild(panel);document.body.appendChild(modal);
      requestAnimationFrame(draw);
      modal.onclick=e=>{if(e.target===modal)vazgec.click();};
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toastGoster('Kapak resmi açılamadı.');resolve(null);};
    img.src=url;
  });
}

// ── ADMİN: KULLANICI SİL ─────────────────────────────────────────────────────
// Kullanıcıyı ve ona ait her şeyi kalıcı olarak siler:
//  • kullanıcının kendi şiirleri (görsel/ses dosyalarıyla birlikte)
//  • başkalarının şiirlerine verdiği puanlar, tepkiler (👍👎❤️) ve yorumları
//  • gönderdiği/aldığı mesajlar ve bildirimler
//  • kullanıcı kaydı (users) ve yerel takip bağlantıları
// Firestore'daki TÜM şiirler sunucudan taranır (yerel liste eksik olabilir).
// ── BİLDİRİM TEMİZLİĞİ ───────────────────────────────────────────────────────
const BILDIRIM_OMUR_MS = 30*24*60*60*1000; // 1 ay

async function bildirimleriBatchSil(refler){
  for(let i=0;i<refler.length;i+=400){
    const batch=db.batch();
    refler.slice(i,i+400).forEach(r=>batch.delete(r));
    await batch.commit();
  }
}

// Her kullanıcı, KENDİ bildirimlerinden 1 aydan eskileri siler. Bildirimler zaten canlı
// dinleyiciyle bellekte olduğu için ek OKUMA maliyeti yoktur; yalnızca silme (yazma) yapılır.
let _eskiBildirimTemizlendi = false;
function eskiBildirimleriTemizle(){
  if(_eskiBildirimTemizlendi || !S.me || S.me.id==='admin_root') return;
  _eskiBildirimTemizlendi = true;
  const sinir = Date.now() - BILDIRIM_OMUR_MS;
  const eskiler = (S.notifs||[]).filter(n => { const t=kayitZamani(n); return t && t < sinir; });
  if(!eskiler.length) return;
  bildirimleriBatchSil(eskiler.map(n=>db.collection('notifs').doc(n.id))).then(()=>{
    const silinen=new Set(eskiler.map(n=>n.id));
    S.notifs=(S.notifs||[]).filter(n=>!silinen.has(n.id));
    lsSet('yo_notifs',S.notifs);
  }).catch(err=>{ _eskiBildirimTemizlendi=false; firestoreHataBildir(err); });
}

// Admin: herkesin 1 aydan eski bildirimlerini günde en fazla 1 kez temizler.
// Sorgu yalnızca silinecek kayıtları okur (okuma = silinen sayısı).
async function adminEskiBildirimTemizligi(){
  if(S.me?.username!==ADMIN_USERNAME) return;
  const son=Number(lsGet('yo_bildirimTemizlikTs',0))||0;
  if(Date.now()-son < 24*60*60*1000) return;
  try{
    const sinir=Date.now()-BILDIRIM_OMUR_MS;
    for(let tur=0; tur<5; tur++){
      const snap=await db.collection('notifs').where('ts','<',sinir).limit(400).get();
      if(!snap.docs.length) break;
      await bildirimleriBatchSil(snap.docs.map(d=>d.ref));
      if(snap.docs.length<400) break;
    }
    lsSet('yo_bildirimTemizlikTs',Date.now());
  }catch(err){ firestoreHataBildir(err); }
}

  if(S.me?.username!==ADMIN_USERNAME) return;

A.deleteUser = async function(userId){
  if(S.me?.username!==ADMIN_USERNAME) return;
  const hedef = S.users.find(u=>u.id===userId);
  if(!hedef || hedef.username===ADMIN_USERNAME || userId==='admin_root') return;
  if(!confirm(`@${hedef.username} kullanıcısı KALICI olarak silinecek.\n\nŞiirleri, verdiği puanlar, tepkiler, yorumlar ve mesajları da silinecek. Bu işlem geri alınamaz.\n\nEmin misiniz?`)) return;
  if(!confirm('Son onay: bu kullanıcıyı ve tüm verilerini silmek istiyor musunuz?')) return;

  try{
    const silinecekMedya=[];
    const yazimlar=[]; // {ref, tur:'sil'|'guncelle', veri}

    // Tüm şiirleri sunucudan çek
    const tumPostSnap = await db.collection('posts').get();
    tumPostSnap.docs.forEach(doc=>{
      const p = doc.data();
      if(p.authorId===userId){
        yazimlar.push({ref:doc.ref, tur:'sil'});
        silinecekMedya.push(p.image, p.audioUrl);
        return;
      }
      const guncelle={};
      // Puan
      if(p.userRatings && Object.prototype.hasOwnProperty.call(p.userRatings,userId)){
        const yeni={...p.userRatings}; delete yeni[userId];
        guncelle.userRatings=yeni;
      }
      // Tepkiler
      if(p.reactions){
        const yeniR={...p.reactions}; let degisti=false;
        ['like','dislike','heart'].forEach(t=>{
          if((yeniR[t]||[]).includes(userId)){ yeniR[t]=yeniR[t].filter(x=>x!==userId); degisti=true; }
        });
        if(degisti) guncelle.reactions=yeniR;
      }
      // Yorumlar (kullanıcının yorumları + onlara verilen yanıtlar)
      if(Array.isArray(p.comments) && p.comments.length){
        const silinenIds=new Set(p.comments.filter(c=>c.authorId===userId).map(c=>c.id));
        if(silinenIds.size){
          let degisti=true;
          while(degisti){
            degisti=false;
            p.comments.forEach(c=>{ if(c.parentId && silinenIds.has(c.parentId) && !silinenIds.has(c.id)){ silinenIds.add(c.id); degisti=true; } });
          }
          guncelle.comments=p.comments.filter(c=>!silinenIds.has(c.id));
        }
      }
      if(Object.keys(guncelle).length) yazimlar.push({ref:doc.ref, tur:'guncelle', veri:guncelle});
    });

    // Mesajlar ve bildirimler
    const [m1,m2,n1,n2] = await Promise.all([
      db.collection('msgs').where('fromId','==',userId).get(),
      db.collection('msgs').where('toId','==',userId).get(),
      db.collection('notifs').where('toId','==',userId).get(),
      db.collection('notifs').where('fromId','==',userId).get()
    ]);
    [m1,m2,n1,n2].forEach(snap=>snap.docs.forEach(d=>yazimlar.push({ref:d.ref, tur:'sil'})));

    // Kullanıcı kaydı
    yazimlar.push({ref:db.collection('users').doc(userId), tur:'sil'});
    silinecekMedya.push(hedef.avatarUrl, hedef.coverUrl);

    // Firestore batch (en fazla 500 işlem/batch)
    for(let i=0;i<yazimlar.length;i+=400){
      const batch=db.batch();
      yazimlar.slice(i,i+400).forEach(y=>{
        if(y.tur==='sil') batch.delete(y.ref); else batch.update(y.ref,y.veri);
      });
      await batch.commit();
    }

    // Yerel durumu güncelle
    S.posts = S.posts.filter(p=>p.authorId!==userId).map(p=>{
      const q={...p};
      if(q.userRatings && userId in q.userRatings){ q.userRatings={...q.userRatings}; delete q.userRatings[userId]; }
      if(q.reactions){ q.reactions={...q.reactions}; ['like','dislike','heart'].forEach(t=>{ q.reactions[t]=(q.reactions[t]||[]).filter(x=>x!==userId); }); }
      if(Array.isArray(q.comments)){
        const sil=new Set(q.comments.filter(c=>c.authorId===userId).map(c=>c.id));
        let d=true; while(d){ d=false; q.comments.forEach(c=>{ if(c.parentId&&sil.has(c.parentId)&&!sil.has(c.id)){sil.add(c.id);d=true;} }); }
        if(sil.size) q.comments=q.comments.filter(c=>!sil.has(c.id));
      }
      return q;
    });
    S.users = S.users.filter(u=>u.id!==userId);
    S.msgs  = S.msgs.filter(m=>m.fromId!==userId && m.toId!==userId);
    S.notifs= (S.notifs||[]).filter(n=>n.fromId!==userId && n.toId!==userId);
    const yeniFollows={};
    Object.entries(S.follows||{}).forEach(([k,l])=>{ if(k!==userId) yeniFollows[k]=(l||[]).filter(x=>x!==userId); });
    S.follows=yeniFollows;
    lsSet('yo_users',S.users); lsSet('yo_msgs',S.msgs); lsSet('yo_notifs',S.notifs);
    save();

    eskiMedyaTemizle(silinecekMedya);
    alert(`@${hedef.username} ve tüm verileri silindi.`);
    go('feed');
  }catch(err){
    console.error('Kullanıcı silme hatası:',err);
    alert('Kullanıcı silinirken bir hata oluştu: '+(err?.message||err)+'\nBazı veriler silinmemiş olabilir; işlemi tekrar deneyebilirsiniz.');
  }
};

function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  if(tag==='img'){
    // Telefonda ekran dışındaki görseller geç yüklensin, çözme işlemi ana iş parçacığını
    // kilitlemesin; yüklenemezse bir kez önbellek kırarak yeniden denensin.
    if(!e.hasAttribute('loading')) e.setAttribute('loading','lazy');
    e.setAttribute('decoding','async');
    if(!props['data-noretry']){
      e.addEventListener('error',()=>{
        if(e.dataset.retry) return;
        e.dataset.retry='1';
        const u=e.getAttribute('src');
        if(!u||u.startsWith('data:')||u.startsWith('blob:')) return;
        setTimeout(()=>{ e.src=u+(u.includes('?')?'&':'?')+'r='+Date.now(); },1200);
      });
    }
  }
  return e;
}

function av(user,size=40,onClick){
  if(!user) return h('div',{class:'av',style:{width:size+'px',height:size+'px',background:'#3d1f6e',color:'#fff'}},['?']);
  const isAdm = user.username === ADMIN_USERNAME;
  const d=h('div',{class:'av',style:{width:size+'px',height:size+'px',fontSize:(size*.36)+'px',background:isAdm?'linear-gradient(135deg,#f59e0b,#d97706)':`linear-gradient(135deg,${user.color||'#7c3aed'},#a855f7)`,color:'#fff',cursor:onClick?'pointer':'default',overflow:'hidden',position:'relative'}});
  if(isAdm){
    d.textContent='👑';
  }else if(user.avatarUrl){
    const bas=user.avatar||user.name?.slice(0,2).toUpperCase()||'?';
    const px=Math.min(400,Math.ceil(size*2));
    // 1200px'lik profil resmini 28px'lik yorum avatarında indirmek telefonu kasıyordu:
    // Cloudinary'den yalnızca gereken boyutta, sıkıştırılmış kopya istiyoruz.
    const kucuk=String(user.avatarUrl).replace(/(res\.cloudinary\.com\/[^/]+\/image\/upload\/)(v\d+\/)/,`$1c_fill,g_auto,w_${px},h_${px},f_auto,q_auto/$2`);
    const img=h('img',{src:kucuk,alt:'',loading:'lazy','data-noretry':'1',style:{width:'100%',height:'100%',objectFit:'cover',display:'block'}});
    let deneme=0;
    img.addEventListener('error',()=>{
      deneme++;
      if(deneme===1){
        setTimeout(()=>{ img.src=String(user.avatarUrl)+(String(user.avatarUrl).includes('?')?'&':'?')+'r='+Date.now(); },1000);
      } else {
        img.remove(); d.textContent=bas;
      }
    });
    d.appendChild(img);
  }else{
    d.textContent=user.avatar||user.name?.slice(0,2).toUpperCase()||'?';
  }
  if(onClick)d.onclick=onClick;
  return d;
}

// ── AI görsel sağlayıcıları (Cloudflare FLUX → Hugging Face) ──────────────
// Pollinations ve Google Gemini (Nano Banana) çalışmadığı için zincirden
// tamamen çıkarıldı (bkz. kullanıcı talebi). İkisi de aynı sözleşmeyi
// izler: (title, text, signal) alır, başarılıysa {blob, provider, model}
// döner, başarısızsa Error fırlatır. Bu sayede adminYapayZekaGorseliYenile
// hepsini TEK bir döngüyle deneyebilir. flux-image.js ve huggingface-image.js
// ham görsel binary'si (image/*) döner.
// NOT: flux-image.js ve huggingface-image.js artık ham görsel binary'si
// DEĞİL, görseli sunucu tarafında Vercel Blob'a yükleyip küçük bir
// {imageUrl} JSON'u döndürüyor. Böylece Firestore'a hiçbir zaman büyük
// base64 veri yazılmıyor (bkz. adminYapayZekaGorseliYenile).
async function fluxGorselDene(title, text, signal){
  const r=await fetch('/api/flux-image',{
    method:'POST', headers:{'Content-Type':'application/json'}, signal,
    body:JSON.stringify({title,text})
  });
  let data=null;
  try{ data=await r.json(); }catch(_){ data=null; }
  if(!r.ok){
    const hata=data?.error||data?.detail||data?.message||'';
    throw new Error(`Cloudflare FLUX HTTP ${r.status}${hata?` — ${hata}`:''}`);
  }
  if(!data?.imageUrl) throw new Error('Cloudflare FLUX görsel linki dönmedi.');
  // TEŞHİS: B2 başarısız olup GitHub yedeğine düşüldüyse gerçek B2 hatasını
  // (r2Error) burada konsola yazdırıyoruz, aksi halde bu sessizce kayboluyordu.
  if(data.storage && data.storage!=='r2'){
    console.warn(`⚠️ Görsel R2'ye değil "${data.storage}" yedeğine yüklendi. R2 hatası: ${data.r2Error||'(bilinmiyor)'}`);
  }
  return { imageUrl:data.imageUrl, provider:data.provider||'cloudflare', model:data.model||'@cf/black-forest-labs/flux-1-schnell' };
}
async function huggingfaceGorselDene(title, text, signal){
  const r=await fetch('/api/huggingface-image',{
    method:'POST', headers:{'Content-Type':'application/json'}, signal,
    body:JSON.stringify({title,text})
  });
  let data=null;
  try{ data=await r.json(); }catch(_){ data=null; }
  if(!r.ok){
    const hata=data?.error||'';
    throw new Error(`Hugging Face HTTP ${r.status}${hata?` — ${hata}`:''}`);
  }
  if(!data?.imageUrl) throw new Error('Hugging Face görsel linki dönmedi.');

    console.warn(`⚠️ Görsel R2'ye değil "${data.storage}" yedeğine yüklendi. R2 hatası: ${data.r2Error||'(bilinmiyor)'}`);
  }

}
// DÜZELTME (Firestore günlük kota sorunu): flux-image.js ve

// Tüm AI sağlayıcıları (Gemini, Groq: gpt-oss-120b, qwen, gpt-oss-20b) başarısız olursa
// şiirdeki anahtar kelimelerden basit bir enstrümantal müzik promptu üretir.
function yerelMuzikPromptu(post){
  const t=((post?.title||'')+' '+(post?.text||'')).toLowerCase();
  const var_=(...k)=>k.some(x=>t.includes(x));
  let tarz='calm ambient, soft piano and warm strings, reflective and gentle';
  if(var_('hüzün','keder','gözyaşı','ağla','ayrılık','yalnız','hasret','özlem','gurbet','yas')) tarz='melancholic solo piano with sad violin, slow tempo, tender and sorrowful';
  else if(var_('aşk','sevda','sevgi','yürek','kalp','canan')) tarz='romantic acoustic guitar and soft strings, warm and tender, slow tempo';
  else if(var_('isyan','öfke','savaş','kavga','zindan','kan')) tarz='dark cinematic orchestral, dramatic cellos and deep drums, intense';
  else if(var_('umut','güneş','sabah','bahar','sevinç','özgür')) tarz='hopeful acoustic guitar and light piano, uplifting, gentle tempo';
  else if(var_('deniz','dağ','orman','nehir','rüzgar','yağmur','doğa')) tarz='peaceful nature ambient, soft flute and pads, serene';
  return tarz+', no vocals, no singing, no lyrics';
}

async function adminMuzikYenile(post){
  if(!S.me || S.me.username!==ADMIN_USERNAME){
    throw new Error('Bu işlem yalnızca admin içindir.');
  }
  const prompt=await aiMuzikPromptuGroqlaOlustur(post);
  const res=await fetch('/api/musicGenerate', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ title: post.title||'', postId: post.id, musicPrompt: prompt })
  });
  let data=null;
  try{ data=await res.json(); }catch(_){}
  if(!res.ok){
    throw new Error(data?.error || `Müzik oluşturulamadı (HTTP ${res.status}).`);
  }
  if(!data?.musicUrl) throw new Error('Müzik linki dönmedi.');
  const idx=S.posts.findIndex(p=>p.id===post.id);
  if(idx>=0){
    S.posts[idx].musicUrl=data.musicUrl;
    save();
  }
  await db.collection('posts').doc(post.id).update({ musicUrl: data.musicUrl });
  return data;
}

async function adminYapayZekaGorseliYenile(post){
  if(!S.me || S.me.username!==ADMIN_USERNAME){
    throw new Error('Bu işlem yalnızca admin içindir.');
  }
  const eskiGorsel = post.image;

  // DÜZELTME (görselde istenmeyen yazı/harf çıkması sorunu):
  // Önceden burada Groq'un ürettiği İngilizce sahne tarifine EK OLARAK
  // şiirin HAM METNİ de (post.text) prompta ekleniyordu. FLUX.1-schnell gibi
  // "guidance-distilled" modeller "no text" gibi OLUMSUZ talimatları güvenilir
  // şekilde uygulayamaz (CFG/negative-prompt desteklemezler) — ayrıca
  // prompt'un içine gerçek bir şiir metni (cümleler, dizeler) gömülünce model
  // bunu genellikle "görsele yazı olarak eklenecek bir metin" gibi algılayıp
  // harf/kelime benzeri şekiller üretiyordu. Artık Groq başarılı olduğunda
  // SADECE onun ürettiği kısa İngilizce sahne tarifi kullanılıyor — şiirin
  // orijinal metni prompta hiç girmiyor. Groq başarısız olursa (nadir durum)
  // yine de bir görsel üretilebilsin diye ham şiir metnine geri dönülüyor.
  const groqGorselPromptu=await aiGorselPromptuGroqlaOlustur(post);
  const gorselIcinMetin=groqGorselPromptu
    ? groqGorselPromptu
    : (post.text||'');

  // Sırasıyla denenecek AI sağlayıcıları: Hugging Face → Cloudflare FLUX.
  // Pollinations ve Gemini (Nano Banana) çalışmadığı için zincirden çıkarıldı.
  // Hugging Face kota/hata verirse otomatik olarak Cloudflare FLUX denenir.
  // İkisi de başarısız olursa en son GIPHY yedeği devreye girer (aşağıda).
  const saglayicilar=[
    { ad:'Hugging Face',    fn:huggingfaceGorselDene, sure:60000, mesaj:'🧠 Hugging Face ile görsel oluşturuluyor...' },
    { ad:'Cloudflare FLUX', fn:fluxGorselDene, sure:90000, mesaj:'🧠 Hugging Face kullanılamadı, Cloudflare FLUX deneniyor...' }
  ];

  const hatalar=[];
  for(const s of saglayicilar){
    const status=document.querySelector('[data-flux-status]');
    if(status) status.textContent=s.mesaj;
    const controller=new AbortController();
    const zamanlayici=setTimeout(()=>controller.abort(), s.sure);
    let imageUrl, provider, model;
    try{
      ({imageUrl, provider, model}=await s.fn(post.title||'', gorselIcinMetin, controller.signal));
      clearTimeout(zamanlayici);
    }catch(err){
      clearTimeout(zamanlayici);
      const mesaj = err?.name==='AbortError'
        ? `${s.ad} isteği ${Math.round(s.sure/1000)} saniyede tamamlanmadı.`
        : (err?.message || `${s.ad} başarısız oldu.`);
      console.warn(`${s.ad} başarısız:`, mesaj);
      hatalar.push(`${s.ad}: ${mesaj}`);
      continue; // sıradaki sağlayıcıyı dene
    }

    // Görsel zaten sunucu tarafında (flux-image.js / huggingface-image.js)
    // Vercel Blob'a yüklendi ve bize hazır bir URL döndü — burada artık
    // sıkıştırma/base64 dönüşümüne gerek yok, Firestore'a doğrudan bu
    // küçük URL yazılıyor.
    try{
      if(status) status.textContent='💾 AI görseli kaydediliyor...';

      const idx=S.posts.findIndex(p=>p.id===post.id);
      if(idx<0) throw new Error('Paylaşım bulunamadı.');

      const now=Date.now();
      const updates={
        image:imageUrl, autoGif:false, gifCaption:null,
        aiImage:true, aiImageUpdatedAt:now,
        aiImageProvider:provider, aiImageModel:model
      };
      S.posts[idx]={...S.posts[idx],...updates};
      save();
      await db.collection('posts').doc(post.id).update(updates);
      refreshCard(post.id);
      if(eskiGorsel && eskiGorsel!==imageUrl) eskiMedyaTemizle([eskiGorsel]);

      return { type:'ai', provider, model };
    }catch(kaydetmeErr){
      throw new Error(`${s.ad} ile görsel BAŞARIYLA üretildi ama kaydedilemedi: ${kaydetmeErr?.message||kaydetmeErr}`);
    }
  }

  // İki AI sağlayıcısı da başarısız oldu (kota/hata) → son çare GIPHY.
  try{
    const data=await adminGiphyFallbackUygula(post);
    return { type:'giphy', provider:'giphy', gifUrl:data?.gifUrl||null, fallbackReason:hatalar.join(' | ') };
  }catch(giphyErr){
    throw new Error(`Tüm AI sağlayıcıları başarısız oldu (${hatalar.join(' | ')}). GIPHY yedeği de başarısız: ${giphyErr?.message||giphyErr}`);
  }
}

// Yüklenen resmi, gerçekten çok büyükse (uzun kenarı 1920px'i aşıyorsa) makul bir
// boyuta indirir. Böylece hem paylaşım anında yükleme hızlanır hem de bu resmi içeren
// paylaşım her açıldığında/uygulama her başladığında indirilecek veri küçülür.
// Zaten küçük olan resimlere dokunulmaz; kalite kaybı gözle fark edilmeyecek düzeydedir.
function resimSikistir(file, maksKenar=1920, kalite=0.85){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maksKenar||height>maksKenar){
          if(width>=height){height=Math.round(height*maksKenar/width);width=maksKenar;}
          else{width=Math.round(width*maksKenar/height);height=maksKenar;}
          const canvas=document.createElement('canvas');
          canvas.width=width;canvas.height=height;
          canvas.getContext('2d').drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg',kalite));
        } else {
          resolve(ev.target.result); // zaten küçük, orijinaliyle bırak
        }
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    r.onerror=()=>resolve(null);
    r.readAsDataURL(file);
  });
}

  const addBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'20px',background:'linear-gradient(135deg,#1e0a3e,#2d1060)',border:'2px dashed #7c3aed',borderRadius:'14px',padding:'18px',color:'#c084fc',fontFamily:"'Playfair Display',serif",fontSize:'1.05rem',display:'flex',alignItems:'center',justifyContent:'center',gap:'10px'},onclick:()=>{
    if(girisGerekli())return;
    if(modal)return;modal=composeModal(()=>{modal&&modal.remove();modal=null;});document.body.appendChild(modal);
  }},[h('span',{style:{fontSize:'1.5rem'}},'🪶'),' + Şiir Ekle']);
  page.appendChild(addBtn);

  const swipeEntryBtn=h('button',{class:'btn swipe-entry-btn',onclick:()=>go('swipe')},[h('span',{style:{fontSize:'1.3rem'}},'📱'),' Kaydırma Modunda Oku']);
  page.appendChild(swipeEntryBtn);

  const feedPosts = gorunurPaylasimlar(S.posts);
  if (feedPosts.length === 0) {
    page.appendChild(h('p', {style:{textAlign:'center', color:'#6b5b8a', fontStyle:'italic', marginTop:'40px'}}, 'Henüz hiç şiir eklenmemiş. İlk şiiri siz paylaşın! ✨'));
  } else {
    // Tüm kartları tek seferde çizmek telefonu kasıyor, görsel/sesleri yarım bırakıyordu.
    // 8'er kart çizilir; aşağı inildikçe canlı S.posts listesinden devamı eklenir.
    const PARCA=8; let gosterilen=0;
    const sentinel=h('div',{style:{height:'40px'}});
    page.appendChild(sentinel);
    let io=null;
    const dahaFazla=()=>{
      const hepsi=gorunurPaylasimlar(S.posts);
      const son=Math.min(gosterilen+PARCA,hepsi.length);
      for(let i=gosterilen;i<son;i++) page.insertBefore(postCard(hepsi[i]),sentinel);
      gosterilen=son;
      if(gosterilen>=hepsi.length){ sentinel.style.display='none'; }
    };
    dahaFazla();
    if('IntersectionObserver' in window){
      io=new IntersectionObserver(es=>{
        if(!sentinel.isConnected){ io.disconnect(); return; }
        if(es.some(x=>x.isIntersecting)){
          dahaFazla();
          io.unobserve(sentinel); io.observe(sentinel); // hâlâ görünürse tekrar tetikle
        }
      },{rootMargin:'700px'});
      io.observe(sentinel);
    } else {
      while(gosterilen<gorunurPaylasimlar(S.posts).length) dahaFazla();
    }
  }
  
  wrap.appendChild(page);return wrap;
}

function Leaderboard(){
  const gorunenPaylasimlar=gorunurPaylasimlar(S.posts);
  const puanli=gorunenPaylasimlar.map(p=>({...p,avg:calcAvg(p.userRatings,p.aiScore)})).filter(p=>p.avg!==null).sort((a,b)=>b.avg-a.avg);
  const ranked=S.users.map(u=>{
    const up=gorunenPaylasimlar.filter(p=>p.authorId===u.id&&calcAvg(p.userRatings,p.aiScore)!==null);
    if(!up.length)return null;
    const avg=up.reduce((sum,p)=>sum+calcAvg(p.userRatings,p.aiScore),0)/up.length;
    return{...u,avg:+avg.toFixed(2),cnt:up.length};
  }).filter(Boolean).sort((a,b)=>b.avg-a.avg);

  // Türkiye saatine göre içinde bulunduğumuz ayı belirler.
  // ts varsa onu kullanır; eski kayıtlarda ts yoksa date alanına düşer.
  const TURKEY_TZ='Europe/Istanbul';
  function postZamani(p){
    const raw = p?.ts;
    if(raw && typeof raw.toMillis === 'function') {
      const ms = raw.toMillis();
      if(Number.isFinite(ms) && ms > 0) return ms;
    }
    if(raw && typeof raw === 'object' && typeof raw.seconds === 'number') {
      const ms = raw.seconds * 1000 + Math.floor((raw.nanoseconds || 0) / 1000000);
      if(Number.isFinite(ms) && ms > 0) return ms;
    }
    const ts = Number(raw || 0);
    if(Number.isFinite(ts) && ts > 0) return ts;
    return parseDate(p?.date);
  }
  function turkiyeYilAyFromPost(p){
    const ms = postZamani(p);
    if(!ms) return null;
    try{
      const parts = new Intl.DateTimeFormat('en-US',{
        timeZone:TURKEY_TZ,
        year:'numeric',
        month:'2-digit'
      }).formatToParts(new Date(ms));
      const y = parts.find(x=>x.type==='year')?.value;
      const m = parts.find(x=>x.type==='month')?.value;
      return y && m ? `${y}-${m}` : null;
    }catch{return null;}
  }
  const nowTurkey = new Date();
  const turkeyNowParts = new Intl.DateTimeFormat('en-US',{
    timeZone:TURKEY_TZ,
    year:'numeric',
    month:'2-digit'
  }).formatToParts(nowTurkey);
  const simdiYilAy = `${turkeyNowParts.find(x=>x.type==='year')?.value}-${turkeyNowParts.find(x=>x.type==='month')?.value}`;
  const ayAdi=new Intl.DateTimeFormat('tr-TR',{timeZone:TURKEY_TZ,month:'long',year:'numeric'}).format(nowTurkey);
  const aylik=gorunenPaylasimlar
    .filter(p=>turkiyeYilAyFromPost(p)===simdiYilAy)
    .map(p=>({...p,avg:calcAvg(p.userRatings,p.aiScore)}))
    .filter(p=>p.avg!==null)
    .sort((a,b)=>{
      if(b.avg!==a.avg)return b.avg-a.avg;
      return postZamani(b)-postZamani(a);
    });

  const medals=['🥇','🥈','🥉'];
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',marginBottom:'4px',fontSize:'1.4rem'}},'🏆 Sıralama'));
  page.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.85rem',marginBottom:'16px',fontStyle:'italic'}},'Puan ver, yorum yaz!'));
  if(!S.tumPostlarHazir){
    page.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.8rem',marginBottom:'12px'}},'⏳ Tüm şiirler yükleniyor, liste birazdan tamamlanacak…'));
  }

  const pb=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'linear-gradient(135deg,#7c3aed,#a855f7)',color:'#fff',border:'none'}},'🪶 En İyi Şiirler');
  const ub=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'#1a0f2e',color:'#a78bfa',border:'1px solid #2d1b52'}},'👑 En İyi Ozanlar');
  const mb=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'#1a0f2e',color:'#a78bfa',border:'1px solid #2d1b52'}},'📅 Ayın Şiirleri');
  page.appendChild(h('div',{style:{display:'flex',gap:'8px',marginBottom:'20px',flexWrap:'wrap'}},[pb,ub,mb]));

  const ct=h('div');

  function kartOlustur(p,i){
    const author=byId(p.authorId);
    const dt=p.title||(p.text?.slice(0,28)+(p.text?.length>28?'…':''))||'İsimsiz';
    const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'center',borderLeft:`3px solid ${i<3?['#fbbf24','#9ca3af','#cd7c2e'][i]:scoreColor(p.avg)}`} });
    card.appendChild(h('div',{style:{textAlign:'center',minWidth:'42px'}},[
      h('p',{style:{fontSize:'1.35rem'}},medals[i]||`#${i+1}`),
      h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.1rem',fontWeight:'700',color:scoreColor(p.avg)}},p.avg.toFixed(1)),
      h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')
    ]));
    const info=h('div',{style:{flex:'1',minWidth:'0'}});
    const tl=h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:'#e9d5ff',fontStyle:'italic',cursor:'pointer',marginBottom:'5px',textDecoration:'underline',textDecorationColor:'#7c3aed'}},`"${dt}"`);
    tl.onclick=()=>go('postdetail',{postId:p.id});
    info.appendChild(tl);
    info.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'4px'}},[
      av(author,20,()=>go('profile',{profileId:author?.id})),
      h('span',{style:{fontSize:'.8rem',color:'#a78bfa',cursor:'pointer'},onclick:()=>go('profile',{profileId:author?.id})},author?.name||'')
    ]));
    const pR=p.reactions||{like:[],dislike:[],heart:[]};
    const tepkiMetin=[(pR.like||[]).length?`👍${pR.like.length}`:'',(pR.dislike||[]).length?`👎${pR.dislike.length}`:'',(pR.heart||[]).length?`❤️${pR.heart.length}`:''].filter(Boolean).join(' ');
    info.appendChild(h('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap',alignItems:'center'}},[
      h('span',{style:{fontSize:'.72rem',color:'#6b5b8a'}},`${Object.keys(p.userRatings||{}).length} oy · ${(p.comments||[]).length} yorum`),
      tepkiMetin?h('span',{style:{fontSize:'.72rem',color:'#6b5b8a'}},tepkiMetin):null,
      h('span',{style:{fontSize:'.72rem',color:scoreColor(p.avg)}},scoreBadge(p.avg))
    ]));
    card.appendChild(info);
    return card;
  }

  function showP(){
    ct.innerHTML='';
    if(!puanli.length){ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz puanlanmış şiir yok!'));return;}
    puanli.forEach((p,i)=>ct.appendChild(kartOlustur(p,i)));
  }

  function showU(){
    ct.innerHTML='';
    if(!ranked.length){ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz sıralama oluşmadı!'));return;}
    ranked.forEach((u,i)=>{
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'14px',borderLeft:`3px solid ${i<3?['#fbbf24','#9ca3af','#cd7c2e'][i]:scoreColor(u.avg)}`}});
      card.appendChild(h('p',{style:{fontSize:'1.35rem',minWidth:'32px'}},medals[i]||`#${i+1}`));
      card.appendChild(av(u,48,()=>go('profile',{profileId:u.id})));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontWeight:'700',color:'#e9d5ff',cursor:'pointer'},onclick:()=>go('profile',{profileId:u.id})},u.name));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},`@${u.username} · ${u.cnt} şiir`));
      card.appendChild(info);
      card.appendChild(h('div',{style:{textAlign:'center'}},[
        h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.4rem',fontWeight:'700',color:scoreColor(u.avg)}},u.avg.toFixed(1)),
        h('p',{style:{fontSize:'.63rem',color:'#6b5b8a'}},'ort. puan')
      ]));
      ct.appendChild(card);
    });
  }

  function showM(){
    ct.innerHTML='';
    if(!aylik.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},`${ayAdi} içinde henüz puanlanmış şiir yok.`));
      return;
    }
    ct.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.85rem',textAlign:'center',fontStyle:'italic',marginBottom:'12px'}},`📅 ${ayAdi} — Türkiye saati`));
    aylik.forEach((p,i)=>ct.appendChild(kartOlustur(p,i)));
  }

  function aktifButon(aktif){
    [pb,ub,mb].forEach(b=>{
      const on=b===aktif;
      b.style.background=on?'linear-gradient(135deg,#7c3aed,#a855f7)':'#1a0f2e';

    });
  }
  pb.onclick=()=>{aktifButon(pb);showP();};
  ub.onclick=()=>{aktifButon(ub);showU();};
  mb.onclick=()=>{aktifButon(mb);showM();};

  aktifButon(pb);

  page.appendChild(ct);
  wrap.appendChild(page);
  return wrap;

// ═══════════════════════════════════════════════════════════════════════════
// KAYDIRMA MODU (mobil "reels" tarzı tam ekran şiir okuma arayüzü)
// 3 mod: en yeni→eskiye (latest), rastgele (random), sıralama sayfasındaki
// puana göre (top). Metin şiirlerde aşağı kaydırma şiirin devamını okutur,
// sola kaydırma bir sonraki şiire geçer. Görsel/videolu paylaşımlarda görsel
// üstte sabit görünür, aşağı kaydırınca altından şiir metni okunur. YouTube
// videolar otomatik oynatılır (tarayıcı politikası gereği sessiz/muted başlar).
// ═══════════════════════════════════════════════════════════════════════════
function SwipeMode(){
  const havuz = gorunurPaylasimlar(S.posts);

  let mode = 'latest'; // 'latest' | 'random' | 'top'
  let list = [];
  let idx = 0;

  function siraliPuanaGore(a,b){
    const av=calcAvg(a.userRatings,a.aiScore), bv=calcAvg(b.userRatings,b.aiScore);
    if(av===null && bv===null) return 0;
    if(av===null) return 1;
    if(bv===null) return -1;
    return bv-av;
  }
  function listeyiOlustur(){
    if(mode==='latest') list=havuz.slice(); // S.posts zaten en yeni en başta (unshift)
    else if(mode==='random') list=havuz.slice().sort(()=>Math.random()-0.5);
    else if(mode==='top') list=havuz.slice().sort(siraliPuanaGore);
    if(idx>=list.length) idx=Math.max(0,list.length-1);
  }
  listeyiOlustur();

  const wrap=h('div',{class:'swipe-wrap'});

  // Kaydırma modunda aktif olan ses referansları (seslendirme + müzik aynı anda
  // çalabilir) — yeni şiire geçerken veya sekme kapanırken hepsini durdurmak
  // için kullanılır.
  let aktifSesler=[];
  function aktifSesiDurdur(){
    aktifSesler.forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(_){} });
    aktifSesler=[];
    // Bekleyen (henüz iframe'i oluşturmamış) video zamanlayıcısı varsa iptal
    // et — kart zaten değişiyor/kapanıyor, gecikmeli iframe artık gereksiz.
    const eskiKart=stage.firstElementChild;
    if(eskiKart && eskiKart._videoTimer) clearTimeout(eskiKart._videoTimer);
  }

  const topbar=h('div',{class:'swipe-topbar'});
  const closeBtn=h('button',{class:'btn swipe-close',onclick:()=>{aktifSesiDurdur();go('feed');}},'✕');
  topbar.appendChild(closeBtn);
  const tabsWrap=h('div',{class:'swipe-tabs'});
  const tabsDef=[{k:'latest',lb:'🕐 Yeni'},{k:'random',lb:'🎲 Rastgele'},{k:'top',lb:'🏆 En İyi'}];
  const tabBtns={};
  tabsDef.forEach(t=>{
    const b=h('button',{class:'btn swipe-tab'+(mode===t.k?' active':''),onclick:()=>{
      if(mode===t.k)return;
      mode=t.k;idx=0;listeyiOlustur();
      Object.entries(tabBtns).forEach(([k,bt])=>bt.classList.toggle('active',k===mode));
      renderCard();
    }},t.lb);
    tabBtns[t.k]=b;
    tabsWrap.appendChild(b);
  });
  topbar.appendChild(tabsWrap);
  wrap.appendChild(topbar);

  const counter=h('div',{class:'swipe-counter'});
  wrap.appendChild(counter);

  const stage=h('div',{class:'swipe-stage'});
  wrap.appendChild(stage);

  function renderCard(){
    aktifSesiDurdur();
    iframeleriBosalt(stage);
    stage.innerHTML='';
    if(!list.length){
      stage.appendChild(h('div',{class:'swipe-empty'},'Bu modda henüz gösterilecek şiir yok. 🌙'));
      counter.textContent='';
      return;
    }
    if(idx<0)idx=list.length-1;
    if(idx>=list.length)idx=0;
    const post=list[idx];
    const kart=swipeCard(post,()=>{idx++;renderCard();});
    stage.appendChild(kart);
    // YouTube videolu paylaşımlarda kendi sesi çalar; seslendirme/müzik yoktur.
    // Diğerlerinde seslendirme VE müzik otomatik ve birlikte başlar.
    if(kart._sesAudio){ aktifSesler.push(kart._sesAudio); kart._sesAudio.play().catch(()=>{}); }
    if(kart._muzikAudio){ aktifSesler.push(kart._muzikAudio); kart._muzikAudio.play().catch(()=>{}); }
    counter.textContent=`${idx+1} / ${list.length} · sola kaydır = sonraki`;
  }

  // Dokunma jestleri: dikey kaydırma normal scroll olarak bırakılır (içeriği okumak için),
  // yatay kaydırma algılanınca sola kaydırmada sıradaki şiire geçilir.
  let startX=0,startY=0,tracking=false,horizontal=false;
  stage.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    startX=t.clientX;startY=t.clientY;tracking=true;horizontal=false;
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(!tracking)return;
    const t=e.touches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(!horizontal && Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.3) horizontal=true;
  },{passive:true});
  stage.addEventListener('touchend',e=>{
    if(!tracking)return;tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(horizontal && Math.abs(dx)>55){
      if(dx<0){ idx++; renderCard(); } // sola kaydır → sonraki şiir
      else { idx--; renderCard(); } // sağa kaydır → önceki şiir (kolaylık)
    }
  });
  // Masaüstünde de kullanılabilsin diye ok tuşları ve fare tekerleği (yatay) desteği
  wrap.tabIndex=0;
  wrap.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){idx++;renderCard();}
    else if(e.key==='ArrowRight'){idx--;renderCard();}
  });

  renderCard();
  setTimeout(()=>wrap.focus(),0);
  return wrap;
}

function swipeCard(post,sonrakineGec){
  const author=byId(post.authorId);
  const vid=ytId(post.youtube);
  const avg=calcAvg(post.userRatings,post.aiScore);
  const isOwn=post.authorId===S.me?.id;
  const isAdmin=S.me?.username===ADMIN_USERNAME;
  const myR=post.userRatings?.[S.me?.id]??null;

  const card=h('div',{class:'swipe-card fade'});
  const scroller=h('div',{class:'swipe-scroll'});

  const header=h('div',{class:'swipe-header'});
  header.appendChild(av(author,36,()=>go('profile',{profileId:author?.id})));
  const hinfo=h('div',{style:{flex:'1',minWidth:'0'}});
  hinfo.appendChild(h('p',{class:'swipe-author-name',style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},author?.name||''));
  hinfo.appendChild(h('p',{class:'swipe-author-meta'},`@${author?.username||''} · ${post.date}`));
  header.appendChild(hinfo);
  if(post.hidden) header.appendChild(h('span',{class:'hidden-badge'},'🙈 Gizli'));
  if(avg!==null) header.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(avg)}44`,minWidth:'40px',padding:'4px 6px'}},[h('p',{style:{fontSize:'1rem',fontWeight:'700',color:scoreColor(avg),lineHeight:'1'}},avg.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
  scroller.appendChild(header);

  // Görsel/video varsa üstte; aşağı kaydırınca altındaki şiir metni okunur.
  if(post.image){
    const swipeImg=h('img',{src:post.image,class:'swipe-media-img'});
    scroller.appendChild(gifUzeriAforizmaBindir(swipeImg, post, {marginBottom:'16px', borderRadius:'14px'}));
  } else if(vid){
    const w=h('div',{class:'swipe-media-video'});
    // Ses AÇIK otomatik oynatma: tarayıcı, kullanıcı bu sekmede zaten kaydırma
    // hareketiyle etkileşime girdiği için genelde bunu engellemez; yine de bazı
    // tarayıcılar sesli otomatik oynatmayı engelleyebilir (bu durumda video
    // duraklamış/tıklanmayı bekler halde gelir, kullanıcı oynat'a basar).
    // DÜZELTME: iframe'i HEMEN eklemek yerine kısa bir gecikmeyle ekliyoruz —
    // kullanıcı hızlı hızlı kaydırıp bu karttan hemen geçerse iframe/WebGL
    // bağlamı hiç oluşturulmaz. Hızlı art arda kaydırmalarda her karta bir
    // YouTube oynatıcısı (ve WebGL bağlamı) açılıp hemen yok edilmesi,
    // tarayıcının "Too many active WebGL contexts" uyarısı vermesine ve
    // donma hissine yol açıyordu.
    card._videoTimer = setTimeout(()=>{
      if(!card.isConnected) return;
      w.innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=0&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    }, 260);
    scroller.appendChild(w);
  }

  if(post.title) scroller.appendChild(h('h3',{class:'swipe-title'},`"${post.title}"`));
  if(post.text) scroller.appendChild(h('p',{class:'swipe-text'},post.text));

  // Sesli okuma + AI müzik — SADECE YouTube videosu YOKSA gösterilir/çalar
  // (video varsa kendi sesi zaten var, karışmasın diye ikisi de eklenmez).
  // SwipeMode bu şiir ekrana gelince card._sesAudio VE card._muzikAudio'yu
  // BİRLİKTE otomatik oynatır, sıradaki/önceki şiire geçilince ikisini de durdurur.
  if(!vid){
    const sesMuzikKaldirYetkisi = isOwn || isAdmin;
    if(post.audioUrl){
      const sesOynatici=sesOynaticiOlustur(post.audioUrl, sesMuzikKaldirYetkisi ? {
        onDelete: async()=>{ await postSesiKaldir(post); sesOynatici.el.remove(); card._sesAudio=null; }
      } : {});
      scroller.appendChild(sesOynatici.el);
      card._sesAudio=sesOynatici.audio;
    }
    if(post.musicUrl){
      const muzikOynatici=sesOynaticiOlustur(post.musicUrl, Object.assign(
        {label:'🎵 Müzik',gradient:'linear-gradient(135deg,#4d7c0f,#84cc16)'},
        sesMuzikKaldirYetkisi ? { onDelete: async()=>{ await postMuzigiKaldir(post); muzikOynatici.el.remove(); card._muzikAudio=null; } } : {}
      ));
      scroller.appendChild(muzikOynatici.el);
      card._muzikAudio=muzikOynatici.audio;
    }
  }

  const footer=h('div',{class:'swipe-footer'});
  footer.appendChild(h('button',{class:'btn swipe-footer-btn',onclick:()=>go('postdetail',{postId:post.id})},`💬 ${(post.comments||[]).length} yorum`));
  const rTeps=post.reactions||{like:[],dislike:[],heart:[]};
  const tepkiMetin=[(rTeps.like||[]).length?`👍${rTeps.like.length}`:'',(rTeps.dislike||[]).length?`👎${rTeps.dislike.length}`:'',(rTeps.heart||[]).length?`❤️${rTeps.heart.length}`:''].filter(Boolean).join(' ');
  if(tepkiMetin) footer.appendChild(h('span',{class:'swipe-footer-btn'},tepkiMetin));
  footer.appendChild(h('button',{class:'btn swipe-footer-btn',onclick:(e)=>{e.stopPropagation();linkiKopyala(post.id);}},'🔗 Paylaş'));
  scroller.appendChild(footer);

  // Hızlı puanlama (şiirin sahibi/admin hariç)
  if(!isOwn && post.authorId!==undefined){
    const rw=h('div',{style:{marginBottom:'14px'}});
    rw.appendChild(h('p',{style:{fontSize:'.8rem',color:myR?'#c084fc':'#a78bfa',marginBottom:'6px',fontStyle:myR?'normal':'italic'}},myR?`✅ Puanınız: ${myR}/10`:'⭐ Bu şiire puan ver'));
    const stars=h('div',{class:'swipe-stars'});
    for(let n=1;n<=10;n++){
      const s=h('button',{style:{background:'none',border:'none',cursor:'pointer',fontSize:'1.1rem',padding:'2px 3px',filter:n<=(myR||0)?'none':'grayscale(1) opacity(.3)'}},n<=5?'⭐':'🌟');
      s.onclick=(e)=>{e.stopPropagation();if(girisGerekli())return;A.ratePost(post.id,n);sonrakineGec&&refreshSwipeStars(stars,post.id);};
      stars.appendChild(s);
    }
    rw.appendChild(stars);
    scroller.appendChild(rw);
  }

  scroller.appendChild(h('p',{class:'swipe-hint'},'↓ okumaya devam et · sola kaydır → sonraki şiir'));

  // Dokunmatik olmayan (fare) kullanıcılar için: metnin sonuna gelince görünen buton
  const nextBtn=h('button',{class:'btn',style:{width:'100%',background:'linear-gradient(135deg,#0891b2,#0e7490)',color:'#fff',border:'none',borderRadius:'12px',padding:'10px',fontSize:'.85rem',marginBottom:'8px'},onclick:(e)=>{e.stopPropagation();sonrakineGec();}},'➜ Sonraki Şiir');
  scroller.appendChild(nextBtn);

  card.appendChild(scroller);
  return card;
}
// Kaydırma modunda puan verildikten sonra yıldızların görünümünü günceller
function refreshSwipeStars(starsEl,pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const myR=post.userRatings?.[S.me?.id]??0;
  for(let i=1;i<=10;i++){
    const b=starsEl.children[i-1];
    if(b) b.style.filter=i<=myR?'none':'grayscale(1) opacity(.3)';
  }
}

      // Kota doldu uyarısı (Groq 429 döndüyse) — bilgiler Groq'un hata mesajından (body) alınır,
      // çünkü tarayıcı x-ratelimit-* header'larını CORS nedeniyle genelde engeller.
      if(groqKota.kotaDolduMu){

        uyari.appendChild(h('p',{style:{color:'#f87171',fontSize:'.78rem',fontWeight:'bold',marginBottom:'4px'}},'⛔ Groq kotası doldu — şu an yorumlar yerel algoritmayla yapılıyor'));
        if(groqKota.kotaTuru)
          uyari.appendChild(h('p',{style:{color:'#fca5a5',fontSize:'.72rem',marginBottom:'2px'}},`Dolan kota: ${groqKota.kotaTuru}`));
        if(groqKota.kotaLimit!==null && groqKota.kotaKullanilan!==null)
          uyari.appendChild(h('p',{style:{color:'#fca5a5',fontSize:'.72rem',marginBottom:'2px'}},`Kullanım: ${groqKota.kotaKullanilan.toLocaleString('tr-TR')} / ${groqKota.kotaLimit.toLocaleString('tr-TR')}`));
        if(kalanSn!==null){
