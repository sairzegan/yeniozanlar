// ── Groq kota yardımcıları ───────────────────────────────────────────────
// Groq "2m59.56s", "7.66s", "1h2m3s" veya "500ms" gibi süre string'leri döner; saniyeye çeviririz.
function groqSureCevir(str){
  if(!str) return null;
  str = String(str).trim();
  if(/^[\d.]+ms$/.test(str)) return parseFloat(str)/1000;
  let toplam = 0, bulundu = false;
  const saat = str.match(/([\d.]+)h/);
  const dakika = str.match(/([\d.]+)m(?!s)/);
  const saniye = str.match(/([\d.]+)s/);
  if(saat){ toplam += parseFloat(saat[1])*3600; bulundu = true; }
  if(dakika){ toplam += parseFloat(dakika[1])*60; bulundu = true; }
  if(saniye){ toplam += parseFloat(saniye[1]); bulundu = true; }
  if(!bulundu){
    const n = parseFloat(str);
    if(!isNaN(n)) toplam = n; else return null;
  }
  return toplam;
}
// Şu andan itibaren N saniye sonrasının saatini okunaklı yazar
function groqSaatFormatla(saniyeSonra){

// N saniyeyi "X dk Y sn" gibi yazar
function groqSureFormatla(saniye){
  if(saniye===null || isNaN(saniye)) return '';
  saniye = Math.max(0, Math.round(saniye));
  const dk = Math.floor(saniye/60), sn = saniye%60;
  return dk>0 ? `${dk} dk ${sn} sn` : `${sn} sn`;
}

// Groq, günlük istek hakkını (RPD) her zaman header'da vermeyebilir.
// Bu yüzden "bugün kaç şiir Groq ile yorumlandı / kaçı yerel algoritmaya düştü" bilgisini

const GROQ_GUNLUK_ANAHTAR = 'yo_groq_gunluk';
function groqGunlukDurum(){
  const bugun = new Date().toLocaleDateString('tr-TR');
  let kayit = lsGet(GROQ_GUNLUK_ANAHTAR, null);
  if(!kayit || kayit.tarih !== bugun){
    kayit = { tarih: bugun, basarili: 0, yerel: 0 };
    lsSet(GROQ_GUNLUK_ANAHTAR, kayit);
  }
  return kayit;
}
function groqGunlukArttir(basariliMi){
  const k = groqGunlukDurum();
  if(basariliMi) k.basarili++; else k.yerel++;
  lsSet(GROQ_GUNLUK_ANAHTAR, k);
  return k;
}

// Groq rate limit takibi (canlı, oturum bazlı)
const groqKota = {
  limitIstek: null,          // Groq'un bildirdiği istek limiti
  kalanIstek: null,          // kalan istek hakkı
  istekSifirlanmaSn: null,   // istek kotasının kaç saniye sonra yenileneceği
  limitToken: null,          // dakikalık token limiti
  kalanToken: null,          // kalan token
  tokenSifirlanmaSn: null,   // token kotasının kaç saniye sonra yenileneceği
  toplamIstek: 0,            // bu oturumda Groq'a yapılan toplam istek
  sonGuncelleme: null,       // son güncelleme saati
  sonKaynak: null,           // 'groq' | 'yerel' — son şiir yorumu nereden geldi
  sonHata: null,             // son hata mesajı (varsa) — admin panelinde gösterilir
  kotaDolduMu: false,        // 429 (kota doldu) durumuna geçildi mi
  kotaAcilmaZamani: null,    // kota tekrar açılacağı an (Date.now() + saniye)
  kotaTuru: null,            // 'RPM' | 'RPD' | 'TPM' | 'TPD' — Groq'un hata mesajından okunur
  kotaLimit: null,           // ilgili kotanın toplam limiti
  kotaKullanilan: null,      // ilgili kotadan kullanılan miktar
  kotaMesaj: null,           // Groq'un ham hata mesajı
};

function groqKotaGuncelle(headers) {
  const get = k => headers.get(k);
  if (get('x-ratelimit-limit-requests'))     groqKota.limitIstek = parseInt(get('x-ratelimit-limit-requests'));
  if (get('x-ratelimit-remaining-requests')) groqKota.kalanIstek = parseInt(get('x-ratelimit-remaining-requests'));
  if (get('x-ratelimit-reset-requests'))     groqKota.istekSifirlanmaSn = groqSureCevir(get('x-ratelimit-reset-requests'));
  if (get('x-ratelimit-limit-tokens'))       groqKota.limitToken = parseInt(get('x-ratelimit-limit-tokens'));
  if (get('x-ratelimit-remaining-tokens'))   groqKota.kalanToken = parseInt(get('x-ratelimit-remaining-tokens'));
  if (get('x-ratelimit-reset-tokens'))       groqKota.tokenSifirlanmaSn = groqSureCevir(get('x-ratelimit-reset-tokens'));
  groqKota.sonGuncelleme = new Date().toLocaleTimeString('tr-TR');
  groqKota.toplamIstek++;
}

// Groq, kota dolduğunda (429) response body'sinde şu formatta bir mesaj döner:
// "Rate limit reached for model `...` on requests per day (RPD): Limit 1000, Used 1000,
//  Requested 1. Please try again in 6m 11.52s. Visit ..."
// Bu bilgi, tarayıcının CORS nedeniyle engelleyebileceği x-ratelimit-* header'larının
// aksine HER ZAMAN okunabilir (response body serbestçe okunur), bu yüzden asıl
// güvenilir kota bilgisi kaynağımız burasıdır.
function groqHataAyristir(mesaj){
  if(!mesaj) return null;
  const turEsleme = {
    'requests per minute':'RPM (dakikalık istek)',
    'requests per day':'RPD (günlük istek)',
    'tokens per minute':'TPM (dakikalık token)',
    'tokens per day':'TPD (günlük token)'
  };
  let tur = null;
  for(const anahtar in turEsleme){ if(mesaj.toLowerCase().includes(anahtar)){ tur = turEsleme[anahtar]; break; } }
  const sayilar = mesaj.match(/Limit ([\d,]+),\s*Used ([\d,]+),\s*Requested ~?([\d,]+)/i);
  const sureEslesme = mesaj.match(/Please try again in\s*((?:[\d.]+h\s*)?(?:[\d.]+m\s*)?(?:[\d.]+s)?)/i);
  const bekleSn = sureEslesme ? groqSureCevir(sureEslesme[1].trim()) : null;
  return {
    tur,
    limit: sayilar ? parseInt(sayilar[1].replace(/,/g,'')) : null,
    kullanilan: sayilar ? parseInt(sayilar[2].replace(/,/g,'')) : null,
    bekleSn,
  };
}

// 429 (Too Many Requests) geldiğinde çağrılır: kota doldu bilgisini işaretler.
// mesaj: Groq'un response body'sindeki error.message alanı (varsa)
function groqKota429Isaretle(headers, mesaj){
  groqKota.kotaDolduMu = true;
  groqKota.kotaMesaj = mesaj || null;
  const ayristirilmis = groqHataAyristir(mesaj);
  let bekleSn = ayristirilmis?.bekleSn;
  if(bekleSn===null || bekleSn===undefined){
    const retryAfter = headers?.get ? parseFloat(headers.get('retry-after')) : null;
    bekleSn = (retryAfter && !isNaN(retryAfter)) ? retryAfter : 60;
  }
  groqKota.kotaAcilmaZamani = Date.now() + bekleSn*1000;
  groqKota.kotaTuru = ayristirilmis?.tur ?? null;
  groqKota.kotaLimit = ayristirilmis?.limit ?? null;
  groqKota.kotaKullanilan = ayristirilmis?.kullanilan ?? null;
}

async function scorePoem(text){
  if(!text||text.trim().length<3)return null;
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1024,
        temperature: 0.7,
        messages: [{
          role: 'system',
          content: 'Sen deneyimli bir Türk edebiyat eleştirmenisin. Şiirleri derinlemesine analiz eder, doğrudan söylenmese bile ima edilen duygu ve anlatıyı kavrayabilirsin. Yanıtlarını SADECE geçerli JSON formatında verirsin.'
        },{
          role: 'user',
          content: `Aşağıdaki şiiri analiz et:\n\n"""\n${text}\n"""\n\nDikkat et:\n- Aynı kelimenin tekrarını kafiye sayma\n- Kısa ve tekrarlı şiirlere düşük puan ver\n- Doğrudan söylenmese bile ima edilen duyguyu, temayı, anlatıyı kavra\n- Şiirden gerçek dize alıntısı yap\n- Hece ölçüsünü doğru tespit et\n- Günlük konuşma dili ve klişelere eksi puan ver\n\nSADECE şu JSON ile yanıtla, başka hiçbir şey yazma:\n{\n  "score": <2.0-9.8 arası gerçekçi puan>,\n  "yorum": "<5-7 cümle: şiirden ne anlaşıldığı, tema, imge, dil kalitesi, ses uyumu>",\n  "gucluYonler": "<tek cümle, şiirden somut örnek>",\n  "gelistirmeOnerisi": "<tek cümle, somut ve uygulanabilir>"\n}`
        }]
      })
    });
    groqKotaGuncelle(res.headers);
    if(res.status===429){
      let mesaj = '';
      try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
      groqKota429Isaretle(res.headers, mesaj);
      throw new Error(mesaj || 'Groq kota doldu (429)');
    }
    groqKota.kotaDolduMu = false;
    if(!res.ok){
      let mesaj = '';
      try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
      throw new Error(mesaj || ('Groq hatası: '+res.status));
    }
    const data = await res.json();
    if(!data.choices?.[0]?.message?.content) throw new Error('Groq yanıt vermedi');
    const raw = data.choices[0].message.content.trim();
    const clean = raw.replace(/```json|```/g,'').trim();
    const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
    const result = JSON.parse(jsonStr);
    result.score = Math.min(9.8, Math.max(2.0, parseFloat(result.score)));
    result.score = Math.round(result.score * 10) / 10;
    groqKota.sonKaynak = 'groq';
    groqKota.sonHata = null;
    groqGunlukArttir(true);
    return result;
  } catch(e){
    console.warn('Groq API çalışmadı, yerel algoritma kullanılıyor:', e.message);
    groqKota.sonKaynak = 'yerel';
    groqKota.sonHata = e.message;
    groqGunlukArttir(false);
    return scorePoemYerel(text);
  }
}

function scorePoemYerel(text){
  if(!text||text.trim().length<3)return null;

  const satirlar = text.split('\n').filter(s=>s.trim().length>0);
  const lc = satirlar.length;
  const tumKelimeler = text.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const len = tumKelimeler.length;
  const tL = text.toLowerCase();
  const hash = text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd = n => Math.abs(hash) % n;

  // Tam kelime eşleşme
  const varMi = w => tumKelimeler.includes(w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));

  // ── BENZERSIZ KELİME ZENGİNLİĞİ ─────────────────────────────────────────
  const benzersiz = new Set(tumKelimeler.filter(k=>k.length>0)).size;
  const zenginlik = benzersiz / Math.max(len, 1);

  // ── TEKRAR ANALİZİ ───────────────────────────────────────────────────────
  const kelSay = {};
  tumKelimeler.forEach(w=>{ if(w.length>0) kelSay[w]=(kelSay[w]||0)+1; });
  // Çok tekrar edenler (3+ kez)
  const cokTekrar = Object.entries(kelSay).filter(([,v])=>v>=3).sort((a,b)=>b[1]-a[1]);
  // Tüm kelimelerin kaçta kaçı tekrar?
  const tekrarOrani = len>0 ? (len - benzersiz) / len : 0;
  // Şiir aslında sadece tekrarlı kelimelerden mi oluşuyor?
  const tekrarAgirlikli = tekrarOrani > 0.40;

  // ── HECE ÖLÇÜSÜ (gerçek analiz) ─────────────────────────────────────────
  const heceHesapla = w => (w.match(/[aeıioöuüAEIİOÖUÜ]/g)||[]).length;
  const satirHece = satirlar.map(s => {
    const ws = s.trim().split(/\s+/);
    const toplam = ws.reduce((t,w)=>t+heceHesapla(w), 0);
    return toplam;
  });
  const heceMean = satirHece.reduce((a,b)=>a+b,0) / Math.max(satirHece.length,1);
  const heceVar = satirHece.length > 1
    ? Math.sqrt(satirHece.reduce((s,h)=>s+(h-heceMean)**2,0)/satirHece.length)
    : 99;

  // Hece ölçüsü GERÇEKTEN VAR MI?
  // Kriterler: en az 4 dize, varyans < 1.5, her dize en az 5 hece, ortalama > 6
  const sifirVeyaAzHece = satirHece.filter(h=>h<3).length;
  const heceOlcusu = (
    heceVar < 1.5 &&
    lc >= 4 &&
    sifirVeyaAzHece === 0 &&
    heceMean >= 6 &&
    satirHece.every(h=>h>=5)
  );

  // ── KAFİYE ANALİZİ (aynı kelime tekrarı = kafiye DEĞİL) ─────────────────
  const satirSon = satirlar.map(l=>{
    const ws = l.trim().split(/\s+/);
    const tam = ws[ws.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'') || '';
    return { tam, son3: tam.slice(-3), son2: tam.slice(-2) };
  });

  // Gerçek kafiye: FARKLI kelimeler ama aynı son ek
  const gercekKafiyeParlari = [];
  for(let i=0;i<satirSon.length;i++){
    for(let j=i+1;j<satirSon.length;j++){
      const k1 = satirSon[i].tam;
      const k2 = satirSon[j].tam;
      // Aynı kelime değil, ama son 3 harf aynı
      if(k1 !== k2 && k1.length>2 && k2.length>2 && satirSon[i].son3 === satirSon[j].son3 && satirSon[i].son3.length>1){
        gercekKafiyeParlari.push({k1, k2, ek: satirSon[i].son3});
      }
    }
  }
  const kafiyeVar = gercekKafiyeParlari.length > 0;
  const kafiyeOrani = gercekKafiyeParlari.length / Math.max(lc, 1);

  // Aynı kelimenin satır sonunda tekrarı — bu kafiye DEĞİL
  const ayniKelimeTekrar = [];
  const sonKelimeSayisi = {};
  satirSon.forEach(s=>{ if(s.tam) sonKelimeSayisi[s.tam]=(sonKelimeSayisi[s.tam]||0)+1; });
  Object.entries(sonKelimeSayisi).forEach(([k,v])=>{ if(v>=2) ayniKelimeTekrar.push({kelime:k, sayi:v}); });

  // Zorlamalı kafiye
  const tekEkSayisi = {};
  satirSon.forEach(s=>{ if(s.son3) tekEkSayisi[s.son3]=(tekEkSayisi[s.son3]||0)+1; });
  const maxEkTekrar = Math.max(...Object.values(tekEkSayisi).concat([0]));
  const zorlamaKafiye = kafiyeVar && maxEkTekrar >= Math.ceil(lc*0.6);

  // ── ALİTERASYON ───────────────────────────────────────────────────────────
  const alitSatirlar = satirlar.map(s=>{
    const harfler = s.trim().split(/\s+/).map(w=>w[0]?.toLowerCase()).filter(Boolean);
    if(harfler.length < 3) return null; // çok kısa satırlarda anlamsız
    const hs = {};
    harfler.forEach(h=>{hs[h]=(hs[h]||0)+1;});
    const guclu = Object.entries(hs).filter(([,v])=>v>=3);
    return guclu.length>0 ? {satir:s.trim(), harf:guclu[0][0], sayi:guclu[0][1]} : null;
  }).filter(Boolean);
  const aliterasyonVar = alitSatirlar.length > 0;

  // ── ASONANS ───────────────────────────────────────────────────────────────
  const unluler = tL.match(/[aeıioöuü]/g)||[];
  const unluHS = {};
  unluler.forEach(u=>{unluHS[u]=(unluHS[u]||0)+1;});
  const domUnlu = Object.entries(unluHS).sort((a,b)=>b[1]-a[1])[0];
  // Sadece uzun şiirlerde (12+ ünlü) ve gerçek hâkimiyet (%45+)
  const asonansVar = domUnlu && unluler.length>=12 && (domUnlu[1]/unluler.length)>0.45;

  // ── GÜNLÜK DİL ───────────────────────────────────────────────────────────
  const gunlukListe = [
    'tamam','evet','hayır','neyse','yani','aslında','işte','şimdi','hadi',
    'sanırım','bilmiyorum','noolur','olur','olmaz','aa','off','vay','hey',
    'ee','hmm','peki','madem','belki','galiba','bence','sence','nasıl',
    'neden','niçin','niye','seviyorum','seviyordum','sevmiyorum','istiyorum',
    'istemiyorum','yapıyorum','gidiyorum','geliyorum','bakıyorum',
    'gel','git','bak','dur','kalk','ver','al','koş'
  ];
  const gunlukBulunan = [...new Set(tumKelimeler.filter(w=>gunlukListe.includes(w)))];

  // ── DİDAKTİK ─────────────────────────────────────────────────────────────
  const didaktikListe = ['çünkü','dolayısıyla','bu nedenle','sonuç olarak','demek ki','özetle','kısaca','şunu söyleyeyim','anlayacağın'];
  const didaktikBulunan = didaktikListe.filter(d=>tL.includes(d));

  // ── KLİŞE ────────────────────────────────────────────────────────────────
  const kliseCiftler = [
    {kelimeler:['saç','rüzgar'], ifade:'saçları rüzgar'},
    {kelimeler:['göz','yıldız'], ifade:'gözleri yıldız'},
    {kelimeler:['aşk','ateş'], ifade:'aşk ateşi'},
    {kelimeler:['yürek','yan'], ifade:'yürek yangını'},
    {kelimeler:['kalp','kır'], ifade:'kırık kalp'},
    {kelimeler:['bülbül','gül'], ifade:'bülbül ve gül'},
    {kelimeler:['göz','deniz'], ifade:'gözlerin denizi'},
    {kelimeler:['sevgi','ışık'], ifade:'sevginin ışığı'},
  ];
  const kliseBulunan = kliseCiftler.filter(c=>c.kelimeler.every(k=>tL.includes(k)));
  const kliseTekListe = ['aşkından yandım','sensiz olmaz','hasret kaldım','kırık kalp','seni bekliyorum','gözlerin yıldız','saçların rüzgar'];
  const kliseTekBulunan = kliseTekListe.filter(k=>tL.includes(k));

  // ── İMGE ─────────────────────────────────────────────────────────────────
  const benzetmeImleri = ['gibi','sanki','andır','tıpkı','adeta','misali'];
  const benzetmeSatirlari = satirlar.filter(s=>benzetmeImleri.some(b=>s.toLowerCase().includes(b)));

  const insanFiilleri = ['söyler','bakar','ağlar','güler','uçar','koşar','fısıldar','haykırır','titrer','sarılır','bekler','özler','düşünür'];
  const dogaKelime = ['güneş','ay','yıldız','deniz','dağ','rüzgar','yaprak','bulut','ağaç','nehir','kar','çiçek','toprak','taş','su'];
  const kisilesMeSatirlari = satirlar.filter(s=>{
    const sL=s.toLowerCase();
    return dogaKelime.some(d=>sL.includes(d)) && insanFiilleri.some(f=>sL.includes(f));
  });

  const sembolListe = ['labirent','kafes','zincir','perde','kök','tohum','kül','yankı','gölge','iz','boşluk','uçurum','köprü','sis','çıkmaz','zindan','kanat','ayna'];
  const sembolBulunan = sembolListe.filter(w=>varMi(w));

  const ozgunMetafor = benzetmeSatirlari.length>0 && kliseBulunan.length===0;

  // ── ŞİİRSEL DİL ─────────────────────────────────────────────────────────
  const siirselListe = ['hüzün','keder','figan','gurbet','özlem','hasret','gönül','yürek','ruh','mehtap','şebnem','seher','canan','yar','efkar','hicran','viran','şevk','baht','felek','naz','niyaz','dert','derman'];
  const siirselBulunan = siirselListe.filter(w=>varMi(w));

  const modernSozler = ['telefon','internet','bilgisayar','araba','market','ofis','toplantı','şirket','uygulama','instagram','whatsapp','sosyal','wifi'];
  const modernBulunan = modernSozler.filter(w=>tL.includes(w));

  // ── TEMA ─────────────────────────────────────────────────────────────────
  const temalar = {
    'hüzün ve keder':      ['hüzün','keder','ağlamak','gözyaşı','yalnız','acı','solmak','yas','figan'],
    'umut ve yenilenme':   ['umut','ışık','sabah','doğmak','güneş','bahar','yeşermek','sevinç'],
    'aşk ve özlem':        ['sevgi','aşk','sevda','yürek','canan','yar','beklemek','özlemek','hasret'],
    'doğa ve evren':       ['deniz','dağ','orman','nehir','rüzgar','yaprak','toprak','bulut','kar','çiçek'],
    'varoluş ve anlam':    ['ölüm','yaşam','sonsuz','zaman','anlam','gerçek','boşluk','hiçlik'],
    'özgürlük ve isyan':   ['özgür','kanat','uçmak','zindan','kafes','kurtulmak','engel','zincir'],
    'gurbet ve yalnızlık': ['gurbet','yalnız','uzak','ayrılık','hasret','yurt','memleket'],
  };
  const temaAgirliklari = Object.entries(temalar).map(([isim,kelimeler])=>({
    isim, agirlik: kelimeler.filter(k=>varMi(k)).length,
    bulunanlar: kelimeler.filter(k=>varMi(k))
  })).sort((a,b)=>b.agirlik-a.agirlik);

  const anaTema = temaAgirliklari[0];
  const ikinciTema = temaAgirliklari[1]?.agirlik>0 ? temaAgirliklari[1] : null;

  // Tema dizelerinden alıntı
  const temaOrnekSatirlar = satirlar.filter(s=>
    anaTema.bulunanlar.some(k=>s.toLowerCase().includes(k))
  ).slice(0,2).map(s=>s.trim());

  const punct = (text.match(/[,;:!?—–.]/g)||[]).length;

  // ── PUAN HESAPLAMA ───────────────────────────────────────────────────────
  let p = 5.0;

  // Uzunluk — çok kısa sert ceza
  if(len < 5)        p -= 3.5;
  else if(len < 10)  p -= 2.0;
  else if(len < 15)  p -= 0.8;
  else if(len <= 60) p += 0.8;
  else if(len <= 120)p += 0.4;

  // Dize sayısı
  if(lc < 2)         p -= 2.0;
  else if(lc === 2)  p -= 1.0;
  else if(lc === 3)  p -= 0.3;
  else if(lc>=4&&lc<=20) p += 0.5;

  // Kelime tekrarı — çok tekrar eden şiire sert ceza
  if(tekrarAgirlikli)        p -= 1.5;
  if(cokTekrar.length >= 3)  p -= 1.0;
  else if(cokTekrar.length >= 2) p -= 0.5;

  // Kelime zenginliği
  if(zenginlik > 0.85)       p += 1.5;
  else if(zenginlik > 0.70)  p += 0.8;
  else if(zenginlik > 0.55)  p += 0.2;
  else if(zenginlik < 0.40)  p -= 1.0;
  else                        p -= 0.4;

  // Günlük dil
  const gd = gunlukBulunan.length;
  if(gd >= 5)      p -= 2.5;
  else if(gd >= 3) p -= 1.5;
  else if(gd >= 2) p -= 0.9;
  else if(gd >= 1) p -= 0.4;

  // Didaktik
  const dd = didaktikBulunan.length;
  if(dd >= 2) p -= 1.5;
  else if(dd >= 1) p -= 0.7;

  // Klişe
  p -= kliseBulunan.length * 0.7;
  p -= kliseTekBulunan.length * 0.5;

  // Şiirsel dil
  if(siirselBulunan.length >= 3) p += 0.8;
  else if(siirselBulunan.length >= 1) p += 0.3;

  // Modern kelime
  p -= modernBulunan.length * 0.4;

  // Kafiye — GERÇEK kafiye
  if(zorlamaKafiye)            p -= 1.0;
  else if(kafiyeOrani > 0.4)   p += 0.9;
  else if(kafiyeOrani > 0.2)   p += 0.4;

  // Aynı kelime tekrarı kafiye sayılmaz, hafif ceza
  if(ayniKelimeTekrar.length > 0 && !kafiyeVar) p -= 0.3;

  // Hece ölçüsü
  if(heceOlcusu) p += 0.8;

  // Ses araçları
  if(aliterasyonVar)  p += 0.4;
  if(asonansVar)      p += 0.3;

  // İmge
  if(ozgunMetafor)                  p += 0.6;
  else if(benzetmeSatirlari.length) p += 0.2;
  if(kisilesMeSatirlari.length)     p += 0.5;
  if(sembolBulunan.length)          p += 0.3;

  // Noktalama
  if(punct >= 2 && punct <= 12) p += 0.2;

  const sapma = ((Math.abs(hash)%9)-4)*0.07;
  p = Math.min(9.6, Math.max(2.0, p+sapma));
  p = Math.round(p*10)/10;

  // ── YORUM ÜRETİMİ ────────────────────────────────────────────────────────
  const P = [];

  // 1. Kısa/tekrarlı şiir uyarısı
  if(len < 10 || lc < 3){
    P.push(`Bu metin çok kısa — ${lc} dize, ${len} kelime. Şiirsel derinlik için çok az alan var; tema yüzeyde kalmak zorunda.`);
  }
  if(tekrarAgirlikli){
    const enCokTekrar = cokTekrar[0];
    P.push(`Şiirde kelime tekrarı çok yoğun: "${enCokTekrar?.[0]}" gibi sözcükler ${enCokTekrar?.[1]} kez geçiyor. Bu tekrar bilinçli bir anafora dönüşmüyor, yalnızca söz azlığını açığa çıkarıyor.`);
  } else if(cokTekrar.length > 0){
    P.push(`"${cokTekrar[0][0]}" kelimesi ${cokTekrar[0][1]} kez tekrarlanmış; bu bilinçli bir yineleme ise güçlü olabilir, değilse şiiri yataylaştırıyor.`);
  }

  // 2. Tema
  if(anaTema.agirlik > 0){
    let temaMetni = `Şiirde ${anaTema.isim} teması seziliyor`;
    if(ikinciTema) temaMetni += `, ${ikinciTema.isim} de ikincil olarak hissediliyor`;
    if(temaOrnekSatirlar.length > 0){
      temaMetni += `. "${temaOrnekSatirlar[0]}" dizesi temayı en açık taşıyan yer.`;
    } else {
      temaMetni += `; temayı taşıyan kelimeler: ${anaTema.bulunanlar.slice(0,3).map(k=>`"${k}"`).join(', ')}.`;
    }
    P.push(temaMetni);
  } else {
    P.push(`Şiirde belirgin bir tema yok; içerik belirsiz, okuyucuya tutunacak bir duygu ekseni sunulmuyor.`);
  }

  // 3. İmge ve metafor
  if(benzetmeSatirlari.length > 0){
    const orn = benzetmeSatirlari[0].trim();
    const k = orn.length > 65 ? orn.slice(0,65)+'…' : orn;
    P.push(ozgunMetafor
      ? `"${k}" dizesinde özgün bir benzetme var; beklenmedik imgeler şiiri sıradanlıktan kurtarıyor.`
      : `"${k}" dizesinde benzetme denenmiş ama kullanılan imgeler alışılagelen kalıplardan uzaklaşamıyor.`);
  }
  if(kisilesMeSatirlari.length > 0){
    const k = kisilesMeSatirlari[0].trim().slice(0,65);
    P.push(`"${k}" dizesinde doğaya insan özelliği yükleniyor — kişileştirme şiire derinlik katıyor.`);
  }
  if(sembolBulunan.length > 0){
    P.push(`"${sembolBulunan[0]}" sözcüğü sembolik anlam taşıyor${sembolBulunan.length>1?`; "${sembolBulunan[1]}" de bu katmanı destekliyor`:''}.`);
  }
  if(kliseBulunan.length > 0){
    P.push(`"${kliseBulunan[0].ifade}" Türk şiirinde çok kullanılmış bir kalıp; okuyucu bunu zaten biliyor, özgünlük zedeleniyor.`);
  }
  if(kliseTekBulunan.length > 0){
    P.push(`"${kliseTekBulunan[0]}" çok yıpranmış bir ifade; yerine özgün bir söyleyiş şiiri canlandırır.`);
  }

  // 4. Hece ölçüsü — gerçekçi
  P.push(heceOlcusu
    ? `Hece ölçüsüyle yazılmış; her dize yaklaşık ${Math.round(heceMean)} hece taşıyor ve bu denge tutarlı (varyans: ${heceVar.toFixed(1)}).`
    : heceMean < 4 && lc > 0
      ? `Dizeler çok kısa (ort. ${Math.round(heceMean)} hece); hece ölçüsü yok, serbest nazım da değil — yalnızca kelime parçaları sıralanmış.`
      : `Serbest nazım tercih edilmiş${heceVar < 4 ? `; dize uzunlukları birbirine yakın (ort. ${Math.round(heceMean)} hece), belli bir ritim hissettiriyor` : `; dize uzunlukları oldukça değişken, ritmik bir kural gözetilmemiş`}.`
  );

  // 5. Kafiye — aynı kelime tekrarını kafiye saymaz
  if(ayniKelimeTekrar.length > 0 && !kafiyeVar){
    const orn = ayniKelimeTekrar[0].kelime;
    P.push(`"${orn}" sözcüğü satır sonlarında ${ayniKelimeTekrar[0].sayi} kez tekrarlanmış; bu kafiye değil, yalnızca aynı kelimenin tekrarı. Kafiye farklı kelimeler arasında ses benzerliği gerektirir.`);
  } else if(zorlamaKafiye){
    P.push(`Kafiye düzeni zorlamalı; aynı ek çok sayıda dizede tekrarlanarak mekanik bir ses uyumu oluşturuluyor.`);
  } else if(kafiyeVar && gercekKafiyeParlari.length > 0){
    P.push(`Gerçek kafiye var: "${gercekKafiyeParlari[0].k1}" ve "${gercekKafiyeParlari[0].k2}" eşleşmesi ses uyumunu güçlendiriyor.`);
  } else {
    P.push(`Kafiye kullanılmamış; ses uyumu tamamen serbest bırakılmış.`);
  }

  // 6. Ses araçları
  if(aliterasyonVar){
    const orn = alitSatirlar[0];
    const k = orn.satir.length > 55 ? orn.satir.slice(0,55)+'…' : orn.satir;
    P.push(`"${k}" dizesinde "${orn.harf}" harfinin ${orn.sayi} kez tekrarıyla aliterasyon yaratılmış.`);
  }
  if(asonansVar){
    P.push(`"${domUnlu[0]}" ünlüsünün hâkimiyeti (%${Math.round(domUnlu[1]/unluler.length*100)}) şiire asonans katıyor.`);
  }

  // 7. Dil kalitesi
  if(gd >= 4){
    P.push(`Şiir büyük ölçüde günlük konuşma diline dayanıyor: "${gunlukBulunan.slice(0,3).join('", "')}" gibi sözcükler şiirsel gerilimi büsbütün kırıyor.`);
  } else if(gd >= 2){
    P.push(`"${gunlukBulunan.slice(0,2).join('" ve "')}" gibi konuşma dili sözcükleri şiirsel tonu zayıflatıyor.`);
  } else if(gd === 1){
    P.push(`"${gunlukBulunan[0]}" sözcüğü şiirin havasından uzaklaşıyor.`);
  } else if(siirselBulunan.length >= 2){
    P.push(`Dil şiirsel ve özenli: "${siirselBulunan.slice(0,2).join('" ve "')}" sözcükleri şiire derinlik katıyor.`);
  }

  if(modernBulunan.length > 0){
    P.push(`"${modernBulunan[0]}" gibi modern sözcükler şiirsel atmosferi kırıyor.`);
  }

  if(dd >= 1){
    P.push(`"${didaktikBulunan[0]}" gibi açıklayıcı bağlaçlar şiiri didaktik bir anlatıma itiyor; şiir açıklamaz, hissettirir.`);
  }

  // 8. Kelime zenginliği
  if(zenginlik < 0.45 && len >= 8){
    P.push(`${len} kelimelik şiirde yalnızca ${benzersiz} farklı sözcük var; yani kelimelerin büyük çoğunluğu tekrar. Bu şiiri daraltıyor.`);
  } else if(zenginlik > 0.82 && len >= 12){
    P.push(`Kelime zenginliği yüksek (${benzersiz} farklı sözcük); söz dağarcığı özgün.`);
  }

  // 9. Kapanış
  if(p >= 8.5){
    P.push(`Ses ve anlam dengesi kurulmuş, olgun bir şiir.`);
  } else if(p >= 7.0){
    P.push(`Güçlü potansiyel var; birkaç kritik değişiklikle çok daha etkili olabilir.`);
  } else if(p >= 5.5){
    P.push(`Şiir kendi sesini henüz bulamamış; ham malzeme var ama işçilik derinleştirilmeli.`);
  } else if(p >= 4.0){
    P.push(`Şiirsel bir niyet var; ancak dil, imge ve ses araçları açısından köklü bir yeniden yazım gerekiyor.`);
  } else {
    P.push(`Bu metin henüz şiir sayılamaz; temel şiir tekniklerine odaklanıp yeniden denemek gerekiyor.`);
  }

  const yorum = P.join(' ');

  // Güçlü yön
  const gucluH = [];
  if(ozgunMetafor && benzetmeSatirlari.length>0) gucluH.push(`Özgün imge: "${benzetmeSatirlari[0].trim().slice(0,35)}…"`);
  if(heceOlcusu) gucluH.push(`${Math.round(heceMean)} heceli tutarlı hece ölçüsü`);
  if(kafiyeOrani>0.35&&!zorlamaKafiye&&gercekKafiyeParlari.length>0) gucluH.push(`"${gercekKafiyeParlari[0].k1}-${gercekKafiyeParlari[0].k2}" kafiyesi doğal`);
  if(aliterasyonVar) gucluH.push(`"${alitSatirlar[0].harf}" sesindeki aliterasyon`);
  if(kisilesMeSatirlari.length>0) gucluH.push('Kişileştirme şiire canlılık katıyor');
  if(sembolBulunan.length>0) gucluH.push(`"${sembolBulunan[0]}" sembolik anlam katıyor`);
  if(zenginlik>0.82&&len>=12) gucluH.push('Kelime zenginliği yüksek');
  if(siirselBulunan.length>=2) gucluH.push('Şiirsel dil özenli');
  if(asonansVar) gucluH.push(`"${domUnlu[0]}" ünlüsüyle asonans`);
  if(gucluH.length===0) gucluH.push('Ham bir duygu yoğunluğu taşıyor; bu zemin geliştirilebilir');
  const guclu = gucluH[rnd(gucluH.length)];

  // Öneri
  const oneriH = [];
  if(len<12||lc<4)                    oneriH.push(`Şiir çok kısa (${len} kelime, ${lc} dize); en az 20-30 kelimeye genişletilmeli`);
  if(tekrarAgirlikli)                 oneriH.push('Aynı kelimelerin tekrarı yerine farklı sözcükler ve imgeler aranmalı');
  if(zorlamaKafiye)                   oneriH.push('Zorlamalı kafiyeden vazgeçilip doğal ses uyumu denenebilir');

  if(modernBulunan.length>0)          oneriH.push(`"${modernBulunan[0]}" yerine şiirsel bir karşılık bulunmalı`);
  if(oneriH.length===0)               oneriH.push('Son dize daha çarpıcı bir kapanışla güçlendirilebilir');
  const oneri = oneriH[rnd(oneriH.length)];

// Sadece ilgili kartı günceller, sayfa kaymaz
function refreshCard(pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const oldCard=document.querySelector(`[data-pid="${pid}"]`);
  if(!oldCard)return;
  // Mevcut durumu kaydet
  const wasExpanded=oldCard.querySelector('.post-full')?.style.display==='block';
  const cmtsOpen=oldCard.querySelector('.cmt-body')?.style.display==='block';
  const scrollY=window.scrollY;
  const cardTop=oldCard.getBoundingClientRect().top;
  // Eski kartın yüksekliğini sabit tut — layout shift önle
  oldCard.style.minHeight=oldCard.offsetHeight+'px';
  // Yeni kartı oluştur
  const newCard=postCard(post, wasExpanded);
  newCard.setAttribute('data-pid',pid);
  oldCard.replaceWith(newCard);
  // Yorumlar açıksa yeni kartta da aç
  if(cmtsOpen){
    const b=newCard.querySelector('.cmt-body');
    if(b)b.style.display='block';
  }
  // Kartın ekrandaki konumunu koruyarak scroll'u sabitle
  const newCardTop=newCard.getBoundingClientRect().top;
  const diff=newCardTop-cardTop;
  window.scrollTo({top:scrollY+diff,behavior:'instant'});
}

async function groqBotCall(systemPrompt, userPrompt) {
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GROQ_API_KEY
      },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 400,
        temperature: 0.8,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      })
    });
    groqKotaGuncelle(res.headers);
    if (res.status === 429) {
      let mesaj = '';
      try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
      groqKota429Isaretle(res.headers, mesaj);
      throw new Error(mesaj || 'Groq kota doldu (429)');
    }
    groqKota.kotaDolduMu = false;
    if (!res.ok){
      let mesaj = '';
      try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
      throw new Error(mesaj || ('HTTP ' + res.status));
    }
    const data = await res.json();
    const raw = data.choices?.[0]?.message?.content?.trim();
    if (!raw) throw new Error('Bos yanit');
    const clean = raw.replace(/```json|```/g, '').trim();
    const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}') + 1);
    return JSON.parse(jsonStr);
  } catch(e) {
    console.warn('groqBotCall hatasi:', e.message);
    groqKota.sonHata = e.message;
    return null;
  }
}

function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  return e;
}

        await new Promise(res=>setTimeout(res,600));
        revalStatus.textContent='arı-yorum analiz ediyor...';
        const b3=await botAriPuan(post.text);

          if(b2){yeniRatings[b2.kullanici]=b2.puan;yeniBotYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};}
          if(b3){yeniRatings[b3.kullanici]=b3.puan;yeniBotYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};}
          if(r){yeniRatings['bot_ai_yorum']=r.score;}
          S.posts[idx].userRatings=yeniRatings;
          S.posts[idx].botYorumlar=yeniBotYorumlar;

            userRatings:yeniRatings,botYorumlar:yeniBotYorumlar,
            aiScore:r?r.score:post.aiScore,aiYorum:r?r.yorum:post.aiYorum,

          refreshCard(post.id);

      revalBtn2.textContent='🤖 Yapay Zeka ile Yeniden Değerlendir';

    revalDiv.appendChild(revalStatus);

  }
  if(avg!==null) full.appendChild(h('p',{style:{fontSize:'.82rem',color:scoreColor(avg),textAlign:'center',marginBottom:'10px'}},scoreBadge(avg)));

  // yorumlar
  let showC=false;

  const cbody=h('div',{class:'cmt-body',style:{marginTop:'10px',display:'none'}});
  (post.comments||[]).forEach(c=>{

    ]);
    cbody.appendChild(cItem);
  });
  if(!(post.comments||[]).length) cbody.appendChild(h('p',{style:{fontSize:'.82rem',color:'#6b5b8a',fontStyle:'italic',marginBottom:'8px'}},'Ozan seni bekliyor! 🌙'));
  const ci=h('textarea',{placeholder:'Düşünceni paylaş... Şiir hakkındaki düşüncelerini, hissettirdiklerini yaz.',class:'inp',rows:'3',style:{borderRadius:'14px',flex:'1',resize:'none',lineHeight:'1.6',fontSize:'.95rem'}});
  ci.onclick=e=>e.stopPropagation();
  ci.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.stopPropagation();if(!ci.value.trim())return;A.addComment(post.id,ci.value.trim());ci.value='';}})
  cbody.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'6px',alignItems:'flex-end'}},[av(S.me,28),ci,h('button',{class:'pb btn',style:{padding:'8px 14px',fontSize:'.85rem',flexShrink:'0'},onclick:(e)=>{e.stopPropagation();if(!ci.value.trim())return;A.addComment(post.id,ci.value.trim());ci.value='';}}, '↩')]));
  full.appendChild(cbtn);full.appendChild(cbody);

  // kapat butonu
  const closeBtn=h('button',{class:'btn',style:{background:'none',color:'#5b21b6',fontSize:'.8rem',width:'100%',textAlign:'center',marginTop:'10px',paddingTop:'8px',borderTop:'1px solid #2d1b5244'},onclick:(e)=>{e.stopPropagation();expanded=false;full.style.display='none';preview.style.display='block';expandLabel.textContent='Devamını gör ▼';}},'▲ Kapat');
  full.appendChild(closeBtn);
  card.appendChild(full);

  // toggle
  preview.onclick=()=>{
    expanded=!expanded;
    preview.style.display=expanded?'none':'block';
    full.style.display=expanded?'block':'none';
    expandLabel.textContent=expanded?'Kapat ▲':'Devamını gör ▼';
  };

  if(forceExpand){preview.style.display='none';full.style.display='block';}

  return card;
}

function authPage(title,sub,fields,btnLabel,onSubmit,altText,altAction){
  const vals={};
  const errEl=h('p',{style:{color:'#f87171',fontSize:'.85rem',display:'none'}},'');
  
  const fieldEls = fields.map(f => {
    const wrap = h('div',{style:{display:'flex',flexDirection:'column',gap:'5px',width:'100%'}},[h('label',{style:{color:'#a78bfa',fontSize:'.85rem'}},f.label)]);
    
    // ŞİFRE GÖSTER/GİZLE DÜZELTİLDİ: DOM ID üzerinden elemente doğrudan erişim sağlandı
    if(f.type === 'password') {
      const uniqueInputId = 'pwd_' + f.k;
      const pWrapper = h('div', {class: 'password-wrapper'});
      
      const i = h('input', {
        id: uniqueInputId,
        placeholder: f.ph, 
        type: 'password', 
        class: 'inp', 
        style:{width:'100%', paddingRight: '45px'}
      });
      i.oninput = e => vals[f.k] = e.target.value;
      
      let isOpen = false;
      const toggleBtn = h('button', {
        class: 'password-toggle-btn',
        type: 'button',
        onclick: (e) => {
          e.preventDefault();
          isOpen = !isOpen;
          const targetInput = document.getElementById(uniqueInputId);
          if(targetInput) {
            targetInput.type = isOpen ? 'text' : 'password';
          }
          toggleBtn.textContent = isOpen ? '🙈' : '👁️';
        }
      }, ['👁️']);
      
      pWrapper.appendChild(i);
      pWrapper.appendChild(toggleBtn);
      wrap.appendChild(pWrapper);
    } else {
      const i = inp(f.ph, f.type);
      i.oninput = e => vals[f.k] = e.target.value;
      wrap.appendChild(i);
    }
    return wrap;
  });

  return h('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'20px',background:'radial-gradient(ellipse at 70% 80%,#3b0d6e,#0f0a1a)'}},[
    h('div',{style:{width:'100%',maxWidth:'400px'}},[
      h('div',{style:{textAlign:'center',marginBottom:'28px'}},[h('span',{style:{fontSize:'34px'}},'🪶'),h('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.9rem',color:'#e9d5ff',marginTop:'6px'}},title),h('p',{style:{color:'#a78bfa',fontStyle:'italic'}},sub)]),
      h('div',{class:'card',style:{display:'flex',flexDirection:'column',gap:'14px'}},[
        ...fieldEls,errEl,
        h('button',{class:'pb btn',style:{width:'100%'},onclick:()=>{const e=onSubmit(vals);if(e){errEl.textContent=e;errEl.style.display='block';}}},btnLabel),
        h('p',{style:{textAlign:'center',color:'#a78bfa',fontSize:'.9rem'}},[altText+' ',h('span',{style:{color:'#c084fc',cursor:'pointer',textDecoration:'underline'},onclick:altAction},(altText.includes('yok')?'Kayıt ol':'Giriş yap'))])
      ])
    ])
  ]);
}

    card.appendChild(fb);
  }

  // Admin paneli
  let adminPanel = null;
  if(S.me?.username===ADMIN_USERNAME){
    adminPanel=h('div',{class:'card',style:{marginTop:'16px',border:'1px solid #5b21b6',background:'linear-gradient(135deg,#1e0a3e,#160d28)'}});
    adminPanel.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#c084fc',marginBottom:'12px',fontSize:'1rem'}},'⚙️ Admin Paneli'));

    // Groq Kota Bölümü
    const kotaDiv=h('div',{style:{background:'#0f0a1a',border:'1px solid #2d1b52',borderRadius:'10px',padding:'12px',marginBottom:'14px'}});
    kotaDiv.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.8rem',fontWeight:'bold',marginBottom:'8px'}},'🤖 Groq API Kota Durumu'));

    const kotaIcerik=h('div');
    function kotaGoster(){
      kotaIcerik.innerHTML='';
      const satir=(label,val,renk)=>{
        const d=h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'4px',gap:'10px'}});
        d.appendChild(h('span',{style:{color:'#6b5b8a',fontSize:'.75rem'}},label));
        d.appendChild(h('span',{style:{color:renk||'#e2e8f0',fontSize:'.75rem',fontWeight:'bold',textAlign:'right'}},String(val)));
        return d;
      };

      // Kota doldu uyarısı (Groq 429 döndüyse) — bilgiler Groq'un hata mesajından (body) alınır,
      // çünkü tarayıcı x-ratelimit-* header'larını CORS nedeniyle genelde engeller.
      if(groqKota.kotaDolduMu){
        const kalanSn = groqKota.kotaAcilmaZamani!==null ? Math.max(0,(groqKota.kotaAcilmaZamani-Date.now())/1000) : null;
        const uyari=h('div',{style:{background:'#3b0d0d',border:'1px solid #7f1d1d',borderRadius:'8px',padding:'8px',marginBottom:'10px'}});
        uyari.appendChild(h('p',{style:{color:'#f87171',fontSize:'.78rem',fontWeight:'bold',marginBottom:'4px'}},'⛔ Groq kotası doldu — şu an yorumlar yerel algoritmayla yapılıyor'));
        if(groqKota.kotaTuru)
          uyari.appendChild(h('p',{style:{color:'#fca5a5',fontSize:'.72rem',marginBottom:'2px'}},`Dolan kota: ${groqKota.kotaTuru}`));
        if(groqKota.kotaLimit!==null && groqKota.kotaKullanilan!==null)
          uyari.appendChild(h('p',{style:{color:'#fca5a5',fontSize:'.72rem',marginBottom:'2px'}},`Kullanım: ${groqKota.kotaKullanilan.toLocaleString('tr-TR')} / ${groqKota.kotaLimit.toLocaleString('tr-TR')}`));
        if(kalanSn!==null){
          uyari.appendChild(h('p',{style:{color:'#fbbf24',fontSize:'.75rem',fontWeight:'bold',marginTop:'4px'}},`⏰ Yenilenme: ${groqSaatFormatla(kalanSn)} (~${groqSureFormatla(kalanSn)} sonra)`));
        }
        kotaIcerik.appendChild(uyari);
      }

      if(groqKota.sonGuncelleme===null){
        kotaIcerik.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',fontStyle:'italic'}},'Henüz API isteği yapılmadı.'));
      } else {
        const kalanRenk=groqKota.kalanIstek!==null?(groqKota.kalanIstek<=5?'#f87171':groqKota.kalanIstek<=15?'#fbbf24':'#34d399'):'#e2e8f0';
        if(groqKota.kalanIstek!==null)
          kotaIcerik.appendChild(satir('Kalan istek hakkı:',groqKota.kalanIstek+' / '+(groqKota.limitIstek??'?'),kalanRenk));
        if(groqKota.istekSifirlanmaSn!==null)
          kotaIcerik.appendChild(satir('İstek kotası yenilenme:',groqSaatFormatla(groqKota.istekSifirlanmaSn)+' ('+groqSureFormatla(groqKota.istekSifirlanmaSn)+' sonra)'));
        if(groqKota.kalanToken!==null)
          kotaIcerik.appendChild(satir('Kalan token (dk.):',groqKota.kalanToken+' / '+(groqKota.limitToken??'?')));
        if(groqKota.tokenSifirlanmaSn!==null)
          kotaIcerik.appendChild(satir('Token kotası yenilenme:',groqSaatFormatla(groqKota.tokenSifirlanmaSn)+' ('+groqSureFormatla(groqKota.tokenSifirlanmaSn)+' sonra)'));
        kotaIcerik.appendChild(satir('Son yorumun kaynağı:',
          groqKota.sonKaynak==='groq'?'🤖 Groq AI':groqKota.sonKaynak==='yerel'?'💻 Yerel algoritma':'—',
          groqKota.sonKaynak==='groq'?'#34d399':groqKota.sonKaynak==='yerel'?'#fbbf24':'#e2e8f0'));
        if(groqKota.sonHata)
          kotaIcerik.appendChild(satir('Son hata:',groqKota.sonHata,'#fbbf24'));
        kotaIcerik.appendChild(satir('Bu oturumda yapılan istek:',groqKota.toplamIstek+' istek'));
        kotaIcerik.appendChild(satir('Son güncelleme:',groqKota.sonGuncelleme,'#6b5b8a'));
      }

      // Günlük yerel sayaç — Groq günlük limiti header'da her zaman gelmeyebildiği için
      // bu tarayıcıda bugün yapılan şiir yorumlarını ayrıca sayıyoruz.
      const gunluk = groqGunlukDurum();
      const gunlukDiv=h('div',{style:{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid #2d1b52'}});
      gunlukDiv.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.72rem',fontWeight:'bold',marginBottom:'4px'}},`📅 Bugün (${gunluk.tarih}) bu tarayıcıda:`));
      gunlukDiv.appendChild(satir('Groq AI ile yorumlanan:',gunluk.basarili+' şiir','#34d399'));
      gunlukDiv.appendChild(satir('Yerel algoritmaya düşen:',gunluk.yerel+' şiir', gunluk.yerel>0?'#fbbf24':'#6b5b8a'));
      kotaIcerik.appendChild(gunlukDiv);
      kotaIcerik.appendChild(h('p',{style:{color:'#4b3d6b',fontSize:'.65rem',fontStyle:'italic',marginTop:'6px'}},'Not: "Kalan istek hakkı" Groq\'un o anki yanıtına göredir; dakikalık veya günlük limiti yansıtabilir.'));
    }
    kotaGoster();
    // Kota doldu ise geri sayımı canlı tutmak için her 5 saniyede bir otomatik güncelle
    const kotaIntervalId = setInterval(()=>{
      if(document.body.contains(kotaIcerik)) kotaGoster();
      else clearInterval(kotaIntervalId);
    }, 5000);

    const yenileBtn=h('button',{style:{marginTop:'8px',fontSize:'.7rem',padding:'4px 10px',background:'transparent',color:'#7c3aed',border:'1px solid #3d1f6e',borderRadius:'8px',cursor:'pointer'},
      onclick:()=>{kotaGoster();}
    },'🔄 Yenile');

    kotaDiv.appendChild(kotaIcerik);
    kotaDiv.appendChild(yenileBtn);
    adminPanel.appendChild(kotaDiv);
    const durumEl=h('p',{style:{color:'#6b5b8a',fontSize:'.85rem',marginTop:'10px',fontStyle:'italic'}},'');
    const revalBtn=h('button',{class:'pb btn',style:{width:'100%',background:'linear-gradient(135deg,#5b21b6,#7c3aed)',fontSize:'.9rem'},
      onclick:async()=>{
        revalBtn.disabled=true;
        revalBtn.textContent='⏳ Değerlendiriliyor...';
        durumEl.textContent='';
        let sayac=0;
        const tumPostlar=[...S.posts];
        for(const post of tumPostlar){
          if(!post.text||post.text.trim().length<10){sayac++;continue;}
          // Her şiir arasında 2.5 sn bekle — Groq rate limit (30 istek/dk) için
          if(sayac>0) await new Promise(res=>setTimeout(res,2500));
          durumEl.textContent=`⏳ ${sayac+1}/${tumPostlar.length} değerlendiriliyor...`;
          const r=await scorePoem(post.text);
          await new Promise(res=>setTimeout(res,800));
          const b1=await botDuyuPuan(post.text);
          await new Promise(res=>setTimeout(res,800));
          const b2=await botKatliPuan(post.text);
          await new Promise(res=>setTimeout(res,800));
          const b3=await botAriPuan(post.text);
          const yeniRatings={...(post.userRatings||{})};
          if(b1)yeniRatings[b1.kullanici]=b1.puan;
          if(b2)yeniRatings[b2.kullanici]=b2.puan;
          if(b3)yeniRatings[b3.kullanici]=b3.puan;
          if(r)yeniRatings['bot_ai_yorum']=r.score;
          const yeniBotYorumlar={...(post.botYorumlar||{})};
          if(b1)yeniBotYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};
          if(b2)yeniBotYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};
          if(b3)yeniBotYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};
          const idx=S.posts.findIndex(p=>p.id===post.id);
          if(idx>-1){
            S.posts[idx].userRatings=yeniRatings;
            S.posts[idx].botYorumlar=yeniBotYorumlar;
            if(r){S.posts[idx].aiScore=r.score;S.posts[idx].aiYorum=r.yorum;S.posts[idx].aiGuclu=r.gucluYonler;S.posts[idx].aiOneri=r.gelistirmeOnerisi;}
          }
          try{await db.collection("posts").doc(post.id).update({userRatings:yeniRatings,botYorumlar:yeniBotYorumlar,aiScore:r?r.score:post.aiScore,aiYorum:r?r.yorum:post.aiYorum,aiGuclu:r?r.gucluYonler:post.aiGuclu,aiOneri:r?r.gelistirmeOnerisi:post.aiOneri});}catch(e){console.error(e);}
          sayac++;
          durumEl.textContent=`${sayac}/${tumPostlar.length} şiir güncellendi...`;
        }
        save();
        revalBtn.disabled=false;
        revalBtn.textContent='🔄 Tüm Şiirleri Yeniden Değerlendir';
        durumEl.textContent=`✅ ${sayac} şiir başarıyla güncellendi!`;
        durumEl.style.color='#34d399';
        render();
      }
    },'🔄 Tüm Şiirleri Yeniden Değerlendir');
    adminPanel.appendChild(revalBtn);
    adminPanel.appendChild(durumEl);
  }

  page.appendChild(card);
  if(adminPanel) page.appendChild(adminPanel);
  page.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#a78bfa',marginBottom:'12px',fontSize:'1.1rem'}},'Şiirler'));
  if(!ups.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Henüz şiir paylaşılmadı.'));
  } else {
    ups.forEach(p=>{
      const a=calcAvg(p.userRatings,p.aiScore);
      const pc=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'center',cursor:'pointer'},onclick:()=>go('postdetail',{postId:p.id})});
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:'#e9d5ff',fontStyle:'italic'}},`"${p.title||p.text?.slice(0,30)+(p.text?.length>30?'…':'')||'İsimsiz'}"`));
      info.appendChild(h('p',{style:{fontSize:'.78rem',color:'#6b5b8a',marginTop:'4px'}},`${p.date} · ${(p.comments||[]).length} yorum`));
      pc.appendChild(info);
      if(a!==null)pc.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(a)}44`}},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',fontWeight:'700',color:scoreColor(a)}},a.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
      page.appendChild(pc);
    });
  }
  wrap.appendChild(page);return wrap;
}

function PostDetail(){
  const post=S.posts.find(p=>p.id===S.postId);
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'16px'},onclick:()=>go('feed')},'← Akışa Dön'));
  if(post)page.appendChild(postCard(post,true));
  else page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Şiir bulunamadı.'));
  wrap.appendChild(page);return wrap;
}

function Messages(){
  let chat=null;
  let activeTab='msgs'; // msgs | notifs
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});

  // Sekmeler
  const unreadCount=(S.notifs||[]).filter(n=>!n.read).length;
  const msgsBtn=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'linear-gradient(135deg,#7c3aed,#a855f7)',color:'#fff',border:'none'}},'✉️ Mesajlar');
  const notifBtn=h('button',{class:'btn',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'#1a0f2e',color:'#a78bfa',border:'1px solid #2d1b52',position:'relative'}});
  notifBtn.appendChild(document.createTextNode('🔔 Bildirimler'));
  if(unreadCount>0){const badge=h('span',{style:{position:'absolute',top:'-4px',right:'-4px',background:'#e879f9',color:'#fff',borderRadius:'50%',width:'18px',height:'18px',fontSize:'.6rem',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unreadCount>9?'9+':unreadCount));notifBtn.appendChild(badge);}
  const tabRow=h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}},[msgsBtn,notifBtn]);
  page.appendChild(tabRow);

  const ct=h('div');page.appendChild(ct);wrap.appendChild(page);

  function showMsgs(){
    ct.innerHTML='';
    // Sadece mesajlaşılan kişileri göster
    const contactedIds=new Set();
    S.msgs.forEach(m=>{
      if(m.fromId===S.me?.id)contactedIds.add(m.toId);
      if(m.toId===S.me?.id)contactedIds.add(m.fromId);
    });
    const contacts=S.users.filter(u=>contactedIds.has(u.id)&&u.id!==S.me?.id);

    // Mesaj yazılabilecek tüm kullanıcılar için "Yeni Mesaj" butonu
    const newMsgBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'12px',background:'linear-gradient(135deg,#1e0a3e,#2d1060)',border:'1px dashed #5b21b6',borderRadius:'12px',padding:'12px',color:'#a78bfa',fontSize:'.9rem',fontFamily:"'Crimson Text',serif",display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'},onclick:()=>showUserList()});
    newMsgBtn.appendChild(document.createTextNode('✏️ Yeni Mesaj'));
    ct.appendChild(newMsgBtn);

    if(!contacts.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'20px'}},'Henüz mesajlaşma yok. Yukarıdaki butona basarak yeni mesaj gönderebilirsin.'));
      return;
    }
    contacts.forEach(u=>{
      const last=[...S.msgs].reverse().find(m=>(m.fromId===S.me?.id&&m.toId===u.id)||(m.fromId===u.id&&m.toId===S.me?.id));
      const unread=S.msgs.filter(m=>m.fromId===u.id&&m.toId===S.me?.id&&!m.read).length;
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,44));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      if(last)info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.83rem'}},last.text.slice(0,40)+(last.text.length>40?'…':'')));
      card.appendChild(info);
      if(unread>0)card.appendChild(h('span',{style:{background:'#c084fc',color:'#fff',borderRadius:'50%',width:'20px',height:'20px',fontSize:'.7rem',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unread)));
      ct.appendChild(card);
    });
  }

  function showUserList(){
    ct.innerHTML='';
    ct.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'12px',fontSize:'.9rem'},onclick:()=>showMsgs()},'← Geri'));
    ct.appendChild(h('p',{style:{color:'#a78bfa',fontFamily:"'Crimson Text',serif",fontSize:'.9rem',marginBottom:'12px',fontStyle:'italic'}},'Mesaj göndermek istediğin kişiyi seç:'));
    const others=S.users.filter(u=>u.id!==S.me?.id&&u.username!==ADMIN_USERNAME);
    others.forEach(u=>{
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,40));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},`@${u.username}`));
      card.appendChild(info);
      ct.appendChild(card);
    });
  }

  function showNotifs(){
    ct.innerHTML='';
    const unread=(S.notifs||[]).filter(n=>!n.read);
    if(unread.length>0){
      unread.forEach(n=>{n.read=true;db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});});
      lsSet('yo_notifs',S.notifs);
    }
    const notifs=S.notifs||[];
    if(!notifs.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
      return;
    }
    notifs.forEach(n=>{
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      card.appendChild(h('span',{style:{fontSize:'1.4rem',flexShrink:'0'}},n.text.includes('yorum')?'💬':'⭐'));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px',display:'inline-block'}}));
      ct.appendChild(card);
    });
  }

  function showChat(){
    ct.innerHTML='';
    const chatUser=S.users.find(u=>u.id===chat);
    const hdr=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
    hdr.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',fontSize:'.9rem'},onclick:()=>{chat=null;showMsgs();}},'←'));
    hdr.appendChild(av(chatUser,36));
    hdr.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},chatUser?.name||''));
    ct.appendChild(hdr);
    const msgs=h('div',{style:{height:'55vh',overflowY:'auto',display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'8px'}});
    S.msgs.filter(m=>(m.fromId===S.me?.id&&m.toId===chat)||(m.fromId===chat&&m.toId===S.me?.id)).forEach(m=>{
      const mine=m.fromId===S.me?.id;
      msgs.appendChild(h('div',{style:{display:'flex',justifyContent:mine?'flex-end':'flex-start'}},[h('div',{style:{maxWidth:'70%',background:mine?'linear-gradient(135deg,#7c3aed,#a855f7)':'#1a0f2e',borderRadius:mine?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'10px 14px',border:mine?'none':'1px solid #2d1b52'}},[h('p',{style:{color:'#f0e8ff',fontSize:'.95rem'}},m.text),h('p',{style:{color:mine?'#ddd6fe':'#6b5b8a',fontSize:'.7rem',marginTop:'4px',textAlign:mine?'right':'left'}},m.date)])]));
    });
    msgs.scrollTop=msgs.scrollHeight;
    const mi=inp('Mesajını yaz...');mi.style.borderRadius='20px';mi.style.flex='1';
    const sendMsg=()=>{if(!mi.value.trim())return;A.sendMsg(chat,mi.value.trim());mi.value='';showChat();};
    mi.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
    ct.appendChild(msgs);
    ct.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},[mi,h('button',{class:'pb btn',style:{padding:'10px 18px'},onclick:sendMsg},'↩')]));
  }

  msgsBtn.onclick=()=>{activeTab='msgs';msgsBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';msgsBtn.style.color='#fff';msgsBtn.style.border='none';notifBtn.style.background='#1a0f2e';notifBtn.style.color='#a78bfa';notifBtn.style.border='1px solid #2d1b52';showMsgs();};
  notifBtn.onclick=()=>{activeTab='notifs';notifBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';notifBtn.style.color='#fff';notifBtn.style.border='none';msgsBtn.style.background='#1a0f2e';msgsBtn.style.color='#a78bfa';msgsBtn.style.border='1px solid #2d1b52';showNotifs();};

  showMsgs();
  return wrap;
}

function Notifs(){
  // Bildirimleri okundu olarak işaretle
  const unread=(S.notifs||[]).filter(n=>!n.read);
  if(unread.length>0){
    unread.forEach(n=>{
      n.read=true;
      db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});
    });
    lsSet('yo_notifs',S.notifs);
  }
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',marginBottom:'16px',fontSize:'1.4rem'}},'🔔 Bildirimler'));
  const notifs=S.notifs||[];
  if(!notifs.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
  } else {
    notifs.forEach(n=>{
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      card.appendChild(h('span',{style:{fontSize:'1.5rem',flexShrink:'0'}},n.text.includes('yorum')? '💬':'⭐'));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px'}}));
      page.appendChild(card);
    });
  }
  wrap.appendChild(page);return wrap;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  
  if (S.loading) {
    app.appendChild(h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#0f0a1a'}},[
      h('div',{style:{fontSize:'32px'}},'🪶'),
      h('p',{style:{color:'#a78bfa',marginTop:'12px',fontStyle:'italic',fontSize:'1rem'}},'Ozanlar Meclisi Yükleniyor...')
    ]));
    return;
  }

  if(!S.me){
    const screens={
      landing:Landing,
      login:()=>authPage('Hoş geldin','Hesabınla giriş yap',[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'}],'Giriş Yap',v=>A.login(v.u||'',v.p||''),'Hesabın yok mu?',()=>go('register')),
      register:()=>authPage('Katıl',"Yeni Ozanlar'a üye ol",[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'},{label:'Şifre tekrar',type:'password',ph:'••••••••',k:'p2'}],'Hesap Oluştur',v=>{if(!v.u||!v.p)return'Tüm alanları doldurun.';if(v.p!==v.p2)return'Şifreler eşleşmiyor.';if((v.p||'').length<6)return'Şifre en az 6 karakter.';return A.register(v.u.trim(),v.p);},'Zaten üye misin?',()=>go('login'))
    };
    const Screen=screens[S.screen]||Landing;
    app.appendChild(Screen());
    return;
  }
  const screens={feed:Feed,leaderboard:Leaderboard,explore:Explore,profile:Profile,postdetail:PostDetail,messages:Messages,notifs:Notifs};
  const Screen=screens[S.screen]||Feed;
  app.appendChild(Screen());
}

verileriYukle();
</script>
</body>
</html>
