<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Ozanlar 🪶</title>
  <style>
    body { background: #0f0a1a; color: #f0e8ff; font-family: sans-serif; margin: 0; padding: 0; }
    /* Kartların genişliği artırıldı ve YouTube boyutu kadar alan açıldı */
    .card { background: #1a0f2e; border: 1px solid #2d1b52; border-radius: 16px; padding: 24px; margin: 20px auto; width: 90%; max-width: 600px; min-height: 350px; }
    .btn { background: #7c3aed; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; }
    .page { padding-bottom: 100px; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
// S'yi global tanımlıyoruz
let S = { posts: [], me: null, pageLimit: 3 };

// Sadece sayfada gösterilecek şiirleri yöneten fonksiyon
function renderFeed() {
  const app = document.getElementById('app');
  app.innerHTML = '<div class="page" id="main"></div>';
  const main = document.getElementById('main');

  // Sayfada S.pageLimit kadar göster
  const gorunur = S.posts.slice(0, S.pageLimit);
  
  gorunur.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${p.title || 'Şiir'}</h3><p>${p.text}</p>`;
    main.appendChild(div);
  });

  // Daha fazla göster butonu
  if (S.posts.length > S.pageLimit) {
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.innerText = 'Daha Fazla Şiir Göster';
    btn.onclick = () => {
      S.pageLimit += 3;
      renderFeed();
    };
    main.appendChild(btn);
  }
}

// Firebase'den veri çekme (Basitleştirilmiş)
async function verileriYukle() {
  // Buradaki kodlarınızın aynısı kalmalı, sadece renderFeed'i çağırın
  // Örnek:
  // S.posts = await db...
  renderFeed();
}

verileriYukle();
</script>
</body>
</html>
