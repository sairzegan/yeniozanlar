<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Ozanlar 🪶</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0a1a;color:#f0e8ff;font-family:'Crimson Text',Georgia,serif;min-height:100vh}

    .nav-top{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(15,10,26,.96);backdrop-filter:blur(12px);border-bottom:1px solid #2d1b52;display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
    .page{padding:80px 16px 80px;max-width:560px;margin:0 auto}

    .modal{width:100%;max-width:560px;background:linear-gradient(160deg,#1e0f3a,#160d28);border-radius:22px 22px 0 0;border:1px solid #5b21b6;border-bottom:none;padding:22px 20px 44px}
    .pb{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:10px 24px;border-radius:50px;font-size:1rem;font-family:'Crimson Text',serif;font-weight:600;border:none;cursor:pointer}
    .inp{width:100%;background:#0f0a1a;border:1px solid #3d1f6e;border-radius:10px;padding:10px 14px;color:#e9d5ff;font-family:'Crimson Text',serif;font-size:1rem}
    .score-box{text-align:center;background:#0f0a1a;border-radius:10px;padding:6px 10px;min-width:50px}
    iframe{display:block;width:100%;aspect-ratio:16/9;border:none;border-radius:12px}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// Firebase Ayarları
const firebaseConfig = {
  apiKey: "AIzaSyC6sshBjUU7xZf_KgjwW2yWuvE1ZG9oZWY",
  authDomain: "yeniozanlar-68b49.firebaseapp.com",
  projectId: "yeniozanlar-68b49",
  storageBucket: "yeniozanlar-68b49.firebasestorage.app",
  messagingSenderId: "99003509618",
  appId: "1:99003509618:web:e4f36d85378f2e554fcbeb"
};

// Veritabanını başlat
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

// İnternetteki Firebase veritabanından verileri çeken fonksiyon
async function verileriYukle() {
  try {
    const usersSnapshot = await db.collection("users").get();
    S.users = usersSnapshot.docs.map(doc => doc.data());

    const postsSnapshot = await db.collection("posts").get();
    const tumPostlar = postsSnapshot.docs.map(doc => doc.data());
    S.posts = tumPostlar.sort((a, b) => b.date.localeCompare(a.date));

    render();
  } catch (error) {
    console.error("Veriler yüklenirken hata oluştu:", error);
  }
}

const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>new Date().toLocaleString('tr-TR');
const ytId=url=>{const m=url?.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const calcAvg=(r,ai)=>{const v=Object.values(r||{});const u=v.length?v.reduce((a,b)=>a+b,0)/v.length:null;if(u===null&&(ai===null||ai===undefined))return null;if(u===null)return+parseFloat(ai).toFixed(2);if(ai===null||ai===undefined)return+u.toFixed(2);return+(u*.6+ai*.4).toFixed(2)};
const scoreColor=s=>{if(!s)return'#6b5b8a';if(s>=8.5)return'#fbbf24';if(s>=7)return'#34d399';if(s>=5)return'#c084fc';return'#f87171'};
const scoreBadge=s=>{if(!s)return'';if(s>=9)return'🏆 Başyapıt';if(s>=8)return'⭐ Muhteşem';if(s>=7)return'✨ Güzel';if(s>=5)return'👍 İyi';return'📝 Gelişiyor'};

function scorePoem(text){
  const lines=text.split('\n').filter(s=>s.trim().length>0);
  const words=text.trim().split(/\s+/);
  const unique=new Set(words.map(k=>k.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''))).size;
  const len=words.length,lc=lines.length;
  const img=['gibi','sanki','kadar','değil','andır','tıpkı','adeta','her','hiç'].filter(w=>text.toLowerCase().includes(w)).length;
  const punct=(text.match(/[,;:!?—–.]/g)||[]).length;
  let p=5.0;
  if(len>=8&&len<=50)p+=1.2;else if(len>50&&len<=120)p+=0.8;else if(len<8)p-=1.0;
  if(lc>=3&&lc<=16)p+=0.8;
  const z=unique/words.length;
  if(z>0.75)p+=1.5;else if(z>0.6)p+=0.9;else if(z>0.45)p+=0.4;
  if(img>=3)p+=0.8;else if(img>=1)p+=0.4;
  if(punct>=2&&punct<=10)p+=0.5;
  const r=(text.length%19)/19*0.8-0.4;
  p=Math.min(9.8,Math.max(4.0,p+r));p=Math.round(p*10)/10;
  const guclu=['Kelime seçimleri özgün ve çarpıcı.','Dizenin ritmi akıcı ve doğal.','İmgeler güçlü ve yaratıcı.','Duygusal derinlik hissediliyor.','Özgün bir ses ve bakış açısı var.','Anlam katmanları zengin.'];
  const oneri=['Bazı dizeler daha yoğun olabilir.','Şiirin sonu güçlendirilebilir.','Daha fazla imge derinlik katabilir.','Ritim tutarlılığı geliştirilebilir.','İlk dize daha çarpıcı olabilir.'];
  const yorum=[`${lc} dizelik bu şiir ${p>=7.5?'güçlü bir lirik ses taşıyor':'gelişmeye açık'}. Kelime zenginliği ${z>0.7?'yüksek':'orta düzeyde'}.`,`${img>2?'Zengin imgelem dikkat çekiyor':'Sade bir dil tercih edilmiş'}. ${p>=8?'Okuyucuda derin etki bırakıyor.':'Birkaç düzenlemeyle güçlenebilir.'}`,`${len<15?'Kısa ve öz':'Kapsamlı'} bir şiir. ${p>=7?'Bütünlük sağlanmış.':'Yapı geliştirilebilir.'}`];
  const i=text.length%guclu.length,oi=(text.length+lc)%oneri.length,yi=text.length%yorum.length;
  return{score:p,yorum:yorum[yi],gucluYonler:guclu[i],gelistirmeOnerisi:oneri[oi]};
}

// STATE
let S={
  users:lsGet('yo_users',[]),
  posts:lsGet('yo_posts',[]),
  me:lsGet('yo_me',null),
  screen:'landing',
  profileId:null,
  postId:null,
  follows:lsGet('yo_follows',{}),
  msgs:lsGet('yo_msgs',[]),
};

function go(screen,extra={}){Object.assign(S,{screen,...extra});render()}
function save(){lsSet('yo_users',S.users);lsSet('yo_posts',S.posts);lsSet('yo_me',S.me);lsSet('yo_follows',S.follows);lsSet('yo_msgs',S.msgs)}

const A={
  register(u, p){
    if(S.users.find(x=>x.username===u))return 'Bu kullanıcı adı alınmış.';
    const user={id:uid(),name:u,username:u,password:p,bio:'',avatar:u.slice(0,2).toUpperCase(),color:`hsl(${Math.random()*360},70%,65%)`};
    
    S.me=user;
    lsSet('yo_me', user);
    
    db.collection("users").doc(user.id).set(user)
      .then(() => { verileriYukle(); })
      .catch(err => console.error("Kayıt hatası:", err));
      
    go('feed');
    return null;
  },
  login(u,p){
    const user=S.users.find(x=>x.username===u&&x.password===p);
    if(!user)return'Kullanıcı adı veya şifre hatalı.';
    S.me=user;save();go('feed');return null;
  },
  logout(){S.me=null;lsSet('yo_me',null);go('landing')},
  addPost(pd){
    const r=pd.text&&pd.text.trim().length>10?scorePoem(pd.text):null;
    const np={...pd,id:uid(),authorId:S.me.id,userRatings:{},aiScore:r?r.score:null,aiYorum:r?r.yorum:null,aiGuclu:r?r.gucluYonler:null,aiOneri:r?r.gelistirmeOnerisi:null,comments:[],date:now()};
    
    db.collection("posts").doc(np.id).set(np)
      .then(() => { verileriYukle(); })
      .catch(err => console.error("Şiir kaydetme hatası:", err));
  },
  ratePost(pid,score){S.posts=S.posts.map(p=>p.id!==pid?p:{...p,userRatings:{...p.userRatings,[S.me.id]:score}});save();render()},
  addComment(pid,text){S.posts=S.posts.map(p=>p.id!==pid?p:{...p,comments:[...p.comments,{id:uid(),authorId:S.me.id,text,date:now()}]});save();render()},
  toggleFollow(tid){const l=S.follows[S.me.id]||[];const has=l.includes(tid);S.follows={...S.follows,[S.me.id]:has?l.filter(x=>x!==tid):[...l,tid]};save();render()},
  sendMsg(toId,text){S.msgs=[...S.msgs,{id:uid(),fromId:S.me.id,toId,text,date:now()}];save();render()},
};

const byId=id=>S.users.find(u=>u.id===id);
const isF=tid=>(S.follows[S.me?.id]||[]).includes(tid);

// DOM helpers
function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  return e;
}

function av(user,size=40,onClick){
  if(!user)return h('span');
  const d=h('div',{class:'av',style:{width:size+'px',height:size+'px',fontSize:(size*.36)+'px',background:`linear-gradient(135deg,${user.color||'#7c3aed'},#a855f7)`,color:'#fff',cursor:onClick?'pointer':'default'}});
  d.textContent=user.avatar||user.name?.slice(0,2).toUpperCase()||'?';
  if(onClick)d.onclick=onClick;
  return d;
}

function inp(placeholder,type='text',style={}){
  return h('input',{placeholder,type,class:'inp',style});
}

function navBar(){
  const tabs=[{k:'feed',ic:'🏠',lb:'Akış'},{k:'leaderboard',ic:'🏆',lb:'Sıralama'},{k:'explore',ic:'🔍',lb:'Keşfet'},{k:'messages',ic:'✉️',lb:'Mesaj'},{k:'profile',ic:'👤',lb:'Profil'}];
  return h('div',{},[
    h('div',{class:'nav-top'},[
      h('span',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.15rem',color:'#c084fc',cursor:'pointer'},onclick:()=>go('feed')},'🪶 Yeni Ozanlar'),
      h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},[
        av(S.me,30,()=>go('profile')),
        h('button',{class:'btn',style:{background:'transparent',color:'#a78bfa',fontSize:'.75rem',padding:'4px 10px',border:'1px solid #3d1f6e',borderRadius:'20px'},onclick:()=>A.logout()},'Çıkış')
      ])
    ]),
    h('div',{class:'nav-bottom'},tabs.map(t=>
      h('button',{class:'btn',style:{background:'none',color:S.screen===t.k?'#c084fc':'#6b5b8a',display:'flex',flexDirection:'column',alignItems:'center',gap:'2px',fontSize:'.62rem',padding:'4px 6px',borderBottom:S.screen===t.k?'2px solid #c084fc':'2px solid transparent'},onclick:()=>go(t.k)},[
        h('span',{style:{fontSize:'1.2rem'}},t.ic),t.lb
      ])
    ))
  ]);
}

function postCard(post){
  const author=byId(post.authorId);
  const vid=ytId(post.youtube);
  const avg=calcAvg(post.userRatings,post.aiScore);
  const ucnt=Object.keys(post.userRatings||{}).length;
  const myR=post.userRatings?.[S.me?.id]??null;
  const isOwn=post.authorId===S.me?.id;

  const card=h('div',{class:'card fade'});

  const hdr=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'14px'}},[
    av(author,42,()=>go('profile',{profileId:author?.id})),
    h('div',{style:{flex:'1'}},[
      h('p',{style:{fontFamily:"'Playfair Display',serif",fontWeight:'700',color:'#e9d5ff',cursor:'pointer'},onclick:()=>go('profile',{profileId:author?.id})},author?.name||''),
      h('p',{style:{color:'#6b5b8a',fontSize:'.78rem'}},`@${author?.username||''} · ${post.date}`)
    ])
  ]);
  if(avg!==null)hdr.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(avg)}44`}},[h('p',{style:{fontSize:'1.15rem',fontWeight:'700',color:scoreColor(avg),fontFamily:"'Playfair Display',serif",lineHeight:'1'}},avg.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
  card.appendChild(hdr);

  if(post.title){const t=h('h3',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.1rem',color:'#e9d5ff',fontStyle:'italic',marginBottom:'10px',paddingBottom:'8px',borderBottom:'1px solid #2d1b52',cursor:'pointer',textDecoration:'underline',textDecorationColor:'#5b21b6'}},`"${post.title}"`);t.onclick=()=>go('postdetail',{postId:post.id});card.appendChild(t);}
  if(post.text)card.appendChild(h('p',{style:{fontFamily:"'Crimson Text',serif",fontSize:'1.05rem',color:'#ddd6fe',lineHeight:'1.9',whiteSpace:'pre-wrap',marginBottom:'14px'}},post.text));
  if(post.image)card.appendChild(h('img',{src:post.image,style:{width:'100%',borderRadius:'12px',marginBottom:'14px',maxHeight:'300px',objectFit:'cover'}}));
  if(vid){const w=h('div',{style:{borderRadius:'12px',overflow:'hidden',marginBottom:'14px'}});w.innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}" allowfullscreen style="width:100%;aspect-ratio:16/9;border:none;border-radius:12px"></iframe>`;card.appendChild(w);}

  if(post.aiScore!==null&&post.aiScore!==undefined){
    const body=h('div',{style:{background:'#0a0718',border:'1px solid #3d1f6e',borderTop:'none',borderRadius:'0 0 10px 10px',padding:'12px 14px',display:'none'}});
    if(post.aiYorum)body.appendChild(h('p',{style:{fontFamily:"'Crimson Text',serif",fontSize:'.92rem',color:'#c4b5fd',fontStyle:'italic',lineHeight:'1.7',marginBottom:'10px'}},`"${post.aiYorum}"`));
    const tags=h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}});
    if(post.aiGuclu)tags.appendChild(h('span',{style:{background:'#052e16',border:'1px solid #166534',borderRadius:'20px',padding:'3px 10px',fontSize:'.76rem',color:'#34d399'}},`💪 ${post.aiGuclu}`));
    if(post.aiOneri)tags.appendChild(h('span',{style:{background:'#1e1b4b',border:'1px solid #4338ca',borderRadius:'20px',padding:'3px 10px',fontSize:'.76rem',color:'#a5b4fc'}},`💡 ${post.aiOneri}`));
    body.appendChild(tags);
    let open=false;
    const arr=h('span',{},'▼');
    const btn=h('button',{class:'btn',style:{background:'linear-gradient(135deg,#1e0a3e,#2d1060)',border:'1px solid #5b21b6',borderRadius:'10px',padding:'8px 14px',color:'#c084fc',fontSize:'.85rem',display:'flex',alignItems:'center',gap:'8px',width:'100%',marginBottom:'0'},onclick:()=>{open=!open;body.style.display=open?'block':'none';arr.textContent=open?'▲':'▼'}},[h('span',{},'🤖'),h('span',{style:{flex:'1',textAlign:'left'}},'Yapay Zeka Değerlendirmesi'),h('span',{style:{color:scoreColor(post.aiScore),fontWeight:'700'}},`${post.aiScore}/10`),arr]);
    card.appendChild(h('div',{style:{marginBottom:'12px'}},[btn,body]));
  }

  if(!isOwn){
    const rw=h('div',{style:{background:'#0f0a1a',border:myR?'1px solid #5b21b6':'1px dashed #3d1f6e',borderRadius:'12px',padding:'12px 14px',marginBottom:'12px'}});
    rw.appendChild(h('p',{style:{fontSize:'.85rem',color:myR?'#c084fc':'#a78bfa',marginBottom:'8px',fontStyle:myR?'normal':'italic'}},myR?`✅ Puanınız: ${myR}/10 — teşekkürler!`:'⭐ Bu şiire puan ver! (1-10)'));
    const stars=h('div',{style:{display:'flex',gap:'3px',flexWrap:'wrap'}});
    for(let n=1;n<=10;n++){
      const s=h('button',{style:{background:'none',border:'none',cursor:'pointer',fontSize:'1.15rem',padding:'2px 3px',transition:'transform .1s',filter:n<=(myR||0)?'none':'grayscale(1) opacity(.3)',transform:n<=(myR||0)?'scale(1.2)':'scale(1)'}},n<=5?'⭐':'🌟');
      s.onmouseenter=()=>{for(let i=1;i<=10;i++){const b=stars.children[i-1];b.style.filter=i<=n?'none':'grayscale(1) opacity(.3)';b.style.transform=i<=n?'scale(1.2)':'scale(1)';}};
      s.onmouseleave=()=>{const cur=post.userRatings?.[S.me?.id]||0;for(let i=1;i<=10;i++){const b=stars.children[i-1];b.style.filter=i<=cur?'none':'grayscale(1) opacity(.3)';b.style.transform=i<=cur?'scale(1.2)':'scale(1)';}};
      s.onclick=()=>A.ratePost(post.id,n);
      stars.appendChild(s);
    }
    rw.appendChild(stars);
    if(ucnt>0)rw.appendChild(h('p',{style:{fontSize:'.74rem',color:'#6b5b8a',marginTop:'6px'}},`${ucnt} kişi puan verdi · Ort: ${(Object.values(post.userRatings).reduce((a,b)=>a+b,0)/ucnt).toFixed(1)}`));
    card.appendChild(rw);
  }
  if(isOwn&&ucnt>0)card.appendChild(h('div',{style:{background:'#0f0a1a',border:'1px solid #2d1b52',borderRadius:'12px',padding:'10px 14px',marginBottom:'12px'}},[h('p',{style:{fontSize:'.85rem',color:'#a78bfa'}},`${ucnt} kişi puan verdi · Ort: ${(Object.values(post.userRatings).reduce((a,b)=>a+b,0)/ucnt).toFixed(1)}/10`)]));
  if(avg!==null)card.appendChild(h('p',{style:{fontSize:'.82rem',color:scoreColor(avg),textAlign:'center',marginBottom:'10px'}},scoreBadge(avg)));

  let showC=false;
  const cbtn=h('button',{class:'btn',style:{background:'none',color:'#6b5b8a',fontSize:'.88rem',display:'flex',gap:'6px',paddingTop:'10px',borderTop:'1px solid #2d1b52',width:'100%'}},`💬 ${post.comments.length} yorum${post.comments.length===0?' — ilk yorumu sen yaz!':''}`);
  const cbody=h('div',{style:{marginTop:'10px',display:'none'}});
  post.comments.forEach(c=>{
    const ca=byId(c.authorId);
    cbody.appendChild(h('div',{style:{display:'flex',gap:'8px',marginBottom:'10px'}},[av(ca,28),h('div',{style:{background:'#0f0a1a',border...:'10px',padding:'8px 12px',flex:'1',border:'1px solid #2d1b52'}},[h('span',{style:{fontFamily:"'Playfair Display',serif",fontSize:'.8rem',color:'#c084fc'}},ca?.name||''),h('p',{style:{fontSize:'.9rem',color:'#ddd6fe',marginTop:'2px'}},c.text)])]));
  });
  if(!post.comments.length)cbody.appendChild(h('p',{style:{fontSize:'.82rem',color:'#6b5b8a',fontStyle:'italic',marginBottom:'8px'}},'Ozan seni bekliyor! 🌙'));
  const ci=inp('Düşünceni paylaş...');ci.style.borderRadius='20px';ci.style.flex='1';
  cbody.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'6px'}},[av(S.me,28),ci,h('button',{class:'pb btn',style:{padding:'6px 14px',fontSize:'.85rem'},onclick:()=>{if(!ci.value.trim())return;A.addComment(post.id,ci.value.trim());ci.value='';}}, '↩')]));
  cbtn.onclick=()=>{showC=!showC;cbody.style.display=showC?'block':'none';};
  card.appendChild(cbtn);card.appendChild(cbody);
  return card;
}

function composeModal(onClose){
  let title='',text='',ytUrl='',image=null,showYt=false;
  const fi=h('input',{type:'file',accept:'image/*',style:{display:'none'}});
  const prev=h('img',{style:{display:'none',width:'100%',borderRadius:'10px',maxHeight:'200px',objectFit:'cover'}});
  fi.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{image=ev.target.result;prev.src=image;prev.style.display='block';};r.readAsDataURL(f);};
  const yti=inp('YouTube linki yapıştır...');yti.style.display='none';yti.oninput=e=>ytUrl=e.target.value;
