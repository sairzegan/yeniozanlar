const db = firebase.firestore();

const adminProfileObj = {
  id: "admin_root",
  name: "Yönetici (Admin)",
  username: ADMIN_USERNAME,

// STATE
let S = {
  users: lsGet('yo_users', []),
  posts: lsGet('yo_posts', []),
  me: lsGet('yo_me', null),
  screen: 'landing',
  profileId: null,
  postId: null,
  follows: lsGet('yo_follows', {}),
  msgs: lsGet('yo_msgs', []),
  notifs: lsGet('yo_notifs', []),
  loading: true 
};

async function verileriYukle() {
  try {
    const usersSnapshot = await db.collection("users").get().catch(() => ({ docs: [] }));
    S.users = usersSnapshot.docs.length ? usersSnapshot.docs.map(doc => doc.data()) : [];

    if (!S.users.find(u => u.username === ADMIN_USERNAME)) {
      S.users.push(adminProfileObj);
    }

    const postsSnapshot = await db.collection("posts").get().catch(() => ({ docs: [] }));
    const tumPostlar = postsSnapshot.docs.length ? postsSnapshot.docs.map(doc => doc.data()) : [];
    const parseDate=d=>{if(!d)return 0;try{const p=d.split(' ');const dmy=p[0].split('.');const hms=p[1]?.split(':');return new Date(dmy[2],dmy[1]-1,dmy[0],hms?.[0]||0,hms?.[1]||0,hms?.[2]||0).getTime();}catch{return 0;}};
    S.posts = tumPostlar.sort((a,b)=>(b.ts||parseDate(b.date))-(a.ts||parseDate(a.date)));

    // Mesajları Firebase'den yükle
    if(S.me) {
      const msgsSnapshot = await db.collection("msgs").get().catch(() => ({ docs: [] }));
      S.msgs = msgsSnapshot.docs.length ? msgsSnapshot.docs.map(doc => doc.data()) : [];
      lsSet('yo_msgs', S.msgs);

      // Bildirimleri Firebase'den yükle
      const notifsSnapshot = await db.collection("notifs").where("toId","==",S.me.id).get().catch(() => ({ docs: [] }));
      S.notifs = notifsSnapshot.docs.length ? notifsSnapshot.docs.map(doc => doc.data()).sort((a,b)=>b.date.localeCompare(a.date)) : [];
      lsSet('yo_notifs', S.notifs);
    }

    if (S.me && S.me.username === ADMIN_USERNAME) {
      S.me = adminProfileObj;
    } else if (S.me && S.users.length) {
      const guncelBen = S.users.find(u => u.id === S.me.id);
      if (guncelBen) S.me = guncelBen;
    }
  } catch (error) {
    console.log("Bağlantı hatası:", error);
  } finally {
    S.loading = false;
    render();
  }
}

const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>new Date().toLocaleString('tr-TR');
const ytId=url=>{const m=url?.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
// Bot kullanıcı ID'leri
const BOT_IDS = ['bot_duyu_yorum','bot_katli_yorum','bot_ari_yorum'];

// Aritmetik ortalama: kullanıcı puanları + bot puanları (AI = 3 bot gibi)
const calcAvg=(r,ai,botPuanlar)=>{
  const tumPuanlar = Object.values(r||{});
  // Bot puanları userRatings içinde zaten var, sadece yoksa AI'dan türet
  if(tumPuanlar.length===0 && (ai===null||ai===undefined)) return null;
  if(tumPuanlar.length===0) return +parseFloat(ai).toFixed(2);
  const ort = tumPuanlar.reduce((a,b)=>a+b,0)/tumPuanlar.length;
  return +ort.toFixed(2);
};
const scoreColor=s=>{if(!s)return'#6b5b8a';if(s>=8.5)return'#fbbf24';if(s>=7)return'#34d399';if(s>=5)return'#c084fc';return'#f87171'};
const scoreBadge=s=>{if(!s)return'';if(s>=9)return'🏆 Başyapıt';if(s>=8)return'⭐ Muhteşem';if(s>=7)return'✨ Güzel';if(s>=5)return'👍 İyi';return'📝 Gelişiyor'};



function scorePoem(text){
  if(!text||text.trim().length<3)return null;

  const satirlar = text.split('\n').filter(s=>s.trim().length>0);
  const tumKelimeler = text.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const benzersiz = new Set(tumKelimeler).size;
  const lc = satirlar.length;
  const len = tumKelimeler.length;
  const tL = text.toLowerCase();
  const hash = text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd = n => hash % n;

  const varMi = w => tumKelimeler.includes(w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const birVarMi = arr => arr.filter(w=>varMi(w));

  // Uzunluk
  const cokKisa = len < 8 || lc < 3;

  // Günlük dil
  const gunlukListe = ['gel','git','bak','al','ver','dur','kalk','otur','yat','tamam','evet','hayir','neyse','yani','aslinda','iste','simdi','hadi','saniyorum','bilmiyorum','noolur','olur','olmaz','ya','aa','off','vay','oof','hey','ee','hmm','peki','madem','belki','galiba','bence','sence','boyle','soyle','oyle','nasil','neden','nicin','niye','seviyorum','seviyordum','sevmiyorum','istiyorum','istemiyorum','yapiyorum','gidiyorum','geliyorum','bakiyorum'];
  const gunlukBulunan = tumKelimeler.filter((w,i,a)=>gunlukListe.includes(w)&&a.indexOf(w)===i);

  // Didaktik
  const didaktikListe = ['çünkü','dolayısıyla','bu nedenle','sonuç olarak','şöyle ki','demek ki','özetle','yani demek','anlayacağın','biliyorsunuz','bilirsiniz','şunu belirteyim','kısaca','özetlersek','sonuçta'];
  const didaktikBulunan = didaktikListe.filter(d=>tL.includes(d));

  // Klişe çiftler — her iki kelime de şiirde var mı?
  const kliseCiftler = [
    ['sac','ruzgar'],['goz','yildiz'],['yanak','gul'],['dudak','mercan'],
    ['ask','ates'],['yurek','yan'],['kalp','kir'],['goz','deniz'],
    ['bulbul','gul'],['mevsim','don'],['yaprak','dok'],['zaman','gec'],
    ['sevgi','isik'],['gece','yalniz'],['ozlem','derin'],['huzun','deniz']
  ];
  const kliseBulunan = kliseCiftler.filter(cift=>cift.every(k=>tumKelimeler.some(w=>w.includes(k))));
  const kliseTekListe = ['yanıyorum','yanarım','yandım','kırık kalp','kırık yürek','hasret kaldım','aşkından yandım','sensiz olmaz','seni bekliyorum'];
  const kliseTekBulunan = kliseTekListe.filter(k=>tL.includes(k));

  // Şiirsel kelimeler
  const siirselListe = ['hüzün','keder','figan','gurbet','özlem','hasret','gönül','yürek','ruh','nur','mehtap','şebnem','seher','canan','yar','efkar','hicran','viran','şevk','neşe','baht','talih','felek','ahu','naz','niyaz','derin','sonsuz','yokluk','sessizlik'];
  const siirselBulunan = birVarMi(siirselListe);

  // Aliterasyon — satır bazlı tam kontrol
  const aliterasyonSatirlar = satirlar.map(s=>{
    const ws = s.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'')[0]).filter(Boolean);
    const hs={};ws.forEach(h=>{hs[h]=(hs[h]||0)+1});
    const guclu=Object.entries(hs).filter(([,v])=>v>=3);
    return guclu.length>0?{satir:s.trim(),harf:guclu[0][0]}:null;
  }).filter(Boolean);
  const aliterasyonVar = aliterasyonSatirlar.length>0;

  // Asonans
  const tumUnlular = tL.match(/[aeıioöuü]/g)||[];
  const unluHS={};tumUnlular.forEach(u=>{unluHS[u]=(unluHS[u]||0)+1});
  const domUnlu = Object.entries(unluHS).sort((a,b)=>b[1]-a[1])[0];
  const asonansVar = domUnlu&&domUnlu[1]/tumUnlular.length>0.40&&tumUnlular.length>10;

  // Kafiye
  const satirSonlari = satirlar.map(l=>{
    const w=l.trim().split(/\s+/);
    return w[w.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'')?.slice(-3)||'';
  });
  let kafiyeSayisi=0;
  for(let i=0;i<satirSonlari.length-1;i++){
    if(satirSonlari[i].length>1&&satirSonlari[i]===satirSonlari[i+1])kafiyeSayisi++;
    else if(satirSonlari[i].length>1&&i+2<satirSonlari.length&&satirSonlari[i]===satirSonlari[i+2])kafiyeSayisi+=0.5;
  }
  const kafiyeOrani=kafiyeSayisi/Math.max(lc-1,1);
  const zorlamaEkler=['miş','mış','muş','müş','ler','lar','dan','den','tan','ten','mak','mek'];
  const zorlamaKafiye=zorlamaEkler.filter(ek=>satirSonlari.filter(s=>s.endsWith(ek)).length>=Math.ceil(lc*0.5)).length>0;

  // Hece
  const heceArr=satirlar.map(l=>l.trim().split(/\s+/).reduce((s,w)=>(w.match(/[aeıioöuüAEIİOÖUÜ]/g)||[]).length+s,0));
  const heceMean=heceArr.reduce((a,b)=>a+b,0)/Math.max(heceArr.length,1);
  const heceVar=heceArr.length>1?Math.sqrt(heceArr.reduce((s,h)=>s+(h-heceMean)**2,0)/heceArr.length):5;
  const heceOlcusu=heceVar<2.0&&lc>=4;

  // İmge — şiirden alıntı
  const benzetmeImleri=['gibi','sanki','andır','tıpkı','adeta','misali'];
  const benzetmeSatirlari=satirlar.filter(s=>benzetmeImleri.some(b=>s.toLowerCase().includes(b)));
  const benzetmeVar=benzetmeSatirlari.length>0;

  const insanFiilleri=['söyler','bakar','ağlar','güler','uçar','koşar','fısıldar','haykırır','titrer','sarılır','bekler','özler'];
  const dogaKelime=['güneş','ay','yıldız','deniz','dağ','rüzgar','yaprak','bulut','ağaç','nehir','kar','çiçek'];
  const kisilesMeSatirlari=satirlar.filter(s=>{const sL=s.toLowerCase();return dogaKelime.some(d=>sL.includes(d))&&insanFiilleri.some(f=>sL.includes(f));});
  const kisilesMeVar=kisilesMeSatirlari.length>0;

  // Sembol — SADECE şiirde bulunanlar
  const sembolListe=['labirent','kafes','zincir','perde','kök','tohum','kül','yankı','gölge','iz','boşluk','uçurum','köprü','sis','çıkmaz','zindan','kanat'];
  const sembolBulunan=sembolListe.filter(w=>varMi(w));

  const ozgunMetaforIhtimali=benzetmeVar&&!['gözlerin yıldız','saçların rüzgar','yüzün ay','kalbin ateş'].some(m=>tL.includes(m));

  // Tema
  const temalar={
    hüzün:{kelimeler:['hüzün','keder','ağlamak','gözyaşı','yalnız','acı','solmak'],label:'hüzün ve keder'},
    umut:{kelimeler:['umut','ışık','sabah','doğmak','güneş','bahar'],label:'umut ve yenilenme'},
    aşk:{kelimeler:['sevgi','aşk','sevda','yürek','canan','yar','beklemek','özlemek'],label:'aşk ve özlem'},
    doğa:{kelimeler:['deniz','dağ','orman','nehir','rüzgar','yaprak','toprak','bulut'],label:'doğa ve evren'},
    varoluş:{kelimeler:['ölüm','yaşam','sonsuz','zaman','anlam','boşluk','hiçlik'],label:'varoluş ve anlam'},
    özgürlük:{kelimeler:['özgür','kanat','uçmak','zindan','kafes','kurtulmak'],label:'özgürlük ve başkaldırı'},
  };
  let anaTema='genel',maxTema=0;
  for(const[t,{kelimeler}]of Object.entries(temalar)){const s=kelimeler.filter(k=>varMi(k)).length;if(s>maxTema){maxTema=s;anaTema=t;}}
  const temaLabel=temalar[anaTema]?.label||'karma duygular';
  const temaKelimelerBulunan=(temalar[anaTema]?.kelimeler||[]).filter(k=>varMi(k)).slice(0,3);

  const kelSay={};tumKelimeler.forEach(w=>{if(w.length>3)kelSay[w]=(kelSay[w]||0)+1});
  const tekrarSayisi=Object.values(kelSay).filter(v=>v>=3).length;
  const zenginlik=benzersiz/Math.max(len,1);
  const punct=(text.match(/[,;:!?—–.]/g)||[]).length;

  // ── PUAN ───────────────────────────────────────────────────────────────
  let p=5.0;

  // Uzunluk
  if(len<4)p-=3.5;
  else if(len<8)p-=2.0;
  else if(len<12)p-=1.0;
  else if(len<=60)p+=0.7;
  else if(len<=120)p+=0.3;

  // Dize
  if(lc<2)p-=2.0;
  else if(lc===2)p-=1.0;
  else if(lc===3)p-=0.4;
  else if(lc>=4&&lc<=20)p+=0.5;

  // Zenginlik
  if(zenginlik>0.85)p+=1.5;
  else if(zenginlik>0.70)p+=0.8;
  else if(zenginlik>0.55)p+=0.2;
  else p-=0.5;

  // Günlük dil — sert ceza
  const gd=gunlukBulunan.length;
  if(gd>=6)p-=2.5;else if(gd>=4)p-=1.8;else if(gd>=2)p-=1.0;else if(gd>=1)p-=0.4;

  // Didaktik
  const dd=didaktikBulunan.length;
  if(dd>=2)p-=1.5;else if(dd>=1)p-=0.7;

  // Klişe
  p-=kliseBulunan.length*0.6;
  p-=kliseTekBulunan.length*0.5;

  // Şiirsel dil
  if(siirselBulunan.length>=3)p+=0.8;
  else if(siirselBulunan.length>=1)p+=0.3;

  // Kafiye
  if(kafiyeOrani>0.5&&!zorlamaKafiye)p+=0.8;
  else if(kafiyeOrani>0.25&&!zorlamaKafiye)p+=0.4;
  if(zorlamaKafiye)p-=0.9;

  if(heceOlcusu)p+=0.6;
  if(aliterasyonVar)p+=0.4;
  if(asonansVar)p+=0.3;
  if(benzetmeVar)p+=0.4;
  if(kisilesMeVar)p+=0.5;
  if(sembolBulunan.length>0)p+=0.3;
  if(ozgunMetaforIhtimali)p+=0.4;
  if(tekrarSayisi>1)p-=(tekrarSayisi-1)*0.25;
  if(punct>=2&&punct<=12)p+=0.2;

  const sapma=((hash%9)-4)*0.07;
  p=Math.min(9.6,Math.max(2.0,p+sapma));
  p=Math.round(p*10)/10;

  // ── YORUM ──────────────────────────────────────────────────────────────
  const parcalar=[];

  if(cokKisa){
    parcalar.push(`Şiir oldukça kısa; ${lc} dize ve ${len} kelimeyle tema yalnızca yüzeyde kalıyor.`);
  }

  if(!cokKisa){
    const izl=[`${lc} dizelik bu şiirde ${temaLabel} işleniyor.`,`Şiir, ${temaLabel} ekseninde kurulmuş.`,`${temaLabel} teması ${lc} dize boyunca işlenmiş.`];
    parcalar.push(izl[rnd(izl.length)]);
  }

  if(temaKelimelerBulunan.length>0){
    parcalar.push(`Temayı destekleyen kelimeler: "${temaKelimelerBulunan.join('", "')}" — şiirin duygusal odağını oluşturuyor.`);
  }

  if(benzetmeSatirlari.length>0){
    const orn=benzetmeSatirlari[0].trim().slice(0,70)+(benzetmeSatirlari[0].trim().length>70?'…':'');
    parcalar.push(`Benzetme: "${orn}" — bu imge temayı somutlaştırıyor.`);
  }
  if(kisilesMeSatirlari.length>0&&!benzetmeVar){
    const orn=kisilesMeSatirlari[0].trim().slice(0,70)+(kisilesMeSatirlari[0].trim().length>70?'…':'');
    parcalar.push(`Kişileştirme: "${orn}" — doğaya insan özelliği yüklenerek derinlik kazanılmış.`);
  }
  if(sembolBulunan.length>0){
    parcalar.push(`"${sembolBulunan[0]}" sembolik anlam taşıyarak şiire katman ekliyor.`);
  }
  if(ozgunMetaforIhtimali&&!kliseBulunan.length){
    parcalar.push(`Benzetmeler klişeden uzak; özgün bir imgelem dili kurulmaya çalışılmış.`);
  }
  if(kliseBulunan.length>0){
    parcalar.push(`"${kliseBulunan[0].join('-')}" imgesi şiirlerde çok kullanılmış klişe; özgün söyleyiş bu şablonların dışına çıkmalı.`);
  }
  if(kliseTekBulunan.length>0){
    parcalar.push(`"${kliseTekBulunan[0]}" çok yıpranmış bir ifade; yerine özgün bir söyleyiş bulunmalı.`);
  }

  if(heceOlcusu){
    parcalar.push(`Hece ölçüsüyle yazılmış; yaklaşık ${Math.round(heceMean)} heceli dengeli ritim var.`);
  } else if(!cokKisa){
    parcalar.push(`Serbest nazım tercih edilmiş.`);
  }

  if(aliterasyonVar){
    const orn=aliterasyonSatirlar[0];
    parcalar.push(`"${orn.satir.slice(0,50)}" dizesinde "${orn.harf}" sesiyle belirgin aliterasyon; ritim güçlenmiş.`);
  }
  if(asonansVar){
    parcalar.push(`"${domUnlu[0]}" ünlüsünün yoğunluğu şiire asonans katıyor.`);
  }

  if(zorlamaKafiye){
    parcalar.push(`Kafiye düzeni zorlamalı; monotonluk yaratıyor.`);
  } else if(kafiyeOrani>0.4){
    parcalar.push(`Kafiye düzeni tutarlı ve doğal.`);
  } else if(kafiyeOrani>0.1&&!heceOlcusu){
    parcalar.push(`Kısmi kafiyeler var; ses uyumu daha tutarlı olabilirdi.`);
  }

  if(gd>=4){
    const ornekler=gunlukBulunan.slice(0,3).join(', ');
    parcalar.push(`Şiir büyük ölçüde günlük konuşma diline dayanıyor (${ornekler}); şiirsel dil çok farklı bir ses gerektirir.`);
  } else if(gd>=2){
    parcalar.push(`"${gunlukBulunan.slice(0,2).join('", "')}" gibi konuşma dili kelimeleri şiirsel tonu kırıyor.`);
  } else if(gd===1){
    parcalar.push(`"${gunlukBulunan[0]}" ifadesi şiirin tonundan uzaklaşıyor.`);
  } else if(siirselBulunan.length>=2){
    parcalar.push(`Dil şiirsel; günlük konuşmadan uzak bir söyleyiş var.`);
  }

  if(dd>=1){
    parcalar.push(`"${didaktikBulunan[0]}" gibi açıklayıcı ifadeler şiiri düz yazıya yaklaştırıyor; duygu gösterilmeli, açıklanmamalı.`);
  }

  if(tekrarSayisi>1){
    parcalar.push(`Bazı kelimeler fazla tekrar ediyor; sinonimler kullanılarak dil zenginleştirilebilir.`);
  } else if(zenginlik>0.78&&!cokKisa){
    parcalar.push(`Kelime seçimleri zengin ve taze.`);
  }

  if(p>=8.0)parcalar.push(`Bütünlüklü ve olgun bir şiir.`);
  else if(p>=6.0)parcalar.push(`Potansiyelini tam açmamış; kritik düzenlemelerle güçlenebilir.`);
  else if(p>=4.0)parcalar.push(`Ham malzeme sunuyor; özenli işçilikle dönüşüm mümkün.`);
  else parcalar.push(`Bu metin henüz şiir tanımına girmiyor; dil, imge ve ses araçları üzerine ciddi çalışma gerekiyor.`);

  const yorum=parcalar.join(' ');

  // Güçlü yön
  const gucluH=[];
  if(kafiyeOrani>0.35&&!zorlamaKafiye)gucluH.push('Kafiye düzeni doğal ve ses uyumu başarılı');
  if(aliterasyonVar)gucluH.push(`"${aliterasyonSatirlar[0].harf}" sesindeki aliterasyon müzikal akış sağlıyor`);
  if(asonansVar)gucluH.push(`"${domUnlu[0]}" ünlüsüyle asonans yaratılmış`);
  if(heceOlcusu)gucluH.push('Hece ölçüsü dengeli ve ritim tutarlı');
  if(ozgunMetaforIhtimali&&!kliseBulunan.length)gucluH.push('Özgün ve klişeden uzak imge kullanımı var');
  if(sembolBulunan.length>0)gucluH.push(`"${sembolBulunan[0]}" sembolik anlam katıyor`);
  if(kisilesMeVar)gucluH.push('Kişileştirme figürleri şiire derinlik katıyor');
  if(zenginlik>0.78)gucluH.push('Kelime seçimleri taze ve özgün');
  if(siirselBulunan.length>=2)gucluH.push('Şiirsel dil özenle kullanılmış');
  if(gucluH.length===0)gucluH.push('Ham bir duygu yoğunluğu taşıyor');
  const guclu=gucluH[rnd(gucluH.length)];

  // Öneri
  const oneriH=[];
  if(cokKisa)oneriH.push('Şiir en az 6-8 dizeye genişletilerek tema derinlemesine işlenmeli');
  if(zorlamaKafiye)oneriH.push('Zorlamalı kafiyelerden vazgeçilip doğal ses uyumu aranmalı');
  if(kliseBulunan.length>0||kliseTekBulunan.length>0)oneriH.push('Klişe imge ve ifadeler yerine özgün söyleyiş bulunmalı');
  if(gd>=2)oneriH.push('Konuşma dili kelimeleri şiirsel karşılıklarıyla değiştirilmeli');
  if(dd>=1)oneriH.push('"Göster, anlatma" ilkesiyle duygu imgelerle verilmeli');
  if(!benzetmeVar&&!kisilesMeVar)oneriH.push('Somut imgeler ve metaforlar eklenerek şiir görselleştirilmeli');
  if(zenginlik<0.60)oneriH.push('Kelime tekrarları azaltılıp söz dağarcığı genişletilmeli');
  if(!aliterasyonVar&&kafiyeOrani<0.2)oneriH.push('Aliterasyon veya iç kafiyeyle ses dokusu zenginleştirilebilir');
  if(tekrarSayisi>1)oneriH.push('Tekrarlayan kelimeler yerine sinonimler kullanılmalı');
  if(oneriH.length===0)oneriH.push('Son dize daha çarpıcı bir kapanışla güçlendirilebilir');
  const oneri=oneriH[rnd(oneriH.length)];

  return{score:p,yorum,gucluYonler:guclu,gelistirmeOnerisi:oneri};
}

// Sadece ilgili kartı günceller, sayfa kaymaz
function refreshCard(pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const oldCard=document.querySelector(`[data-pid="${pid}"]`);
  if(!oldCard)return;
  // Kartın genişletilmiş mi olduğunu kaydet
  const wasExpanded=oldCard.querySelector('.post-full')?.style.display==='block';
  // Yorumlar açık mıydı
  const cmtBodyEl=oldCard.querySelector('.cmt-body');
  const cmtsOpen=cmtBodyEl?.style.display==='block';
  // Mevcut scroll pozisyonunu kaydet
  const scrollY=window.scrollY;
  // Yeni kartı oluştur — her zaman genişletilmiş tut
  const newCard=postCard(post, wasExpanded);
  newCard.setAttribute('data-pid',pid);
  oldCard.replaceWith(newCard);
  // Yorumlar açıksa yeni kartta da aç
  if(cmtsOpen){
    const newCmtBody=newCard.querySelector('.cmt-body');
    if(newCmtBody)newCmtBody.style.display='block';
  }
  // Scroll pozisyonunu geri yükle — sayfa kaymaz
  window.scrollTo({top:scrollY,behavior:'instant'});
}

// ── BOT PUANLAMALARI (A dışında tanımlanır) ──────────────────────────────────
function botDuyuPuan(text){
  if(!text||text.trim().length<5)return null;
  const tL=text.toLowerCase();
  const tumK=text.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const varMi=w=>tumK.includes(w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));

  const duygusalK=['hüzün','keder','özlem','hasret','aşk','sevda','ağlamak','yalnız','gurbet','acı','figan','ah','vah','sızı','yürek','gönül','can','ruh','sessizlik','yokluk','sonsuz','ölüm','yaşam','umut','sevinç','neşe','bahar','ışık'];
  const bulunan=duygusalK.filter(k=>varMi(k));
  const yogunluk=bulunan.length;

  // Duygu yoğunluğuna göre puan
  let p=4.0;
  if(yogunluk>=6)p=8.5+(Math.random()*0.8);
  else if(yogunluk>=4)p=7.0+(Math.random()*1.0);
  else if(yogunluk>=2)p=5.5+(Math.random()*1.0);
  else if(yogunluk===1)p=4.5+(Math.random()*0.8);
  else p=3.0+(Math.random()*1.0);

  // Uzunluk etkisi
  const lc=text.split('\n').filter(s=>s.trim().length>0).length;
  if(lc<3)p-=1.5;
  else if(lc>=6)p+=0.3;

  p=Math.min(9.5,Math.max(2.0,p));
  p=Math.round(p*10)/10;

  const yorumlar=[
    `Şiirde ${yogunluk>3?'güçlü':'zayıf'} bir duygusal yoğunluk hissediliyor. ${bulunan.length>0?bulunan.slice(0,2).join(', ')+' gibi kelimeler duygu atmosferini oluşturuyor.':'Duygu sözcükleri oldukça sınırlı kalmış.'}`,
    `Duygusal etki ${p>=7?'yüksek':'sınırlı'}. ${bulunan.length>0?'Şiirde geçen '+bulunan[0]+' gibi imgeler okuyucuya duyguyu iletebiliyor.':'Duygu doğrudan aktarılamamış; şiirsel imgelerle pekiştirilmeli.'}`,
    `${lc<3?'Çok kısa bir metin; duygu yeterince geliştirilmemiş.':yogunluk>=4?'Duygu katmanları belirgin ve okuyucuya ulaşıyor.':'Duygu potansiyeli var ama henüz tam ifade bulamamış.'}`,
  ];
  const hash=text.length%yorumlar.length;
  return {puan:p, yorum:yorumlar[hash], kullanici:'bot_duyu_yorum', ad:'duyu-yorum'};
}

// Bot 2: katlı-yorum — ses uyumu ve kafiye analizi
function botKatliPuan(text){
  if(!text||text.trim().length<5)return null;
  const satirlar=text.split('\n').filter(s=>s.trim().length>0);
  const lc=satirlar.length;

  // Kafiye
  const sonlar=satirlar.map(l=>{const w=l.trim().split(/\s+/);return w[w.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'')?.slice(-3)||''});
  let kafiyeSayisi=0;
  for(let i=0;i<sonlar.length-1;i++){if(sonlar[i].length>1&&sonlar[i]===sonlar[i+1])kafiyeSayisi++;else if(sonlar[i].length>1&&i+2<sonlar.length&&sonlar[i]===sonlar[i+2])kafiyeSayisi+=0.5;}
  const kafiyeOrani=kafiyeSayisi/Math.max(lc-1,1);

  // Zorlamalı kafiye
  const zorlamaEkler=['miş','mış','muş','müş','ler','lar','dan','den','mak','mek'];
  const zorlamaKafiye=zorlamaEkler.filter(ek=>sonlar.filter(s=>s.endsWith(ek)).length>=Math.ceil(lc*0.5)).length>0;

  // Hece ölçüsü
  const heceArr=satirlar.map(l=>l.trim().split(/\s+/).reduce((s,w)=>(w.match(/[aeıioöuüAEIİOÖUÜ]/g)||[]).length+s,0));
  const heceMean=heceArr.reduce((a,b)=>a+b,0)/Math.max(heceArr.length,1);
  const heceVar=heceArr.length>1?Math.sqrt(heceArr.reduce((s,h)=>s+(h-heceMean)**2,0)/heceArr.length):5;
  const heceOlcusu=heceVar<2.0&&lc>=4;

  // Aliterasyon
  const tumK=text.trim().split(/\s+/).map(w=>w[0]?.toLowerCase()).filter(Boolean);
  const hs={};tumK.forEach(h=>{hs[h]=(hs[h]||0)+1});
  const aliterasyon=Object.values(hs).filter(v=>v>=3).length>0;

  let p=4.0;
  if(heceOlcusu)p+=2.0;
  if(kafiyeOrani>0.5&&!zorlamaKafiye)p+=1.5;
  else if(kafiyeOrani>0.25&&!zorlamaKafiye)p+=0.8;
  if(zorlamaKafiye)p-=1.2;
  if(aliterasyon)p+=0.6;
  if(lc<3)p-=1.5;

  p=Math.min(9.5,Math.max(2.0,p));
  p=Math.round(p*10)/10;

  let yorum='';
  if(heceOlcusu)yorum=`Hece ölçüsü tutarlı (ort. ${Math.round(heceMean)} hece/dize); ${kafiyeOrani>0.4&&!zorlamaKafiye?'kafiye düzeni de başarılı.':'ancak kafiye daha güçlendirilebilir.'}`;
  else if(zorlamaKafiye)yorum=`Ses uyumu zorlamalı kafiyeye dayanıyor; aynı ek tekrarı monotonluk yaratıyor. Daha doğal bir ses arayışı gerekiyor.`;
  else if(kafiyeOrani>0.3)yorum=`Serbest nazımda kafiye denemeleri var; ${aliterasyon?'aliterasyon da ritmi destekliyor.':'aliterasyon eklenirse ses dokusu zenginleşir.'}`;
  else yorum=`Ses araçları (kafiye, hece ölçüsü, aliterasyon) yeterince kullanılmamış; şiir ritmik açıdan zayıf kalıyor.`;

  return {puan:p, yorum, kullanici:'bot_katli_yorum', ad:'katlı-yorum'};
}

// Bot 3: arı-yorum — imge, metafor, uzunluk, emek analizi
function botAriPuan(text){
  if(!text||text.trim().length<5)return null;
  const tumK=text.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const satirlar=text.split('\n').filter(s=>s.trim().length>0);
  const lc=satirlar.length;
  const len=tumK.length;
  const tL=text.toLowerCase();
  const benzersiz=new Set(tumK).size;
  const zenginlik=benzersiz/Math.max(len,1);

  const benzetmeImleri=['gibi','sanki','andır','tıpkı','adeta','misali'];
  const benzetmeVar=benzetmeImleri.some(b=>tL.includes(b));
  const insanFiilleri=['söyler','bakar','ağlar','fısıldar','haykırır','titrer','bekler'];
  const dogaK=['güneş','ay','deniz','dağ','rüzgar','yaprak','bulut','nehir'];
  const kisilesMeVar=satirlar.some(s=>{const sL=s.toLowerCase();return dogaK.some(d=>sL.includes(d))&&insanFiilleri.some(f=>sL.includes(f));});
  const sembolListe=['kafes','zincir','perde','kül','yankı','gölge','uçurum','köprü','sis'];
  const sembolVar=sembolListe.some(w=>tumK.includes(w));
  const kliseMetaforlar=['gözlerin yıldız','saçların rüzgar','aşkından yandım','kalp kırık'];
  const kliseVar=kliseMetaforlar.some(k=>tL.includes(k));

  let p=4.0;
  // Uzunluk/emek
  if(len>=30&&len<=80)p+=1.5;
  else if(len>=15)p+=0.8;
  else if(len<8)p-=2.0;
  else if(len<15)p-=1.0;
  if(lc>=6)p+=0.5;
  else if(lc<3)p-=1.2;

  // İmge/metafor
  if(benzetmeVar)p+=0.8;
  if(kisilesMeVar)p+=0.9;
  if(sembolVar)p+=0.6;
  if(kliseVar)p-=0.8;
  if(zenginlik>0.75)p+=0.7;
  else if(zenginlik<0.5)p-=0.5;

  p=Math.min(9.5,Math.max(2.0,p));
  p=Math.round(p*10)/10;

  let yorum='';
  const imgeSayisi=(benzetmeVar?1:0)+(kisilesMeVar?1:0)+(sembolVar?1:0);
  if(imgeSayisi>=2&&!kliseVar)yorum=`Şiirde özgün imgeler ve metaforlar dikkat çekiyor. ${len>=20?'Emek verilmiş bir yapı; uzunluk ve kelime çeşitliliği bunu destekliyor.':'Ancak şiir daha geniş bir yapıya kavuşturulabilir.'}`;
  else if(kliseVar)yorum=`Şiirde klişeleşmiş metaforlar kullanılmış; özgün imgeler şiiri daha güçlü kılar. ${len<15?'Ayrıca şiir oldukça kısa; daha fazla emek ve genişleme gerekiyor.':''}`;
  else if(len<10)yorum=`Şiir çok kısa; imge ve metafor için yeterli alan oluşmamış. Daha uzun ve işlenmiş bir yapı hedeflenmeli.`;
  else yorum=`${imgeSayisi===0?'İmge ve metafor kullanımı oldukça sınırlı; şiirsel araçlar geliştirilmeli.':'Bazı imgeler mevcut fakat daha özgün söyleyişler şiiri güçlendirirdi.'} Kelime zenginliği ${zenginlik>0.65?'tatmin edici':'artırılabilir'}.`;

  return {puan:p, yorum, kullanici:'bot_ari_yorum', ad:'arı-yorum'};
}

A.addPost = function(pd){
    const r=pd.text&&pd.text.trim().length>10?scorePoem(pd.text):null;

    // Bot puanları hesapla
    const botRatings={};
    const botYorumlar={};
    if(pd.text&&pd.text.trim().length>10){
      const b1=botDuyuPuan(pd.text);
      const b2=botKatliPuan(pd.text);
      const b3=botAriPuan(pd.text);
      if(b1){botRatings[b1.kullanici]=b1.puan;botYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};}
      if(b2){botRatings[b2.kullanici]=b2.puan;botYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};}
      if(b3){botRatings[b3.kullanici]=b3.puan;botYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};}
      // Yapay zekanın puanı da aritmetik ortalamaya katılıyor
      if(r&&r.score) botRatings['bot_ai_yorum']=r.score;
    }

    const np={...pd,id:uid(),authorId:S.me.id,ts:Date.now(),
      userRatings:botRatings,
      botYorumlar:botYorumlar,
      aiScore:r?r.score:null,aiYorum:r?r.yorum:null,
      aiGuclu:r?r.gucluYonler:null,aiOneri:r?r.gelistirmeOnerisi:null,
      comments:[],date:now()};

    S.posts.unshift(np);
    save();
    render();
    db.collection("posts").doc(np.id).set(np)
      .then(()=>{ verileriYukle(); })
      .catch(err=>console.error("Şiir kaydetme hatası:",err));
};

A.ratePost = function(pid,score){
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex > -1) {
      if(!S.posts[pIndex].userRatings) S.posts[pIndex].userRatings = {};
      S.posts[pIndex].userRatings[S.me.id] = score;
      save();
      refreshCard(pid);
      const post=S.posts[pIndex];
      const postTitle=post.title||post.text?.slice(0,20)||'şiirinize';
      A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinize ${score}/10 puan verdi.`);
      db.collection("posts").doc(pid).update({ userRatings: S.posts[pIndex].userRatings });
    }
};
A.addComment = function(pid,text){
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex > -1) {
      const newComment = {id:uid(),authorId:S.me.id,text,date:now()};

    }
};

function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  return e;
}

function Profile(){
  const tid=S.profileId||S.me?.id;
  const user=byId(tid);
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  if(S.profileId && S.profileId !== S.me?.id){
    page.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'16px',fontSize:'.9rem'},onclick:()=>go('feed')},'← Geri'));
  }
  if(!user){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Kullanıcı bulunamadı.'));
    wrap.appendChild(page);return wrap;
  }
  const ups=S.posts.filter(p=>p.authorId===tid);
  const sp=ups.filter(p=>calcAvg(p.userRatings,p.aiScore)!==null);
  const avg=sp.length?(sp.reduce((s,p)=>s+calcAvg(p.userRatings,p.aiScore),0)/sp.length).toFixed(1):null;
  const fc=Object.values(S.follows).filter(l=>l.includes(tid)).length;
  const fg=(S.follows[tid]||[]).length;
  const isMe=tid===S.me?.id;
  const card=h('div',{class:'card fade',style:{textAlign:'center'}});
  card.appendChild(h('div',{style:{display:'flex',justifyContent:'center',marginBottom:'12px'}},[av(user,72)]));
  card.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.5rem',color:'#e9d5ff'}},user.name));
  card.appendChild(h('p',{style:{color:'#6b5b8a',marginBottom:'6px'}},`@${user.username}`));
  if(user.bio)card.appendChild(h('p',{style:{color:'#c4b5fd',fontStyle:'italic',marginBottom:'10px'}},user.bio));
  if(avg)card.appendChild(h('p',{style:{color:scoreColor(+avg),marginBottom:'12px'}},`Ort. Puan: ${avg}/10 ${scoreBadge(+avg)}`));
  const stats=h('div',{style:{display:'flex',justifyContent:'center',gap:'28px',marginBottom:'16px'}});
  [['Şiir',ups.length],['Takipçi',fc],['Takip',fg]].forEach(([l,v])=>stats.appendChild(h('div',{},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.3rem',color:'#e9d5ff'}},String(v)),h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},l)])));
  card.appendChild(stats);
  if(!isMe && user.username !== ADMIN_USERNAME){
    const fb=h('button',{class:'pb btn',onclick:()=>{A.toggleFollow(user.id);render();}},isF(user.id)?'Takibi Bırak':'Takip Et');
    card.appendChild(fb);
  }

  // Admin paneli
  if(S.me?.username===ADMIN_USERNAME){
    const adminPanel=h('div',{class:'card',style:{marginTop:'16px',border:'1px solid #5b21b6',background:'linear-gradient(135deg,#1e0a3e,#160d28)'}});
    adminPanel.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#c084fc',marginBottom:'12px',fontSize:'1rem'}},'⚙️ Admin Paneli'));

    // Tüm şiirleri yeniden değerlendir butonu
    const durumEl=h('p',{style:{color:'#6b5b8a',fontSize:'.85rem',marginTop:'10px',fontStyle:'italic'}},'');
    const revalBtn=h('button',{class:'pb btn',style:{width:'100%',background:'linear-gradient(135deg,#5b21b6,#7c3aed)',fontSize:'.9rem'},
      onclick:async()=>{
        revalBtn.disabled=true;
        revalBtn.textContent='⏳ Değerlendiriliyor...';
        durumEl.textContent='';
        let sayac=0;
        const tumPostlar=[...S.posts];
        for(const post of tumPostlar){
          if(!post.text||post.text.trim().length<10){sayac++;continue;}
          const r=scorePoem(post.text);
          const b1=botDuyuPuan(post.text);
          const b2=botKatliPuan(post.text);
          const b3=botAriPuan(post.text);
          const yeniRatings={...(post.userRatings||{})};
          // Bot puanlarını güncelle
          if(b1)yeniRatings[b1.kullanici]=b1.puan;
          if(b2)yeniRatings[b2.kullanici]=b2.puan;
          if(b3)yeniRatings[b3.kullanici]=b3.puan;
          if(r)yeniRatings['bot_ai_yorum']=r.score;
          const yeniBotYorumlar={...(post.botYorumlar||{})};
          if(b1)yeniBotYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};
          if(b2)yeniBotYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};
          if(b3)yeniBotYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};
          const idx=S.posts.findIndex(p=>p.id===post.id);
          if(idx>-1){
            S.posts[idx].userRatings=yeniRatings;
            S.posts[idx].botYorumlar=yeniBotYorumlar;
            if(r){S.posts[idx].aiScore=r.score;S.posts[idx].aiYorum=r.yorum;S.posts[idx].aiGuclu=r.gucluYonler;S.posts[idx].aiOneri=r.gelistirmeOnerisi;}
          }
          // Firebase güncelle
          try{await db.collection("posts").doc(post.id).update({userRatings:yeniRatings,botYorumlar:yeniBotYorumlar,aiScore:r?r.score:post.aiScore,aiYorum:r?r.yorum:post.aiYorum,aiGuclu:r?r.gucluYonler:post.aiGuclu,aiOneri:r?r.gelistirmeOnerisi:post.aiOneri});}catch(e){console.error(e);}
          sayac++;
          durumEl.textContent=`${sayac}/${tumPostlar.length} şiir güncellendi...`;
        }
        save();
        revalBtn.disabled=false;
        revalBtn.textContent='🔄 Tüm Şiirleri Yeniden Değerlendir';
        durumEl.textContent=`✅ ${sayac} şiir başarıyla güncellendi!`;
        durumEl.style.color='#34d399';
        render();
      }
    },'🔄 Tüm Şiirleri Yeniden Değerlendir');
    adminPanel.appendChild(revalBtn);
    adminPanel.appendChild(durumEl);
  }
  page.appendChild(card);
  // Admin panelini kartın altına ekle
  if(S.me?.username===ADMIN_USERNAME){
    page.appendChild(adminPanel);
  }
  page.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#a78bfa',marginBottom:'12px',fontSize:'1.1rem'}},'Şiirler'));
  if(!ups.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Henüz şiir paylaşılmadı.'));
  } else {
    ups.forEach(p=>{
      const a=calcAvg(p.userRatings,p.aiScore);
      const pc=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'center',cursor:'pointer'},onclick:()=>go('postdetail',{postId:p.id})});
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:'#e9d5ff',fontStyle:'italic'}},`"${p.title||p.text?.slice(0,30)+(p.text?.length>30?'…':'')||'İsimsiz'}"`));
      info.appendChild(h('p',{style:{fontSize:'.78rem',color:'#6b5b8a',marginTop:'4px'}},`${p.date} · ${(p.comments||[]).length} yorum`));
      pc.appendChild(info);
      if(a!==null)pc.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(a)}44`}},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',fontWeight:'700',color:scoreColor(a)}},a.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
      page.appendChild(pc);
    });
  }
  wrap.appendChild(page);return wrap;
}

    const contactedIds=new Set();
    S.msgs.forEach(m=>{
      if(m.fromId===S.me?.id)contactedIds.add(m.toId);
      if(m.toId===S.me?.id)contactedIds.add(m.fromId);
    });
    const contacts=S.users.filter(u=>contactedIds.has(u.id)&&u.id!==S.me?.id);

    // Mesaj yazılabilecek tüm kullanıcılar için "Yeni Mesaj" butonu
    const newMsgBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'12px',background:'linear-gradient(135deg,#1e0a3e,#2d1060)',border:'1px dashed #5b21b6',borderRadius:'12px',padding:'12px',color:'#a78bfa',fontSize:'.9rem',fontFamily:"'Crimson Text',serif",display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'},onclick:()=>showUserList()});
    newMsgBtn.appendChild(document.createTextNode('✏️ Yeni Mesaj'));
    ct.appendChild(newMsgBtn);

    if(!contacts.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'20px'}},'Henüz mesajlaşma yok. Yukarıdaki butona basarak yeni mesaj gönderebilirsin.'));
      return;
    }
    contacts.forEach(u=>{
      const last=[...S.msgs].reverse().find(m=>(m.fromId===S.me?.id&&m.toId===u.id)||(m.fromId===u.id&&m.toId===S.me?.id));
      const unread=S.msgs.filter(m=>m.fromId===u.id&&m.toId===S.me?.id&&!m.read).length;
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,44));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      if(last)info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.83rem'}},last.text.slice(0,40)+(last.text.length>40?'…':'')));
      card.appendChild(info);
      if(unread>0)card.appendChild(h('span',{style:{background:'#c084fc',color:'#fff',borderRadius:'50%',width:'20px',height:'20px',fontSize:'.7rem',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unread)));
      ct.appendChild(card);
    });
  }

  function showUserList(){
    ct.innerHTML='';
    ct.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'12px',fontSize:'.9rem'},onclick:()=>showMsgs()},'← Geri'));
    ct.appendChild(h('p',{style:{color:'#a78bfa',fontFamily:"'Crimson Text',serif",fontSize:'.9rem',marginBottom:'12px',fontStyle:'italic'}},'Mesaj göndermek istediğin kişiyi seç:'));
    const others=S.users.filter(u=>u.id!==S.me?.id&&u.username!==ADMIN_USERNAME);
    others.forEach(u=>{
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,40));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},`@${u.username}`));
      card.appendChild(info);
      ct.appendChild(card);
    });
  }

  function showNotifs(){
    ct.innerHTML='';
    const unread=(S.notifs||[]).filter(n=>!n.read);
    if(unread.length>0){
      unread.forEach(n=>{n.read=true;db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});});
      lsSet('yo_notifs',S.notifs);
    }
    const notifs=S.notifs||[];
    if(!notifs.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
      return;
    }
    notifs.forEach(n=>{
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      card.appendChild(h('span',{style:{fontSize:'1.4rem',flexShrink:'0'}},n.text.includes('yorum')?'💬':'⭐'));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px',display:'inline-block'}}));
      ct.appendChild(card);
    });
  }

  function showChat(){
    ct.innerHTML='';
    const chatUser=S.users.find(u=>u.id===chat);
    const hdr=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
    hdr.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',fontSize:'.9rem'},onclick:()=>{chat=null;showMsgs();}},'←'));
    hdr.appendChild(av(chatUser,36));
    hdr.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},chatUser?.name||''));
    ct.appendChild(hdr);
    const msgs=h('div',{style:{height:'55vh',overflowY:'auto',display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'8px'}});
    S.msgs.filter(m=>(m.fromId===S.me?.id&&m.toId===chat)||(m.fromId===chat&&m.toId===S.me?.id)).forEach(m=>{
      const mine=m.fromId===S.me?.id;
      msgs.appendChild(h('div',{style:{display:'flex',justifyContent:mine?'flex-end':'flex-start'}},[h('div',{style:{maxWidth:'70%',background:mine?'linear-gradient(135deg,#7c3aed,#a855f7)':'#1a0f2e',borderRadius:mine?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'10px 14px',border:mine?'none':'1px solid #2d1b52'}},[h('p',{style:{color:'#f0e8ff',fontSize:'.95rem'}},m.text),h('p',{style:{color:mine?'#ddd6fe':'#6b5b8a',fontSize:'.7rem',marginTop:'4px',textAlign:mine?'right':'left'}},m.date)])]));
    });
    msgs.scrollTop=msgs.scrollHeight;
    const mi=inp('Mesajını yaz...');mi.style.borderRadius='20px';mi.style.flex='1';
    const sendMsg=()=>{if(!mi.value.trim())return;A.sendMsg(chat,mi.value.trim());mi.value='';showChat();};
    mi.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
    ct.appendChild(msgs);
    ct.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},[mi,h('button',{class:'pb btn',style:{padding:'10px 18px'},onclick:sendMsg},'↩')]));
  }

  msgsBtn.onclick=()=>{activeTab='msgs';msgsBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';msgsBtn.style.color='#fff';msgsBtn.style.border='none';notifBtn.style.background='#1a0f2e';notifBtn.style.color='#a78bfa';notifBtn.style.border='1px solid #2d1b52';showMsgs();};
  notifBtn.onclick=()=>{activeTab='notifs';notifBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';notifBtn.style.color='#fff';notifBtn.style.border='none';msgsBtn.style.background='#1a0f2e';msgsBtn.style.color='#a78bfa';msgsBtn.style.border='1px solid #2d1b52';showNotifs();};

  showMsgs();
  return wrap;
}

function Notifs(){
  // Bildirimleri okundu olarak işaretle
  const unread=(S.notifs||[]).filter(n=>!n.read);
  if(unread.length>0){
    unread.forEach(n=>{
      n.read=true;
      db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});
    });
    lsSet('yo_notifs',S.notifs);
  }
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',marginBottom:'16px',fontSize:'1.4rem'}},'🔔 Bildirimler'));
  const notifs=S.notifs||[];
  if(!notifs.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
  } else {
    notifs.forEach(n=>{
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      card.appendChild(h('span',{style:{fontSize:'1.5rem',flexShrink:'0'}},n.text.includes('yorum')? '💬':'⭐'));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px'}}));
      page.appendChild(card);
    });
  }
  wrap.appendChild(page);return wrap;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  
  if (S.loading) {
    app.appendChild(h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#0f0a1a'}},[
      h('div',{style:{fontSize:'32px'}},'🪶'),
      h('p',{style:{color:'#a78bfa',marginTop:'12px',fontStyle:'italic',fontSize:'1rem'}},'Ozanlar Meclisi Yükleniyor...')
    ]));
    return;
  }

  if(!S.me){
    const screens={
      landing:Landing,
      login:()=>authPage('Hoş geldin','Hesabınla giriş yap',[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'}],'Giriş Yap',v=>A.login(v.u||'',v.p||''),'Hesabın yok mu?',()=>go('register')),
      register:()=>authPage('Katıl',"Yeni Ozanlar'a üye ol",[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'},{label:'Şifre tekrar',type:'password',ph:'••••••••',k:'p2'}],'Hesap Oluştur',v=>{if(!v.u||!v.p)return'Tüm alanları doldurun.';if(v.p!==v.p2)return'Şifreler eşleşmiyor.';if((v.p||'').length<6)return'Şifre en az 6 karakter.';return A.register(v.u.trim(),v.p);},'Zaten üye misin?',()=>go('login'))
    };
    const Screen=screens[S.screen]||Landing;
    app.appendChild(Screen());
    return;
  }
  const screens={feed:Feed,leaderboard:Leaderboard,explore:Explore,profile:Profile,postdetail:PostDetail,messages:Messages,notifs:Notifs};
  const Screen=screens[S.screen]||Feed;
  app.appendChild(Screen());
}

verileriYukle();
</script>
</body>
</html>
