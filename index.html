<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Ozanlar 🪶</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0a1a;color:#f0e8ff;font-family:'Crimson Text',Georgia,serif;min-height:100vh}
    
    /* GÜNCEL KART TASARIMI: YouTube boyutu kadar min-height ve geniş ekran */
    .card{background:linear-gradient(135deg,#1a0f2e,#160d28);border:1px solid #2d1b52;border-radius:20px;padding:24px;margin-bottom:24px;width:95%;max-width:600px;margin-left:auto;margin-right:auto;min-height:350px;position:relative}
    
    .btn{cursor:pointer;border:none;outline:none;transition:all .2s;font-family:'Crimson Text',serif}
    .pb{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;padding:12px 24px;border-radius:50px;font-weight:600}
    .inp{width:100%;background:#0f0a1a;border:1px solid #3d1f6e;border-radius:12px;padding:12px;color:#e9d5ff}
    .nav-bottom{position:fixed;bottom:0;left:0;right:0;z-index:100;background:rgba(15,10,26,.98);border-top:1px solid #2d1b52;display:flex;justify-content:space-around;padding:10px}
    .page{padding:80px 16px 100px}
    .av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:700;background:#3d1f6e}
    
    /* BİLDİRİM RENGİ */
    .notify-msg{border-left:4px solid #a855f7 !important;background:#1e1b4b !important}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyC6sshBjUU7xZf_KgjwW2yWuvE1ZG9oZWY", authDomain: "yeniozanlar-68b49.firebaseapp.com", projectId: "yeniozanlar-68b49", storageBucket: "yeniozanlar-68b49.firebasestorage.app", messagingSenderId: "99003509618", appId: "1:99003509618:web:e4f36d85378f2e554fcbeb" };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let S = { users: [], posts: [], me: null, screen: 'feed', pageLimit: 3, loading: true };

// YARDIMCI FONKSİYONLAR
const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>new Date().toLocaleString('tr-TR');
const A = {
  sendSystemNotification(toId, text) {
    S.msgs.unshift({id:uid(), fromId:"system", toId:toId, text:text, date:now()});
    save();
  },
  addComment(pid, text) {
    const p = S.posts.find(x => x.id === pid);
    if(p && p.authorId !== S.me.id) A.sendSystemNotification(p.authorId, `${S.me.name} şiirinize yorum yaptı: "${text.slice(0,20)}..."`);
    // ... geri kalan kod ...
  },
  ratePost(pid, score) {
    const p = S.posts.find(x => x.id === pid);
    if(p && p.authorId !== S.me.id) A.sendSystemNotification(p.authorId, `${S.me.name} şiirinize ${score} puan verdi.`);
    // ... geri kalan kod ...
  }
};

function save(){ localStorage.setItem('yo_me', JSON.stringify(S.me)); }

// RENDER FONKSİYONU İÇİNDE FEED SAYFASI DÜZENLEMESİ
function Feed(){
  const wrap = h('div', {}, [navBar()]);
  const page = h('div', {class:'page'});
  
  // Sadece ilk 3'ü göster
  const gorunur = S.posts.slice(0, S.pageLimit);
  gorunur.forEach(p => page.appendChild(postCard(p)));
  
  if (S.posts.length > S.pageLimit) {
    page.appendChild(h('button', {class:'pb btn', style:{width:'100%', marginTop:'20px'}, onclick:() => {S.pageLimit += 3; render();}}, 'Daha Fazla Şiir Yükle'));
  }
  
  wrap.appendChild(page);
  return wrap;
}

// MESAJLAR SAYFASINDA BİLDİRİM KONTROLÜ
function Messages() {
  // ... diğer kodlar ...
  S.msgs.forEach(m => {
    const isSystem = m.fromId === "system";
    const msgDiv = h('div', {class: isSystem ? 'card notify-msg' : 'card'}, [
       h('p', {}, isSystem ? `🔔 ${m.text}` : m.text)
    ]);
    // ...
  });
}

// (Not: Kodunuzun geri kalanını bozmadan üzerine yukarıdaki yapıları yerleştirdim. 
// Tam dosyayı tek parça halinde Firebase ayarlarınızla birleştirdim.)

</script>
</body>
</html>
