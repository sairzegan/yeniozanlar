<script>

// STATE
// Önce yerelde (cache) ne varsa onu okuyoruz. Cache doluysa uygulamayı Firebase'i
// beklemeden ANINDA gösteriyoruz (loading=false); veriler arka planda sessizce

const _cacheUsers = lsGet('yo_users', []);
const _cachePosts = lsGet('yo_posts', []);
let S = {

  screen: 'feed',

// Paylaşım linkiyle gelindiyse, uygulama açılır açılmaz doğrudan o şiirin
// sayfasına gider. Üç format da desteklenir:
//  - /post/baslik-slug-ID → yeni, başlık uzantılı paylaşım formatı (bkz. paylasimLinki())
//  - /post/ID             → eski paylaşım formatı (geçmişte paylaşılmış linkler kırılmasın diye)
//  - #postdetail-ID       → uygulama içi gezinmede kullanılan eski/dahili format
// ID'nin kendisi (uid()) yalnızca rakam/küçük harften oluşur, tire içermez; bu yüzden
// "slug-ID" birleşiminde gerçek ID, son "-" işaretinden sonraki kısımdır.
(function(){
  const yolEslesme = location.pathname.match(/^\/post\/([^/]+)/);
  const hashEslesme = location.hash.match(/^#postdetail-(.+)$/);
  // Adreste #messages gibi bir ekran varsa (sayfa yenilenince) o ekrana dön;
  // /post/... yolu ancak ekran belirtilmemişse şiir sayfasını açar.
  const ekranEslesme = location.hash.match(/^#(messages|notifs|leaderboard|explore|feed)$/);
  let id = ekranEslesme ? null : (yolEslesme ? yolEslesme[1] : (hashEslesme ? hashEslesme[1] : null));
  if(ekranEslesme){
    S.screen = ekranEslesme[1];
  }
  if(id){
    id = decodeURIComponent(id);
    const sonTireIndex = id.lastIndexOf('-');
    if(sonTireIndex !== -1) id = id.slice(sonTireIndex + 1);
    S.screen = 'postdetail';
    S.postId = id;
  }
})();

const parseDate=d=>{if(!d)return 0;try{const p=d.split(' ');const dmy=p[0].split('.');const hms=p[1]?.split(':');return new Date(dmy[2],dmy[1]-1,dmy[0],hms?.[0]||0,hms?.[1]||0,hms?.[2]||0).getTime();}catch{return 0;}};
// Mesaj/bildirim kayıtlarının zamanı: yeni kayıtlarda ts (ms) var; eski kayıtlarda
// yalnızca "29.09.2026 14:30:00" biçiminde metin var. Metni localeCompare ile
// karşılaştırmak YANLIŞ sonuç verir (gün önce gelir), bu yüzden sayıya çeviriyoruz.
const kayitZamani = x => Number(x?.ts) || parseDate(x?.date) || 0;
const zamanArtan  = (a,b) => kayitZamani(a) - kayitZamani(b);
const zamanAzalan = (a,b) => kayitZamani(b) - kayitZamani(a);
const postSirala = arr => arr.sort((a,b)=>{
  const ap = Number(a.pinnedAt||0), bp = Number(b.pinnedAt||0);
  if(ap || bp){ if(ap !== bp) return bp-ap; }
  return (b.ts||parseDate(b.date))-(a.ts||parseDate(a.date));
});

// Ayın şiirleri sorgusu diğer sorgularla PARALEL başlar (eskiden art arda bekleniyordu).
function ayinSiirleriSorgusuBaslat(){
  try{
    const turkeyParts = new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Istanbul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const ty = Number(turkeyParts.find(x=>x.type==='year')?.value);
    const tm = Number(turkeyParts.find(x=>x.type==='month')?.value);
    const bas = Date.UTC(ty,tm-1,1) - (3*60*60*1000);
    const son = Date.UTC(ty,tm,1) - (3*60*60*1000);
    return db.collection('posts').where('ts','>=',bas).where('ts','<',son).orderBy('ts','desc').get().catch(()=>null);
  }catch(e){ return Promise.resolve(null); }
}

async function verileriYukle() {
  // KOTA TASARRUFU: önbellek yeterince tazeyse Firestore'a hiç gitme.
  const _simdi = Date.now();
  const postlarTaze = _cachePosts.length > 0 && (_simdi - (Number(lsGet('yo_postTs',0))||0) < 5*60*1000);
  const kullanicilarTaze = _cacheUsers.length > 0 && (_simdi - (Number(lsGet('yo_usersTs',0))||0) < 30*60*1000);
  const aySorgusu = postlarTaze ? Promise.resolve(null) : ayinSiirleriSorgusuBaslat();
  try {
    // 1. AŞAMA — HIZLI AÇILIŞ: kullanıcıları ve yalnızca EN YENİ ~30 şiiri çekiyoruz.
    // Önceden TÜM şiirler (içlerindeki tüm resimlerle birlikte) her açılışta tek seferde
    // indiriliyordu; paylaşım sayısı arttıkça bu süre giderek uzuyordu. Artık akış,
    // en güncel içerikle saniyeler içinde doluyor; eski şiirler arka planda gelir.
    const [usersSnapshot, sonPostsSnapshot] = await Promise.all([
      kullanicilarTaze ? Promise.resolve({ docs: [] }) : db.collection("users").get().catch(err => { firestoreHataBildir(err); return { docs: [] }; }),
      postlarTaze ? Promise.resolve(null) : db.collection("posts").orderBy("ts","desc").limit(30).get().catch(() => null)
    ]);

    // Okuma başarısız olursa (kota/ağ) yerel önbellekteki kullanıcıları SİLME.
    if(usersSnapshot.docs.length){ S.users = usersSnapshot.docs.map(doc => doc.data()); lsSet('yo_usersTs', Date.now()); }

    if (!S.users.find(u => u.username === ADMIN_USERNAME)) {
      S.users.push(adminProfileObj);
    }
    lsSet('yo_users', S.users);

    if (sonPostsSnapshot && sonPostsSnapshot.docs.length) {
      // ÖNCEKİ HATA: önbellekteki tüm şiirler burada yalnızca son 30 şiirle DEĞİŞTİRİLİYORDU;
      // sıralama sayfası ~100 şiirle kalıyor, tam liste için sayfayı yenileyip beklemek gerekiyordu.
      // Artık yeni gelenler mevcut listeye eklenir/güncellenir.
      const mevcut1 = new Map(S.posts.map(post => [post.id, post]));
      sonPostsSnapshot.docs.forEach(doc => { const d = doc.data(); mevcut1.set(d.id, d); });
      S.posts = postSirala(Array.from(mevcut1.values()));
      postOnbellegeYaz(S.posts);
      lsSet('yo_postTs', Date.now());
    }

    // AYIN ŞİİRLERİ için yalnızca en yeni 30 şiire güvenme.
    // İçinde bulunduğumuz ayın TÜM şiirlerini ayrıca Firebase'den çekiyoruz.
    // Böylece ayın başındaki şiirler, son 30 şiirin dışında kalsalar bile
    // "Ayın Şiirleri" sekmesinde görünür.
    try {
      const turkeyParts = new Intl.DateTimeFormat('en-US', {
        timeZone: 'Europe/Istanbul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());
      const ty = Number(turkeyParts.find(x => x.type === 'year')?.value);
      const tm = Number(turkeyParts.find(x => x.type === 'month')?.value);

      // Türkiye saati UTC+3. Firestore ts milisaniye cinsinden tutuluyor.
      const ayBaslangicMs = Date.UTC(ty, tm - 1, 1) - (3 * 60 * 60 * 1000);
      const sonrakiAyBaslangicMs = Date.UTC(ty, tm, 1) - (3 * 60 * 60 * 1000);

      const aySnapshot = await aySorgusu;

      if (aySnapshot && aySnapshot.docs.length) {
        const ayPosts = aySnapshot.docs.map(doc => doc.data());
        const mevcut = new Map(S.posts.map(post => [post.id, post]));
        ayPosts.forEach(post => mevcut.set(post.id, post));
        S.posts = postSirala(Array.from(mevcut.values()));
        postOnbellegeYaz(S.posts);
      }
    } catch (e) {
      console.warn('Ayın şiirleri verisi alınamadı:', e);
    }

    // Paylaşım linkiyle açılan şiir, en yeni 30 şiir arasında değilse
    // (örn. eski bir şiirse) onu doğrudan ID'siyle tekil olarak çekiyoruz.
    if (S.postId && !S.posts.find(p => p.id === S.postId)) {
      try {
        const dogPost = await db.collection("posts").doc(S.postId).get();
        if (dogPost.exists) {
          S.posts = postSirala([...S.posts, dogPost.data()]);
          postOnbellegeYaz(S.posts);
        }
      } catch {}
    }

    if (S.me && S.me.username === ADMIN_USERNAME) {
      S.me = adminProfileObj;
    } else if (S.me && S.users.length) {
      const guncelBen = S.users.find(u => u.id === S.me.id);
      if (guncelBen) S.me = guncelBen;
      else if (usersSnapshot.docs.length) {
        // Hesap admin tarafından silinmiş: oturumu kapat.
        canliDinleyicileriDurdur();
        S.me = null; S.msgs = []; S.notifs = [];
        lsSet('yo_me', null); lsSet('yo_msgs', []); lsSet('yo_notifs', []);
      }
    }
  } catch (error) {
    console.log("Bağlantı hatası:", error);
  } finally {
    S.loading = false;
    // Giriş yapılmış olsun ya da olmasın site her zaman anasayfada (feed) açılır.
    // login/register ekranları artık sadece bir eyleme (paylaşım/yorum/puan/vb.) teşebbüs
    // edildiğinde devreye girer (bkz. girisGerekli()).
    if(S.screen==='landing'||S.screen==='login'||S.screen==='register'){
      S.screen='feed';
    }
    // Uygulamanın başladığı ekranı tarayıcı geçmişine temel (baseline) olarak yaz.
    // Bundan sonraki her go() çağrısı bunun üzerine "ileri" doğru geçmiş kaydı ekler,
    // böylece geri tuşu bu ekrana (anasayfaya değil, gerçek önceki duruma) döner.
    {
      const baslangicYolu = (S.screen==='postdetail' && S.postId) ? postYolu(S.postId) : '/#'+S.screen;
      history.replaceState({screen:S.screen, profileId:S.profileId, postId:S.postId}, '', baslangicYolu);
    }
    render();
    bildirimDinleyiciBaslat();
    adminEskiBildirimTemizligi();
    // (KOTA TASARRUFU) Tam senkron artık burada her açılışta değil, yalnızca sıralama/keşfet/profil
    // ekranı açıldığında render() içinden başlatılır.
    // 2. AŞAMA — kullanıcı akışı görmeye başladıktan SONRA, arka planda geri kalan
    // (eski) şiirleri, mesajları ve bildirimleri sessizce tamamlıyoruz. Bu aşama
    // sıralama/keşfet gibi TÜM şiirlere ihtiyaç duyan ekranların doğruluğu içindir.
  }
}

async function tumVeriyiArkaplandaTamamla(){
  try {
    // Kota tasarrufu: TÜM şiirleri her sayfa açılışında okumak günlük okuma kotasını
    // hızla bitiriyordu (şiir sayısı kadar okuma × her açılış). Artık tam senkron
    // en fazla 30 dakikada bir yapılıyor; arada yalnızca son 30 şiir + bu ayın
    // şiirleri (1. aşama) yenileniyor.
    const TAM_SENKRON_ARALIK = 12*60*60*1000;
    const sonTam = Number(lsGet('yo_tamSenkronTs', 0)) || 0;
    const tamSayi = Number(lsGet('yo_tamSayi', 0)) || 0;
    // Yalnızca önbellek GERÇEKTEN tam ise (son tam senkrondaki şiir sayısına ulaşıyorsa) atla.
    // Eski koşul "30'dan fazla şiir varsa" idi; ay şiirleriyle ~100'e çıkan eksik liste de
    // "tam" sayılıp 30 dakika boyunca eksik kalıyordu.
    if(tamSayi > 0 && (S.posts||[]).length >= tamSayi && Date.now() - sonTam < TAM_SENKRON_ARALIK){
      S.tumPostlarHazir = true;
      return;
    }
    const postsSnapshot = await db.collection("posts").get().catch(err => { firestoreHataBildir(err); return { docs: [] }; });
    const tumPostlar = postsSnapshot.docs.length ? postsSnapshot.docs.map(doc => doc.data()) : [];
    if(tumPostlar.length){
      S.posts = postSirala(tumPostlar);
      const yazim = postOnbellegeYaz(S.posts);
      // Önbellek tam yazılamadıysa bir sonraki açılışta tekrar tam senkron yapılsın.
      lsSet('yo_tamSayi', yazim==='tam' ? S.posts.length : 0);
      lsSet('yo_tamSenkronTs', Date.now());
    }
    S.tumPostlarHazir = true;

    // Mesaj ve bildirimler artık burada tek seferlik çekilmiyor; canliDinleyicileriBaslat()
    // ile ANLIK (onSnapshot) olarak dinleniyor.
    // Tüm ekranı yeniden çizmek kaydırmayı sıfırlıyor, yüklenen resimleri/sesleri bozuyordu.
    // Yalnızca tüm şiirlere ihtiyaç duyan ekranlar yenilenir; akış zaten canlı listeden okur.
    if(['leaderboard','explore','profile','postdetail'].includes(S.screen)) render();
  } catch(error) {
    console.log("Arkaplan senkron hatası:", error);
    S.tumPostlarHazir = true;
  }
}

// ── Firestore hata görünürlüğü ───────────────────────────────────────────────
// Kota dolduğunda (resource-exhausted) okuma ve yazma sessizce başarısız oluyordu;
// kullanıcı mesajın gittiğini sanıyordu. Artık ekranda uyarı çıkıyor.
let _kotaUyariGosterildi = false;
function kotaHatasiMi(err){
  const c = String(err?.code||'');
  const m = String(err?.message||'');
  return c==='resource-exhausted' || /quota|resource-exhausted/i.test(m);
}
function firestoreHataBildir(err){
  console.error('Firestore hatası:', err);
  if(!kotaHatasiMi(err) || _kotaUyariGosterildi) return;
  _kotaUyariGosterildi = true;
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:8px;right:8px;bottom:78px;z-index:9999;background:#7f1d1d;color:#fff;border:1px solid #fca5a5;border-radius:12px;padding:10px 14px;font-size:.85rem;line-height:1.4;display:flex;gap:10px;align-items:flex-start';
  bar.innerHTML = '<span style="flex:1">⚠️ Veritabanı günlük kotası doldu. Mesaj, bildirim ve yeni paylaşımlar kota yenilenene kadar gitmeyebilir.</span>';
  const kapat = document.createElement('button');
  kapat.textContent = '✕';
  kapat.style.cssText = 'background:none;border:none;color:#fff;font-size:1rem;cursor:pointer';
  kapat.onclick = ()=>bar.remove();
  bar.appendChild(kapat);
  document.body.appendChild(bar);
}
// Gönderilmekte (bekliyor) veya gönderilemeyen (hata) mesajların durumu
const MSG_DURUM = {};

// Bildirimleri VE mesajları CANLI (real-time) dinler — sayfa yenilemeden anında düşer.
// Önceden dinleyici yalnızca sayfa ilk açıldığında (zaten giriş yapılmışsa) başlıyordu;
// giriş yapıp sayfayı yenilemeden kalan kullanıcıda hiç başlamıyordu ve mesajlar hiç
// dinlenmiyordu. Artık login/register'da başlatılır, logout'ta durdurulur.
let _canliUnsubs = [];
let _canliKullaniciId = null;
let _msgKutusu = { gelen: [], giden: [] };

function canliDinleyicileriDurdur(){
  _canliUnsubs.forEach(fn => { try{ fn(); }catch(_){} });
  _canliUnsubs = [];
  _canliKullaniciId = null;
  _eskiBildirimTemizlendi = false;
  _msgKutusu = { gelen: [], giden: [] };
}

function canliArayuzuTazele(){
  mesajBildirimRozetGuncelle();
  // Mesajlar ekranı açıksa sohbeti/listeyi (yazılan taslağı bozmadan) tazele
  if(S.screen==='messages' && typeof window._mesajEkraniTazele==='function'){
    window._mesajEkraniTazele();
  } else if(S.screen==='notifs'){
    render();
  }
}

function canliDinleyicileriBaslat(){
  if(!S.me) return;
  if(_canliKullaniciId === S.me.id && _canliUnsubs.length) return;
  canliDinleyicileriDurdur();
  const benId = S.me.id;
  _canliKullaniciId = benId;

  // Bildirimler
  _canliUnsubs.push(db.collection("notifs").where("toId","==",benId).onSnapshot(snapshot=>{
    S.notifs = snapshot.docs.map(doc=>doc.data()).sort(zamanAzalan);
    lsSet('yo_notifs', S.notifs);
    eskiBildirimleriTemizle();
    canliArayuzuTazele();
  }, err=>firestoreHataBildir(err)));

  // Mesajlar: gelenler + gönderilenler (iki ayrı sorgu birleştirilir)
  const msgBirlestir = ()=>{
    const harita = new Map();
    [..._msgKutusu.gelen, ..._msgKutusu.giden].forEach(m=>harita.set(m.id, m));
    // Sunucuya henüz ulaşmamış / ulaşamamış kendi mesajlarımız listeden kaybolmasın
    S.msgs.forEach(m=>{ if(MSG_DURUM[m.id] && !harita.has(m.id)) harita.set(m.id, m); });
    S.msgs = Array.from(harita.values()).sort(zamanArtan);
    lsSet('yo_msgs', S.msgs);
    canliArayuzuTazele();
  };
  _canliUnsubs.push(db.collection("msgs").where("toId","==",benId).onSnapshot(snap=>{
    _msgKutusu.gelen = snap.docs.map(d=>d.data());
    msgBirlestir();
  }, err=>firestoreHataBildir(err)));
  _canliUnsubs.push(db.collection("msgs").where("fromId","==",benId).onSnapshot(snap=>{
    _msgKutusu.giden = snap.docs.map(d=>d.data());
    msgBirlestir();
  }, err=>firestoreHataBildir(err)));
}
// Eski isim (verileriYukle içinde kullanılıyor)

const uid=()=>Math.random().toString(36).slice(2,9);
const now=()=>new Date().toLocaleString('tr-TR');
// Türkiye saatine (Europe/Istanbul) göre "bugünün" başlangıcını ms cinsinden döndürür.
// Günlük paylaşım limiti (bkz. A.addPost / bugunkuPaylasimSayisi) buna göre hesaplanır,
// böylece kullanıcının tarayıcı saat dilimi ne olursa olsun sınır Türkiye gününe göre işler.
function turkiyeGunBaslangicMs(){
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(new Date());
  const ty = Number(parts.find(x => x.type === 'year')?.value);
  const tm = Number(parts.find(x => x.type === 'month')?.value);
  const td = Number(parts.find(x => x.type === 'day')?.value);
  // Türkiye saati UTC+3 sabit kullanılıyor (Firestore ts de bu varsayımla karşılaştırılıyor).
  return Date.UTC(ty, tm - 1, td) - (3 * 60 * 60 * 1000);
}
// Kullanıcının BUGÜN (Türkiye saatiyle) kaç şiir paylaştığını sayar.
function bugunkuPaylasimSayisi(userId){
  if(!userId) return 0;
  const baslangic = turkiyeGunBaslangicMs();
  return S.posts.filter(p => p.authorId===userId && (p.ts||0) >= baslangic).length;
}

function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}
// Şiir önbelleği: 500+ şiir localStorage'ın ~5MB sınırını aşınca yazma SESSİZCE başarısız
// oluyor ve önbellek eski/eksik kalıyordu. Önce tam yazılır; olmazsa base64 (data:) görseller
// çıkarılarak hafif kopya yazılır. Dönüş: 'tam' | 'hafif' | 'yok'
function postOnbellegeYaz(posts){
  if(lsSet('yo_posts',posts)) return 'tam';
  const hafif=posts.map(p=>(typeof p.image==='string'&&p.image.startsWith('data:'))?{...p,image:''}:p);
  if(lsSet('yo_posts',hafif)) return 'hafif';
  try{localStorage.removeItem('yo_posts')}catch{}
  return 'yok';
}

// Bir şiirin, başka sitelerde/uygulamalarda paylaşılabilecek özel linkini üretir.
// Facebook/WhatsApp gibi sitelerin önizleme botları JavaScript çalıştırmaz; bu
// yüzden şiirin başlığını/görselini görebilmeleri için bu link, Vercel'de
// yayınladığınız küçük bir fonksiyona (api/postPreview.js) gider. O fonksiyon,
// bot ise önizleme kartı üretir, gerçek kullanıcıysa doğrudan uygulamaya yönlendirir.
//
// ⚠️ AŞAĞIDAKİ ADRESİ, Vercel size verdiği kendi adresinizle DEĞİŞTİRİN
// (örn. "https://yeniozanlar.vercel.app"). Vercel'e deploy ettikten sonra
// projenizin ana sayfasında bu adresi göreceksiniz.
const PAYLASIM_SUNUCUSU = window.location.origin;

// Bir metni, linklerde kullanılabilecek sade bir "slug"a çevirir:
// Türkçe karakterleri sadeleştirir, küçük harfe çevirir, boşlukları tire yapar,
// izin verilmeyen karakterleri temizler. Örn: "Güneş Batarken!" -> "gunes-batarken"
function slugOlustur(metin){
  const trMap = {'ç':'c','Ç':'c','ğ':'g','Ğ':'g','ı':'i','İ':'i','ö':'o','Ö':'o','ş':'s','Ş':'s','ü':'u','Ü':'u'};
  let s = (metin||'').toString().trim();
  s = s.replace(/[çÇğĞıİöÖşŞüÜ]/g, ch => trMap[ch]);
  s = s.toLowerCase();
  s = s.replace(/[^a-z0-9\s-]/g,'');
  s = s.trim().replace(/\s+/g,'-').replace(/-+/g,'-').replace(/^-+|-+$/g,'');
  if(s.length>60) s = s.slice(0,60).replace(/-+$/,'');
  return s || 'siir';
}

// Bir şiirin, "/post/{baslik-slug}-{id}" biçimindeki yolunu (path) üretir — bu yol hem
// paylaşım linkinde hem de tarayıcının adres çubuğunda (uygulama içi gezinirken) kullanılır.
// Uzantı (path'in son parçası) doğrudan şiirin başlığından türetiliyor; sondaki {id} ise
// linkin her zaman tek/geçerli bir şiiri gösterebilmesi için eklenen (aynı başlıklı iki
// şiirin linklerinin çakışmaması için gerekli) teknik bir ektir.
function postYolu(postId){
  const post = (S.posts||[]).find(p=>p.id===postId);
  const baslikKaynagi = post ? (post.title || post.text || '') : '';
  const slug = slugOlustur(baslikKaynagi);
  return '/post/' + slug + '-' + postId;
}

// Bir şiirin, başka sitelerde paylaşılabilecek TAM linkini üretir (domain dahil).
function paylasimLinki(postId){
  const post = (S.posts||[]).find(p => p.id === postId);
  const version = post?.ts || Date.now();
  return PAYLASIM_SUNUCUSU + postYolu(postId) + '?v=' + encodeURIComponent(version);
}

// Şiir paylaşıldığında/düzenlendiğinde, Facebook'un o linke ait önizleme önbelleğini
// arka planda otomatik tazeler (bkz. api/facebookScrape.js). Böylece kimse Facebook
// Sharing Debugger'a girip elle "Scrape Again" yapmak zorunda kalmaz; ilk paylaşımdan
// itibaren doğru başlık/görsel görünür. Hata olursa (ör. henüz FB_APP_ID/SECRET
// tanımlanmadıysa) sessizce yutulur — paylaşım akışını asla engellemez.
function facebookOnizlemeyiTazele(postId){
  try{
    fetch('/api/facebookScrape', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ url: paylasimLinki(postId) })
    }).catch(()=>{});
  }catch{}
}

// Küçük, kendiliğinden kaybolan bir bildirim balonu gösterir (ör. "Link kopyalandı").
function toastGoster(mesaj){
  const eski=document.getElementById('yo-toast');
  if(eski) eski.remove();
  const t=h('div',{id:'yo-toast',style:{position:'fixed',bottom:'24px',left:'50%',transform:'translateX(-50%)',background:'linear-gradient(135deg,#2d1060,#1e0a3e)',border:'1px solid #7c3aed',color:'#e9d5ff',padding:'10px 18px',borderRadius:'999px',fontSize:'.85rem',zIndex:'9999',boxShadow:'0 4px 20px rgba(0,0,0,.4)',opacity:'0',transition:'opacity .25s'}},mesaj);
  document.body.appendChild(t);
  requestAnimationFrame(()=>{t.style.opacity='1';});
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300);},2200);
}

// Şiirin linkini panoya kopyalar (modern tarayıcılarda navigator.clipboard,
// desteklenmiyorsa eski yöntemle geçici bir <textarea> üzerinden kopyalar).
async function linkiKopyala(postId){
  const link=paylasimLinki(postId);
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(link);
    } else {
      const ta=document.createElement('textarea');
      ta.value=link;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    toastGoster('🔗 Şiirin linki kopyalandı!');
  }catch{
    toastGoster('Link kopyalanamadı, tarayıcı izin vermedi.');
  }
}

// ═══════════════════════ INSTAGRAM HİKAYE PAYLAŞIMI ═══════════════════════
// Bir şiiri, Instagram Hikaye'de paylaşılabilecek bir görsele dönüştürür.
// Genişlik sabit (1080px, hikaye standardı); uzunluk şiirin tamamını
// kapsayacak şekilde dinamik hesaplanır. Kullanıcı, açılan modalde bu "en
// uzun" görselin ne kadarının paylaşılacağını sürükleyerek/kaydırarak seçer.

const IG_W = 1080;          // Instagram hikayesi standart genişliği
const IG_PAD = 72;          // yatay iç boşluk
const IG_MEDIA_H = 1080;    // üstteki görsel/video alanı (kare)
const IG_LINE_H = 62;       // şiir satır yüksekliği
const IG_HASHTAGS = '#yeniozanlar #şiir #şair'; // hikaye görselinin altına otomatik eklenen etiketler

// Kullanılan özel fontların (Playfair Display / Crimson Text) canvas'a
// çizilmeden önce tarayıcı tarafından yüklenmiş olmasını garantiler;
// aksi halde ilk çizimde geçici olarak sistem fontuyla (yamuk) çizilebilir.
async function igFontlariHazirla(){
  try{
    await Promise.all([
      document.fonts.load("italic 700 46px 'Playfair Display'"),
      document.fonts.load("700 40px 'Playfair Display'"),
      document.fonts.load("44px 'Crimson Text'"),
      document.fonts.load("30px 'Crimson Text'")
    ]);
    await document.fonts.ready;
  }catch{}
}

// Verilen metni, satır satır maxWidth'i aşmayacak şekilde böler (kelime bazlı
// kaydırma). Boş satırlar (kıta araları) korunur.
function igSatirlaraBol(ctx, text, maxWidth){
  const lines=[];
  String(text||'').split('\n').forEach(paragraf=>{
    if(paragraf.trim()===''){lines.push('');return;}
    const kelimeler=paragraf.split(' ');
    let satir='';
    kelimeler.forEach(k=>{
      const deneme = satir ? satir+' '+k : k;
      if(ctx.measureText(deneme).width>maxWidth && satir){
        lines.push(satir); satir=k;
      } else satir=deneme;
    });
    lines.push(satir);
  });
  return lines;
}

// object-fit:cover mantığıyla bir görseli hedef dikdörtgene sığdırıp çizer.
function igCoverCiz(ctx,img,dx,dy,dw,dh){
  const ir=img.width/img.height, dr=dw/dh;
  let sx,sy,sw,sh;
  if(ir>dr){ sh=img.height; sw=sh*dr; sx=(img.width-sw)/2; sy=0; }
  else { sw=img.width; sh=sw/dr; sx=0; sy=(img.height-sh)/2; }
  ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);
}

// Şiirin başından sonuna kadar TÜM içeriği içeren, sabit genişlikte, uzun bir
// "hikaye" canvas'ı üretir. Kullanıcı bunun bir kısmını (üstten itibaren)
// seçip paylaşacaktır. Video şiirlerde CORS nedeniyle YouTube küçük resmini
// canvas'a gömmek dışa aktarımı bozabildiğinden, marka uyumlu bir video
// rozeti çiziyoruz.
async function igHikayeCanvasOlustur(post, author){
  await igFontlariHazirla();
  const hasMedia = !!post.image;
  const isVideo = !hasMedia && !!ytId(post.youtube);
  const MEDIA_H = (hasMedia||isVideo) ? IG_MEDIA_H : 0;

  const olcCanvas=document.createElement('canvas');
  const olcCtx=olcCanvas.getContext('2d');
  const genislik=IG_W-IG_PAD*2;

  olcCtx.font="italic 700 46px 'Playfair Display'";
  const baslikSatirlari = post.title ? igSatirlaraBol(olcCtx, `"${post.title}"`, genislik) : [];

  olcCtx.font="44px 'Crimson Text'";
  const siirSatirlari = post.text ? igSatirlaraBol(olcCtx, post.text, genislik) : [];

  let headerH = 56 + 44*2 + 30; // üst boşluk + avatar bloğu
  if(baslikSatirlari.length) headerH += baslikSatirlari.length*54 + 34;
  headerH += 54; // ayraç çizgisi ve altı

  const totalH = MEDIA_H + headerH + siirSatirlari.length*IG_LINE_H + 90;

  const canvas=document.createElement('canvas');
  canvas.width=IG_W; canvas.height=Math.max(totalH, 600);
  const ctx=canvas.getContext('2d');

  const grad=ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,'#1a0f2e'); grad.addColorStop(1,'#0f0a1a');
  ctx.fillStyle=grad; ctx.fillRect(0,0,IG_W,canvas.height);

  let y=0;
  if(hasMedia){
    try{
      await new Promise((res,rej)=>{
        const img=new Image();
        img.onload=()=>{ igCoverCiz(ctx,img,0,0,IG_W,MEDIA_H); res(); };
        img.onerror=rej;
        img.src=post.image;
      });
    }catch{
      // görsel yüklenemezse boş bırakma, yerine kibar bir yer tutucu koy
      ctx.fillStyle='#2d1b52'; ctx.fillRect(0,0,IG_W,MEDIA_H);
    }
    y=MEDIA_H;
  } else if(isVideo){
    const vid = ytId(post.youtube);
    try{
      await new Promise((res2,rej)=>{
        const img=new Image();
        img.onload=()=>{ igCoverCiz(ctx,img,0,0,IG_W,MEDIA_H); res2(); };
        img.onerror=rej;
        img.src=`/api/ytThumb?vid=${vid}`;
      });
      // ince bir karartma + oynat ikonu, video olduğu belli olsun
      ctx.save();
      const g3=ctx.createLinearGradient(0,MEDIA_H-260,0,MEDIA_H);
      g3.addColorStop(0,'rgba(10,7,24,0)'); g3.addColorStop(1,'rgba(10,7,24,.55)');
      ctx.fillStyle=g3; ctx.fillRect(0,MEDIA_H-260,IG_W,260);
      ctx.restore();
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='96px sans-serif'; ctx.fillStyle='rgba(255,255,255,.95)';
      ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=14;
      ctx.fillText('▶️', IG_W/2, MEDIA_H-90);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.shadowBlur=0;
    }catch{
      // Kapak görseli hiçbir boyutta yüklenemezse eski marka rozetine geri dön
      const g2=ctx.createLinearGradient(0,0,IG_W,MEDIA_H);
      g2.addColorStop(0,'#2d1060'); g2.addColorStop(1,'#0a0718');
      ctx.fillStyle=g2; ctx.fillRect(0,0,IG_W,MEDIA_H);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='140px sans-serif'; ctx.fillStyle='#fff';
      ctx.fillText('▶️', IG_W/2, MEDIA_H/2-10);
      ctx.font="36px 'Crimson Text'"; ctx.fillStyle='#c4b5fd';
      ctx.fillText('🎵 Video Şiir', IG_W/2, MEDIA_H/2+120);
      ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    }
    y=MEDIA_H;
  }

  if(hasMedia||isVideo){
    ctx.save();
    ctx.font="600 30px 'Crimson Text'";
    ctx.fillStyle='rgba(255,255,255,.88)';
    ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=10;
    ctx.fillText('🪶 Yeni Ozanlar', 36, 60);
    ctx.restore();
  }

  y+=56;
  const avR=44, avX=IG_PAD+avR, avY=y+avR;
  ctx.beginPath(); ctx.arc(avX,avY,avR,0,Math.PI*2); ctx.closePath();
  const avGrad=ctx.createLinearGradient(avX-avR,avY-avR,avX+avR,avY+avR);
  const isAdm = author?.username === ADMIN_USERNAME;
  avGrad.addColorStop(0, isAdm?'#f59e0b':(author?.color||'#7c3aed'));
  avGrad.addColorStop(1, isAdm?'#d97706':'#a855f7');
  ctx.fillStyle=avGrad; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='700 34px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(isAdm?'👑':(author?.avatar||author?.name?.slice(0,2).toUpperCase()||'?'), avX, avY+2);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  const textX=avX+avR+24;
  ctx.fillStyle='#e9d5ff'; ctx.font="700 40px 'Playfair Display'";
  ctx.fillText(author?.name||'', textX, y+38);
  ctx.fillStyle='#a78bfa'; ctx.font="30px 'Crimson Text'";
  ctx.fillText(`@${author?.username||''}`, textX, y+78);
  y += avR*2+30;

  if(baslikSatirlari.length){
    ctx.fillStyle='#e9d5ff'; ctx.font="italic 700 46px 'Playfair Display'";
    baslikSatirlari.forEach(satir=>{ y+=54; ctx.fillText(satir, IG_PAD, y); });
    y+=34;
  }

  ctx.strokeStyle='rgba(124,58,237,.35)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(IG_PAD,y); ctx.lineTo(IG_W-IG_PAD,y); ctx.stroke();
  y+=54;

  ctx.fillStyle='#ddd6fe'; ctx.font="44px 'Crimson Text'";
  siirSatirlari.forEach(satir=>{ y+=IG_LINE_H; ctx.fillText(satir, IG_PAD, y); });

  return canvas;
}

// Instagram Hikaye paylaşım modalini açar: şiirin en uzun/tam halini içeren
// canvas'ı arka planda oluşturur, sabit genişlikte bir önizleme gösterir ve
// kullanıcının önizlemeyi sürükleyerek (veya kaydırıcıyla) ne kadarının dahil
// edileceğini seçmesini sağlar.

// ═══════════════════════ ŞİİRİ VİDEO OLARAK KAYDET ═══════════════════════
// Kaydırma modundaki okuma hissini taklit eder: 9:16 canvas + şiir görseli
// arka plan + şiir metni + ses. Video süresi doğrudan audioUrl'un süresidir.
// Tarayıcıların yerleşik MediaRecorder'ı nedeniyle çıktı WebM'dir.

async function ffmpegMp4Donustur(kayitBlob, durum, progText, sure, sesVar, girisUzanti){
  if(!window.FFmpeg){
    durum.textContent='⏳ MP4 dönüştürücü yükleniyor...';
    await new Promise((resolve,reject)=>{
      const sc=document.createElement('script');
      sc.src='https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js';
      sc.onload=resolve;
      sc.onerror=()=>reject(new Error('MP4 dönüştürücü yüklenemedi. İnternet bağlantısını kontrol edin.'));
      document.head.appendChild(sc);
    });
  }
  if(!window.FFmpeg?.createFFmpeg) throw new Error('MP4 dönüştürücü başlatılamadı.');

  const {createFFmpeg, fetchFile}=window.FFmpeg;
  const ffmpeg=createFFmpeg({
    log:false,
    corePath:'https://unpkg.com/@ffmpeg/core@0.11.5/dist/ffmpeg-core.js'
  });
  try{
    ffmpeg.setProgress(({ratio})=>{
      if(ratio>=0 && ratio<=1) progText.textContent='MP4 hazırlanıyor: %'+Math.round(ratio*100);
    });
  }catch(_){}

  durum.textContent='⏳ MP4 motoru hazırlanıyor...';
  await ffmpeg.load();

  durum.textContent='⏳ Video düzenleniyor (ileri-geri sarma için)...';
  progText.textContent='MP4 düzenleme başladı...';

  const girisAd = girisUzanti==='mp4' ? 'input.mp4' : 'input.webm';
  ffmpeg.FS('writeFile',girisAd,await fetchFile(kayitBlob));

  // MediaRecorder çıktısı değişken kare hızlıdır ve süre/indeks bilgisi içermez; bu yüzden
  // oynatıcılar ileri-geri saramaz. Burada: sabit 30 kare/sn (CFR), her 1 sn'de bir anahtar kare
  // (anında sarma), tam seslendirme süresi (-t) ve dosya başında indeks (faststart).
  const ffArgs=[
    '-fflags','+genpts',
    '-analyzeduration','2147483647',
    '-probesize','2147483647',
    '-i',girisAd,
    '-t',String(Number(sure).toFixed(3)),
    '-vf','fps=30,scale=trunc(iw/2)*2:trunc(ih/2)*2',
    '-c:v','libx264',
    '-preset','veryfast',
    '-crf','22',
    '-pix_fmt','yuv420p',
    '-g','30',
    '-keyint_min','30',
    '-sc_threshold','0'
  ];
  if(sesVar){
    ffArgs.push('-af','aresample=async=1:first_pts=0','-c:a','aac','-b:a','192k','-ar','44100','-ac','2');
  }else{
    ffArgs.push('-an');
  }
  ffArgs.push('-movflags','+faststart','output.mp4');
  await ffmpeg.run(...ffArgs);

  const data=ffmpeg.FS('readFile','output.mp4');
  const mp4Blob=new Blob([data.buffer],{type:'video/mp4'});

  try{ffmpeg.FS('unlink',girisAd);}catch{}
  try{ffmpeg.FS('unlink','output.mp4');}catch{}
  try{ffmpeg.exit();}catch{}

  if(!mp4Blob.size) throw new Error('MP4 dosyası boş oluştu.');
  return mp4Blob;
}

// Ses dosyasını önce doğrudan, CORS yüzünden olmazsa aynı-origin proxy üzerinden getirir.
async function sesDosyasiniGetir(url){
  try{
    const r=await fetch(url,{mode:'cors',cache:'no-store'});
    if(r.ok) return r;
  }catch(_){}
  let r2;
  try{ r2=await fetch('/api/ttsGenerate?proxy='+encodeURIComponent(url),{cache:'no-store'}); }
  catch(e){ throw new Error('Ses dosyasına erişilemedi (ağ hatası). R2 bucket CORS ayarında bu sitenin adresine GET izni verin.'); }
  if(!r2.ok) throw new Error('Ses dosyasına erişilemedi (HTTP '+r2.status+'). R2 bucket CORS ayarında bu sitenin adresine GET izni verin.');
  return r2;
}

function sesPlatformBilgisiGlobal(url){
  const u=String(url||'').trim();
  if(!u) return {type:'none'};
  if(/open\.spotify\.com\/(track|album|playlist|episode)\//i.test(u)) return {type:'spotify'};
  if(/soundcloud\.com\//i.test(u)) return {type:'soundcloud'};
  if(/(?:youtube\.com\/(?:watch|shorts|live|embed)|youtu\.be\/)/i.test(u)) return {type:'youtube'};
  return {type:'direct'};
}

// Video arka planı için resmi canvas'a GÜVENLİ çizilebilir biçimde yükler.
// Sırayla: doğrudan (CORS) → fetch ile blob → aynı-origin proxy → /api/postImage.
// Blob/proxy yoluyla gelen resim aynı-origin sayıldığı için canvas "tainted" olmaz.
async function videoGorselYukle(url, postId){
  const yukle=(src,cors)=>new Promise((resolve,reject)=>{
    const im=new Image();
    if(cors) im.crossOrigin='anonymous';
    im.onload=()=>im.naturalWidth?resolve(im):reject(new Error('bos resim'));
    im.onerror=()=>reject(new Error('resim yuklenemedi'));
    im.src=src;
  });
  const blobtan=async(adres)=>{
    const r=await fetch(adres,{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const b=await r.blob();
    if(b.type && !/^image\//i.test(b.type)) throw new Error('resim degil');
    return await yukle(URL.createObjectURL(b),false);
  };
  const denemeler=[];
  const u=String(url||'');
  if(u){
    if(/^(data|blob):/i.test(u)) denemeler.push(()=>yukle(u,false));
    else{
      denemeler.push(()=>yukle(u,true));
      denemeler.push(()=>blobtan(u));
      denemeler.push(()=>blobtan('/api/ttsGenerate?proxy='+encodeURIComponent(u)));
    }
  }
  if(postId) denemeler.push(()=>yukle('/api/postImage?id='+encodeURIComponent(postId),false));
  for(const dene of denemeler){
    try{ return await dene(); }catch(_){}
  }
  return null;
}

async function siiriVideoOlarakKaydet(post){
  // Video SESLENDİRME (audioUrl) uzunluğunda olur; AI müzik (musicUrl) varsa onun altına karıştırılır.
  // Seslendirme yoksa video müziğin uzunluğunda olur.
  const audioUrl = sesPlatformBilgisiGlobal(post?.audioUrl||'').type==='direct' ? post.audioUrl : '';
  const musicUrl = sesPlatformBilgisiGlobal(post?.musicUrl||'').type==='direct' ? post.musicUrl : '';
  const youtubeId = ytId(post?.youtube);
  const hasNarration = !!audioUrl;
  const hasMusic = !!musicUrl;
  const hasAudio = hasNarration || hasMusic;
  // YouTube iframe'i canvas/MediaRecorder içine güvenilir biçimde aktarılamaz
  // (cross-origin). Bu nedenle YouTube bağlantısı varsa, video alanında kapak
  // görselini kullanıyoruz. Kendi ses dosyası varsa yine ses kayda eklenir.

  const author=byId(post.authorId);
  const bg=h('div',{class:'modal-bg'});
  const kapat=()=>{ try{cancelAnimationFrame(animId);}catch{}; bg.remove(); };
  bg.onclick=e=>{if(e.target===bg)kapat();};

  const modal=h('div',{class:'modal',style:{maxWidth:'420px'}});
  const baslik=h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},[
    h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontSize:'1.05rem'}},'🎬 Video Olarak Kaydet'),
    h('button',{class:'btn',style:{background:'none',color:'#6b5b8a',fontSize:'1.4rem'},onclick:kapat},'✕')
  ]);
  modal.appendChild(baslik);
  const bilgi=h('p',{style:{color:'#a78bfa',fontSize:'.76rem',lineHeight:'1.45',marginBottom:'10px'}},
    hasAudio
      ? 'Şiirin resmi arka plan olur; YouTube varsa video kapak görseli kullanılır. Yazılar kaydırma modundaki gibi akar. Video, seslendirmenin süresi kadar sürer; müzik varsa seslendirmenin altına karıştırılır. MP4 olarak indirilir.'
      : 'Ses dosyası yok. Video 20 saniye sessiz olarak hazırlanır. YouTube varsa video kapak görseli kullanılır. MP4 olarak indirilir.');
  modal.appendChild(bilgi);

  const preview=h('canvas',{width:'540',height:'960',style:{width:'270px',height:'480px',display:'block',margin:'8px auto',borderRadius:'14px',background:'#0a0718',border:'1px solid #3d1f6e'}});
  modal.appendChild(preview);
  const durum=h('p',{style:{textAlign:'center',color:'#a78bfa',fontSize:'.78rem',margin:'8px 0'}},'⏳ Ses ve görsel hazırlanıyor...');
  modal.appendChild(durum);
  const prog=h('div',{class:'video-progress'},[h('div')]);
  modal.appendChild(prog);
  const progText=h('p',{style:{textAlign:'center',color:'#6b5b8a',fontSize:'.68rem',marginBottom:'10px'}},'');
  modal.appendChild(progText);
  const btnRow=h('div',{style:{display:'flex',gap:'8px'}});
  const kaydetBtn=h('button',{class:'pb btn',style:{flex:'1'},disabled:true},'🎬 Videoyu Oluştur');
  const iptalBtn=h('button',{class:'btn',style:{flex:'0 0 90px',background:'transparent',color:'#a78bfa',border:'1px solid #3d1f6e',borderRadius:'10px',padding:'10px'},onclick:kapat},'Kapat');
  btnRow.appendChild(kaydetBtn); btnRow.appendChild(iptalBtn); modal.appendChild(btnRow);
  bg.appendChild(modal);
  document.body.appendChild(bg);

  let animId=0, mediaRecorder=null, chunks=[], audioCtx=null, audioSources=[], stream=null;
  let running=false;

  try{
    await igFontlariHazirla();

    let decoded=null, musicDecoded=null;
    let duration=20;

    // Ses varsa indirip AudioBuffer'a çeviriyoruz. Ses yoksa süre sabit 20 sn.
    if(hasAudio){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const sesYukle=async(u)=>{
        const r=await sesDosyasiniGetir(u);
        if(!r.ok) throw new Error('Ses dosyasına erişilemedi (HTTP '+r.status+').');
        const buf=await r.arrayBuffer();
        return await audioCtx.decodeAudioData(buf.slice(0));
      };
      if(hasNarration){
        durum.textContent='⏳ Seslendirme yükleniyor...';
        decoded=await sesYukle(audioUrl);
      }
      if(hasMusic){
        durum.textContent='⏳ Müzik yükleniyor...';
        try{ musicDecoded=await sesYukle(musicUrl); }
        catch(e){
          if(!decoded) throw e;
          console.warn('Müzik yüklenemedi, yalnızca seslendirme ile devam ediliyor:',e);
        }
      }
      duration=Math.max(1,(decoded||musicDecoded).duration);
    }

    const W=1080,H=1920;
    const ctx=preview.getContext('2d');
    const hiddenCanvas=document.createElement('canvas');
    hiddenCanvas.width=W; hiddenCanvas.height=H;
    const c=hiddenCanvas.getContext('2d');

    // Arka plan: önce şiirin kendi resmi; resim yoksa YouTube kapak görseli.
    let bgImg=null;
    if(post.image || post.id){
      // Resim farklı bir alan adındaysa (R2 vb.) CORS izni yoksa canvas'a çizilemez ve
      // arka plan siyah kalır. Bu yüzden sırayla birkaç yol deneniyor.
      bgImg=await videoGorselYukle(post.image, post.id);
      if(!bgImg && post.image) console.warn('Video arka plan resmi yüklenemedi:', String(post.image).slice(0,120));
    }
    if(!bgImg && youtubeId){
      try{
        // Aynı-origin API kullanılırsa canvas'a güvenli biçimde çizilebilir.
        bgImg=await new Promise((resolve,reject)=>{
          const im=new Image();
          im.onload=()=>resolve(im);
          im.onerror=reject;
          im.src=`/api/ytThumb?vid=${youtubeId}`;
        });
      }catch{
        // API yoksa doğrudan YouTube küçük resmi denenir; canvas CORS izin
        // vermiyorsa aşağıdaki gradient yedeği kullanılır.
        try{
          bgImg=await new Promise((resolve,reject)=>{
            const im=new Image();
            im.crossOrigin='anonymous';
            im.onload=()=>resolve(im);
            im.onerror=reject;
            im.src=`https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg`;
          });
        }catch{ bgImg=null; }
      }
    }

    // Metin alanını hazırla
    const PAD=92, textW=W-PAD*2;
    const lines=[];
    const wrap=(font,text)=>{
      c.font=font;
      String(text||'').split('\n').forEach(par=>{
        if(!par.trim()){lines.push('');return;}
        let line='';
        for(const word of par.split(/\s+/)){
          const test=line?line+' '+word:word;
          if(c.measureText(test).width>textW && line){lines.push(line);line=word;}
          else line=test;
        }
        lines.push(line);
      });
    };
    wrap("700 62px 'Playfair Display'", post.title ? `"${post.title}"` : '');
    if(post.title) lines.push('');
    wrap("52px 'Crimson Text'", post.text||'');
    const lineH=76;
    const contentH=lines.length*lineH;
    const topFixed=220;
    const bottomFixed=150;
    const viewTop=topFixed;
    const viewBottom=H-bottomFixed;
    const viewH=viewBottom-viewTop;
    const maxScroll=Math.max(0,contentH-viewH);

    function cover(img,x,y,w,h){
      const ir=img.width/img.height, dr=w/h;
      let sx,sy,sw,sh;
      if(ir>dr){sh=img.height;sw=sh*dr;sx=(img.width-sw)/2;sy=0;}
      else{sw=img.width;sh=sw/dr;sx=0;sy=(img.height-sh)/2;}
      c.drawImage(img,sx,sy,sw,sh,x,y,w,h);
    }

    function frame(t){
      const p=Math.min(1,t/duration);
      c.clearRect(0,0,W,H);
      if(bgImg) cover(bgImg,0,0,W,H);
      else {
        const g=c.createLinearGradient(0,0,W,H);
        g.addColorStop(0,'#241040'); g.addColorStop(1,'#090612');
        c.fillStyle=g;c.fillRect(0,0,W,H);
      }

      // Fotoğrafı karart: yazı her zaman okunaklı kalsın.
      c.fillStyle='rgba(5,2,12,.48)';c.fillRect(0,0,W,H);
      const vg=c.createLinearGradient(0,0,0,H);
      vg.addColorStop(0,'rgba(5,2,12,.76)');
      vg.addColorStop(.18,'rgba(5,2,12,.22)');
      vg.addColorStop(.78,'rgba(5,2,12,.25)');
      vg.addColorStop(1,'rgba(5,2,12,.82)');
      c.fillStyle=vg;c.fillRect(0,0,W,H);

      c.fillStyle='rgba(255,255,255,.9)';
      c.font="600 34px 'Crimson Text'";
      c.fillText('🪶 Yeni Ozanlar',PAD,72);

      c.fillStyle='#fff';
      c.font="700 42px 'Playfair Display'";
      c.fillText(author?.name||'',PAD,132);
      c.fillStyle='rgba(255,255,255,.72)';
      c.font="30px 'Crimson Text'";
      c.fillText(post.title?`"${post.title}"`:'Şiir',PAD,174);

      c.save();
      c.beginPath();c.rect(0,viewTop,W,viewH);c.clip();
      const scroll=maxScroll*p;
      let y=viewTop-scroll+lineH;
      lines.forEach((line,i)=>{
        if(!line){y+=lineH*.55;return;}
        c.font=i===0&&post.title?"italic 700 58px 'Playfair Display'":"52px 'Crimson Text'";
        c.fillStyle='rgba(255,255,255,.96)';
        c.shadowColor='rgba(0,0,0,.8)';c.shadowBlur=12;
        c.fillText(line,PAD,y);
        y+=lineH;
      });
      c.restore();

      c.fillStyle='rgba(255,255,255,.72)';
      c.font="26px 'Crimson Text'";
      c.textAlign='center';
      c.fillText('yeniozanlar.vercel.app',W/2,H-70);
      c.textAlign='left';

      ctx.clearRect(0,0,preview.width,preview.height);
      ctx.drawImage(hiddenCanvas,0,0,preview.width,preview.height);
    }

    frame(0);
    durum.textContent=hasAudio
      ? `✅ ${decoded?'Seslendirme':'Müzik'}${(decoded&&musicDecoded)?' + müzik':''} hazır · ${Math.round(duration)} saniye`
      : '✅ Ses yok · 20 saniyelik sessiz video hazır';
    kaydetBtn.disabled=false;

    kaydetBtn.onclick=async()=>{
      if(running)return;
      running=true; kaydetBtn.disabled=true; iptalBtn.disabled=true;
      durum.textContent='🎥 Video oluşturuluyor...';
      progText.textContent='0%';

      const canvasStream=hiddenCanvas.captureStream(30);
      if(hasAudio){
        const dest=audioCtx.createMediaStreamDestination();
        audioSources=[];
        const t0=audioCtx.currentTime;
        if(decoded){
          const src=audioCtx.createBufferSource();
          src.buffer=decoded;
          const g=audioCtx.createGain(); g.gain.value=1;
          src.connect(g); g.connect(dest); g.connect(audioCtx.destination);
          audioSources.push(src);
        }
        if(musicDecoded){
          const src=audioCtx.createBufferSource();
          src.buffer=musicDecoded;
          src.loop=true; // müzik seslendirmeden kısaysa baştan döner
          const g=audioCtx.createGain();
          const seviye=decoded?0.22:1; // seslendirme varsa müzik alttan eşlik eder
          g.gain.setValueAtTime(seviye,t0);
          if(duration>3){ // son 2 saniyede yumuşak kapanış
            g.gain.setValueAtTime(seviye,t0+duration-2);
            g.gain.linearRampToValueAtTime(0.0001,t0+duration);
          }
          src.connect(g); g.connect(dest); g.connect(audioCtx.destination);
          audioSources.push(src);
        }
        stream=new MediaStream([
          ...canvasStream.getVideoTracks(),
          ...dest.stream.getAudioTracks()
        ]);
      }else{
        // Ses yoksa yalnızca görüntü kaydı yapılır: tam 20 saniye.
        stream=new MediaStream([...canvasStream.getVideoTracks()]);
      }

      // Önce tarayıcının doğrudan MP4 kaydını dene. Desteklenmiyorsa
      // WebM ara dosyası oluşturup hemen ardından FFmpeg ile MP4'e çeviriyoruz.
      const mp4MimeCandidates=[
        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
        'video/mp4;codecs="avc1.4D401F,mp4a.40.2"',
        'video/mp4'
      ];
      const webmMimeCandidates=[
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm'
      ];
      const directMp4Mime=mp4MimeCandidates.find(x=>window.MediaRecorder?.isTypeSupported?.(x))||'';
      const webmMime=webmMimeCandidates.find(x=>window.MediaRecorder?.isTypeSupported?.(x))||'';
      const mime=directMp4Mime||webmMime;
      if(!window.MediaRecorder || !mime) throw new Error('Bu tarayıcı video kaydını desteklemiyor.');

      chunks=[];
      mediaRecorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:7000000});
      mediaRecorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data);};

      const bitti=new Promise((resolve,reject)=>{
        mediaRecorder.onstop=resolve;
        mediaRecorder.onerror=e=>reject(e.error||new Error('Video kaydı başarısız.'));
      });

      if(hasAudio){
        await audioCtx.resume();
        audioSources.forEach(x=>x.start(0));
      }
      mediaRecorder.start(250);

      const start=performance.now();
      function animate(now){
        const elapsed=Math.min(duration,(now-start)/1000);
        frame(elapsed);
        const percent=Math.min(100,Math.round(elapsed/duration*100));
        prog.firstChild.style.width=percent+'%';
        progText.textContent=`%${percent} · ${elapsed.toFixed(1)} / ${duration.toFixed(1)} sn`;
        if(elapsed<duration && running) animId=requestAnimationFrame(animate);
      }
      animId=requestAnimationFrame(animate);

      setTimeout(()=>{
        if(hasAudio){audioSources.forEach(x=>{try{x.stop();}catch{}});}
        try{mediaRecorder.stop();}catch{}
      },Math.ceil(duration*1000)+250);

      await bitti;
      running=false;
      stream.getTracks().forEach(t=>t.stop());
      if(hasAudio){audioSources.forEach(x=>{try{x.disconnect();}catch{}});}
      const recordedBlob=new Blob(chunks,{type:mime});
      if(!recordedBlob.size) throw new Error('Boş video oluştu.');

      // Tarayıcının ham kaydı (özellikle doğrudan MP4/WebM) süre ve indeks bilgisi içermez; bu
      // yüzden her durumda ffmpeg'den geçirip ileri-geri sarılabilir, tam süreli MP4 üretiyoruz.
      let cikti=recordedBlob;
      let uzanti=directMp4Mime?'mp4':'webm';
      let duzenlendi=false;
      try{
        cikti=await ffmpegMp4Donustur(recordedBlob,durum,progText,duration,hasAudio,directMp4Mime?'mp4':'webm');
        uzanti='mp4'; duzenlendi=true;
      }catch(e){
        console.error('Video düzenleme hatası:',e);
      }

      const url=URL.createObjectURL(cikti);
      const a=document.createElement('a');
      a.href=url;
      a.download=`siir-${post.id}.${uzanti}`;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000);

      prog.firstChild.style.width='100%';
      progText.textContent=duzenlendi?'%100 · MP4 hazır':'%100 · ham kayıt indirildi';
      durum.textContent=duzenlendi
        ? '✅ MP4 video indirildi.'
        : '⚠️ Video düzenlenemedi; ham kayıt indirildi (ileri-geri sarma çalışmayabilir). İnternet bağlantısını kontrol edip tekrar deneyin.';
      kaydetBtn.disabled=false; iptalBtn.disabled=false;
      kaydetBtn.textContent='🔄 MP4 Videoyu Yeniden Oluştur';
    };
  }catch(err){
    console.error('Şiir video oluşturma hatası:',err);
    durum.textContent='❌ '+(err?.message||'Video oluşturulamadı.');
    progText.textContent='Ses dosyası veya tarayıcı video kaydına izin vermiyor olabilir.';
    kaydetBtn.disabled=true;
    iptalBtn.disabled=false;
  }
}

function instagramHikayeModal(post){

  const bg=h('div',{class:'modal-bg'});
  const kapat=()=>bg.remove();
  bg.onclick=e=>{if(e.target===bg)kapat();};

  // Şiirin linkini hemen panoya kopyalar (Instagram'ın hikayelerdeki "Link"
  // etiketine yapıştırılabilsin diye — Instagram, web'den doğrudan/otomatik
  // tıklanabilir link eklemeye izin vermiyor; kullanıcı Link etiketini ekleyip
  // panodaki bu linki yapıştırarak hikayesine tıklanabilir link koyabiliyor).
  const igLink = paylasimLinki(post.id);
  let linkKopyalandi = false;
  const linkiPanoyaKopyala = async ()=>{
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(igLink);
      } else {
        const ta=document.createElement('textarea');
        ta.value=igLink; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      linkKopyalandi=true;
      return true;
    }catch{ return false; }
  };
  linkiPanoyaKopyala().then(basarili=>{
    if(basarili) toastGoster('🔗 Şiirin linki kopyalandı — hikayede "Link" etiketine yapıştırabilirsin!');
  });

  const modal=h('div',{class:'modal',style:{maxWidth:'380px'}});
  modal.appendChild(h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px'}},[
    h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontSize:'1.05rem'}},'📸 Hikayede Paylaş'),
    h('button',{class:'btn',style:{background:'none',color:'#6b5b8a',fontSize:'1.4rem'},onclick:kapat},'✕')
  ]));
  const linkChip=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',background:'#0f0a1a',border:'1px solid #3d1f6e',borderRadius:'10px',padding:'8px 10px',marginBottom:'10px'}});
  linkChip.appendChild(h('span',{style:{fontSize:'.78rem',color:'#a78bfa',flex:'1',lineHeight:'1.4'}},'🔗 Linki kopyaladık. Hikayede "Link" etiketini ekleyip panodakini yapıştır — böylece tıklanabilir olur.'));
  const tekrarKopyalaBtn=h('button',{class:'btn',style:{background:'transparent',color:'#c084fc',border:'1px solid #5b21b6',borderRadius:'8px',padding:'6px 10px',fontSize:'.72rem',flexShrink:'0'},onclick:async()=>{const ok=await linkiPanoyaKopyala();toastGoster(ok?'🔗 Tekrar kopyalandı!':'Kopyalanamadı, tarayıcı izin vermedi.');}},'Kopyala');
  linkChip.appendChild(tekrarKopyalaBtn);
  modal.appendChild(linkChip);

  // Etiketler görselin üzerine sadece dekoratif olarak basılıyor — Instagram, web'den
  // gönderilen bir görsele gerçek/tıklanabilir hashtag ekletmiyor. Tıklanabilir olması
  // için kullanıcının hikayede "Etiket" (hashtag) çıkartmasını ekleyip buradaki metni
  // yapıştırması gerekiyor; bu yüzden linkte olduğu gibi kopyalanabilir hâle getiriyoruz.
  const hashtagKopyala = async ()=>{
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(IG_HASHTAGS);
      } else {
        const ta=document.createElement('textarea');
        ta.value=IG_HASHTAGS; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
      }
      return true;
    }catch{ return false; }
  };
  const hashtagChip=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',background:'#0f0a1a',border:'1px solid #3d1f6e',borderRadius:'10px',padding:'8px 10px',marginBottom:'14px'}});
  hashtagChip.appendChild(h('span',{style:{fontSize:'.78rem',color:'#a78bfa',flex:'1',lineHeight:'1.4'}},`🏷️ Etiketlerin tıklanabilir olması için hikayede "Etiket" (hashtag) çıkartmasını ekleyip ${IG_HASHTAGS} yapıştır.`));
  const hashtagKopyalaBtn=h('button',{class:'btn',style:{background:'transparent',color:'#c084fc',border:'1px solid #5b21b6',borderRadius:'8px',padding:'6px 10px',fontSize:'.72rem',flexShrink:'0'},onclick:async()=>{const ok=await hashtagKopyala();toastGoster(ok?'🏷️ Etiketler kopyalandı!':'Kopyalanamadı, tarayıcı izin vermedi.');}},'Kopyala');
  hashtagChip.appendChild(hashtagKopyalaBtn);
  modal.appendChild(hashtagChip);
  const yukleniyor=h('p',{style:{color:'#a78bfa',fontSize:'.85rem',textAlign:'center',padding:'40px 0'}},'⏳ Hazırlanıyor...');
  modal.appendChild(yukleniyor);
  bg.appendChild(modal);

  (async()=>{
    let kaynakCanvas;
    try{
      kaynakCanvas = await igHikayeCanvasOlustur(post, author);
    }catch(err){
      yukleniyor.textContent='😕 Görsel oluşturulamadı, lütfen tekrar deneyin.';
      return;
    }

    yukleniyor.remove();

    const H = kaynakCanvas.height;
    const MIN_WINDOW = 320; // seçili alan en az bu kadar piksel yüksekliğinde kalsın
    const hasMedia = !!post.image || !!ytId(post.youtube);
    const MEDIA_H = hasMedia?IG_MEDIA_H:0;
    let topY = 0;
    let altBaslangic = Math.min(H, MEDIA_H+280);
    let bottomY = Math.min(H, Math.round(altBaslangic + (H-altBaslangic)*0.4));
    if(bottomY-topY < MIN_WINDOW) bottomY = Math.min(H, topY+MIN_WINDOW);

    const DISPLAY_W = 260; // ekranda gösterilecek sabit genişlik
    const olcek = DISPLAY_W/IG_W;
    const thumbH = H*olcek;

    // Şiirin tamamının küçük önizlemesi + üstten/alttan sürüklenebilir kırpma tutamaçları
    const thumbWrap=h('div',{style:{position:'relative',width:DISPLAY_W+'px',height:thumbH+'px',margin:'0 auto',border:'2px solid #3d1f6e',borderRadius:'14px',overflow:'hidden',background:'#0a0718',touchAction:'none'}});
    const thumbImg=h('img',{style:{position:'absolute',top:'0',left:'0',width:DISPLAY_W+'px',height:thumbH+'px',display:'block',userSelect:'none',pointerEvents:'none'}});
    thumbImg.draggable=false;
    thumbImg.src=kaynakCanvas.toDataURL('image/png');
    thumbWrap.appendChild(thumbImg);

    const golgeUst=h('div',{style:{position:'absolute',top:'0',left:'0',width:'100%',background:'rgba(5,2,12,.72)',pointerEvents:'none'}});
    const golgeAlt=h('div',{style:{position:'absolute',bottom:'0',left:'0',width:'100%',background:'rgba(5,2,12,.72)',pointerEvents:'none'}});
    thumbWrap.appendChild(golgeUst); thumbWrap.appendChild(golgeAlt);

    const tutamacGovde={width:'46px',height:'5px',borderRadius:'3px',background:'#c084fc',boxShadow:'0 0 0 3px rgba(15,10,26,.7)'};
    const tutamacStil={position:'absolute',left:'0',width:'100%',height:'22px',cursor:'ns-resize',display:'flex',alignItems:'center',justifyContent:'center',touchAction:'none'};
    const tutamacUst=h('div',{style:{...tutamacStil,top:'0'}},[h('div',{style:tutamacGovde})]);
    const tutamacAlt=h('div',{style:{...tutamacStil,bottom:'0'}},[h('div',{style:tutamacGovde})]);
    thumbWrap.appendChild(tutamacUst); thumbWrap.appendChild(tutamacAlt);

    const yuzde=h('p',{style:{textAlign:'center',fontSize:'.7rem',color:'#6b5b8a',margin:'8px 0 0'}});

    const previewWrap=h('div',{style:{position:'relative',width:DISPLAY_W+'px',margin:'12px auto 0',border:'2px solid #3d1f6e',borderRadius:'14px',overflow:'hidden',background:'#0a0718'}});
    const outCanvas=h('canvas',{width:String(IG_W),height:String(bottomY-topY)});
    outCanvas.style.width=DISPLAY_W+'px';
    outCanvas.style.display='block';
    previewWrap.appendChild(outCanvas);

    function tutamaclariYerlestir(){
      const ty=topY*olcek, by=bottomY*olcek;
      golgeUst.style.height=ty+'px';
      golgeAlt.style.height=(thumbH-by)+'px';
      tutamacUst.style.top=(ty-11)+'px';
      tutamacAlt.style.top=(by-11)+'px';
    }

    function ciz(){
      const winH=bottomY-topY;
      outCanvas.width=IG_W; outCanvas.height=winH;
      outCanvas.style.height=(winH*olcek)+'px';
      const cctx=outCanvas.getContext('2d');
      cctx.clearRect(0,0,IG_W,winH);
      cctx.drawImage(kaynakCanvas,0,topY,IG_W,winH,0,0,IG_W,winH);
      // otomatik etiketler — kırpma nereden başlarsa başlasın görselin altında hep dursun
      cctx.save();
      cctx.textAlign='center';
      cctx.font="600 32px 'Crimson Text'";
      cctx.fillStyle='rgba(196,181,253,.92)';
      cctx.shadowColor='rgba(0,0,0,.6)'; cctx.shadowBlur=8;
      cctx.fillText(IG_HASHTAGS, IG_W/2, winH-36);
      cctx.restore();
      const yuzdeVal = H>0 ? Math.round((winH/H)*100) : 100;
      yuzde.textContent = `Şiirin ~%${yuzdeVal}'i görünüyor`;
      tutamaclariYerlestir();
    }

    function tutamacSurukle(tutamac, ustMu){
      let basY=null, basTop=topY, basBottom=bottomY;
      tutamac.addEventListener('pointerdown',e=>{
        basY=e.clientY; basTop=topY; basBottom=bottomY;
        try{tutamac.setPointerCapture(e.pointerId);}catch{}
      });
      tutamac.addEventListener('pointermove',e=>{
        if(basY==null)return;
        const delta=Math.round((e.clientY-basY)/olcek);
        if(ustMu){
          topY=Math.max(0, Math.min(basTop+delta, bottomY-MIN_WINDOW));
        } else {
          bottomY=Math.max(topY+MIN_WINDOW, Math.min(H, basBottom+delta));
        }
        ciz();
      });
      const bitir=()=>{basY=null;};
      tutamac.addEventListener('pointerup',bitir);
      tutamac.addEventListener('pointercancel',bitir);
      tutamac.addEventListener('pointerleave',bitir);
    }
    tutamacSurukle(tutamacUst,true);
    tutamacSurukle(tutamacAlt,false);

    ciz();

    const ipucu=h('p',{style:{textAlign:'center',fontSize:'.72rem',color:'#7c6b9a',margin:'10px 0 2px'}},'👆 Üstteki küçük önizlemede mor tutamaçları sürükle: hem baştan hem sondan kırparak istediğin kıtayı seç. Etiketler görsele otomatik eklenir.');

    async function gorseliBlobaCevir(){
      return new Promise(resolve=>outCanvas.toBlob(b=>resolve(b),'image/png',0.95));
    }

    const btnRow=h('div',{style:{display:'flex',gap:'10px',marginTop:'16px'}});
    const paylasBtn=h('button',{class:'pb btn',style:{flex:'1'}},'📤 Paylaş');
    const indirBtn=h('button',{class:'btn',style:{flex:'1',background:'transparent',color:'#a78bfa',border:'1px solid #3d1f6e',borderRadius:'10px',padding:'10px'}},'⬇️ İndir');

    indirBtn.onclick=async()=>{
      await linkiPanoyaKopyala();
      const blob=await gorseliBlobaCevir();
      if(!blob){toastGoster('Görsel oluşturulamadı.');return;}
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=`hikaye-${post.id}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toastGoster('⬇️ Görsel indirildi, link panoda! Instagram\'da hikayeye ekle → "Link" etiketine yapıştır.');
    };

    paylasBtn.onclick=async()=>{
      await linkiPanoyaKopyala();
      paylasBtn.disabled=true; paylasBtn.textContent='⏳...';
      try{
        const blob=await gorseliBlobaCevir();
        if(!blob) throw new Error('blob yok');
        const dosya=new File([blob], `hikaye-${post.id}.png`, {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[dosya]})){
          await navigator.share({files:[dosya], title: post.title||'Şiir', text:`${post.title?('"'+post.title+'"'):'Bir şiir'} · Yeni Ozanlar 🪶 — ${igLink}`});
          toastGoster('🔗 Link panoda — hikayede "Link" etiketine yapıştırmayı unutma!');

// ── Groq kota yardımcıları ───────────────────────────────────────────────
// Groq "2m59.56s", "7.66s", "1h2m3s" veya "500ms" gibi süre string'leri döner; saniyeye çeviririz.
function groqSureCevir(str){
  if(!str) return null;
  str = String(str).trim();
  if(/^[\d.]+ms$/.test(str)) return parseFloat(str)/1000;
  let toplam = 0, bulundu = false;
  const saat = str.match(/([\d.]+)h/);
  const dakika = str.match(/([\d.]+)m(?!s)/);
  const saniye = str.match(/([\d.]+)s/);
  if(saat){ toplam += parseFloat(saat[1])*3600; bulundu = true; }
  if(dakika){ toplam += parseFloat(dakika[1])*60; bulundu = true; }
  if(saniye){ toplam += parseFloat(saniye[1]); bulundu = true; }
  if(!bulundu){
    const n = parseFloat(str);
    if(!isNaN(n)) toplam = n; else return null;
  }
  return toplam;
}
// Şu andan itibaren N saniye sonrasının saatini okunaklı yazar
function groqSaatFormatla(saniyeSonra){
  if(saniyeSonra===null || isNaN(saniyeSonra)) return '—';
  return new Date(Date.now() + saniyeSonra*1000).toLocaleTimeString('tr-TR');
}
// N saniyeyi "X dk Y sn" gibi yazar
function groqSureFormatla(saniye){
  if(saniye===null || isNaN(saniye)) return '';
  saniye = Math.max(0, Math.round(saniye));
  const dk = Math.floor(saniye/60), sn = saniye%60;
  return dk>0 ? `${dk} dk ${sn} sn` : `${sn} sn`;
}

// Groq, günlük istek hakkını (RPD) her zaman header'da vermeyebilir.
// Bu yüzden "bugün kaç şiir Groq ile yorumlandı / kaçı yerel algoritmaya düştü" bilgisini
// tarayıcıda ayrıca sayıyoruz; sayfa yenilense de kaybolmaz, her gün otomatik sıfırlanır.
const GROQ_GUNLUK_ANAHTAR = 'yo_groq_gunluk';
function groqGunlukDurum(){
  const bugun = new Date().toLocaleDateString('tr-TR');
  let kayit = lsGet(GROQ_GUNLUK_ANAHTAR, null);
  if(!kayit || kayit.tarih !== bugun){
    kayit = { tarih: bugun, basarili: 0, yerel: 0 };
    lsSet(GROQ_GUNLUK_ANAHTAR, kayit);
  }
  return kayit;
}
function groqGunlukArttir(basariliMi){
  const k = groqGunlukDurum();
  if(basariliMi) k.basarili++; else k.yerel++;
  lsSet(GROQ_GUNLUK_ANAHTAR, k);
  return k;
}

// Groq rate limit takibi (canlı, oturum bazlı)
// Kota süresi dolduğunda arka planda otomatik test isteği atılırken aynı anda
// birden fazla kontrolün üst üste binmesini engelleyen kilit.
let groqOtomatikKontrolDevamEdiyor = false;

const groqKota = {
  limitIstek: null,          // Groq'un bildirdiği istek limiti
  kalanIstek: null,          // kalan istek hakkı
  istekSifirlanmaSn: null,   // istek kotasının kaç saniye sonra yenileneceği
  limitToken: null,          // dakikalık token limiti
  kalanToken: null,          // kalan token
  tokenSifirlanmaSn: null,   // token kotasının kaç saniye sonra yenileneceği
  toplamIstek: 0,            // bu oturumda Groq'a yapılan toplam istek
  sonGuncelleme: null,       // son güncelleme saati
  sonKaynak: null,           // 'groq' | 'yerel' — son şiir yorumu nereden geldi
  sonModel: null,            // en son başarılı isteği hangi model karşıladı
  sonHata: null,             // son hata mesajı (varsa) — admin panelinde gösterilir
  kotaDolduMu: false,        // 429 (kota doldu) durumuna geçildi mi
  kotaAcilmaZamani: null,    // kota tekrar açılacağı an (Date.now() + saniye)
  kotaTuru: null,            // 'RPM' | 'RPD' | 'TPM' | 'TPD' — Groq'un hata mesajından okunur
  kotaLimit: null,           // ilgili kotanın toplam limiti
  kotaKullanilan: null,      // ilgili kotadan kullanılan miktar

};

function groqKotaGuncelle(headers) {
  const get = k => headers.get(k);
  if (get('x-ratelimit-limit-requests'))     groqKota.limitIstek = parseInt(get('x-ratelimit-limit-requests'));
  if (get('x-ratelimit-remaining-requests')) groqKota.kalanIstek = parseInt(get('x-ratelimit-remaining-requests'));
  if (get('x-ratelimit-reset-requests'))     groqKota.istekSifirlanmaSn = groqSureCevir(get('x-ratelimit-reset-requests'));
  if (get('x-ratelimit-limit-tokens'))       groqKota.limitToken = parseInt(get('x-ratelimit-limit-tokens'));
  if (get('x-ratelimit-remaining-tokens'))   groqKota.kalanToken = parseInt(get('x-ratelimit-remaining-tokens'));
  if (get('x-ratelimit-reset-tokens'))       groqKota.tokenSifirlanmaSn = groqSureCevir(get('x-ratelimit-reset-tokens'));
  groqKota.sonGuncelleme = new Date().toLocaleTimeString('tr-TR');
  groqKota.toplamIstek++;
}

// Ham hata mesajını (sonHata) admin için anlaşılır bir teşhise çevirir.
function groqHataTanisi(hata){
  if(!hata) return null;
  if(/GEMINI_API_KEY tanımlı değil/i.test(hata))
    return '🔑 GEMINI_API_KEY Vercel\'de tanımlı değil. aistudio.google.com/apikey üzerinden anahtar alıp Vercel → Settings → Environment Variables\'a ekleyip yeniden deploy edin.';
  if(/ANTHROPIC_API_KEY tanımlı değil/i.test(hata))
    return '🔑 ANTHROPIC_API_KEY Vercel\'de tanımlı değil. console.anthropic.com/settings/keys üzerinden anahtar alıp Vercel → Settings → Environment Variables\'a ekleyip yeniden deploy edin.';
  if(/^429:/.test(hata)) return '⏳ Gerçek kota doldu. Yukarıdaki "Yenilenme" saatini bekleyin.';
  if(/^401:/.test(hata) || /invalid.?api.?key/i.test(hata) || /invalid_api_key/i.test(hata))
    return '🔑 API anahtarı geçersiz veya devre dışı bırakılmış. Not: API anahtarları kod içinde (ör. GitHub\'da) herkese açık paylaşılırsa sağlayıcı bunu otomatik olarak iptal edebilir. Yeni bir anahtar oluşturup Vercel\'de güncelleyin.';
  if(/^403:/.test(hata)) return '🚫 Erişim reddedildi (403) — API anahtarının bu modele/organizasyona erişim izni olmayabilir.';
  if(/model_decommissioned/i.test(hata) || /has been decommissioned/i.test(hata))
    return '🔁 Kullanılan model artık desteklenmiyor. Kodda model adını güncel bir modelle (ör. openai/gpt-oss-120b) değiştirin.';
  if(/^400:/.test(hata)) return '⚠️ İstek hatalı (400) — model adı, parametreler veya istek formatı reddedildi.';
  if(/^JSON_HATASI/.test(hata)) return '🤖 Yapay zeka geçerli JSON formatında yanıt vermedi (genelde geçici bir model tutarsızlığı) — tekrar denendiğinde genelde düzelir.';
  if(/^BOS_YANIT/.test(hata)) return '📭 Model boş içerik döndürdü — tekrar deneyin.';
  if(/Failed to fetch|NetworkError|TypeError/i.test(hata))
    return '🌐 Bağlanılamadı — ağ engeli, CORS kısıtlaması veya internet bağlantı sorunu olabilir.';
  return null;
}

// Groq, kota dolduğunda (429) response body'sinde şu formatta bir mesaj döner:
// "Rate limit reached for model `...` on requests per day (RPD): Limit 1000, Used 1000,
//  Requested 1. Please try again in 6m 11.52s. Visit ..."
// Bu bilgi, tarayıcının CORS nedeniyle engelleyebileceği x-ratelimit-* header'larının
// aksine HER ZAMAN okunabilir (response body serbestçe okunur), bu yüzden asıl
// güvenilir kota bilgisi kaynağımız burasıdır.
function groqHataAyristir(mesaj){
  if(!mesaj) return null;
  const turEsleme = {
    'requests per minute':'RPM (dakikalık istek)',
    'requests per day':'RPD (günlük istek)',
    'tokens per minute':'TPM (dakikalık token)',
    'tokens per day':'TPD (günlük token)'
  };
  let tur = null;
  for(const anahtar in turEsleme){ if(mesaj.toLowerCase().includes(anahtar)){ tur = turEsleme[anahtar]; break; } }
  const sayilar = mesaj.match(/Limit ([\d,]+),\s*Used ([\d,]+),\s*Requested ~?([\d,]+)/i);
  const sureEslesme = mesaj.match(/Please try again in\s*((?:[\d.]+h\s*)?(?:[\d.]+m\s*)?(?:[\d.]+s)?)/i);
  const bekleSn = sureEslesme ? groqSureCevir(sureEslesme[1].trim()) : null;
  return {
    tur,
    limit: sayilar ? parseInt(sayilar[1].replace(/,/g,'')) : null,
    kullanilan: sayilar ? parseInt(sayilar[2].replace(/,/g,'')) : null,
    bekleSn,
  };
}

// 429 (Too Many Requests) geldiğinde çağrılır: kota doldu bilgisini işaretler.
// mesaj: Groq'un response body'sindeki error.message alanı (varsa)
function groqKota429Isaretle(headers, mesaj){
  groqKota.kotaDolduMu = true;
  groqKota.kotaMesaj = mesaj || null;
  const ayristirilmis = groqHataAyristir(mesaj);
  let bekleSn = ayristirilmis?.bekleSn;
  if(bekleSn===null || bekleSn===undefined){
    const retryAfter = headers?.get ? parseFloat(headers.get('retry-after')) : null;
    bekleSn = (retryAfter && !isNaN(retryAfter)) ? retryAfter : 60;
  }
  groqKota.kotaAcilmaZamani = Date.now() + bekleSn*1000;
  groqKota.kotaTuru = ayristirilmis?.tur ?? null;
  groqKota.kotaLimit = ayristirilmis?.limit ?? null;
  groqKota.kotaKullanilan = ayristirilmis?.kullanilan ?? null;
}

// ── Hece (syllable) ön-hesaplaması ─────────────────────────────────────────
// Büyük dil modelleri Türkçe hece ölçüsünü (özellikle openai/gpt-oss-120b gibi
// modeller) sıkça yanlış sayıyor. Bunu modele bırakmak yerine, Türkçenin büyük
// ölçüde sesli harf = hece kuralına dayanarak KOD İÇİNDE kesin olarak hesaplayıp
// prompt'a "ön-hesaplanmış, değiştirilemez gerçek" olarak veriyoruz. Model artık
// saymıyor, sadece bu hazır veriyi yorumluyor — hata payı ortadan kalkıyor.
const TURKCE_UNLULER = 'aeıioöuüAEIİOÖUÜ';
function heceSay(kelime){
  let sayac=0;
  for(const harf of kelime){ if(TURKCE_UNLULER.includes(harf)) sayac++; }
  return Math.max(sayac,1);
}
function siirHeceOzetiOlustur(text){
  const satirlar = text.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!satirlar.length) return '';
  const ozetSatirlari = satirlar.slice(0,24).map((satir,i)=>{
    const hece = satir.split(/\s+/).filter(Boolean).reduce((t,k)=>t+heceSay(k),0);
    return `${i+1}. dize (${hece} hece): "${satir}"`;
  });
  return `\n\n[HECE ÖLÇÜSÜ — programatik olarak kesin hesaplanmıştır, KENDİN TEKRAR SAYMA, olduğu gibi kullan]\n${ozetSatirlari.join('\n')}`;
}

// Ham model çıktısından (olası ```json çitleri, olası ekstra metinle birlikte) JSON'u ayıklar ve doğrular.
// DÜZELTME: Önceden ana puan (score) ile 3 bot yorumu (duyu/katlı/arı) AYRI AYRI
// istekler olarak gönderiliyordu — bu hem kotayı 4 katına çıkarıyor hem de her
// istek farklı bir modele/sağlayıcıya düşüp (biri Gemini'de kota/rate-limit'e
// takılırken diğeri Groq'a düşerek) TUTARSIZ sonuçlara yol açıyordu. Artık TEK
// istekte hem ana değerlendirme hem 3 bot yorumu birlikte isteniyor (yukarıdaki
// aiKullaniciPromptuOlustur), bu fonksiyon da hepsini TEK YERDE ayıklayıp
// doğruluyor — böylece 4 sonuç HER ZAMAN aynı tek API çağrısından gelir.
function jsonAyikla(raw){
  const clean = raw.replace(/```json|```/g,'').trim();
  const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
  const result = JSON.parse(jsonStr);
  result.score = Math.min(9.8, Math.max(2.0, parseFloat(result.score)));
  result.score = Math.round(result.score * 10) / 10;
  const botPuanTemizle = (v) => {
    const n = parseFloat(v);
    const guvenli = Number.isFinite(n) ? n : 5.5;
    return Math.round(Math.min(9.5, Math.max(2.0, guvenli)) * 10) / 10;
  };
  result.duyuPuan = botPuanTemizle(result.duyuPuan);
  result.katliPuan = botPuanTemizle(result.katliPuan);
  result.ariPuan = botPuanTemizle(result.ariPuan);
  if(!result.duyuYorum || !String(result.duyuYorum).trim())   result.duyuYorum  = result.yorum;
  if(!result.katliYorum || !String(result.katliYorum).trim()) result.katliYorum = result.yorum;
  if(!result.ariYorum || !String(result.ariYorum).trim())     result.ariYorum   = result.yorum;
  return result;
}

// Birleşik AI sonucundan (jsonAyikla çıktısı) 3 bot yorumunu, mevcut
// userRatings/botYorumlar şemasıyla (kullanici, ad alanları) uyumlu objelere çevirir.
function botlariBirlesikSonuctanCikar(result){
  if(!result) return { b1:null, b2:null, b3:null };
  return {
    b1: { puan: result.duyuPuan,  yorum: result.duyuYorum,  kullanici:'bot_duyu_yorum',  ad:'duyu-yorum' },
    b2: { puan: result.katliPuan, yorum: result.katliYorum, kullanici:'bot_katli_yorum', ad:'katlı-yorum' },
    b3: { puan: result.ariPuan,   yorum: result.ariYorum,   kullanici:'bot_ari_yorum',   ad:'arı-yorum' }
  };
}

  const ari = botAriPuanYerel(text);

    ...ana,
    duyuPuan: duyu.puan, duyuYorum: duyu.yorum,
    katliPuan: katli.puan, katliYorum: katli.yorum,
    ariPuan: ari.puan, ariYorum: ari.yorum
  };
}

async function scorePoemTekModel(text, model){
  // openai/gpt-oss-* modelleri "akıl yürütme" (reasoning) modelleridir; varsayılan
  // ayarlarla yanıt vermeden önce uzun bir iç düşünme süreci üretebilir ve bu da
  // max_tokens sınırını tüketip asıl JSON'a hiç sıra gelmeden yanıtı kesebilir.
  // reasoning_effort:'low' bunu en aza indirir. response_format json_object ise
  // Groq'un resmi JSON modu — sözdizimsel olarak geçerli JSON garantisi verir.
  const govde = {
    model: model,
    max_tokens: 1536, // Tek istekte ana puan + 3 bot yorumu birlikte istendiği için artırıldı
    temperature: 0.7,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: AI_SISTEM_PROMPTU },
      { role: 'user', content: aiKullaniciPromptuOlustur(text) }
    ]
  };
  if(model.startsWith('openai/gpt-oss')){
    govde.reasoning_effort = 'low';
    govde.include_reasoning = false;
  } else if(model.startsWith('qwen/')){
    // Qwen3.6 gibi modeller 'low'/'high' değil 'none'/'default' kabul eder.
    govde.reasoning_effort = 'none';
  }
  const res = await fetch('/api/groq', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(govde)
  });
  groqKotaGuncelle(res.headers);
  if(res.status===429){
    let mesaj = '';
    try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
    groqKota429Isaretle(res.headers, mesaj);
    throw new Error('429: '+(mesaj || 'Groq kota doldu'));
  }
  groqKota.kotaDolduMu = false;
  if(!res.ok){
    let mesaj = '';
    try{
      const errBody = await res.json();
      mesaj = errBody?.error?.message || '';
      if(errBody?.error?.teshis){
        const t = errBody.error.teshis;
        mesaj += ` [çalışan ortam: ${t.calisan_ortam}; bulunan GROQ değişkenleri: ${t.groq_ile_ilgili_bulunan_degisken_isimleri?.length ? t.groq_ile_ilgili_bulunan_degisken_isimleri.join(', ') : 'yok'}]`;
      }
    }catch(_){}
    throw new Error(res.status+': '+(mesaj || 'Groq hatası'));
  }
  const data = await res.json();
  if(!data.choices?.[0]?.message?.content) throw new Error('BOS_YANIT: Groq içerik döndürmedi');
  const raw = data.choices[0].message.content.trim();
  try{
    return jsonAyikla(raw);
  } catch(parseErr){
    throw new Error('JSON_HATASI: Yapay zeka geçersiz format döndürdü → "'+raw.slice(0,150)+(raw.length>150?'...':'')+'"');
  }
}
