<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni Ozanlar 🪶</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0f0a1a;color:#f0e8ff;font-family:'Crimson Text',Georgia,serif;min-height:100vh}
    /* KART TASARIMI: Geniş ve büyük */
    .card{background:linear-gradient(135deg,#1a0f2e,#160d28);border:1px solid #2d1b52;border-radius:20px;padding:30px;margin:20px auto;width:95%;max-width:600px;min-height:400px;position:relative}
    .btn{cursor:pointer;border:none;background:#7c3aed;color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;width:100%;margin-top:10px}
    .notify{border-left:4px solid #a855f7;background:#1e1b4b !important}
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="app"></div>
<script>
// Firebase ayarlarınızı buraya koyun (sizin orijinal ayarlarınızın aynısı)
const firebaseConfig = { apiKey: "AIzaSyC6sshBjUU7xZf_KgjwW2yWuvE1ZG9oZWY", authDomain: "yeniozanlar-68b49.firebaseapp.com", projectId: "yeniozanlar-68b49", storageBucket: "yeniozanlar-68b49.firebasestorage.app", messagingSenderId: "99003509618", appId: "1:99003509618:web:e4f36d85378f2e554fcbeb" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);

let S = { posts: [], me: null, msgs: [], pageLimit: 3 };

const A = {
  sendSystemNotification(toId, text) {
    const msg = {id:Math.random().toString(36).slice(2), fromId:"system", toId, text, date:new Date().toLocaleString('tr-TR')};
    S.msgs.unshift(msg);
  },
  addComment(pid, text) {
    const p = S.posts.find(x => x.id === pid);
    if(p && S.me && p.authorId !== S.me.id) A.sendSystemNotification(p.authorId, `${S.me.name} şiirinize yorum yaptı: "${text.slice(0,10)}..."`);
  },
  ratePost(pid, score) {
    const p = S.posts.find(x => x.id === pid);
    if(p && S.me && p.authorId !== S.me.id) A.sendSystemNotification(p.authorId, `${S.me.name} şiirinize ${score} puan verdi.`);
  }
};

function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const container = document.createElement('div');
  
  // 3'lü sınır kuralı
  const gorunur = S.posts.slice(0, S.pageLimit);
  gorunur.forEach(p => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${p.title}</h3><p>${p.text}</p>`;
    container.appendChild(div);
  });
  
  if(S.posts.length > S.pageLimit) {
    const b = document.createElement('button');
    b.className = 'btn';
    b.innerText = 'Daha Fazla Şiir';
    b.onclick = () => { S.pageLimit += 3; render(); };
    container.appendChild(b);
  }
  app.appendChild(container);
}

// Başlatıcı
async function init() {
  // S.posts verilerini buradan çekin
  render();
}
init();
</script>
</body>
</html>
