// ── Otomatik GIF + Türkçe alıntı/aforizma (görsel/YouTube eklenmemiş paylaşımlar için) ──
// Kullanıcı ne bir görsel yükler ne de YouTube linki eklerse, şiirin temasına/
// ruh haline uygun bir GIF'i, üzerine bindirilecek Türkçe bir mısra/aforizma ile
// birlikte arka planda otomatik bulup ekleriz. İki adım:
//   1) Groq (mevcut GROQ_API_KEY, en ucuz/hızlı model) tek çağrıda hem Giphy
//      aramasında kullanılacak 2-4 İngilizce anahtar kelimeyi (Giphy Türkçe
//      aramada zayıf kalır) HEM DE görselin üzerine yazılacak kısa Türkçe metni
//      üretir — mümkünse şiirden birebir uygun bir mısra, yoksa temaya uygun
//      özgün bir aforizma.
//   2) /api/giphy o anahtar kelimelerle Giphy'de arama yapar ve bir GIF döner.
// Herhangi bir adım başarısız olursa (kota, eksik anahtar, ağ hatası, geçersiz
// JSON vb.) sessizce vazgeçilir — paylaşım akışı ASLA engellenmez.
// Kurulum: Vercel → Settings → Environment Variables → GIPHY_API_KEY ekleyip
// yeniden deploy edin (bkz. /api/giphy.js). Anahtar: developers.giphy.com
async function siirIcinGifVerileriGetir(title, text){
  try{
    const govde = {
      model: 'llama-3.1-8b-instant',
      max_tokens: 220,
      temperature: 0.7,
      response_format: { type: 'json_object' },
      messages: [
        { role:'system', content:'Sen bir şiirden GIF arama terimi ve görsel üzerine bindirilecek kısa bir Türkçe alıntı/aforizma çıkaran bir asistansın. SADECE geçerli JSON döndürürsün, başka hiçbir şey yazmazsın.' },
        { role:'user', content:
          `Aşağıdaki şiiri oku.\n\n"""\n${(text||'').slice(0,800)}\n"""\n\nBaşlık: ${title||'(başlıksız)'}\n\n`+
          `Şunları üret:\n`+
          `1) "subject": Şiirde geçen, GÖRSEL OLARAK ÇİZİLEBİLİR/ÇEKİLEBİLİR somut ana konu (bir hayvan, nesne, doğa öğesi, eylem, mekan vb. — örn. "kedi" varsa "cat", "deniz" varsa "ocean", "yağmur" varsa "rain"). Şiir soyut/duygusal ve somut bir varlık/nesne/hayvan geçmiyorsa en baskın somut imgeyi seç (örn. "gece", "ateş", "yıldız"). Bu alan İNGİLİZCE, TEK bir kelime veya kısa öbek olmalı, ASLA boş bırakma.\n`+
          `2) "mood": Şiirin ruh halini/tonunu yansıtan, "subject" ile BİRLİKTE Giphy'de aratılacak, İNGİLİZCE tek bir kelime (örn. "cute", "calm", "melancholic", "playful", "peaceful"). Şiir kedi/köpek gibi sevimli bir konudaysa "cute" veya "funny" gibi kelimeler tercih et.\n`+
          `3) "caption": Görselin üzerine bindirilecek, TÜRKÇE, en fazla 12 kelimelik kısa bir metin. Şiirde temayla çok uyumlu, güçlü ve en fazla 12 kelimelik bir mısra varsa onu OLDUĞU GİBİ (kelimesi kelimesine, değiştirmeden) kullan. Uygun bir mısra yoksa, şiirin konusuna uygun ÖZGÜN kısa bir Türkçe aforizma yaz (şiirden birebir alıntı değil, senin ürettiğin, klişe olmayan).\n\n`+
          `SADECE şu JSON ile yanıt ver, başka hiçbir şey yazma:\n{"subject":"...","mood":"...","caption":"..."}`
        }
      ]
    };
    const res = await fetch('/api/groq', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(govde) });
    if(!res.ok) return null;
    const data = await res.json();
    const raw = data?.choices?.[0]?.message?.content?.trim();
    if(!raw) return null;
    const clean = raw.replace(/```json|```/g,'').trim();
    const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
    const parsed = JSON.parse(jsonStr);
    const subject = (parsed.subject||'').toString().replace(/["'.]/g,'').trim().slice(0,40) || null;
    const mood = (parsed.mood||'').toString().replace(/["'.]/g,'').trim().slice(0,30) || null;
    const caption = (parsed.caption||'').toString().replace(/^["'“”]+|["'“”]+$/g,'').trim().slice(0,140) || null;
    // "subject" ana/zorunlu arama terimi; "mood" ona eşlik eder. subject boşsa
    // (nadiren) mood'u tek başına kullan; ikisi de boşsa null dön (aşağıda yerel yedek devreye girer).
    const keywords = subject && mood ? `${subject} ${mood}` : (subject || mood || null);
    return { keywords, subject, mood, caption };
  }catch{ return null; }
}
// Groq tamamen başarısız olursa (kota, ağ, JSON hatası) devreye giren, şiirde geçen
// sık kullanılan Türkçe kelimelerden basit bir İngilizce arama terimi üreten yerel
// yedek. Amaç: en azından şiirin çok bariz somut konusunu (kedi, deniz, yağmur vb.)
// yakalayıp tamamen alakasız bir gif gelmesini önlemek.
const TR_EN_ANAHTAR_SOZLUK = [
  [/\bkedi(ler)?\b/i,'cat'], [/\bköpek|köpeğ/i,'dog'], [/\bkuş(lar)?\b/i,'bird'],
  [/\bdeniz/i,'ocean'], [/\byağmur/i,'rain'], [/\bkar\b|\bkarlar/i,'snow'],
  [/\bgüneş/i,'sun'], [/\bay\b|\bayışığı/i,'moon'], [/\byıldız/i,'stars'],
  [/\bçiçe(k|kler)/i,'flowers'], [/\bağaç/i,'tree'], [/\borman/i,'forest'],
  [/\bateş/i,'fire'], [/\brüzgar|rüzgâr/i,'wind'], [/\bgece/i,'night'],
  [/\bsabah/i,'sunrise'], [/\başk/i,'love'], [/\bkalp/i,'heart'],
  [/\bgözyaşı|ağla/i,'tears'], [/\byalnız/i,'loneliness'], [/\bdağ(lar)?\b/i,'mountains'],
  [/\bnehir|ırmak/i,'river'], [/\bçocuk/i,'child'], [/\banne\b/i,'mother'],
  [/\bkahve/i,'coffee'], [/\bkitap/i,'book'], [/\bmüzik/i,'music'],
];
function turkceMetindenYerelAnahtarKelime(title, text){
  const birlesik = `${title||''} ${text||''}`;
  for(const [regex, en] of TR_EN_ANAHTAR_SOZLUK){
    if(regex.test(birlesik)) return en;
  }
  return null;
}
async function siirIcinOtomatikGifGetir(title, text){
  let veri = await siirIcinGifVerileriGetir(title, text);
  if(!veri?.keywords){
    const yerel = turkceMetindenYerelAnahtarKelime(title, text);
    veri = { ...(veri||{}), keywords: yerel ? `${yerel} aesthetic` : 'nature calm aesthetic' };
  }
  try{
    const res = await fetch('/api/giphy', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query: veri.keywords }) });
    if(!res.ok){
      let mesaj='';
      try{ const errBody=await res.json(); mesaj=errBody?.error?.message||''; }catch(_){}
      console.warn('Otomatik GIF alınamadı:', mesaj || res.status);
      return null;
    }
    const data = await res.json();
    if(!data?.gifUrl) return null;
    return { gifUrl: data.gifUrl, caption: veri?.caption || null };
  }catch(e){ console.warn('Otomatik GIF alınamadı:', e.message); return null; }
}
// Bir paylaşımda ne görsel ne YouTube linki varsa arka planda otomatik GIF+alıntı uygular.
// Kullanıcı bu sırada kendi görselini/linkini eklerse üzerine yazmaz (race-condition koruması).
function otomatikGifUygulaGerekirse(postId, title, text, mevcutGorsel, mevcutYoutube){
  if(mevcutGorsel || ytId(mevcutYoutube)) return;
  siirIcinOtomatikGifGetir(title, text).then(sonuc=>{
    if(!sonuc?.gifUrl) return;
    const idx = S.posts.findIndex(p=>p.id===postId);
    if(idx<0) return;
    if(S.posts[idx].image || ytId(S.posts[idx].youtube)) return;
    S.posts[idx].image = sonuc.gifUrl;
    S.posts[idx].autoGif = true;
    S.posts[idx].gifCaption = sonuc.caption || null;
    save();
    refreshCard(postId);
    db.collection("posts").doc(postId).update({ image: sonuc.gifUrl, autoGif: true, gifCaption: sonuc.caption || null }).catch(err=>console.error("Otomatik GIF kaydetme hatası:",err));
  });
}
// Otomatik bulunmuş bir GIF'in (post.autoGif) üzerine, varsa post.gifCaption metnini
// alt kısımda okunaklı bir gradyan üzerinde bindirir. imgEl'i saran, position:relative
// bir wrapper döndürür; caption yoksa imgEl aynen (değişmeden) geri döner.
// opts.marginBottom / opts.borderRadius, imgEl'in ORİJİNAL inline stilinden wrapper'a taşınır
// (imgEl kendisi marginBottom:0 olur), böylece dış görünüm/aralıklar bozulmaz.
function gifUzeriAforizmaBindir(imgEl, post, opts={}){
  if(!post?.autoGif || !post?.gifCaption) return imgEl;
  const marginBottom = opts.marginBottom || '0';
  const borderRadius = opts.borderRadius || '0';
  imgEl.style.marginBottom = '0';
  imgEl.style.display = 'block';
  const wrap = h('div',{style:{position:'relative',width:'100%',marginBottom,borderRadius,overflow:'hidden'}});
  wrap.appendChild(imgEl);
  const capBox = h('div',{style:{
    position:'absolute',left:'0',right:'0',bottom:'0',
    padding:'26px 16px 12px',
    background:'linear-gradient(to top, rgba(10,7,20,.92), rgba(10,7,20,.05) 80%, transparent)',
    pointerEvents:'none'
  }});
  const capText = h('p',{style:{
    fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontWeight:'700',
    color:'#f5edff',fontSize:'.92rem',lineHeight:'1.45',textAlign:'center',
    textShadow:'0 2px 10px rgba(0,0,0,.7)'
  }});
  capText.textContent = `"${post.gifCaption}"`;
  capBox.appendChild(capText);
  wrap.appendChild(capBox);
  return wrap;
}

A.addPost = async function(pd){
    if(!S.me) return;
    // Bot puanları hesapla (önce bots, sonra async AI)
    const botRatings={};
    const botYorumlar={};
    const hasText=pd.text&&pd.text.trim().length>10;
    let b1=null,b2=null,b3=null,ortakModel=null;
    if(hasText){
      // İlk botu 'auto' kademeyle çalıştırıp hangi modelin başarılı olduğunu öğreniyoruz,
      // sonra diğer 2 botu VE ana AI'ı aynı modele zorluyoruz — böylece 4 değerlendirme
      // de (3 bot + ana AI) her zaman aynı modeli kullanır, birbirinden farklı
      // modellere düşüp tutarsız yorum vermezler.
      b1 = await botDuyuPuan(pd.text);
      ortakModel = sonBasariliBotModeli;
      [b2,b3] = await Promise.all([botKatliPuan(pd.text, ortakModel), botAriPuan(pd.text, ortakModel)]);
    }
    if(b1){botRatings[b1.kullanici]=b1.puan;botYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};}
    if(b2){botRatings[b2.kullanici]=b2.puan;botYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};}
    if(b3){botRatings[b3.kullanici]=b3.puan;botYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};}

    // Şiiri önce botsuz kaydet (hızlı görünüm için)
    const np={...pd,id:uid(),authorId:S.me.id,ts:Date.now(),
      userRatings:{...botRatings},
      botYorumlar:{...botYorumlar},
      aiScore:null,aiYorum:null,aiGuclu:null,aiOneri:null,
      comments:[],date:now()};
    S.posts.unshift(np);
    save();render();

    // Claude AI değerlendirmesini async bekle
    if(pd.text&&pd.text.trim().length>10){
      // Botlar hangi Groq modelini kullandıysa (ortakModel), ana AI da AYNI modeli
      // kullansın — tutarlılık için. Botlar tamamen başarısız olup yerel algoritmaya
      // düştüyse (ortakModel=null), ana AI kendi 'auto' kademesini normal şekilde dener.
      const r = await scorePoem(pd.text, ortakModel ? ('groq:'+ortakModel) : 'auto');
      const kullanilanModel = groqKota.sonKaynak==='yerel' ? 'yerel' : (groqKota.sonModel||groqKota.sonKaynak);
      if(r){
        const idx=S.posts.findIndex(p=>p.id===np.id);
        if(idx>-1){
          S.posts[idx].aiScore=r.score;
          S.posts[idx].aiYorum=r.yorum;
          S.posts[idx].aiGuclu=r.gucluYonler;
          S.posts[idx].aiOneri=r.gelistirmeOnerisi;
          S.posts[idx].aiModel=kullanilanModel;
          S.posts[idx].userRatings['bot_ai_yorum']=r.score;
          save();
          refreshCard(np.id);
          db.collection("posts").doc(np.id).update({
            aiScore:r.score,aiYorum:r.yorum,aiGuclu:r.gucluYonler,aiOneri:r.gelistirmeOnerisi,aiModel:kullanilanModel,
            userRatings:S.posts[idx].userRatings
          }).catch(err=>console.error(err));
        }
      }
    }
    db.collection("posts").doc(np.id).set(np).catch(err=>console.error("Kaydetme hatası:",err));
    facebookOnizlemeyiTazele(np.id);
    otomatikGifUygulaGerekirse(np.id, np.title, np.text, np.image, np.youtube);

    // Takipçilere yeni paylaşım bildirimi gönder
    const takipciler = Object.keys(S.follows).filter(uid => (S.follows[uid]||[]).includes(S.me.id));
    if(takipciler.length){
      const baslik = np.title || np.text?.slice(0,20) || 'yeni bir şiir';
      const paylasan = S.me.name||S.me.username;
      takipciler.forEach(fid => A.addNotif(fid, `${paylasan} yeni bir şiir paylaştı: "${baslik}"`, {postId:np.id}));
    }
};

// Şiir sahibi kendi paylaşımının başlığını/metnini/görselini/YouTube linkini düzenler.

// tur: 'like' | 'dislike' | 'heart'. like/dislike birbirini dışlar (biri seçilince öteki kalkar),
// kalp bunlardan bağımsızdır. Aynı butona tekrar basmak tepkiyi kaldırır (toggle).
A.react = function(pid, tur){
    if(!S.me) return;
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex<0) return;
    const post = S.posts[pIndex];
    if(!post.reactions) post.reactions = {like:[],dislike:[],heart:[]};
    ['like','dislike','heart'].forEach(t=>{ if(!post.reactions[t]) post.reactions[t]=[]; });
    const meId = S.me.id;
    const zatenVar = post.reactions[tur].includes(meId);
    if(zatenVar){
      post.reactions[tur] = post.reactions[tur].filter(id=>id!==meId);
    } else {
      post.reactions[tur] = [...post.reactions[tur], meId];
      if(tur==='like')    post.reactions.dislike = post.reactions.dislike.filter(id=>id!==meId);
      if(tur==='dislike') post.reactions.like    = post.reactions.like.filter(id=>id!==meId);
      if(tur!=='dislike'){
        const postTitle=post.title||post.text?.slice(0,20)||'şiirinize';
        const eylem = tur==='like' ? 'beğendi' : 'kalp attı';
        A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinizi ${eylem}.`, {postId:post.id});
      }
    }
    save();
    refreshCard(pid);
    db.collection("posts").doc(pid).update({reactions:post.reactions}).catch(err=>console.error("Tepki hatası:",err));
};
A.ratePost = function(pid,score){
    if(!S.me) return;

    if(pIndex > -1) {
      if(!S.posts[pIndex].userRatings) S.posts[pIndex].userRatings = {};

      save();

      const post=S.posts[pIndex];

      A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinize ${score}/10 puan verdi.`, {postId:post.id,tur:'puan'});
      db.collection("posts").doc(pid).update({ userRatings: S.posts[pIndex].userRatings });
    }
};
A.addComment = function(pid,text,parentId=null,media=null){
    if(!S.me) return;
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex > -1) {
      const post=S.posts[pIndex];
      let gercekParentId = null;
      if(parentId){
        const parentYorum = (post.comments||[]).find(c=>c.id===parentId);
        gercekParentId = parentYorum ? (parentYorum.parentId || parentYorum.id) : null;
      }
      const newComment = {id:uid(),authorId:S.me.id,text:(text||'').trim(),date:now(),parentId:gercekParentId};
      if(media) newComment.media=media;
      const updatedComments = [...(post.comments || []), newComment];
      S.posts[pIndex].comments = updatedComments;
      save();
      refreshCard(pid);
      const postTitle=post.title||post.text?.slice(0,20)||'şiirinize';
      if(gercekParentId){
        const asilYorum = (post.comments||[]).find(c=>c.id===gercekParentId);
        if(asilYorum){
          A.addNotif(asilYorum.authorId, `Sizin "${postTitle}" şiirine yazdığınız yoruma ${S.me.name||S.me.username} yanıt verdi.`, {postId:post.id,tur:'yanit',commentId:gercekParentId});
        }
      } else {
        A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinize yorum yaptı.`, {postId:post.id,tur:'yorum',commentId:newComment.id});
      }
      db.collection("posts").doc(pid).update({ comments: updatedComments }).catch(err=>console.error("Yorum kaydetme hatası:",err));
    }
};

async function yorumDosyasiYukle(file){
  if(!file || !S.me) return null;
  const isImage=file.type.startsWith('image/');
  const isVideo=file.type.startsWith('video/');
  if(!isImage && !isVideo){ toastGoster('Sadece resim veya video ekleyebilirsin.'); return null; }
  if(isImage && file.size>10*1024*1024){ toastGoster('Resim en fazla 10 MB olabilir.'); return null; }
  if(isVideo && file.size>30*1024*1024){ toastGoster('Video en fazla 30 MB olabilir.'); return null; }
  try{
    const temizAd=file.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-80);
    const yol=`comments/${S.me.id}/${Date.now()}_${temizAd}`;
    const snap=await storage.ref().child(yol).put(file,{contentType:file.type});
    const url=await snap.ref.getDownloadURL();
    return {type:isImage?'image':'video',url,name:file.name};
  }catch(err){
    console.error('Yorum medya yükleme hatası:',err);
    toastGoster('Medya yüklenemedi. Firebase Storage izinlerini kontrol edin.');
    return null;
  }
}

async function yorumIcinGifGetir(post){
  try{
    const metin=[post?.title||'',post?.text||''].join(' ').slice(0,700);
    const result=await groqBotCall(
      'Sen şiir temalarından GIPHY araması için kısa İngilizce anahtar kelimeler üreten asistansın. Yalnızca JSON döndür.',
      `Şu şiirin ruhuna uygun, GIPHY aramasında işe yarayacak 2-4 İngilizce kelime üret. Genel meme yerine sinematik/duygusal görselleri hedefle. JSON: {"query":"..."}\nŞiir: ${metin}`
    );
    const query=(result?.query||'poetry emotional aesthetic').toString().slice(0,100);
    const r=await fetch('/api/giphy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});
    const data=await r.json();
    if(!r.ok) throw new Error(data?.error?.message||'GIPHY hatası');
    return {type:'gif',url:data.gifUrl,title:data.title||'',query};
  }catch(err){
    console.warn('Yorum GIF hatası:',err);
    toastGoster('GIF getirilemedi; tekrar deneyin.');
    return null;
  }
}

function yorumMedyaGoster(media){
  if(!media?.url) return null;
  const wrap=h('div',{class:'comment-media'});
  if(media.type==='image') wrap.appendChild(h('img',{src:media.url,loading:'lazy',alt:'Yorum görseli'}));
  else if(media.type==='video') wrap.appendChild(h('video',{src:media.url,controls:true,preload:'metadata'}));
  else if(media.type==='youtube'){
    const id=ytId(media.url);
    if(id) wrap.appendChild(h('iframe',{src:`https://www.youtube.com/embed/${id}`,allow:'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture',allowFullscreen:true}));
    else return null;
  } else if(media.type==='gif'){
    wrap.appendChild(h('img',{src:media.url,loading:'lazy',alt:'GIF yorum'}));
    wrap.appendChild(h('div',{class:'comment-gif-credit'},'Powered by GIPHY'));
  }
  return wrap;
}

function h(tag,props={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props)){
    if(k==='style'&&typeof v==='object')Object.assign(e.style,v);
    else if(k==='class')e.className=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(const c of kids){
    if(c==null)continue;
    if(c instanceof Node)e.appendChild(c);
    else e.appendChild(document.createTextNode(String(c)));
  }
  return e;
}

async function adminGiphyAlternatifiGetir(post){
  const mevcut=post?.image||'';
  // Mevcut GIF ile aynı URL gelmemesi için birkaç kez isteriz. /api/giphy
  // eski çalışan endpoint'tir ve değiştirilmez.
  for(let i=0;i<6;i++){
    try{
      let veri=await siirIcinGifVerileriGetir(post?.title||'',post?.text||'');
      if(!veri?.keywords){
        const yerel=turkceMetindenYerelAnahtarKelime(post?.title||'',post?.text||'');
        veri={keywords:yerel?`${yerel} aesthetic`:'poetry emotional aesthetic'};
      }
      const r=await fetch('/api/giphy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:veri.keywords})});
      let data={}; try{data=await r.json();}catch(_){ }
      if(r.ok && data?.gifUrl && data.gifUrl!==mevcut) return data;
    }catch(err){ console.warn('Alternatif GIPHY denemesi:',err); }
  }
  throw new Error('Farklı bir GIF bulunamadı. Lütfen tekrar deneyin.');
}

async function adminGiphyFallbackUygula(post){

}

async function adminYapayZekaGorseliYenile(post){
  if(!S.me || S.me.username!==ADMIN_USERNAME){
    throw new Error('Bu işlem yalnızca admin içindir.');
  }

  const controller=new AbortController();
  const fluxTimeout=setTimeout(()=>controller.abort(),90000);

  try{
    const r=await fetch('/api/flux-image',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal:controller.signal,
      body:JSON.stringify({
        title:post.title||'',
        text:post.text||''
      })
    });

    const contentType=(r.headers.get('content-type')||'').split(';')[0].trim();

    if(!r.ok){
      let hata='';
      try{
        const data=await r.json();
        hata=data?.error || (data?.detail ? String(data.detail) : '');
        if(data?.detail && hata && !hata.includes(String(data.detail))) hata += ` — ${data.detail}`;
      }catch(_){ }
      throw new Error(hata || `FLUX sunucusu HTTP ${r.status} döndürdü.`);
    }

    if(!contentType.startsWith('image/')){
      throw new Error(`FLUX görsel yerine ${contentType||'bilinmeyen veri'} döndürdü.`);
    }

    const blob=await r.blob();
    if(!blob || !blob.size){
      throw new Error('FLUX boş görsel döndürdü.');
    }

    clearTimeout(fluxTimeout);

    /*
     * ÖNEMLİ DÜZELTME:
     *
     * Önceki sürüm burada Firebase Storage'a put(blob) yapıyordu.
     * Uygulamanın kendi giriş sistemi Firebase Authentication kullanmadığı
     * için Storage isteği yetkilendirilmeden bekliyor ve 30 saniye sonra
     * "Storage görsel yüklemesi ... tamamlanmadı" hatası veriyordu.
     *
     * FLUX zaten resmi başarıyla üretiyor (Vercel logunda /api/flux-image = 200).
     * Bu nedenle Storage'ı bu akıştan tamamen çıkarıyoruz ve resmi data URL
     * olarak doğrudan Firestore'daki post.image alanına kaydediyoruz.
     * FLUX.1 schnell çıktısı 512x512 olduğundan bu alan tek görsel için
     * Firestore belge limitinin altında kalacak şekilde kontrol ediliyor.
     */
    const imageDataUrl=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(String(reader.result||''));
      reader.onerror=()=>reject(new Error('FLUX görseli tarayıcıda okunamadı.'));
      reader.readAsDataURL(blob);
    });

    if(!imageDataUrl.startsWith('data:image/')){
      throw new Error('FLUX görsel verisi geçersiz.');
    }

    // Firestore belge limiti 1 MiB olduğundan güvenli bir üst sınır bırak.
    if(imageDataUrl.length > 850000){
      throw new Error('FLUX görseli Firestore için fazla büyük döndü.');
    }

    const idx=S.posts.findIndex(p=>p.id===post.id);
    if(idx<0) throw new Error('Paylaşım bulunamadı.');

    const now=Date.now();
    const updates={
      image:imageDataUrl,
      autoGif:false,
      gifCaption:null,
      aiImage:true,
      aiImageUpdatedAt:now,
      aiImageProvider:'cloudflare',
      aiImageModel:'@cf/black-forest-labs/flux-1-schnell'
    };

    // Önce yerel arayüzü güncelle; böylece resim anında görünür.
    S.posts[idx]={...S.posts[idx],...updates};
    save();
    refreshCard(post.id);

    // Kalıcı kayıt. Firebase Storage artık bu akışta hiç kullanılmıyor.
    await db.collection('posts').doc(post.id).update(updates);
    refreshCard(post.id);

    return {
      type:'ai',
      provider:'cloudflare',
      model:'@cf/black-forest-labs/flux-1-schnell'
    };

  }catch(err){
    clearTimeout(fluxTimeout);
    console.error('AI görsel oluşturma hatası:',err);
    throw err;
  }
}

// Yüklenen resmi, gerçekten çok büyükse (uzun kenarı 1920px'i aşıyorsa) makul bir
// boyuta indirir. Böylece hem paylaşım anında yükleme hızlanır hem de bu resmi içeren
// paylaşım her açıldığında/uygulama her başladığında indirilecek veri küçülür.
// Zaten küçük olan resimlere dokunulmaz; kalite kaybı gözle fark edilmeyecek düzeydedir.
function resimSikistir(file, maksKenar=1920, kalite=0.85){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maksKenar||height>maksKenar){
          if(width>=height){height=Math.round(height*maksKenar/width);width=maksKenar;}
          else{width=Math.round(width*maksKenar/height);height=maksKenar;}
          const canvas=document.createElement('canvas');
          canvas.width=width;canvas.height=height;
          canvas.getContext('2d').drawImage(img,0,0,width,height);
          resolve(canvas.toDataURL('image/jpeg',kalite));
        } else {
          resolve(ev.target.result); // zaten küçük, orijinaliyle bırak
        }
      };
      img.onerror=()=>resolve(ev.target.result);
      img.src=ev.target.result;
    };
    r.onerror=()=>resolve(null);
    r.readAsDataURL(file);
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// KAYDIRMA MODU (mobil "reels" tarzı tam ekran şiir okuma arayüzü)
// 3 mod: en yeni→eskiye (latest), rastgele (random), sıralama sayfasındaki
// puana göre (top). Metin şiirlerde aşağı kaydırma şiirin devamını okutur,
// sola kaydırma bir sonraki şiire geçer. Görsel/videolu paylaşımlarda görsel
// üstte sabit görünür, aşağı kaydırınca altından şiir metni okunur. YouTube
// videolar otomatik oynatılır (tarayıcı politikası gereği sessiz/muted başlar).
// ═══════════════════════════════════════════════════════════════════════════
function SwipeMode(){
  const havuz = gorunurPaylasimlar(S.posts);

  let mode = 'latest'; // 'latest' | 'random' | 'top'
  let list = [];
  let idx = 0;

  function siraliPuanaGore(a,b){
    const av=calcAvg(a.userRatings,a.aiScore), bv=calcAvg(b.userRatings,b.aiScore);
    if(av===null && bv===null) return 0;
    if(av===null) return 1;
    if(bv===null) return -1;
    return bv-av;
  }
  function listeyiOlustur(){
    if(mode==='latest') list=havuz.slice(); // S.posts zaten en yeni en başta (unshift)
    else if(mode==='random') list=havuz.slice().sort(()=>Math.random()-0.5);
    else if(mode==='top') list=havuz.slice().sort(siraliPuanaGore);
    if(idx>=list.length) idx=Math.max(0,list.length-1);
  }
  listeyiOlustur();

  const wrap=h('div',{class:'swipe-wrap'});

  const topbar=h('div',{class:'swipe-topbar'});
  const closeBtn=h('button',{class:'btn swipe-close',onclick:()=>go('feed')},'✕');
  topbar.appendChild(closeBtn);
  const tabsWrap=h('div',{class:'swipe-tabs'});
  const tabsDef=[{k:'latest',lb:'🕐 Yeni'},{k:'random',lb:'🎲 Rastgele'},{k:'top',lb:'🏆 En İyi'}];
  const tabBtns={};
  tabsDef.forEach(t=>{
    const b=h('button',{class:'btn swipe-tab'+(mode===t.k?' active':''),onclick:()=>{
      if(mode===t.k)return;
      mode=t.k;idx=0;listeyiOlustur();
      Object.entries(tabBtns).forEach(([k,bt])=>bt.classList.toggle('active',k===mode));
      renderCard();
    }},t.lb);
    tabBtns[t.k]=b;
    tabsWrap.appendChild(b);
  });
  topbar.appendChild(tabsWrap);
  wrap.appendChild(topbar);

  const counter=h('div',{class:'swipe-counter'});
  wrap.appendChild(counter);

  const stage=h('div',{class:'swipe-stage'});
  wrap.appendChild(stage);

  function renderCard(){
    stage.innerHTML='';
    if(!list.length){
      stage.appendChild(h('div',{class:'swipe-empty'},'Bu modda henüz gösterilecek şiir yok. 🌙'));
      counter.textContent='';
      return;
    }
    if(idx<0)idx=list.length-1;
    if(idx>=list.length)idx=0;
    const post=list[idx];
    stage.appendChild(swipeCard(post,()=>{idx++;renderCard();}));
    counter.textContent=`${idx+1} / ${list.length} · sola kaydır = sonraki`;
  }

  // Dokunma jestleri: dikey kaydırma normal scroll olarak bırakılır (içeriği okumak için),
  // yatay kaydırma algılanınca sola kaydırmada sıradaki şiire geçilir.
  let startX=0,startY=0,tracking=false,horizontal=false;
  stage.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    startX=t.clientX;startY=t.clientY;tracking=true;horizontal=false;
  },{passive:true});
  stage.addEventListener('touchmove',e=>{
    if(!tracking)return;
    const t=e.touches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(!horizontal && Math.abs(dx)>14 && Math.abs(dx)>Math.abs(dy)*1.3) horizontal=true;
  },{passive:true});
  stage.addEventListener('touchend',e=>{
    if(!tracking)return;tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(horizontal && Math.abs(dx)>55){
      if(dx<0){ idx++; renderCard(); } // sola kaydır → sonraki şiir
      else { idx--; renderCard(); } // sağa kaydır → önceki şiir (kolaylık)
    }
  });
  // Masaüstünde de kullanılabilsin diye ok tuşları ve fare tekerleği (yatay) desteği
  wrap.tabIndex=0;
  wrap.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){idx++;renderCard();}
    else if(e.key==='ArrowRight'){idx--;renderCard();}
  });

  renderCard();
  setTimeout(()=>wrap.focus(),0);
  return wrap;
}

function swipeCard(post,sonrakineGec){
  const author=byId(post.authorId);
  const vid=ytId(post.youtube);
  const avg=calcAvg(post.userRatings,post.aiScore);
  const isOwn=post.authorId===S.me?.id;
  const myR=post.userRatings?.[S.me?.id]??null;

  const card=h('div',{class:'swipe-card fade'});
  const scroller=h('div',{class:'swipe-scroll'});

  const header=h('div',{class:'swipe-header'});
  header.appendChild(av(author,36,()=>go('profile',{profileId:author?.id})));
  const hinfo=h('div',{style:{flex:'1',minWidth:'0'}});
  hinfo.appendChild(h('p',{class:'swipe-author-name',style:{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},author?.name||''));
  hinfo.appendChild(h('p',{class:'swipe-author-meta'},`@${author?.username||''} · ${post.date}`));
  header.appendChild(hinfo);
  if(post.hidden) header.appendChild(h('span',{class:'hidden-badge'},'🙈 Gizli'));
  if(avg!==null) header.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(avg)}44`,minWidth:'40px',padding:'4px 6px'}},[h('p',{style:{fontSize:'1rem',fontWeight:'700',color:scoreColor(avg),lineHeight:'1'}},avg.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
  scroller.appendChild(header);

  // Görsel/video varsa üstte; aşağı kaydırınca altındaki şiir metni okunur.
  if(post.image){
    const swipeImg=h('img',{src:post.image,class:'swipe-media-img'});
    scroller.appendChild(gifUzeriAforizmaBindir(swipeImg, post, {marginBottom:'16px', borderRadius:'14px'}));
  } else if(vid){
    const w=h('div',{class:'swipe-media-video'});
    w.innerHTML=`<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
    scroller.appendChild(w);
  }

  if(post.title) scroller.appendChild(h('h3',{class:'swipe-title'},`"${post.title}"`));
  if(post.text) scroller.appendChild(h('p',{class:'swipe-text'},post.text));

  const footer=h('div',{class:'swipe-footer'});
  footer.appendChild(h('button',{class:'btn swipe-footer-btn',onclick:()=>go('postdetail',{postId:post.id})},`💬 ${(post.comments||[]).length} yorum`));
  const rTeps=post.reactions||{like:[],dislike:[],heart:[]};
  const tepkiMetin=[(rTeps.like||[]).length?`👍${rTeps.like.length}`:'',(rTeps.dislike||[]).length?`👎${rTeps.dislike.length}`:'',(rTeps.heart||[]).length?`❤️${rTeps.heart.length}`:''].filter(Boolean).join(' ');
  if(tepkiMetin) footer.appendChild(h('span',{class:'swipe-footer-btn'},tepkiMetin));
  footer.appendChild(h('button',{class:'btn swipe-footer-btn',onclick:(e)=>{e.stopPropagation();linkiKopyala(post.id);}},'🔗 Paylaş'));
  scroller.appendChild(footer);

  // Hızlı puanlama (şiirin sahibi/admin hariç)
  if(!isOwn && post.authorId!==undefined){
    const rw=h('div',{style:{marginBottom:'14px'}});
    rw.appendChild(h('p',{style:{fontSize:'.8rem',color:myR?'#c084fc':'#a78bfa',marginBottom:'6px',fontStyle:myR?'normal':'italic'}},myR?`✅ Puanınız: ${myR}/10`:'⭐ Bu şiire puan ver'));
    const stars=h('div',{class:'swipe-stars'});
    for(let n=1;n<=10;n++){
      const s=h('button',{style:{background:'none',border:'none',cursor:'pointer',fontSize:'1.1rem',padding:'2px 3px',filter:n<=(myR||0)?'none':'grayscale(1) opacity(.3)'}},n<=5?'⭐':'🌟');
      s.onclick=(e)=>{e.stopPropagation();if(girisGerekli())return;A.ratePost(post.id,n);sonrakineGec&&refreshSwipeStars(stars,post.id);};
      stars.appendChild(s);
    }
    rw.appendChild(stars);
    scroller.appendChild(rw);
  }

  scroller.appendChild(h('p',{class:'swipe-hint'},'↓ okumaya devam et · sola kaydır → sonraki şiir'));

  // Dokunmatik olmayan (fare) kullanıcılar için: metnin sonuna gelince görünen buton
  const nextBtn=h('button',{class:'btn',style:{width:'100%',background:'linear-gradient(135deg,#0891b2,#0e7490)',color:'#fff',border:'none',borderRadius:'12px',padding:'10px',fontSize:'.85rem',marginBottom:'8px'},onclick:(e)=>{e.stopPropagation();sonrakineGec();}},'➜ Sonraki Şiir');
  scroller.appendChild(nextBtn);

  card.appendChild(scroller);
  return card;
}
// Kaydırma modunda puan verildikten sonra yıldızların görünümünü günceller
function refreshSwipeStars(starsEl,pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const myR=post.userRatings?.[S.me?.id]??0;
  for(let i=1;i<=10;i++){
    const b=starsEl.children[i-1];
    if(b) b.style.filter=i<=myR?'none':'grayscale(1) opacity(.3)';
  }
}

function Profile(){
  const tid=S.profileId||S.me?.id;
  // Admin için özel lookup
  let user = S.users.find(u=>u.id===tid);
  if(!user && tid==='admin_root') user=adminProfileObj;
  if(!user && S.me?.username===ADMIN_USERNAME) user=adminProfileObj;

  const isMe=tid===S.me?.id;
  const isAdminViewer=S.me?.username===ADMIN_USERNAME;

  const ups=S.posts.filter(p=>p.authorId===tid && (!p.hidden || isMe || isAdminViewer));
  const sp=ups.filter(p=>calcAvg(p.userRatings,p.aiScore)!==null);
  const avg=sp.length?(sp.reduce((s,p)=>s+calcAvg(p.userRatings,p.aiScore),0)/sp.length).toFixed(1):null;
  const fc=Object.values(S.follows).filter(l=>l.includes(tid)).length;
  const fg=(S.follows[tid]||[]).length;
  const card=h('div',{class:'card fade',style:{textAlign:'center'}});
  card.appendChild(h('div',{style:{display:'flex',justifyContent:'center',marginBottom:'12px'}},[av(user,72)]));
  card.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.5rem',color:'#e9d5ff'}},user.name));
  card.appendChild(h('p',{style:{color:'#6b5b8a',marginBottom:'6px'}},`@${user.username}`));
  if(user.bio)card.appendChild(h('p',{style:{color:'#c4b5fd',fontStyle:'italic',marginBottom:'10px'}},user.bio));
  if(avg)card.appendChild(h('p',{style:{color:scoreColor(+avg),marginBottom:'12px'}},`Ort. Puan: ${avg}/10 ${scoreBadge(+avg)}`));
  const stats=h('div',{style:{display:'flex',justifyContent:'center',gap:'28px',marginBottom:'16px'}});
  [['Şiir',ups.length],['Takipçi',fc],['Takip',fg]].forEach(([l,v])=>stats.appendChild(h('div',{},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1.3rem',color:'#e9d5ff'}},String(v)),h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},l)])));
  card.appendChild(stats);
  // Bu ozanın tüm şiirlerindeki toplam tepkiler (beğeni/dislike/kalp)
  const toplamLike=ups.reduce((s,p)=>s+((p.reactions?.like||[]).length),0);
  const toplamDislike=ups.reduce((s,p)=>s+((p.reactions?.dislike||[]).length),0);
  const toplamHeart=ups.reduce((s,p)=>s+((p.reactions?.heart||[]).length),0);
  if(toplamLike+toplamDislike+toplamHeart>0){
    const rStats=h('div',{style:{display:'flex',justifyContent:'center',gap:'20px',marginBottom:'16px',paddingTop:'12px',borderTop:'1px solid #2d1b52'}});
    [['👍',toplamLike,'#34d399'],['👎',toplamDislike,'#f87171'],['❤️',toplamHeart,'#e879f9']].forEach(([ikon,v,renk])=>{
      if(v>0) rStats.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:'4px'}},[h('span',{style:{fontSize:'1.1rem'}},ikon),h('span',{style:{color:renk,fontWeight:'700',fontSize:'.95rem'}},String(v))]));
    });

    card.appendChild(fb);
  }

  // Admin paneli

    adminPanel.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#c084fc',marginBottom:'12px',fontSize:'1rem'}},'⚙️ Admin Paneli'));

    // Groq Kota Bölümü
    const kotaDiv=h('div',{style:{background:'#0f0a1a',border:'1px solid #2d1b52',borderRadius:'10px',padding:'12px',marginBottom:'14px'}});

    const kotaIcerik=h('div');
    function kotaGoster(){

      // Kota doldu uyarısı (Groq 429 döndüyse) — bilgiler Groq'un hata mesajından (body) alınır,

      if(groqKota.kotaDolduMu){
        const kalanSn = groqKota.kotaAcilmaZamani!==null ? Math.max(0,(groqKota.kotaAcilmaZamani-Date.now())/1000) : null;
        const uyari=h('div',{style:{background:'#3b0d0d',border:'1px solid #7f1d1d',borderRadius:'8px',padding:'8px',marginBottom:'10px'}});
        uyari.appendChild(h('p',{style:{color:'#f87171',fontSize:'.78rem',fontWeight:'bold',marginBottom:'4px'}},'⛔ Groq kotası doldu — şu an yorumlar yerel algoritmayla yapılıyor'));
        if(groqKota.kotaTuru)
          uyari.appendChild(h('p',{style:{color:'#fca5a5',fontSize:'.72rem',marginBottom:'2px'}},`Dolan kota: ${groqKota.kotaTuru}`));
        if(groqKota.kotaLimit!==null && groqKota.kotaKullanilan!==null)
          uyari.appendChild(h('p',{style:{color:'#fca5a5',fontSize:'.72rem',marginBottom:'2px'}},`Kullanım: ${groqKota.kotaKullanilan.toLocaleString('tr-TR')} / ${groqKota.kotaLimit.toLocaleString('tr-TR')}`));
        if(kalanSn!==null){
          if(kalanSn>0){
            uyari.appendChild(h('p',{style:{color:'#fbbf24',fontSize:'.75rem',fontWeight:'bold',marginTop:'4px'}},`⏰ Tahmini yenilenme: ${groqSaatFormatla(kalanSn)} (~${groqSureFormatla(kalanSn)} sonra)`));
            uyari.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.68rem',marginTop:'2px'}},'Bu, Groq\'un verdiği tahmini süredir (kesin değil). Süre dolunca sistem otomatik olarak arka planda test edip burayı güncelleyecek.'));
          } else {
            uyari.appendChild(h('p',{style:{color:'#93c5fd',fontSize:'.75rem',fontWeight:'bold',marginTop:'4px'}},'🔄 Tahmini süre doldu, kota şu an otomatik olarak kontrol ediliyor...'));
          }
        }
        kotaIcerik.appendChild(uyari);
      }

      if(groqKota.sonGuncelleme===null){
        kotaIcerik.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',fontStyle:'italic'}},'Henüz API isteği yapılmadı.'));
      } else {
        const kalanRenk=groqKota.kalanIstek!==null?(groqKota.kalanIstek<=5?'#f87171':groqKota.kalanIstek<=15?'#fbbf24':'#34d399'):'#e2e8f0';
        if(groqKota.kalanIstek!==null)
          kotaIcerik.appendChild(satir('Kalan istek hakkı:',groqKota.kalanIstek+' / '+(groqKota.limitIstek??'?'),kalanRenk));
        if(groqKota.istekSifirlanmaSn!==null)
          kotaIcerik.appendChild(satir('İstek kotası yenilenme:',groqSaatFormatla(groqKota.istekSifirlanmaSn)+' ('+groqSureFormatla(groqKota.istekSifirlanmaSn)+' sonra)'));
        if(groqKota.kalanToken!==null)
          kotaIcerik.appendChild(satir('Kalan token (dk.):',groqKota.kalanToken+' / '+(groqKota.limitToken??'?')));
        if(groqKota.tokenSifirlanmaSn!==null)
          kotaIcerik.appendChild(satir('Token kotası yenilenme:',groqSaatFormatla(groqKota.tokenSifirlanmaSn)+' ('+groqSureFormatla(groqKota.tokenSifirlanmaSn)+' sonra)'));
        {
          const kaynakEtiket = {groq:`🤖 Groq AI${groqKota.sonModel?' ('+groqKota.sonModel+')':''}`, gemini:'✨ Google Gemini', claude:'🎭 Anthropic Claude', yerel:'💻 Yerel algoritma'}[groqKota.sonKaynak] || '—';
          const kaynakRenk = {groq:'#34d399', gemini:'#60a5fa', claude:'#f0abfc', yerel:'#fbbf24'}[groqKota.sonKaynak] || '#e2e8f0';
          kotaIcerik.appendChild(satir('Son yorumun kaynağı:', kaynakEtiket, kaynakRenk));
        }
        if(groqKota.sonHata){
          kotaIcerik.appendChild(satir('Son hata:',groqKota.sonHata,'#fbbf24'));
          const tanisi = groqHataTanisi(groqKota.sonHata);
          if(tanisi){
            kotaIcerik.appendChild(h('p',{style:{color:'#93c5fd',fontSize:'.72rem',marginTop:'2px',marginBottom:'4px',lineHeight:'1.4'}},tanisi));
          }
        }
        kotaIcerik.appendChild(satir('Bu oturumda yapılan istek:',groqKota.toplamIstek+' istek'));
        kotaIcerik.appendChild(satir('Son güncelleme:',groqKota.sonGuncelleme,'#6b5b8a'));
      }

      // Günlük yerel sayaç — Groq günlük limiti header'da her zaman gelmeyebildiği için
      // bu tarayıcıda bugün yapılan şiir yorumlarını ayrıca sayıyoruz.
      const gunluk = groqGunlukDurum();
      const gunlukDiv=h('div',{style:{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid #2d1b52'}});
      gunlukDiv.appendChild(h('p',{style:{color:'#a78bfa',fontSize:'.72rem',fontWeight:'bold',marginBottom:'4px'}},`📅 Bugün (${gunluk.tarih}) bu tarayıcıda:`));
      gunlukDiv.appendChild(satir('Groq AI ile yorumlanan:',gunluk.basarili+' şiir','#34d399'));
      gunlukDiv.appendChild(satir('Yerel algoritmaya düşen:',gunluk.yerel+' şiir', gunluk.yerel>0?'#fbbf24':'#6b5b8a'));
      kotaIcerik.appendChild(gunlukDiv);
      kotaIcerik.appendChild(h('p',{style:{color:'#4b3d6b',fontSize:'.65rem',fontStyle:'italic',marginTop:'6px'}},'Not: "Kalan istek hakkı" Groq\'un o anki yanıtına göredir; dakikalık veya günlük limiti yansıtabilir.'));
    }
    kotaGoster();
    // Her 5 saniyede bir: ekranı güncelle. Ayrıca, gösterilen bekleme süresi dolduysa
    // (kota tahmini olarak açılmış olmalıysa) arka planda GERÇEK bir test isteği atıp
    // kotanın gerçekten açılıp açılmadığını doğrular — sadece sayaç sıfırlanınca "kota
    // dolu" yazısının otomatik güncellenmemesi sorununu bu şekilde çözüyoruz.
    const kotaIntervalId = setInterval(async ()=>{
      if(!document.body.contains(kotaIcerik)){ clearInterval(kotaIntervalId); return; }
      const suresiDolduMu = groqKota.kotaDolduMu && groqKota.kotaAcilmaZamani!==null && Date.now() >= groqKota.kotaAcilmaZamani;
      if(suresiDolduMu && !groqOtomatikKontrolDevamEdiyor){
        groqOtomatikKontrolDevamEdiyor = true;
        try{
          await scorePoem('Deneme şiiri:\nGüneş doğar, kuşlar öter,\nBu satırlar sadece test eder.');
        } finally {
          groqOtomatikKontrolDevamEdiyor = false;
        }
      }
      kotaGoster();
    }, 5000);

    const yenileBtn=h('button',{style:{marginTop:'8px',fontSize:'.7rem',padding:'4px 10px',background:'transparent',color:'#7c3aed',border:'1px solid #3d1f6e',borderRadius:'8px',cursor:'pointer'},
      onclick:()=>{kotaGoster();}
    },'🔄 Yenile');

    const testBtn=h('button',{style:{marginTop:'8px',marginLeft:'8px',fontSize:'.7rem',padding:'4px 10px',background:'transparent',color:'#34d399',border:'1px solid #1d5c3d',borderRadius:'8px',cursor:'pointer'},
      onclick:async(ev)=>{
        const btn=ev.currentTarget;
        btn.disabled=true; const eskiMetin=btn.textContent; btn.textContent='⏳ Test ediliyor...';
        await scorePoem('Deneme şiiri:\nGökyüzü mavi, rüzgar eser,\nBu satırlar sadece test eder.');
        kotaGoster();
        btn.disabled=false; btn.textContent=eskiMetin;
      }
    },'🔍 Groq Test Et');

    const geminiTestBtn=h('button',{style:{marginTop:'8px',marginLeft:'8px',fontSize:'.7rem',padding:'4px 10px',background:'transparent',color:'#60a5fa',border:'1px solid #1e3a5f',borderRadius:'8px',cursor:'pointer'},
      onclick:async(ev)=>{
        const btn=ev.currentTarget;
        btn.disabled=true; const eskiMetin=btn.textContent; btn.textContent='⏳ Test ediliyor...';
        await scorePoemGeminiIle('Deneme şiiri:\nDeniz mavi, martı öter,\nBu satırlar sadece test eder.');
        kotaGoster();
        btn.disabled=false; btn.textContent=eskiMetin;
      }
    },'✨ Gemini Test Et');

    const claudeTestBtn=h('button',{style:{marginTop:'8px',marginLeft:'8px',fontSize:'.7rem',padding:'4px 10px',background:'transparent',color:'#f0abfc',border:'1px solid #4a1d5c',borderRadius:'8px',cursor:'pointer'},
      onclick:async(ev)=>{
        const btn=ev.currentTarget;
        btn.disabled=true; const eskiMetin=btn.textContent; btn.textContent='⏳ Test ediliyor...';
        await scorePoemClaudeIle('Deneme şiiri:\nYağmur yağar, toprak kokar,\nBu satırlar sadece test eder.');
        kotaGoster();
        btn.disabled=false; btn.textContent=eskiMetin;
      }
    },'🎭 Claude Test Et');

    kotaDiv.appendChild(kotaIcerik);
    kotaDiv.appendChild(yenileBtn);
    kotaDiv.appendChild(testBtn);
    kotaDiv.appendChild(geminiTestBtn);
    kotaDiv.appendChild(claudeTestBtn);
    adminPanel.appendChild(kotaDiv);
    const durumEl=h('p',{style:{color:'#6b5b8a',fontSize:'.85rem',marginTop:'10px',fontStyle:'italic'}},'');
    const topluModelSecici=h('select',{class:'inp',style:{marginBottom:'8px',fontSize:'.82rem',padding:'8px',borderRadius:'8px'}},[
      h('option',{value:'auto'},'🔀 Groq — otomatik kademe (kota dolarsa sıradakine geçer)'),
      h('option',{value:'groq:openai/gpt-oss-120b'},'🟢 Groq: openai/gpt-oss-120b'),
      h('option',{value:'groq:llama-3.3-70b-versatile'},'🟢 Groq: llama-3.3-70b-versatile'),
      h('option',{value:'groq:llama-3.1-8b-instant'},'🟢 Groq: llama-3.1-8b-instant'),
      h('option',{value:'gemini'},'✨ Google Gemini'),
      h('option',{value:'claude'},'🎭 Anthropic Claude')
    ]);
    topluModelSecici.value=adminSecilenSaglayici;
    topluModelSecici.onchange=e=>{adminSecilenSaglayici=e.target.value;};
    adminPanel.appendChild(topluModelSecici);
    const revalBtn=h('button',{class:'pb btn',style:{width:'100%',background:'linear-gradient(135deg,#5b21b6,#7c3aed)',fontSize:'.9rem'},
      onclick:async()=>{
        revalBtn.disabled=true;
        revalBtn.textContent='⏳ Değerlendiriliyor...';
        durumEl.textContent='';
        let sayac=0;
        const tumPostlar=[...S.posts];
        for(const post of tumPostlar){
          if(!post.text||post.text.trim().length<10){sayac++;continue;}
          // Her şiir arasında 2.5 sn bekle — Groq rate limit (30 istek/dk) için
          if(sayac>0) await new Promise(res=>setTimeout(res,2500));
          durumEl.textContent=`⏳ ${sayac+1}/${tumPostlar.length} değerlendiriliyor...`;
          const r=await scorePoem(post.text, adminSecilenSaglayici);
          const kullanilanModelToplu = groqKota.sonKaynak==='yerel' ? 'yerel' : (groqKota.sonModel||groqKota.sonKaynak);
          const botZorunluModelToplu = groqKota.sonKaynak==='groq' ? groqKota.sonModel : null;
          await new Promise(res=>setTimeout(res,800));
          const b1=await botDuyuPuan(post.text, botZorunluModelToplu);
          await new Promise(res=>setTimeout(res,800));
          const b2=await botKatliPuan(post.text, botZorunluModelToplu);
          await new Promise(res=>setTimeout(res,800));
          const b3=await botAriPuan(post.text, botZorunluModelToplu);
          const yeniRatings={...(post.userRatings||{})};
          if(b1)yeniRatings[b1.kullanici]=b1.puan;
          if(b2)yeniRatings[b2.kullanici]=b2.puan;
          if(b3)yeniRatings[b3.kullanici]=b3.puan;
          if(r)yeniRatings['bot_ai_yorum']=r.score;
          const yeniBotYorumlar={...(post.botYorumlar||{})};
          if(b1)yeniBotYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};
          if(b2)yeniBotYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};
          if(b3)yeniBotYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};
          const idx=S.posts.findIndex(p=>p.id===post.id);
          if(idx>-1){
            S.posts[idx].userRatings=yeniRatings;
            S.posts[idx].botYorumlar=yeniBotYorumlar;
            if(r){S.posts[idx].aiScore=r.score;S.posts[idx].aiYorum=r.yorum;S.posts[idx].aiGuclu=r.gucluYonler;S.posts[idx].aiOneri=r.gelistirmeOnerisi;S.posts[idx].aiModel=kullanilanModelToplu;}
          }
          try{await db.collection("posts").doc(post.id).update({userRatings:yeniRatings,botYorumlar:yeniBotYorumlar,aiScore:r?r.score:post.aiScore,aiYorum:r?r.yorum:post.aiYorum,aiGuclu:r?r.gucluYonler:post.aiGuclu,aiOneri:r?r.gelistirmeOnerisi:post.aiOneri,aiModel:r?kullanilanModelToplu:(post.aiModel||null)});}catch(e){console.error(e);}
          sayac++;
          durumEl.textContent=`${sayac}/${tumPostlar.length} şiir güncellendi...`;
        }
        save();
        revalBtn.disabled=false;
        revalBtn.textContent='🔄 Tüm Şiirleri Yeniden Değerlendir';
        durumEl.textContent=`✅ ${sayac} şiir başarıyla güncellendi!`;
        durumEl.style.color='#34d399';
        render();
      }
    },'🔄 Tüm Şiirleri Yeniden Değerlendir');
    adminPanel.appendChild(revalBtn);
    adminPanel.appendChild(durumEl);
  }

  page.appendChild(card);
  if(adminPanel) page.appendChild(adminPanel);
  page.appendChild(h('h3',{style:{fontFamily:"'Playfair Display',serif",color:'#a78bfa',marginBottom:'12px',fontSize:'1.1rem'}},'Şiirler'));
  if(!ups.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Henüz şiir paylaşılmadı.'));
  } else {
    ups.forEach(p=>{
      const a=calcAvg(p.userRatings,p.aiScore);
      const pc=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'center',cursor:'pointer',opacity:p.hidden?'.6':'1'},onclick:()=>go('postdetail',{postId:p.id})});

      const baslikRow=h('div',{style:{display:'flex',alignItems:'center',gap:'8px',flexWrap:'wrap'}});
      baslikRow.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',color:'#e9d5ff',fontStyle:'italic'}},`"${p.title||p.text?.slice(0,30)+(p.text?.length>30?'…':'')||'İsimsiz'}"`));
      if(p.hidden) baslikRow.appendChild(h('span',{class:'hidden-badge'},'🙈 Gizli'));
      info.appendChild(baslikRow);
      info.appendChild(h('p',{style:{fontSize:'.78rem',color:'#6b5b8a',marginTop:'4px'}},`${p.date} · ${(p.comments||[]).length} yorum`));
      pc.appendChild(info);
      if(a!==null)pc.appendChild(h('div',{class:'score-box',style:{border:`1px solid ${scoreColor(a)}44`}},[h('p',{style:{fontFamily:"'Playfair Display',serif",fontSize:'1rem',fontWeight:'700',color:scoreColor(a)}},a.toFixed(1)),h('p',{style:{fontSize:'.55rem',color:'#6b5b8a'}},'/10')]));
      if(isMe || isAdminViewer){
        const toggleBtn=h('button',{class:'btn',style:{background:p.hidden?'#16a34a':'#3d1f6e',color:'#fff',border:'none',borderRadius:'8px',padding:'6px 10px',fontSize:'.72rem',fontWeight:'bold',flexShrink:'0'},onclick:(e)=>{e.stopPropagation();A.togglePostHidden(p.id);}},p.hidden?'👁️ Aktif Et':'🙈 Gizle');
        pc.appendChild(toggleBtn);
      }
      page.appendChild(pc);
    });
  }
  wrap.appendChild(page);return wrap;
}

function PostDetail(){
  const post=S.posts.find(p=>p.id===S.postId);
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'16px'},onclick:()=>history.back()},'← Akışa Dön'));
  // Bir bildirimden (yorum/yanıt bildirimi) gelindiyse yorum bölümünü otomatik aç ve o yoruma kaydır
  const yorumAc = !!S.acilacakYorum;
  const hedefYorumId = S.hedefYorumId||null;
  S.acilacakYorum = false;
  S.hedefYorumId = null;
  const gizliVeGoremez = post && post.hidden && post.authorId!==S.me?.id && S.me?.username!==ADMIN_USERNAME;
  if(post && !gizliVeGoremez) page.appendChild(postCard(post,true,yorumAc,hedefYorumId));
  else if(gizliVeGoremez) page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Bu şiir sahibi tarafından gizlenmiş.'));
  else page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic'}},'Şiir bulunamadı.'));
  wrap.appendChild(page);return wrap;
}

function Messages(){
  let chat=null;
  let activeTab='msgs'; // msgs | notifs
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});

  // Sekmeler
  const unreadMsgCount=(S.msgs||[]).filter(m=>m.toId===S.me?.id && !m.read).length;
  const unreadNotifCount=(S.notifs||[]).filter(n=>!n.read).length;
  const msgsBtn=h('button',{class:'btn','data-subtab':'msgs',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'linear-gradient(135deg,#7c3aed,#a855f7)',color:'#fff',border:'none',position:'relative'}});
  msgsBtn.appendChild(document.createTextNode('✉️ Mesajlar'));
  const msgsBadge=h('span',{class:'sub-badge',style:{position:'absolute',top:'-4px',right:'-4px',background:'#e879f9',color:'#fff',borderRadius:'50%',width:'18px',height:'18px',fontSize:'.6rem',display:unreadMsgCount>0?'flex':'none',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unreadMsgCount>9?'9+':unreadMsgCount));
  msgsBtn.appendChild(msgsBadge);
  const notifBtn=h('button',{class:'btn','data-subtab':'notifs',style:{flex:'1',padding:'10px',borderRadius:'10px',fontSize:'.88rem',background:'#1a0f2e',color:'#a78bfa',border:'1px solid #2d1b52',position:'relative'}});
  notifBtn.appendChild(document.createTextNode('🔔 Bildirimler'));
  const notifBadge=h('span',{class:'sub-badge',style:{position:'absolute',top:'-4px',right:'-4px',background:'#e879f9',color:'#fff',borderRadius:'50%',width:'18px',height:'18px',fontSize:'.6rem',display:unreadNotifCount>0?'flex':'none',alignItems:'center',justifyContent:'center',fontWeight:'700'}},String(unreadNotifCount>9?'9+':unreadNotifCount));
  notifBtn.appendChild(notifBadge);
  const tabRow=h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}},[msgsBtn,notifBtn]);
  page.appendChild(tabRow);

  const ct=h('div');page.appendChild(ct);wrap.appendChild(page);

  function showMsgs(){
    ct.innerHTML='';
    // Sadece mesajlaşılan kişileri göster
    const contactedIds=new Set();
    S.msgs.forEach(m=>{
      if(m.fromId===S.me?.id)contactedIds.add(m.toId);
      if(m.toId===S.me?.id)contactedIds.add(m.fromId);
    });
    const contacts=S.users.filter(u=>contactedIds.has(u.id)&&u.id!==S.me?.id);

    // Mesaj yazılabilecek tüm kullanıcılar için "Yeni Mesaj" butonu
    const newMsgBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'12px',background:'linear-gradient(135deg,#1e0a3e,#2d1060)',border:'1px dashed #5b21b6',borderRadius:'12px',padding:'12px',color:'#a78bfa',fontSize:'.9rem',fontFamily:"'Crimson Text',serif",display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'},onclick:()=>showUserList()});
    newMsgBtn.appendChild(document.createTextNode('✏️ Yeni Mesaj'));
    ct.appendChild(newMsgBtn);

    if(!contacts.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'20px'}},'Henüz mesajlaşma yok. Yukarıdaki butona basarak yeni mesaj gönderebilirsin.'));
      return;
    }
    contacts.forEach(u=>{
      const last=[...S.msgs].reverse().find(m=>(m.fromId===S.me?.id&&m.toId===u.id)||(m.fromId===u.id&&m.toId===S.me?.id));
      const unread=S.msgs.filter(m=>m.fromId===u.id&&m.toId===S.me?.id&&!m.read).length;
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,44));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      if(last)info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.83rem'}},last.text.slice(0,40)+(last.text.length>40?'…':'')));
      card.appendChild(info);
      if(unread>0)card.appendChild(h('span',{style:{background:'#c084fc',color:'#fff',borderRadius:'50%',width:'20px',height:'20px',fontSize:'.7rem',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:'700',flexShrink:'0'}},String(unread)));
      const delBtn=h('button',{class:'btn',title:'Sohbeti sil',style:{background:'none',color:'#6b5b8a',fontSize:'.95rem',padding:'4px 6px',flexShrink:'0'},onclick:(e)=>{e.stopPropagation();A.deleteConversation(u.id);}},'🗑');
      card.appendChild(delBtn);
      ct.appendChild(card);
    });
  }

  function showUserList(){
    ct.innerHTML='';
    ct.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',marginBottom:'12px',fontSize:'.9rem'},onclick:()=>showMsgs()},'← Geri'));
    ct.appendChild(h('p',{style:{color:'#a78bfa',fontFamily:"'Crimson Text',serif",fontSize:'.9rem',marginBottom:'12px',fontStyle:'italic'}},'Mesaj göndermek istediğin kişiyi seç:'));
    const others=S.users.filter(u=>u.id!==S.me?.id&&u.username!==ADMIN_USERNAME);
    others.forEach(u=>{
      const card=h('div',{class:'card',style:{display:'flex',alignItems:'center',gap:'12px',cursor:'pointer'},onclick:()=>{chat=u.id;showChat();}});
      card.appendChild(av(u,40));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700'}},u.name));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.8rem'}},`@${u.username}`));
      card.appendChild(info);
      ct.appendChild(card);
    });
  }

  function showNotifs(){
    ct.innerHTML='';
    const unread=(S.notifs||[]).filter(n=>!n.read);
    if(unread.length>0){
      unread.forEach(n=>{n.read=true;db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});});
      lsSet('yo_notifs',S.notifs);
      mesajBildirimRozetGuncelle();
    }
    const notifs=S.notifs||[];
    if(!notifs.length){
      ct.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
      return;
    }
    const temizleBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'12px',background:'none',color:'#f87171',fontSize:'.82rem',border:'1px solid #4c1d1d',borderRadius:'10px',padding:'8px'},onclick:()=>{A.clearAllNotifs();}},'🗑 Tümünü Temizle');
    ct.appendChild(temizleBtn);
    notifs.forEach(n=>{
      const tiklanabilir = !!(n.postId || n.fromId);
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',cursor:tiklanabilir?'pointer':'default',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      if(tiklanabilir){
        card.onclick=()=>{
          if(n.postId){
            S.acilacakYorum = n.tur==='yorum'||n.tur==='yanit';
            S.hedefYorumId = n.commentId||null;
            go('postdetail',{postId:n.postId});
          } else if(n.fromId){
            go('profile',{profileId:n.fromId});
          }
        };
      }
      const ikon = n.text.includes('takip')?'👤':n.text.includes('paylaştı')?'🪶':n.text.includes('yorum')?'💬':n.text.includes('beğendi')?'👍':n.text.includes('kalp')?'❤️':'⭐';
      card.appendChild(h('span',{style:{fontSize:'1.4rem',flexShrink:'0'}},ikon));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px',display:'inline-block'}}));
      const delBtn=h('button',{class:'btn',title:'Bildirimi sil',style:{background:'none',color:'#6b5b8a',fontSize:'.9rem',padding:'2px 4px',flexShrink:'0'},onclick:(e)=>{e.stopPropagation();A.deleteNotif(n.id);showNotifs();}},'✕');
      card.appendChild(delBtn);
      ct.appendChild(card);
    });
  }

  function showChat(){
    // Bu sohbette bana ait, henüz okunmamış mesajları okundu olarak işaretle
    const okunmamislar = S.msgs.filter(m=>m.fromId===chat && m.toId===S.me?.id && !m.read);
    if(okunmamislar.length>0){
      okunmamislar.forEach(m=>{
        m.read=true;
        db.collection("msgs").doc(m.id).update({read:true}).catch(()=>{});
      });
      lsSet('yo_msgs',S.msgs);
      mesajBildirimRozetGuncelle();
    }
    ct.innerHTML='';
    const chatUser=S.users.find(u=>u.id===chat);
    const hdr=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',marginBottom:'12px'}});
    hdr.appendChild(h('button',{class:'btn',style:{background:'none',color:'#a78bfa',fontSize:'.9rem'},onclick:()=>{chat=null;showMsgs();}},'←'));
    hdr.appendChild(av(chatUser,36));
    hdr.appendChild(h('p',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',fontWeight:'700',flex:'1'}},chatUser?.name||''));
    hdr.appendChild(h('button',{class:'btn',title:'Sohbeti sil',style:{background:'none',color:'#f87171',fontSize:'.85rem',padding:'4px 8px'},onclick:()=>{A.deleteConversation(chat);}},'🗑 Sohbeti Sil'));
    ct.appendChild(hdr);
    const msgs=h('div',{style:{height:'55vh',overflowY:'auto',display:'flex',flexDirection:'column',gap:'10px',paddingBottom:'8px'}});
    S.msgs.filter(m=>(m.fromId===S.me?.id&&m.toId===chat)||(m.fromId===chat&&m.toId===S.me?.id)).forEach(m=>{
      const mine=m.fromId===S.me?.id;
      const bubbleRow=h('div',{style:{display:'flex',justifyContent:mine?'flex-end':'flex-start',alignItems:'center',gap:'6px'}});
      const bubble=h('div',{style:{maxWidth:'70%',background:mine?'linear-gradient(135deg,#7c3aed,#a855f7)':'#1a0f2e',borderRadius:mine?'16px 16px 4px 16px':'16px 16px 16px 4px',padding:'10px 14px',border:mine?'none':'1px solid #2d1b52'}},[h('p',{style:{color:'#f0e8ff',fontSize:'.95rem'}},m.text),h('p',{style:{color:mine?'#ddd6fe':'#6b5b8a',fontSize:'.7rem',marginTop:'4px',textAlign:mine?'right':'left'}},m.date)]);
      if(mine){
        const delBtn=h('button',{class:'btn',title:'Mesajı sil',style:{background:'none',color:'#6b5b8a',fontSize:'.8rem',padding:'2px 4px',flexShrink:'0'},onclick:()=>{A.deleteMsg(m.id);showChat();}},'🗑');
        bubbleRow.appendChild(delBtn);
        bubbleRow.appendChild(bubble);
      } else {
        bubbleRow.appendChild(bubble);
      }
      msgs.appendChild(bubbleRow);
    });
    msgs.scrollTop=msgs.scrollHeight;
    const mi=inp('Mesajını yaz...');mi.style.borderRadius='20px';mi.style.flex='1';
    const sendMsg=()=>{if(!mi.value.trim())return;A.sendMsg(chat,mi.value.trim());mi.value='';showChat();};
    mi.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
    ct.appendChild(msgs);
    ct.appendChild(h('div',{style:{display:'flex',gap:'8px',marginTop:'10px'}},[mi,h('button',{class:'pb btn',style:{padding:'10px 18px'},onclick:sendMsg},'↩')]));
  }

  msgsBtn.onclick=()=>{activeTab='msgs';msgsBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';msgsBtn.style.color='#fff';msgsBtn.style.border='none';notifBtn.style.background='#1a0f2e';notifBtn.style.color='#a78bfa';notifBtn.style.border='1px solid #2d1b52';showMsgs();};
  notifBtn.onclick=()=>{activeTab='notifs';notifBtn.style.background='linear-gradient(135deg,#7c3aed,#a855f7)';notifBtn.style.color='#fff';notifBtn.style.border='none';msgsBtn.style.background='#1a0f2e';msgsBtn.style.color='#a78bfa';msgsBtn.style.border='1px solid #2d1b52';showNotifs();};

  showMsgs();
  return wrap;
}

function Notifs(){
  // Bildirimleri okundu olarak işaretle
  const unread=(S.notifs||[]).filter(n=>!n.read);
  if(unread.length>0){
    unread.forEach(n=>{
      n.read=true;
      db.collection("notifs").doc(n.id).update({read:true}).catch(()=>{});
    });
    lsSet('yo_notifs',S.notifs);
  }
  const wrap=h('div',{},[navBar()]);
  const page=h('div',{class:'page'});
  page.appendChild(h('h2',{style:{fontFamily:"'Playfair Display',serif",color:'#e9d5ff',marginBottom:'16px',fontSize:'1.4rem'}},'🔔 Bildirimler'));
  const notifs=S.notifs||[];
  if(!notifs.length){
    page.appendChild(h('p',{style:{color:'#6b5b8a',fontStyle:'italic',textAlign:'center',marginTop:'40px'}},'Henüz bildirim yok. Şiirlerine yorum ve puan geldikçe burada görünecek! 🌙'));
  } else {
    const temizleBtn=h('button',{class:'btn',style:{width:'100%',marginBottom:'12px',background:'none',color:'#f87171',fontSize:'.82rem',border:'1px solid #4c1d1d',borderRadius:'10px',padding:'8px'},onclick:()=>{A.clearAllNotifs();}},'🗑 Tümünü Temizle');
    page.appendChild(temizleBtn);
    notifs.forEach(n=>{
      const tiklanabilir = !!(n.postId || n.fromId);
      const card=h('div',{class:'card',style:{display:'flex',gap:'12px',alignItems:'flex-start',cursor:tiklanabilir?'pointer':'default',background:n.read?'linear-gradient(135deg,#1a0f2e,#160d28)':'linear-gradient(135deg,#2d1060,#1e0f3a)',border:n.read?'1px solid #2d1b52':'1px solid #7c3aed'}});
      if(tiklanabilir){
        card.onclick=()=>{
          if(n.postId){
            S.acilacakYorum = n.tur==='yorum'||n.tur==='yanit';
            S.hedefYorumId = n.commentId||null;
            go('postdetail',{postId:n.postId});
          } else if(n.fromId){
            go('profile',{profileId:n.fromId});
          }
        };
      }
      const ikon = n.text.includes('takip')?'👤':n.text.includes('paylaştı')?'🪶':n.text.includes('yorum')?'💬':n.text.includes('beğendi')?'👍':n.text.includes('kalp')?'❤️':'⭐';
      card.appendChild(h('span',{style:{fontSize:'1.5rem',flexShrink:'0'}},ikon));
      const info=h('div',{style:{flex:'1'}});
      info.appendChild(h('p',{style:{color:'#e9d5ff',fontSize:'.92rem',lineHeight:'1.5',fontFamily:"'Crimson Text',serif"}},n.text));
      info.appendChild(h('p',{style:{color:'#6b5b8a',fontSize:'.75rem',marginTop:'4px'}},n.date));
      card.appendChild(info);
      if(!n.read)card.appendChild(h('span',{style:{width:'8px',height:'8px',borderRadius:'50%',background:'#c084fc',flexShrink:'0',marginTop:'4px'}}));
      const delBtn=h('button',{class:'btn',title:'Bildirimi sil',style:{background:'none',color:'#6b5b8a',fontSize:'.9rem',padding:'2px 4px',flexShrink:'0'},onclick:(e)=>{e.stopPropagation();A.deleteNotif(n.id);}},'✕');
      card.appendChild(delBtn);
      page.appendChild(card);
    });
  }
  wrap.appendChild(page);return wrap;
}

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  
  if (S.loading) {
    app.appendChild(h('div',{style:{minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#0f0a1a'}},[
      h('div',{style:{fontSize:'32px'}},'🪶'),
      h('p',{style:{color:'#a78bfa',marginTop:'12px',fontStyle:'italic',fontSize:'1rem'}},'Ozanlar Meclisi Yükleniyor...')
    ]));
    return;
  }

  // Anasayfa (feed), sıralama, keşfet, profil ve şiir detayı GİRİŞ YAPMADAN görülebilir.
  // Şiir paylaşma, yorum yazma, puan/tepki verme, takip etme ve mesajlaşma gibi eylemler
  // ise tıklandığı anda girisGerekli() üzerinden giriş ekranına yönlendirir.
  // Mesajlar ekranı, giriş gerektirdiği için misafirse doğrudan login'e çevrilir.
  let gosterilecekEkran = S.screen;
  if(gosterilecekEkran==='messages' && !S.me) gosterilecekEkran='login';

  const screens={
    feed:Feed,
    leaderboard:Leaderboard,
    explore:Explore,
    profile:Profile,
    postdetail:PostDetail,
    messages:Messages,
    notifs:Notifs,
    swipe:SwipeMode,
    login:()=>authPage('Hoş geldin','Hesabınla giriş yap',[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'}],'Giriş Yap',v=>A.login(v.u||'',v.p||''),'Hesabın yok mu?',()=>go('register')),
    register:()=>authPage('Katıl',"Yeni Ozanlar'a üye ol",[{label:'Kullanıcı adı',type:'text',ph:'kullaniciadi',k:'u'},{label:'Şifre',type:'password',ph:'••••••••',k:'p'},{label:'Şifre tekrar',type:'password',ph:'••••••••',k:'p2'}],'Hesap Oluştur',v=>{if(!v.u||!v.p)return'Tüm alanları doldurun.';if(v.p!==v.p2)return'Şifreler eşleşmiyor.';if((v.p||'').length<6)return'Şifre en az 6 karakter.';return A.register(v.u.trim(),v.p);},'Zaten üye misin?',()=>go('login'))
  };
  const Screen=screens[gosterilecekEkran]||Feed;
  app.appendChild(Screen());
}

// Uygulama Firebase'den hiçbir şey beklemeden ilk çizimini hemen yapar
// (cache doluysa akış anında görünür, boşsa kısa bir yükleniyor ekranı görünür).
// Daha önce ilk render() çağrısı yalnızca verileriYukle() bittikten SONRA yapılıyordu,
// bu da uygulamanın veri gelene kadar tamamen boş/beyaz görünmesine sebep oluyordu.
render();
verileriYukle();
</script>
