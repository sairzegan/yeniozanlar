<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Yeni Ozanlar 🪶</title>
  <style>
    body { background: #0f0a1a; color: #f0e8ff; font-family: sans-serif; margin: 0; padding: 0; }
    /* Geniş kart tasarımı */
    .card { background: #1a0f2e; border: 1px solid #2d1b52; border-radius: 20px; padding: 30px; margin: 20px auto; width: 90%; max-width: 600px; min-height: 400px; }
    .btn { background: #7c3aed; color: white; padding: 15px; border-radius: 10px; cursor: pointer; width: 100%; border: none; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 1. Durum (State) tanımları
    let S = { posts: [], loading: true, pageLimit: 3 };

    // 2. Basit render fonksiyonu (Hatasız olması için)
    function render() {
      const app = document.getElementById('app');
      if (S.loading) {
        app.innerHTML = '<div style="text-align:center; padding-top:50px;">Yükleniyor...</div>';
        return;
      }
      
      app.innerHTML = '<div id="main" style="padding-bottom:100px;"></div>';
      const main = document.getElementById('main');

      // İlk 3 şiiri göster
      const gorunur = S.posts.slice(0, S.pageLimit);
      gorunur.forEach(p => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `<h2>${p.title || 'Şiir'}</h2><p style="margin-top:20px; font-size:18px;">${p.text}</p>`;
        main.appendChild(div);
      });

      // "Daha Fazla Gör" butonu
      if (S.posts.length > S.pageLimit) {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = 'Daha Fazla Şiir Gör';
        btn.onclick = () => { S.pageLimit += 3; render(); };
        main.appendChild(btn);
      }
    }

    // 3. Veri çekme simülasyonu (Firebase kodlarınızı buraya ekleyeceksiniz)
    async function verileriYukle() {
      try {
        // Firebase'den verileri buraya çekip S.posts'a atayacağız
        // Örnek: S.posts = await db.collection('posts').get()...
        S.posts = [{title: "Örnek Şiir 1", text: "..."}, {title: "Örnek Şiir 2", text: "..."}, {title: "Örnek Şiir 3", text: "..."}, {title: "Örnek Şiir 4", text: "..."}]; 
        S.loading = false;
        render();
      } catch (e) {
        console.error("Hata:", e);
      }
    }

    verileriYukle();
  </script>
</body>
</html>
