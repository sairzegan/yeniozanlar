// ── Genel AI kademesi (cascade) ─────────────────────────────────────────────
// Admin doğrudan 'gemini', 'claude' ya da belirli bir 'groq:model' seçtiğinde,
// o seçim başarısız olduğunda DOĞRUDAN yerel algoritmaya düşülmez; kademedeki
// KALAN adımlar sırayla denenir. Yerel algoritmaya SADECE hepsi başarısız
// olursa (en son çare olarak) düşülür.
//
// Gemini BİLEREK 1. sırada: admin'in isteği bu yönde ("Gemini mutlaka 1.
// sırada değerlendirme yapmalı"). Not: sıra değişikliği Gemini'nin ARKA
// PLANDA neden başarısız olduğunu değiştirmez — /api/gemini gerçekten hata
// dönüyorsa (ör. eksik/yanlış GEMINI_API_KEY, kota, sunucu tarafı hata) yine
// hata verecek ve kademe otomatik olarak sıradaki Groq modeline geçecektir;
// bu zaten var olan "sıradakine geç, yerele düşme" davranışıyla karşılanır.
const TAM_AI_KADEMESI = [
  {tur:'gemini'},                               // admin isteğiyle 1. sırada
  {tur:'groq', model:'openai/gpt-oss-120b'},   // ~200.000 token/gün — kaliteli, iyi bir denge
  {tur:'groq', model:'qwen/qwen3.8-27b'},      // Groq'un llama-3.3-70b-versatile YERİNE önerdiği model
  {tur:'groq', model:'openai/gpt-oss-20b'}     // en yüksek kotalı/en hızlı Groq modeli
];

function adimEtiketi(adim){ return adim.tur==='groq' ? adim.model : adim.tur; }

async function scorePoemAdimCalistir(text, adim){
  if(adim.tur==='groq') return await scorePoemTekModel(text, adim.model);
  if(adim.tur==='gemini') return await scorePoemGeminiCore(text);
  if(adim.tur==='claude') return await scorePoemClaudeCore(text);
  throw new Error('Bilinmeyen AI adımı: '+adim.tur);
}

// baslangicAdimi verilirse (admin'in doğrudan seçimi) önce O denenir; başarısız
// olursa TAM_AI_KADEMESI'ndeki KALAN adımlar (baslangicAdimi hariç, kendi
// sırasıyla) denenir. baslangicAdimi verilmezse 'auto' modu: doğrudan
// TAM_AI_KADEMESI baştan sona denenir (Gemini 1. sırada). Hiçbir adım
// çalışmazsa EN SON yerel algoritmaya düşülür.
async function scorePoemKademeCalistir(text, baslangicAdimi=null){
  const denenecekler = baslangicAdimi
    ? [baslangicAdimi, ...TAM_AI_KADEMESI.filter(a=>adimEtiketi(a)!==adimEtiketi(baslangicAdimi))]
    : TAM_AI_KADEMESI;
  const hatalar=[];
  for(const adim of denenecekler){
    try{
      const result = await scorePoemAdimCalistir(text, adim);
      if(adim.tur==='groq'){
        groqKota.sonKaynak='groq'; groqKota.sonModel=adim.model;
        groqGunlukArttir(true);
      } else {
        groqKota.sonKaynak=adim.tur;
        groqKota.sonModel = adim.tur==='gemini' ? 'gemini-3.5-flash' : 'claude-sonnet-5';
      }
      groqKota.sonHata=null; groqKota.kotaDolduMu=false;
      return result;
    } catch(e){
      hatalar.push(`${adimEtiketi(adim)}: ${e.message}`);
      if(adim.tur==='groq') groqGunlukArttir(false);
      console.warn(`${adimEtiketi(adim)} başarısız, sıradaki AI deneniyor:`, e.message);
      // sıradaki AI'ya geç
    }
  }
  console.warn('Tüm AI sağlayıcıları başarısız oldu, yerel algoritma kullanılıyor:', hatalar.join(' | '));
  groqKota.sonKaynak = 'yerel';
  groqKota.sonModel = null;
  groqKota.sonHata = hatalar.join(' | ');
  return scorePoemYerelBirlesik(text);
}

async function scorePoem(text, saglayici='auto'){
  if(!text||text.trim().length<3)return null;
  if(saglayici==='gemini') return await scorePoemKademeCalistir(text, {tur:'gemini'});
  if(saglayici==='claude') return await scorePoemKademeCalistir(text, {tur:'claude'});
  // 'groq:model-adi' formatı: admin, Groq kademesindeki belirli bir modeli önce
  // dener; başarısız olursa kademedeki diğer AI'lar (diğer Groq modelleri ve
  // Gemini) sırayla denenir.
  if(saglayici && saglayici.startsWith('groq:')){
    const secilenModel = saglayici.slice(5);
    return await scorePoemKademeCalistir(text, {tur:'groq', model:secilenModel});
  }
  // 'auto': TAM_AI_KADEMESI baştan sona denenir (gemini → openai/gpt-oss-120b →
  // qwen/qwen3.8-27b → openai/gpt-oss-20b); hiçbiri çalışmazsa en son
  // yerel algoritmaya düşülür.
  return await scorePoemKademeCalistir(text, null);
}

function scorePoemYerel(text){
  if(!text||text.trim().length<3)return null;

  const satirlar = text.split('\n').filter(s=>s.trim().length>0);
  const lc = satirlar.length;
  const tumKelimeler = text.trim().split(/\s+/).map(w=>w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));
  const len = tumKelimeler.length;
  const tL = text.toLowerCase();
  const hash = text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd = n => Math.abs(hash) % n;

  // Tam kelime eşleşme
  const varMi = w => tumKelimeler.includes(w.toLowerCase().replace(/[^a-züğışöçâîû]/gi,''));

  // ── BENZERSIZ KELİME ZENGİNLİĞİ ─────────────────────────────────────────
  const benzersiz = new Set(tumKelimeler.filter(k=>k.length>0)).size;
  const zenginlik = benzersiz / Math.max(len, 1);

  // ── TEKRAR ANALİZİ ───────────────────────────────────────────────────────
  const kelSay = {};
  tumKelimeler.forEach(w=>{ if(w.length>0) kelSay[w]=(kelSay[w]||0)+1; });
  // Çok tekrar edenler (3+ kez)
  const cokTekrar = Object.entries(kelSay).filter(([,v])=>v>=3).sort((a,b)=>b[1]-a[1]);
  // Tüm kelimelerin kaçta kaçı tekrar?
  const tekrarOrani = len>0 ? (len - benzersiz) / len : 0;
  // Şiir aslında sadece tekrarlı kelimelerden mi oluşuyor?
  const tekrarAgirlikli = tekrarOrani > 0.40;

  // ── HECE ÖLÇÜSÜ (gerçek analiz) ─────────────────────────────────────────
  const heceHesapla = w => (w.match(/[aeıioöuüAEIİOÖUÜ]/g)||[]).length;
  const satirHece = satirlar.map(s => {
    const ws = s.trim().split(/\s+/);
    const toplam = ws.reduce((t,w)=>t+heceHesapla(w), 0);
    return toplam;
  });
  const heceMean = satirHece.reduce((a,b)=>a+b,0) / Math.max(satirHece.length,1);
  const heceVar = satirHece.length > 1
    ? Math.sqrt(satirHece.reduce((s,h)=>s+(h-heceMean)**2,0)/satirHece.length)
    : 99;

  // Hece ölçüsü GERÇEKTEN VAR MI?
  // Kriterler: en az 4 dize, varyans < 1.5, her dize en az 5 hece, ortalama > 6
  const sifirVeyaAzHece = satirHece.filter(h=>h<3).length;
  const heceOlcusu = (
    heceVar < 1.5 &&
    lc >= 4 &&
    sifirVeyaAzHece === 0 &&
    heceMean >= 6 &&
    satirHece.every(h=>h>=5)
  );

  // ── KAFİYE ANALİZİ (aynı kelime tekrarı = kafiye DEĞİL) ─────────────────
  const satirSon = satirlar.map(l=>{
    const ws = l.trim().split(/\s+/);
    const tam = ws[ws.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'') || '';
    return { tam, son3: tam.slice(-3), son2: tam.slice(-2) };
  });

  // Gerçek kafiye: FARKLI kelimeler ama aynı son ek
  const gercekKafiyeParlari = [];
  for(let i=0;i<satirSon.length;i++){
    for(let j=i+1;j<satirSon.length;j++){
      const k1 = satirSon[i].tam;
      const k2 = satirSon[j].tam;
      // Aynı kelime değil, ama son 3 harf aynı
      if(k1 !== k2 && k1.length>2 && k2.length>2 && satirSon[i].son3 === satirSon[j].son3 && satirSon[i].son3.length>1){
        gercekKafiyeParlari.push({k1, k2, ek: satirSon[i].son3});
      }
    }
  }
  const kafiyeVar = gercekKafiyeParlari.length > 0;
  const kafiyeOrani = gercekKafiyeParlari.length / Math.max(lc, 1);

  // Aynı kelimenin satır sonunda tekrarı — bu kafiye DEĞİL
  const ayniKelimeTekrar = [];
  const sonKelimeSayisi = {};
  satirSon.forEach(s=>{ if(s.tam) sonKelimeSayisi[s.tam]=(sonKelimeSayisi[s.tam]||0)+1; });
  Object.entries(sonKelimeSayisi).forEach(([k,v])=>{ if(v>=2) ayniKelimeTekrar.push({kelime:k, sayi:v}); });

  // Zorlamalı kafiye
  const tekEkSayisi = {};
  satirSon.forEach(s=>{ if(s.son3) tekEkSayisi[s.son3]=(tekEkSayisi[s.son3]||0)+1; });
  const maxEkTekrar = Math.max(...Object.values(tekEkSayisi).concat([0]));
  const zorlamaKafiye = kafiyeVar && maxEkTekrar >= Math.ceil(lc*0.6);

  // ── ALİTERASYON ───────────────────────────────────────────────────────────
  const alitSatirlar = satirlar.map(s=>{
    const harfler = s.trim().split(/\s+/).map(w=>w[0]?.toLowerCase()).filter(Boolean);
    if(harfler.length < 3) return null; // çok kısa satırlarda anlamsız
    const hs = {};
    harfler.forEach(h=>{hs[h]=(hs[h]||0)+1;});
    const guclu = Object.entries(hs).filter(([,v])=>v>=3);
    return guclu.length>0 ? {satir:s.trim(), harf:guclu[0][0], sayi:guclu[0][1]} : null;
  }).filter(Boolean);
  const aliterasyonVar = alitSatirlar.length > 0;

  // ── ASONANS ───────────────────────────────────────────────────────────────
  const unluler = tL.match(/[aeıioöuü]/g)||[];
  const unluHS = {};
  unluler.forEach(u=>{unluHS[u]=(unluHS[u]||0)+1;});
  const domUnlu = Object.entries(unluHS).sort((a,b)=>b[1]-a[1])[0];
  // Sadece uzun şiirlerde (12+ ünlü) ve gerçek hâkimiyet (%45+)
  const asonansVar = domUnlu && unluler.length>=12 && (domUnlu[1]/unluler.length)>0.45;

  // ── GÜNLÜK DİL ───────────────────────────────────────────────────────────
  const gunlukListe = [
    'tamam','evet','hayır','neyse','yani','aslında','işte','şimdi','hadi',
    'sanırım','bilmiyorum','noolur','olur','olmaz','aa','off','vay','hey',
    'ee','hmm','peki','madem','belki','galiba','bence','sence','nasıl',
    'neden','niçin','niye','seviyorum','seviyordum','sevmiyorum','istiyorum',
    'istemiyorum','yapıyorum','gidiyorum','geliyorum','bakıyorum',
    'gel','git','bak','dur','kalk','ver','al','koş'
  ];
  const gunlukBulunan = [...new Set(tumKelimeler.filter(w=>gunlukListe.includes(w)))];

  // ── DİDAKTİK ─────────────────────────────────────────────────────────────
  const didaktikListe = ['çünkü','dolayısıyla','bu nedenle','sonuç olarak','demek ki','özetle','kısaca','şunu söyleyeyim','anlayacağın'];
  const didaktikBulunan = didaktikListe.filter(d=>tL.includes(d));

  // ── KLİŞE ────────────────────────────────────────────────────────────────
  const kliseCiftler = [
    {kelimeler:['saç','rüzgar'], ifade:'saçları rüzgar'},
    {kelimeler:['göz','yıldız'], ifade:'gözleri yıldız'},
    {kelimeler:['aşk','ateş'], ifade:'aşk ateşi'},
    {kelimeler:['yürek','yan'], ifade:'yürek yangını'},
    {kelimeler:['kalp','kır'], ifade:'kırık kalp'},
    {kelimeler:['bülbül','gül'], ifade:'bülbül ve gül'},
    {kelimeler:['göz','deniz'], ifade:'gözlerin denizi'},
    {kelimeler:['sevgi','ışık'], ifade:'sevginin ışığı'},
  ];
  const kliseBulunan = kliseCiftler.filter(c=>c.kelimeler.every(k=>tL.includes(k)));
  const kliseTekListe = ['aşkından yandım','sensiz olmaz','hasret kaldım','kırık kalp','seni bekliyorum','gözlerin yıldız','saçların rüzgar'];
  const kliseTekBulunan = kliseTekListe.filter(k=>tL.includes(k));

  // ── İMGE ─────────────────────────────────────────────────────────────────
  const benzetmeImleri = ['gibi','sanki','andır','tıpkı','adeta','misali'];
  const benzetmeSatirlari = satirlar.filter(s=>benzetmeImleri.some(b=>s.toLowerCase().includes(b)));

  const insanFiilleri = ['söyler','bakar','ağlar','güler','uçar','koşar','fısıldar','haykırır','titrer','sarılır','bekler','özler','düşünür'];
  const dogaKelime = ['güneş','ay','yıldız','deniz','dağ','rüzgar','yaprak','bulut','ağaç','nehir','kar','çiçek','toprak','taş','su'];
  const kisilesMeSatirlari = satirlar.filter(s=>{
    const sL=s.toLowerCase();
    return dogaKelime.some(d=>sL.includes(d)) && insanFiilleri.some(f=>sL.includes(f));
  });

  const sembolListe = ['labirent','kafes','zincir','perde','kök','tohum','kül','yankı','gölge','iz','boşluk','uçurum','köprü','sis','çıkmaz','zindan','kanat','ayna'];
  const sembolBulunan = sembolListe.filter(w=>varMi(w));

  const ozgunMetafor = benzetmeSatirlari.length>0 && kliseBulunan.length===0;

  // ── ŞİİRSEL DİL ─────────────────────────────────────────────────────────
  const siirselListe = ['hüzün','keder','figan','gurbet','özlem','hasret','gönül','yürek','ruh','mehtap','şebnem','seher','canan','yar','efkar','hicran','viran','şevk','baht','felek','naz','niyaz','dert','derman'];
  const siirselBulunan = siirselListe.filter(w=>varMi(w));

  const modernSozler = ['telefon','internet','bilgisayar','araba','market','ofis','toplantı','şirket','uygulama','instagram','whatsapp','sosyal','wifi'];
  const modernBulunan = modernSozler.filter(w=>tL.includes(w));

  // ── TEMA ─────────────────────────────────────────────────────────────────
  const temalar = {
    'hüzün ve keder':      ['hüzün','keder','ağlamak','gözyaşı','yalnız','acı','solmak','yas','figan'],
    'umut ve yenilenme':   ['umut','ışık','sabah','doğmak','güneş','bahar','yeşermek','sevinç'],
    'aşk ve özlem':        ['sevgi','aşk','sevda','yürek','canan','yar','beklemek','özlemek','hasret'],
    'doğa ve evren':       ['deniz','dağ','orman','nehir','rüzgar','yaprak','toprak','bulut','kar','çiçek'],
    'varoluş ve anlam':    ['ölüm','yaşam','sonsuz','zaman','anlam','gerçek','boşluk','hiçlik'],
    'özgürlük ve isyan':   ['özgür','kanat','uçmak','zindan','kafes','kurtulmak','engel','zincir'],
    'gurbet ve yalnızlık': ['gurbet','yalnız','uzak','ayrılık','hasret','yurt','memleket'],
  };
  const temaAgirliklari = Object.entries(temalar).map(([isim,kelimeler])=>({
    isim, agirlik: kelimeler.filter(k=>varMi(k)).length,
    bulunanlar: kelimeler.filter(k=>varMi(k))
  })).sort((a,b)=>b.agirlik-a.agirlik);

  const anaTema = temaAgirliklari[0];
  const ikinciTema = temaAgirliklari[1]?.agirlik>0 ? temaAgirliklari[1] : null;

  // Tema dizelerinden alıntı
  const temaOrnekSatirlar = satirlar.filter(s=>
    anaTema.bulunanlar.some(k=>s.toLowerCase().includes(k))
  ).slice(0,2).map(s=>s.trim());

  const punct = (text.match(/[,;:!?—–.]/g)||[]).length;

  // ── PUAN HESAPLAMA ───────────────────────────────────────────────────────
  let p = 5.0;

  // Uzunluk — çok kısa sert ceza
  if(len < 5)        p -= 3.5;
  else if(len < 10)  p -= 2.0;
  else if(len < 15)  p -= 0.8;
  else if(len <= 60) p += 0.8;
  else if(len <= 120)p += 0.4;

  // Dize sayısı
  if(lc < 2)         p -= 2.0;
  else if(lc === 2)  p -= 1.0;
  else if(lc === 3)  p -= 0.3;
  else if(lc>=4&&lc<=20) p += 0.5;

  // Kelime tekrarı — çok tekrar eden şiire sert ceza
  if(tekrarAgirlikli)        p -= 1.5;
  if(cokTekrar.length >= 3)  p -= 1.0;
  else if(cokTekrar.length >= 2) p -= 0.5;

  // Kelime zenginliği
  if(zenginlik > 0.85)       p += 1.5;
  else if(zenginlik > 0.70)  p += 0.8;
  else if(zenginlik > 0.55)  p += 0.2;
  else if(zenginlik < 0.40)  p -= 1.0;
  else                        p -= 0.4;

  // Günlük dil
  const gd = gunlukBulunan.length;
  if(gd >= 5)      p -= 2.5;
  else if(gd >= 3) p -= 1.5;
  else if(gd >= 2) p -= 0.9;
  else if(gd >= 1) p -= 0.4;

  // Didaktik
  const dd = didaktikBulunan.length;
  if(dd >= 2) p -= 1.5;
  else if(dd >= 1) p -= 0.7;

  // Klişe
  p -= kliseBulunan.length * 0.7;
  p -= kliseTekBulunan.length * 0.5;

  // Şiirsel dil
  if(siirselBulunan.length >= 3) p += 0.8;
  else if(siirselBulunan.length >= 1) p += 0.3;

  // Modern kelime
  p -= modernBulunan.length * 0.4;

  // Kafiye — GERÇEK kafiye
  if(zorlamaKafiye)            p -= 1.0;
  else if(kafiyeOrani > 0.4)   p += 0.9;
  else if(kafiyeOrani > 0.2)   p += 0.4;

  // Aynı kelime tekrarı kafiye sayılmaz, hafif ceza
  if(ayniKelimeTekrar.length > 0 && !kafiyeVar) p -= 0.3;

  // Hece ölçüsü
  if(heceOlcusu) p += 0.8;

  // Ses araçları
  if(aliterasyonVar)  p += 0.4;
  if(asonansVar)      p += 0.3;

  // İmge
  if(ozgunMetafor)                  p += 0.6;
  else if(benzetmeSatirlari.length) p += 0.2;
  if(kisilesMeSatirlari.length)     p += 0.5;
  if(sembolBulunan.length)          p += 0.3;

  // Noktalama
  if(punct >= 2 && punct <= 12) p += 0.2;

  const sapma = ((Math.abs(hash)%9)-4)*0.07;
  p = Math.min(9.6, Math.max(2.0, p+sapma));
  p = Math.round(p*10)/10;

  // ── YORUM ÜRETİMİ ────────────────────────────────────────────────────────
  const P = [];

  // 1. Kısa/tekrarlı şiir uyarısı
  if(len < 10 || lc < 3){
    P.push(`Bu metin çok kısa — ${lc} dize, ${len} kelime. Şiirsel derinlik için çok az alan var; tema yüzeyde kalmak zorunda.`);
  }
  if(tekrarAgirlikli){
    const enCokTekrar = cokTekrar[0];
    P.push(`Şiirde kelime tekrarı çok yoğun: "${enCokTekrar?.[0]}" gibi sözcükler ${enCokTekrar?.[1]} kez geçiyor. Bu tekrar bilinçli bir anafora dönüşmüyor, yalnızca söz azlığını açığa çıkarıyor.`);
  } else if(cokTekrar.length > 0){
    P.push(`"${cokTekrar[0][0]}" kelimesi ${cokTekrar[0][1]} kez tekrarlanmış; bu bilinçli bir yineleme ise güçlü olabilir, değilse şiiri yataylaştırıyor.`);
  }

  // 2. Tema
  if(anaTema.agirlik > 0){
    let temaMetni = `Şiirde ${anaTema.isim} teması seziliyor`;
    if(ikinciTema) temaMetni += `, ${ikinciTema.isim} de ikincil olarak hissediliyor`;
    if(temaOrnekSatirlar.length > 0){
      temaMetni += `. "${temaOrnekSatirlar[0]}" dizesi temayı en açık taşıyan yer.`;
    } else {
      temaMetni += `; temayı taşıyan kelimeler: ${anaTema.bulunanlar.slice(0,3).map(k=>`"${k}"`).join(', ')}.`;
    }
    P.push(temaMetni);
  } else {
    P.push(`Şiirde belirgin bir tema yok; içerik belirsiz, okuyucuya tutunacak bir duygu ekseni sunulmuyor.`);
  }

  // 3. İmge ve metafor
  if(benzetmeSatirlari.length > 0){
    const orn = benzetmeSatirlari[0].trim();
    const k = orn.length > 65 ? orn.slice(0,65)+'…' : orn;
    P.push(ozgunMetafor
      ? `"${k}" dizesinde özgün bir benzetme var; beklenmedik imgeler şiiri sıradanlıktan kurtarıyor.`
      : `"${k}" dizesinde benzetme denenmiş ama kullanılan imgeler alışılagelen kalıplardan uzaklaşamıyor.`);
  }
  if(kisilesMeSatirlari.length > 0){
    const k = kisilesMeSatirlari[0].trim().slice(0,65);
    P.push(`"${k}" dizesinde doğaya insan özelliği yükleniyor — kişileştirme şiire derinlik katıyor.`);
  }
  if(sembolBulunan.length > 0){
    P.push(`"${sembolBulunan[0]}" sözcüğü sembolik anlam taşıyor${sembolBulunan.length>1?`; "${sembolBulunan[1]}" de bu katmanı destekliyor`:''}.`);
  }
  if(kliseBulunan.length > 0){
    P.push(`"${kliseBulunan[0].ifade}" Türk şiirinde çok kullanılmış bir kalıp; okuyucu bunu zaten biliyor, özgünlük zedeleniyor.`);
  }
  if(kliseTekBulunan.length > 0){
    P.push(`"${kliseTekBulunan[0]}" çok yıpranmış bir ifade; yerine özgün bir söyleyiş şiiri canlandırır.`);
  }

  // 4. Hece ölçüsü — gerçekçi
  P.push(heceOlcusu
    ? `Hece ölçüsüyle yazılmış; her dize yaklaşık ${Math.round(heceMean)} hece taşıyor ve bu denge tutarlı (varyans: ${heceVar.toFixed(1)}).`
    : heceMean < 4 && lc > 0
      ? `Dizeler çok kısa (ort. ${Math.round(heceMean)} hece); hece ölçüsü yok, serbest nazım da değil — yalnızca kelime parçaları sıralanmış.`
      : `Serbest nazım tercih edilmiş${heceVar < 4 ? `; dize uzunlukları birbirine yakın (ort. ${Math.round(heceMean)} hece), belli bir ritim hissettiriyor` : `; dize uzunlukları oldukça değişken, ritmik bir kural gözetilmemiş`}.`
  );

  // 5. Kafiye — aynı kelime tekrarını kafiye saymaz
  if(ayniKelimeTekrar.length > 0 && !kafiyeVar){
    const orn = ayniKelimeTekrar[0].kelime;
    P.push(`"${orn}" sözcüğü satır sonlarında ${ayniKelimeTekrar[0].sayi} kez tekrarlanmış; bu kafiye değil, yalnızca aynı kelimenin tekrarı. Kafiye farklı kelimeler arasında ses benzerliği gerektirir.`);
  } else if(zorlamaKafiye){
    P.push(`Kafiye düzeni zorlamalı; aynı ek çok sayıda dizede tekrarlanarak mekanik bir ses uyumu oluşturuluyor.`);
  } else if(kafiyeVar && gercekKafiyeParlari.length > 0){
    P.push(`Gerçek kafiye var: "${gercekKafiyeParlari[0].k1}" ve "${gercekKafiyeParlari[0].k2}" eşleşmesi ses uyumunu güçlendiriyor.`);
  } else {
    P.push(`Kafiye kullanılmamış; ses uyumu tamamen serbest bırakılmış.`);
  }

  // 6. Ses araçları
  if(aliterasyonVar){
    const orn = alitSatirlar[0];
    const k = orn.satir.length > 55 ? orn.satir.slice(0,55)+'…' : orn.satir;
    P.push(`"${k}" dizesinde "${orn.harf}" harfinin ${orn.sayi} kez tekrarıyla aliterasyon yaratılmış.`);
  }
  if(asonansVar){
    P.push(`"${domUnlu[0]}" ünlüsünün hâkimiyeti (%${Math.round(domUnlu[1]/unluler.length*100)}) şiire asonans katıyor.`);
  }

  // 7. Dil kalitesi
  if(gd >= 4){
    P.push(`Şiir büyük ölçüde günlük konuşma diline dayanıyor: "${gunlukBulunan.slice(0,3).join('", "')}" gibi sözcükler şiirsel gerilimi büsbütün kırıyor.`);
  } else if(gd >= 2){
    P.push(`"${gunlukBulunan.slice(0,2).join('" ve "')}" gibi konuşma dili sözcükleri şiirsel tonu zayıflatıyor.`);
  } else if(gd === 1){
    P.push(`"${gunlukBulunan[0]}" sözcüğü şiirin havasından uzaklaşıyor.`);
  } else if(siirselBulunan.length >= 2){
    P.push(`Dil şiirsel ve özenli: "${siirselBulunan.slice(0,2).join('" ve "')}" sözcükleri şiire derinlik katıyor.`);
  }

  if(modernBulunan.length > 0){
    P.push(`"${modernBulunan[0]}" gibi modern sözcükler şiirsel atmosferi kırıyor.`);
  }

  if(dd >= 1){
    P.push(`"${didaktikBulunan[0]}" gibi açıklayıcı bağlaçlar şiiri didaktik bir anlatıma itiyor; şiir açıklamaz, hissettirir.`);
  }

  // 8. Kelime zenginliği
  if(zenginlik < 0.45 && len >= 8){
    P.push(`${len} kelimelik şiirde yalnızca ${benzersiz} farklı sözcük var; yani kelimelerin büyük çoğunluğu tekrar. Bu şiiri daraltıyor.`);
  } else if(zenginlik > 0.82 && len >= 12){
    P.push(`Kelime zenginliği yüksek (${benzersiz} farklı sözcük); söz dağarcığı özgün.`);
  }

  // 9. Kapanış
  if(p >= 8.5){
    P.push(`Ses ve anlam dengesi kurulmuş, olgun bir şiir.`);
  } else if(p >= 7.0){
    P.push(`Güçlü potansiyel var; birkaç kritik değişiklikle çok daha etkili olabilir.`);
  } else if(p >= 5.5){
    P.push(`Şiir kendi sesini henüz bulamamış; ham malzeme var ama işçilik derinleştirilmeli.`);
  } else if(p >= 4.0){
    P.push(`Şiirsel bir niyet var; ancak dil, imge ve ses araçları açısından köklü bir yeniden yazım gerekiyor.`);
  } else {
    P.push(`Bu metin henüz şiir sayılamaz; temel şiir tekniklerine odaklanıp yeniden denemek gerekiyor.`);
  }

  const yorum = P.join(' ');

  // Güçlü yön
  const gucluH = [];
  if(ozgunMetafor && benzetmeSatirlari.length>0) gucluH.push(`Özgün imge: "${benzetmeSatirlari[0].trim().slice(0,35)}…"`);
  if(heceOlcusu) gucluH.push(`${Math.round(heceMean)} heceli tutarlı hece ölçüsü`);
  if(kafiyeOrani>0.35&&!zorlamaKafiye&&gercekKafiyeParlari.length>0) gucluH.push(`"${gercekKafiyeParlari[0].k1}-${gercekKafiyeParlari[0].k2}" kafiyesi doğal`);
  if(aliterasyonVar) gucluH.push(`"${alitSatirlar[0].harf}" sesindeki aliterasyon`);
  if(kisilesMeSatirlari.length>0) gucluH.push('Kişileştirme şiire canlılık katıyor');
  if(sembolBulunan.length>0) gucluH.push(`"${sembolBulunan[0]}" sembolik anlam katıyor`);
  if(zenginlik>0.82&&len>=12) gucluH.push('Kelime zenginliği yüksek');
  if(siirselBulunan.length>=2) gucluH.push('Şiirsel dil özenli');
  if(asonansVar) gucluH.push(`"${domUnlu[0]}" ünlüsüyle asonans`);
  if(gucluH.length===0) gucluH.push('Ham bir duygu yoğunluğu taşıyor; bu zemin geliştirilebilir');
  const guclu = gucluH[rnd(gucluH.length)];

  // Öneri
  const oneriH = [];
  if(len<12||lc<4)                    oneriH.push(`Şiir çok kısa (${len} kelime, ${lc} dize); en az 20-30 kelimeye genişletilmeli`);
  if(tekrarAgirlikli)                 oneriH.push('Aynı kelimelerin tekrarı yerine farklı sözcükler ve imgeler aranmalı');
  if(zorlamaKafiye)                   oneriH.push('Zorlamalı kafiyeden vazgeçilip doğal ses uyumu denenebilir');
  if(kliseBulunan.length>0)           oneriH.push(`"${kliseBulunan[0].ifade}" klişesi yerine özgün imgeler üretilmeli`);
  if(gd>=2)                           oneriH.push(`"${gunlukBulunan.slice(0,2).join('", "')}" gibi konuşma dili kelimeleri şiirsel karşılıklarıyla değiştirilmeli`);
  if(dd>=1)                           oneriH.push('"Göster, anlatma" ilkesiyle duygular imgelerle aktarılmalı');
  if(benzetmeSatirlari.length===0)    oneriH.push('Somut imgeler ve metaforlar eklenerek şiir görselleştirilebilir');
  if(zenginlik<0.45&&len>=8)          oneriH.push('Kelime tekrarı çok fazla; sinonimler ve yeni sözcükler denenebilir');
  if(!aliterasyonVar&&!kafiyeVar)     oneriH.push('Aliterasyon veya ses tekrarı eklenerek ritim güçlendirilebilir');
  if(modernBulunan.length>0)          oneriH.push(`"${modernBulunan[0]}" yerine şiirsel bir karşılık bulunmalı`);
  if(oneriH.length===0)               oneriH.push('Son dize daha çarpıcı bir kapanışla güçlendirilebilir');
  const oneri = oneriH[rnd(oneriH.length)];

  return { score:p, yorum, gucluYonler:guclu, gelistirmeOnerisi:oneri };
}

// ── BOT YORUMLARI İÇİN YEREL YEDEK ─────────────────────────────────────────
// Groq'un 3 modeli de (kademe) başarısız olursa botDuyuPuan/botKatliPuan/botAriPuan
// artık null dönüp yorumu tamamen atlamak yerine, kısa ve o botun temasına uygun
// bir yerel yorum üretir. Böylece kota tamamen dolsa bile 3 bot da yorum bırakır.
function _yerelYardimci(text){
  const satirlar = text.split('\n').filter(s=>s.trim().length>0);
  const lc = satirlar.length;
  const kelimeler = text.trim().split(/\s+/);
  const len = kelimeler.length;
  const hash = text.split('').reduce((a,c)=>((a<<5)-a)+c.charCodeAt(0),0)>>>0;
  const rnd = n => Math.abs(hash) % n;
  const satirSon = satirlar.map(l=>{
    const ws = l.trim().split(/\s+/);
    const tam = ws[ws.length-1]?.toLowerCase().replace(/[^a-züğışöçâîû]/gi,'') || '';
    return tam.slice(-3);
  });
  const ekSayisi = {};
  satirSon.forEach(s=>{ if(s) ekSayisi[s]=(ekSayisi[s]||0)+1; });
  const kafiyeVar = Object.values(ekSayisi).some(v=>v>=2);
  const benzetmeImleri = ['gibi','sanki','andır','tıpkı','adeta','misali'];
  const imgeVar = satirlar.some(s=>benzetmeImleri.some(b=>s.toLowerCase().includes(b)));
  const benzersiz = new Set(kelimeler.map(w=>w.toLowerCase())).size;
  const zenginlik = benzersiz / Math.max(len,1);
  return { lc, len, rnd, kafiyeVar, imgeVar, zenginlik };
}

function botDuyuPuanYerel(text){
  const { rnd, len } = _yerelYardimci(text);
  const yorumlar = [
    'Satırlarda belli bir duygu akışı var ama daha derinleşebilir.',
    'Duygusal ton okurken hissediliyor, samimi bir hava taşıyor.',
    'Duygu güçlü verilmiş ama biraz daha katmanlı olabilirdi.',
    'İçtenlik var, fakat duygu bazı yerlerde yüzeyde kalmış.',
  ];
  const taban = 5.5 + (len>=20?0.8:0) + rnd(20)/10;
  const p = Math.round(Math.min(9.5,Math.max(2.0,taban))*10)/10;
  return { puan: p, yorum: yorumlar[rnd(yorumlar.length)], kullanici: 'bot_duyu_yorum', ad: 'duyu-yorum' };
}

function botKatliPuanYerel(text){
  const { rnd, kafiyeVar, lc } = _yerelYardimci(text);
  const yorumlar = kafiyeVar
    ? ['Ses uyumu ve kafiye düzeni fark edilir şekilde işlenmiş.', 'Dizeler arasında hoş bir ritim yakalanmış.']
    : ['Serbest bir yapı tercih edilmiş, kafiyeye dayanmıyor.', 'Ritim daha çok anlam akışına dayanıyor, kafiye zorlanmamış.'];
  const taban = (kafiyeVar?6.2:5.0) + (lc>=6?0.5:0) + rnd(15)/10;
  const p = Math.round(Math.min(9.5,Math.max(2.0,taban))*10)/10;
  return { puan: p, yorum: yorumlar[rnd(yorumlar.length)], kullanici: 'bot_katli_yorum', ad: 'katlı-yorum' };
}

function botAriPuanYerel(text){
  const { rnd, imgeVar, zenginlik } = _yerelYardimci(text);
  const yorumlar = imgeVar
    ? ['Benzetmeler şiire özgün bir görsellik katmış.', 'İmgeler dikkat çekici, emek verilmiş bir dil var.']
    : ['İmge kullanımı sınırlı, daha somut betimlemeler eklenebilir.', 'Metaforlar yerine daha doğrudan bir anlatım tercih edilmiş.'];
  const taban = (imgeVar?6.0:4.8) + zenginlik*2 + rnd(10)/10;
  const p = Math.round(Math.min(9.5,Math.max(2.0,taban))*10)/10;
  return { puan: p, yorum: yorumlar[rnd(yorumlar.length)], kullanici: 'bot_ari_yorum', ad: 'arı-yorum' };
}

// go(): ekran değiştirir VE tarayıcı geçmişine (history) bir kayıt ekler, böylece
// fiziksel "geri" tuşu bir önceki ziyaret edilen ekrana döner (her zaman anasayfaya değil).
// profileId/postId gibi ekrana özgü alanlar, yeni ekran onları belirtmediyse sıfırlanır
// (aksi halde bir önceki ekrandan kalan eski id'ler sızabilir).
function go(screen,extra={}){
  S.screen = screen;
  S.profileId = 'profileId' in extra ? extra.profileId : null;
  S.postId = 'postId' in extra ? extra.postId : null;
  render();
  // '/#ekran' (başında /): adres /post/... üzerindeyken '#messages' eklenip
  // /post/baslik#messages gibi karışık bir adres oluşmasın.
  const yol = (screen==='postdetail' && S.postId) ? postYolu(S.postId) : '/#'+screen;
  history.pushState({screen:S.screen, profileId:S.profileId, postId:S.postId}, '', yol);
}
window.addEventListener('popstate', (e)=>{
  const st = e.state;
  if(st){
    S.screen = st.screen;
    S.profileId = st.profileId ?? null;
    S.postId = st.postId ?? null;
  } else {
    S.screen = 'feed';
    S.profileId = null;
    S.postId = null;
  }
  render();
});

// Giriş yapılmamış bir kullanıcı, giriş gerektiren bir eyleme (paylaşım/yorum/puan/tepki/
// takip/mesaj) teşebbüs ettiğinde çağrılır. Giriş ekranına yönlendirir ve true döner
// (çağıran taraf true dönerse asıl işlemi yapmadan durmalıdır). Zaten girişliyse false döner.
function girisGerekli(){
  if(!S.me){ go('login'); return true; }
  return false;
}

// Sadece ilgili kartı günceller, sayfa kaymaz
function refreshCard(pid){
  const post=S.posts.find(p=>p.id===pid);
  if(!post)return;
  const oldCard=document.querySelector(`[data-pid="${pid}"]`);
  if(!oldCard)return;
  // Mevcut durumu kaydet
  const wasExpanded=oldCard.querySelector('.post-full')?.style.display==='block';
  const cmtsOpen=oldCard.querySelector('.cmt-body')?.style.display==='block';
  const scrollY=window.scrollY;
  const cardTop=oldCard.getBoundingClientRect().top;
  // Eski kartın yüksekliğini sabit tut — layout shift önle
  oldCard.style.minHeight=oldCard.offsetHeight+'px';
  // Yeni kartı oluştur
  const newCard=postCard(post, wasExpanded);
  newCard.setAttribute('data-pid',pid);
  oldCard.replaceWith(newCard);
  // Yorumlar açıksa yeni kartta da aç
  if(cmtsOpen){
    const b=newCard.querySelector('.cmt-body');
    if(b)b.style.display='block';
  }
  // Kartın ekrandaki konumunu koruyarak scroll'u sabitle
  const newCardTop=newCard.getBoundingClientRect().top;
  const diff=newCardTop-cardTop;
  window.scrollTo({top:scrollY+diff,behavior:'instant'});
}
// Tam sayfa render yapmadan (örn. açık sohbet ekranını kapatmadan) sadece
// mesaj/bildirim rozetlerini günceller. showChat/showNotifs gibi kısmi DOM
// güncellemesi yapan yerlerden çağrılır.
function mesajBildirimRozetGuncelle(){
  const unreadMsg=(S.msgs||[]).filter(m=>m.toId===S.me?.id && !m.read).length;
  const unreadNotif=(S.notifs||[]).filter(n=>!n.read).length;

// Ham model çıktısından JSON'u ayıklar (jsonAyikla ile aynı mantık, ama
// score'a 2.0-9.8 sınırlaması UYGULAMAZ — bot yorumları {puan,yorum} şeklinde
// farklı bir şema kullanıyor, sınırlama her botun kendi puan aralığında yapılıyor).
function jsonAyiklaBasit(raw){
  const clean = raw.replace(/```json|```/g,'').trim();
  const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
  return JSON.parse(jsonStr);
}

// DÜZELTME: Daha önce bot yorumları (duyu-yorum/katlı-yorum/arı-yorum) admin
// panelinden "Gemini" veya "Claude" seçilse BİLE her zaman Groq'u kullanıyordu
// — çünkü zorunluModel yalnızca "ana AI Groq kullandıysa o Groq modelini"
// zorluyordu, Gemini/Claude seçiminde botZorunluModel=null kalıp botlar kendi
// Groq kademesini (auto) çalıştırıyordu. Bu da ana AI ile 3 bot'un TAMAMEN
// FARKLI modellerden gelip birbirini tutmayan puan/yorum vermesine yol açıyordu.
//
// AYRICA DÜZELTİLDİ: Gemini/Claude/belirli-bir-groq-modeli seçimi başarısız
// olduğunda botlar doğrudan null dönüp (dolayısıyla yerel algoritmaya) düşerdi;
// diğer AI'lar hiç denenmezdi. Artık botAICagir de ana AI ile AYNI TAM_AI_KADEMESI
// üzerinden çalışır: seçilen sağlayıcı başarısız olursa kademedeki KALAN AI'lar
// sırayla denenir (Gemini kademede 1. sırada) ve TÜMÜ başarısız olduğunda
// null döner (yerel yedek çağıran fonksiyonda devreye girer).
async function botAdimCalistir(systemPrompt, userPrompt, adim){
  if(adim.tur==='groq') return await groqBotCallTekModel(systemPrompt, userPrompt, adim.model);
  groqKota.sonGuncelleme = new Date().toLocaleTimeString('tr-TR');
  groqKota.toplamIstek++;
  if(adim.tur==='gemini'){
    const res = await fetch('/api/gemini', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'gemini-3.5-flash',
        max_tokens: 400,
        temperature: 0.8,
        reasoning_effort: 'low',
        response_format: { type: 'json_object' },
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userPrompt }
        ]
      })
    });
    if(!res.ok){
      let mesaj = '';
      try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
      throw new Error(res.status+': '+(mesaj || 'Gemini hatası'));
    }
    const data = await res.json();
    const raw = data.choices?.[0]?.message?.content?.trim();
    if(!raw) throw new Error('BOS_YANIT: Gemini içerik döndürmedi');
    return jsonAyiklaBasit(raw);
  }
  if(adim.tur==='claude'){
    const res = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        max_tokens: 400,
        system: systemPrompt,
        messages: [ { role: 'user', content: userPrompt } ]
      })
    });
    if(!res.ok){
      let mesaj = '';
      try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
      throw new Error(res.status+': '+(mesaj || 'Claude hatası'));
    }
    const data = await res.json();
    const raw = data.content?.[0]?.text?.trim();
    if(!raw) throw new Error('BOS_YANIT: Claude içerik döndürmedi');
    return jsonAyiklaBasit(raw);
  }
  throw new Error('Bilinmeyen AI adımı: '+adim.tur);
}

async function botAICagir(systemPrompt, userPrompt, saglayici='auto'){
  if(saglayici==='yerel'){
    // Ana AI zaten tamamen başarısız olup yerel algoritmaya düşmüşse, botları da
    // gereksiz yere ağa çıkarmadan doğrudan yerel yedeğe yönlendiriyoruz.
    return null;
  }
  let baslangicAdimi=null;
  if(saglayici==='gemini') baslangicAdimi={tur:'gemini'};
  else if(saglayici==='claude') baslangicAdimi={tur:'claude'};
  else if(saglayici && saglayici.startsWith('groq:')) baslangicAdimi={tur:'groq', model:saglayici.slice(5)};

  const denenecekler = baslangicAdimi
    ? [baslangicAdimi, ...TAM_AI_KADEMESI.filter(a=>adimEtiketi(a)!==adimEtiketi(baslangicAdimi))]
    : TAM_AI_KADEMESI;

  let sonHata=null;
  for(const adim of denenecekler){
    try{
      const result = await botAdimCalistir(systemPrompt, userPrompt, adim);
      groqKota.sonHata = null;
      sonBasariliBotModeli = adim.tur==='groq' ? adim.model : (adim.tur==='gemini' ? 'gemini-3.5-flash' : 'claude-sonnet-5');
      return result;
    }catch(e){
      sonHata = `${adimEtiketi(adim)}: ${e.message}`;
      console.warn(`Bot (${adimEtiketi(adim)}) başarısız, sıradaki AI deneniyor:`, e.message);
      // sıradaki AI'ya geç
    }
  }
  console.warn('Bot: tüm AI sağlayıcıları başarısız oldu:', sonHata);
  groqKota.sonHata = sonHata;
  sonBasariliBotModeli = null;
  return null;
}

// Ana AI çağrısından (scorePoem) hemen SONRA çağrılır. adminSecilenSaglayici
// 'auto' veya belirli bir 'groq:model' olsa bile, kota durumuna göre gerçekte
// FARKLI bir modele/sağlayıcıya düşmüş olabilir (örn. Groq kotası dolup Gemini'ye
// veya yerel algoritmaya düşmüş olabilir). Botları admin'in SEÇTİĞİ isme değil,
// ana AI'ın GERÇEKTE kullandığı sağlayıcıya zorlarız — böylece ikisi arasında
// hep tutarlılık olur.
function sonBasariliSaglayiciyiBul(){
  if(groqKota.sonKaynak==='groq' && groqKota.sonModel) return 'groq:'+groqKota.sonModel;
  if(groqKota.sonKaynak==='gemini') return 'gemini';
  if(groqKota.sonKaynak==='claude') return 'claude';
  return 'yerel';
}

async function groqBotCallTekModel(systemPrompt, userPrompt, model) {
  const govde = {
    model: model,
    max_tokens: 400,
    temperature: 0.8,
    response_format: { type: 'json_object' },
    messages: [
      { role: 'system', content: systemPrompt },
      { role: 'user', content: userPrompt }
    ]
  };
  if(model.startsWith('openai/gpt-oss')){
    govde.reasoning_effort = 'low';
    govde.include_reasoning = false;
  } else if(model.startsWith('qwen/')){
    govde.reasoning_effort = 'none';
  }
  const res = await fetch('/api/groq', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(govde)
  });
  groqKotaGuncelle(res.headers);
  if (res.status === 429) {
    let mesaj = '';
    try{ const errBody = await res.json(); mesaj = errBody?.error?.message || ''; }catch(_){}
    groqKota429Isaretle(res.headers, mesaj);
    throw new Error('429: '+(mesaj || 'Groq kota doldu'));
  }
  groqKota.kotaDolduMu = false;
  if (!res.ok){
    let mesaj = '';
    try{
      const errBody = await res.json();
      mesaj = errBody?.error?.message || '';
      if(errBody?.error?.teshis){
        const t = errBody.error.teshis;
        mesaj += ` [çalışan ortam: ${t.calisan_ortam}; bulunan GROQ değişkenleri: ${t.groq_ile_ilgili_bulunan_degisken_isimleri?.length ? t.groq_ile_ilgili_bulunan_degisken_isimleri.join(', ') : 'yok'}]`;
      }
    }catch(_){}
    throw new Error(res.status+': '+(mesaj || 'Groq hatası'));
  }
  const data = await res.json();
  const raw = data.choices?.[0]?.message?.content?.trim();
  if (!raw) throw new Error('BOS_YANIT: Groq içerik döndürmedi');
  const clean = raw.replace(/```json|```/g, '').trim();
  const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}') + 1);
  try{
    return JSON.parse(jsonStr);
  } catch(parseErr){
    throw new Error('JSON_HATASI: Yapay zeka geçersiz format döndürdü → "'+raw.slice(0,150)+(raw.length>150?'...':'')+'"');
  }
}

// zorunluModel verilirse (ör. ana AI'ın kullandığı model), kademe/cascade DEVREYE GİRMEZ,
// sadece o tek model denenir. Bu sayede aynı şiiri değerlendiren 3 bot + ana AI hepsi
// AYNI modeli kullanır — art arda atılan istekler yüzünden birinin akıllı modele,
// diğerinin zayıf modele düşüp tutarsız yorum vermesi önlenmiş olur.
async function groqBotCall(systemPrompt, userPrompt, zorunluModel=null) {
  if(zorunluModel){
    try{
      const result = await groqBotCallTekModel(systemPrompt, userPrompt, zorunluModel);
      groqKota.sonHata = null;
      sonBasariliBotModeli = zorunluModel;
      return result;
    } catch(e){
      console.warn(`groqBotCall (zorunlu: ${zorunluModel}) başarısız:`, e.message);
      groqKota.sonHata = e.message;
      sonBasariliBotModeli = null;
      return null;
    }
  }
  let sonHataMesaji = null;
  for(const model of GROQ_MODEL_KADEMESI){
    try{
      const result = await groqBotCallTekModel(systemPrompt, userPrompt, model);
      groqKota.sonHata = null;
      sonBasariliBotModeli = model;
      return result;
    } catch(e){
      sonHataMesaji = e.message;
      console.warn(`groqBotCall (${model}) başarısız, sıradaki modele geçiliyor:`, e.message);
    }
  }
  console.warn('groqBotCall: tüm Groq modelleri başarısız oldu:', sonHataMesaji);
  groqKota.sonHata = sonHataMesaji;
  sonBasariliBotModeli = null;
  return null;
}

// ── AKSİYONLAR (devam) ───────────────────────────────────────────────────────
// ── Otomatik GIF + Türkçe alıntı/aforizma (görsel/YouTube eklenmemiş paylaşımlar için) ──
// Kullanıcı ne bir görsel yükler ne de YouTube linki eklerse, şiirin temasına/
// ruh haline uygun bir GIF'i, üzerine bindirilecek Türkçe bir mısra/aforizma ile
// birlikte arka planda otomatik bulup ekleriz. İki adım:
//   1) Groq (mevcut GROQ_API_KEY, en ucuz/hızlı model) tek çağrıda hem Giphy
//      aramasında kullanılacak 2-4 İngilizce anahtar kelimeyi (Giphy Türkçe
//      aramada zayıf kalır) HEM DE görselin üzerine yazılacak kısa Türkçe metni
//      üretir — mümkünse şiirden birebir uygun bir mısra, yoksa temaya uygun
//      özgün bir aforizma.
//   2) /api/giphy o anahtar kelimelerle Giphy'de arama yapar ve bir GIF döner.
// Herhangi bir adım başarısız olursa (kota, eksik anahtar, ağ hatası, geçersiz
// JSON vb.) sessizce vazgeçilir — paylaşım akışı ASLA engellenmez.
// Kurulum: Vercel → Settings → Environment Variables → GIPHY_API_KEY ekleyip
// yeniden deploy edin (bkz. /api/giphy.js). Anahtar: developers.giphy.com
async function siirIcinGifVerileriGetir(title, text){
  try{
    const govde = {
      model: 'openai/gpt-oss-20b', // llama-3.1-8b-instant 16 Ağustos 2026'da kapatıldı; Groq'un önerdiği yerine geçen model
      max_tokens: 220,
      temperature: 0.7,
      reasoning_effort: 'low', // gpt-oss modelleri "akıl yürütme" modelidir; bu olmadan 220 token'lık bütçe düşünmede tükenip boş yanıt dönebilir
      include_reasoning: false,
      response_format: { type: 'json_object' },
      messages: [
        { role:'system', content:'Sen bir şiirden GIF arama terimi ve görsel üzerine bindirilecek kısa bir Türkçe alıntı/aforizma çıkaran bir asistansın. SADECE geçerli JSON döndürürsün, başka hiçbir şey yazmazsın.' },
        { role:'user', content:
          `Aşağıdaki şiiri oku.\n\n"""\n${(text||'').slice(0,800)}\n"""\n\nBaşlık: ${title||'(başlıksız)'}\n\n`+
          `Şunları üret:\n`+
          `1) "subject": Şiirde geçen, GÖRSEL OLARAK ÇİZİLEBİLİR/ÇEKİLEBİLİR somut ana konu (bir hayvan, nesne, doğa öğesi, eylem, mekan vb. — örn. "kedi" varsa "cat", "deniz" varsa "ocean", "yağmur" varsa "rain"). Şiir soyut/duygusal ve somut bir varlık/nesne/hayvan geçmiyorsa en baskın somut imgeyi seç (örn. "gece", "ateş", "yıldız"). Bu alan İNGİLİZCE, TEK bir kelime veya kısa öbek olmalı, ASLA boş bırakma.\n`+
          `2) "mood": Şiirin ruh halini/tonunu yansıtan, "subject" ile BİRLİKTE Giphy'de aratılacak, İNGİLİZCE tek bir kelime (örn. "cute", "calm", "melancholic", "playful", "peaceful"). Şiir kedi/köpek gibi sevimli bir konudaysa "cute" veya "funny" gibi kelimeler tercih et.\n`+
          `3) "caption": Görselin üzerine bindirilecek, TÜRKÇE, en fazla 12 kelimelik kısa bir metin. Şiirde temayla çok uyumlu, güçlü ve en fazla 12 kelimelik bir mısra varsa onu OLDUĞU GİBİ (kelimesi kelimesine, değiştirmeden) kullan. Uygun bir mısra yoksa, şiirin konusuna uygun ÖZGÜN kısa bir Türkçe aforizma yaz (şiirden birebir alıntı değil, senin ürettiğin, klişe olmayan).\n\n`+
          `SADECE şu JSON ile yanıt ver, başka hiçbir şey yazma:\n{"subject":"...","mood":"...","caption":"..."}`
        }
      ]
    };
    const res = await fetch('/api/groq', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(govde) });
    if(!res.ok) return null;
    const data = await res.json();
    const raw = data?.choices?.[0]?.message?.content?.trim();
    if(!raw) return null;
    const clean = raw.replace(/```json|```/g,'').trim();
    const jsonStr = clean.slice(clean.indexOf('{'), clean.lastIndexOf('}')+1);
    const parsed = JSON.parse(jsonStr);
    const subject = (parsed.subject||'').toString().replace(/["'.]/g,'').trim().slice(0,40) || null;
    const mood = (parsed.mood||'').toString().replace(/["'.]/g,'').trim().slice(0,30) || null;
    const caption = (parsed.caption||'').toString().replace(/^["'“”]+|["'“”]+$/g,'').trim().slice(0,140) || null;
    // "subject" ana/zorunlu arama terimi; "mood" ona eşlik eder. subject boşsa
    // (nadiren) mood'u tek başına kullan; ikisi de boşsa null dön (aşağıda yerel yedek devreye girer).
    const keywords = subject && mood ? `${subject} ${mood}` : (subject || mood || null);
    return { keywords, subject, mood, caption };
  }catch{ return null; }
}
// Groq tamamen başarısız olursa (kota, ağ, JSON hatası) devreye giren, şiirde geçen
// sık kullanılan Türkçe kelimelerden basit bir İngilizce arama terimi üreten yerel
// yedek. Amaç: en azından şiirin çok bariz somut konusunu (kedi, deniz, yağmur vb.)
// yakalayıp tamamen alakasız bir gif gelmesini önlemek.
const TR_EN_ANAHTAR_SOZLUK = [
  [/\bkedi(ler)?\b/i,'cat'], [/\bköpek|köpeğ/i,'dog'], [/\bkuş(lar)?\b/i,'bird'],
  [/\bdeniz/i,'ocean'], [/\byağmur/i,'rain'], [/\bkar\b|\bkarlar/i,'snow'],

function turkceMetindenYerelAnahtarKelime(title, text){
  const birlesik = `${title||''} ${text||''}`;
  for(const [regex, en] of TR_EN_ANAHTAR_SOZLUK){
    if(regex.test(birlesik)) return en;
  }
  return null;
}
async function siirIcinOtomatikGifGetir(title, text){
  let veri = await siirIcinGifVerileriGetir(title, text);
  if(!veri?.keywords){
    const yerel = turkceMetindenYerelAnahtarKelime(title, text);
    veri = { ...(veri||{}), keywords: yerel ? `${yerel} aesthetic` : 'nature calm aesthetic' };
  }
  try{
    const res = await fetch('/api/giphy', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query: veri.keywords }) });
    if(!res.ok){
      let mesaj='';
      try{ const errBody=await res.json(); mesaj=errBody?.error?.message||''; }catch(_){}
      console.warn('Otomatik GIF alınamadı:', mesaj || res.status);
      return null;
    }
    const data = await res.json();
    if(!data?.gifUrl) return null;
    return { gifUrl: data.gifUrl, caption: veri?.caption || null };
  }catch(e){ console.warn('Otomatik GIF alınamadı:', e.message); return null; }
}
// Bir paylaşımda ne görsel ne YouTube linki varsa arka planda otomatik GIF+alıntı uygular.
// Kullanıcı bu sırada kendi görselini/linkini eklerse üzerine yazmaz (race-condition koruması).
// Sıra: Hugging Face → Cloudflare FLUX → GIPHY (bir öncekinde hata olursa sonrakine geçer).
async function otomatikAiGorselUret(title, text){
  if(!String(text||'').trim()) return null;
  const groqPrompt = await aiGorselPromptuGroqlaOlustur({title,text});
  const sahne = groqPrompt || text;
  const saglayicilar=[
    { ad:'Hugging Face',    fn:huggingfaceGorselDene, sure:60000 },
    { ad:'Cloudflare FLUX', fn:fluxGorselDene,        sure:90000 }
  ];
  for(const sg of saglayicilar){
    const controller=new AbortController();
    const zamanlayici=setTimeout(()=>controller.abort(), sg.sure);
    try{
      const r=await sg.fn(title||'', sahne, controller.signal);
      clearTimeout(zamanlayici);
      if(r?.imageUrl) return r;
    }catch(err){
      clearTimeout(zamanlayici);
      console.warn(`${sg.ad} başarısız, sıradaki deneniyor:`, err?.message||err);
    }
  }
  return null;
}
function otomatikGifUygulaGerekirse(postId, title, text, mevcutGorsel, mevcutYoutube){
  if(mevcutGorsel || ytId(mevcutYoutube)) return;
  (async()=>{
    const ai = await otomatikAiGorselUret(title, text).catch(()=>null);
    if(ai?.imageUrl){
      const idx = S.posts.findIndex(p=>p.id===postId);
      if(idx<0) return;
      if(S.posts[idx].image || ytId(S.posts[idx].youtube)) return;
      const updates={ image:ai.imageUrl, autoGif:false, gifCaption:null, aiImage:true, aiImageUpdatedAt:Date.now(), aiImageProvider:ai.provider, aiImageModel:ai.model };
      S.posts[idx] = {...S.posts[idx], ...updates};
      save();
      refreshCard(postId);
      db.collection("posts").doc(postId).update(updates).catch(err=>console.error("AI görsel kaydetme hatası:",err));
      return;
    }
    // Her iki AI sağlayıcısı da başarısız → GIPHY yedeği
    siirIcinOtomatikGifGetir(title, text).then(sonuc=>{
    if(!sonuc?.gifUrl) return;
    const idx = S.posts.findIndex(p=>p.id===postId);
    if(idx<0) return;
    if(S.posts[idx].image || ytId(S.posts[idx].youtube)) return;
    S.posts[idx].image = sonuc.gifUrl;
    S.posts[idx].autoGif = true;
    S.posts[idx].gifCaption = sonuc.caption || null;
    save();
    refreshCard(postId);
    db.collection("posts").doc(postId).update({ image: sonuc.gifUrl, autoGif: true, gifCaption: sonuc.caption || null }).catch(err=>console.error("Otomatik GIF kaydetme hatası:",err));
    });
  })();
}
// Bir şiir paylaşıldığında arka planda otomatik seslendirme (ElevenLabs)
// oluşturup Firestore'a audioUrl olarak kaydeder. Hata olursa (ör. API key
// tanımlı değilse veya kota dolmuşsa) sessizce yutulur — paylaşım akışını
// asla engellemez, tıpkı otomatikGifUygulaGerekirse gibi.
function otomatikSesUygulaGerekirse(postId, title, text){
  if(!text || text.trim().length<10) return;
  // Görsel promptunda olduğu gibi (aiGorselPromptuGroqlaOlustur), önce Groq'a
  // şiirin duygusuna/temasına göre HANGİ ses karakterinin ve okuma tarzının
  // uygun olduğunu soruyoruz. Groq başarısız olursa varsayılan (sakin) sesle
  // devam edilir — asla paylaşım akışını engellemez.
  aiSesYonlendirmesiGroqlaOlustur(title, text).then(yon=>{
    fetch('/api/ttsGenerate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text, postId, ...yon })
    }).then(async res=>{
      if(!res.ok){ console.warn('Otomatik ses oluşturulamadı:', res.status); return; }
      const data = await res.json();
      if(!data?.audioUrl) return;
      // TEŞHİS: bkz. görsel sağlayıcılarındaki aynı not — B2 başarısız olup
      // GitHub yedeğine düşüldüyse gerçek B2 hatasını konsola yazdırıyoruz.
      if(data.storage && data.storage!=='r2'){
        console.warn(`⚠️ Ses R2'ye değil "${data.storage}" yedeğine yüklendi. R2 hatası: ${data.r2Error||'(bilinmiyor)'}`);
      }
      const idx = S.posts.findIndex(p=>p.id===postId);
      if(idx<0) return;
      S.posts[idx].audioUrl = data.audioUrl;
      save();
      refreshCard(postId);
      db.collection("posts").doc(postId).update({ audioUrl: data.audioUrl }).catch(err=>console.error("Ses kaydetme hatası:",err));
    }).catch(e=>console.warn('Otomatik ses oluşturulamadı:', e.message));
  });
}

// Admin panelinden, ESKİ paylaşımlar dahil, sesi manuel olarak (yeniden)
// oluşturmak için kullanılır. otomatikSesUygulaGerekirse ile AYNI akışı
// izler, ama sonucu bekleyip (await edilebilir) hata fırlatır — böylece
// "Yapay Zeka ile Sesi Yeniden Oluştur" butonu kullanıcıya anlık durum ve
// hata mesajı gösterebilir (sessizce yutmaz).
async function adminSesiYenile(post){
  const yon = await aiSesYonlendirmesiGroqlaOlustur(post.title, post.text);
  const res = await fetch('/api/ttsGenerate', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ text: post.text, postId: post.id, ...yon })
  });
  if(!res.ok){
    let detay='';
    try{ const j=await res.json(); detay=j?.error||j?.detail||''; }catch{}
    throw new Error(detay || ('HTTP '+res.status));
  }
  const data = await res.json();
  if(!data?.audioUrl) throw new Error('Ses linki dönmedi.');
  if(data.storage && data.storage!=='r2'){
    console.warn(`⚠️ Ses R2'ye değil "${data.storage}" yedeğine yüklendi. R2 hatası: ${data.r2Error||'(bilinmiyor)'}`);
  }
  const idx = S.posts.findIndex(p=>p.id===post.id);
  if(idx>-1){
    const eskiAudioUrl = S.posts[idx].audioUrl;
    S.posts[idx].audioUrl = data.audioUrl;
    save();
    await db.collection("posts").doc(post.id).update({ audioUrl: data.audioUrl });
    if(eskiAudioUrl && eskiAudioUrl!==data.audioUrl) eskiMedyaTemizle([eskiAudioUrl]);
  }
  return data;
}

// DÜZELTME: Aşağıdaki "dosyayı Blob'dan silmez" notu artık DOĞRU DEĞİL —
// depodaki (Backblaze B2 / GitHub yedeği) eski dosya artık gerçekten
// siliniyor (bkz. eskiMedyaTemizle). post.musicUrl İSTİSNA: o her zaman
// TÜM şiirler arasında PAYLAŞILAN sabit bir müzik kütüphanesi dosyasına
// işaret eder (bkz. musicGenerate.js), o yüzden ASLA silinmemeli — bu
// yüzden postMuzigiKaldir bilerek eskiMedyaTemizle çağırmıyor.
//
// eskiMedyaTemizle: elindeki HERHANGİ bir URL'yi (GIPHY, Cloudinary,
// Spotify/YouTube linki, paylaşılan müzik kütüphanesi dosyası, eski
// B2/GitHub dosyası — ne olursa olsun) /api/flux-image'e DELETE isteğiyle
// gönderir. NOT: Silme mantığı ayrı bir /api/deleteMedia.js dosyası OLARAK
// DEĞİL, flux-image.js'in içine (DELETE metodu ile) eklendi — Vercel'in
// Hobby planındaki 12 Serverless Function sınırını aşmamak için. "Bu URL
// bize mi ait" kontrolünü backend kendisi yapar (sadece kendi B2
// bucket'ına / GitHub yedek reposuna ait URL'leri siler, gerisini sessizce
// yok sayar) — o yüzden burada ayrıca bir "bu benim mi" kontrolüne gerek
// yok. En iyi çaba (best-effort) ile çalışır: başarısız olsa bile sadece
// konsola yazar, hiçbir kullanıcı akışını engellemez veya bekletmez.
function eskiMedyaTemizle(urls){
  const temiz = (urls||[]).filter(u=>typeof u==='string' && u.trim());
  if(!temiz.length) return;
  fetch('/api/flux-image', {
    method:'DELETE',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ urls: temiz })
  }).catch(err=>console.warn('Eski medya temizlenemedi:', err?.message||err));
}

// Şiirin duygusuna göre uygun bir ElevenLabs sesi + okuma tonu seçtirir.
// Görsel oluşturmadaki aiGorselPromptuGroqlaOlustur ile AYNI mantık: Groq'a
// sadece SEÇİM yaptırıyoruz (sabit bir ses listesinden), gerçek ses üretimi
// sunucu tarafında (api/ttsGenerate.js) sabit ID'lerle yapılıyor — böylece
// Groq'un uydurabileceği geçersiz bir ses ID'si asla ElevenLabs'e gitmez.
async function aiSesYonlendirmesiGroqlaOlustur(title, text){
  const baslik=String(title||'').trim().slice(0,250);
  const siir=String(text||'').trim().slice(0,2200);
  const VARSAYILAN={voiceKey:'sakin', stability:0.65, style:0.2};
  if(!siir) return VARSAYILAN;
  try{
    const sonuc=await botAICagir(
      'Sen şiirleri seslendirecek bir seslendirme yönetmenisin. YALNIZCA JSON döndür.',
      `ÖNCELİKLİ KURAL: Bu bir ŞİİR OKUMASI olacak, ŞARKI SÖYLEME/EZGİ DEĞİL. Ses asla melodik, tekrarlayan bir ritimle veya nakarat söyler gibi YÜKSELİP ALÇALMAMALI. Doğal, içten, bir insanın sevdiği bir şiiri sesli okuduğu gibi, konuşma diline yakın bir tempoda ve tonlamada okunmalı. Bu kural, aşağıdaki seçimlerden HER ZAMAN daha önceliklidir.

Bu şiiri analiz et ve aşağıdaki 5 ses karakterinden şiirin duygusuna/temasına EN UYGUN olanını seç:
- "huzunlu": hüzünlü, melankolik, ayrılık/özlem temalı şiirler için duygusal kadın sesi
- "romantik": aşk, sevgi, sıcaklık temalı şiirler için yumuşak, sıcak kadın sesi
- "dramatik": yoğun, çarpıcı, isyan/hesaplaşma temalı şiirler için güçlü erkek sesi
- "sakin": huzur, doğa, tefekkür temalı şiirler için sakin, dingin kadın sesi
- "tutkulu": tutku, öfke, güçlü duygular içeren şiirler için derin, kararlı erkek sesi

Ayrıca 0.4 ile 0.9 arasında "stability" ve 0 ile 0.6 arasında "style" değeri belirle (bu üst sınırların dışına ASLA çıkma — yüksek style ve düşük stability şarkı gibi, aşırı tiyatral/melodik bir okumaya yol açar):
- "stability": okuma ne kadar durağan/tutarlı olsun (0.4=biraz daha duygusal ama hâlâ konuşma gibi, 0.9=çok durağan/sakin)
- "style": okuma ne kadar abartılı olsun (0=tamamen doğal/düz okuma, 0.6=hafif vurgulu ama ASLA şarkı gibi değil)

Şiirin başlığı: ${baslik}

Şiir:
${siir}

JSON: {"voiceKey":"...", "stability":0.0, "style":0.0}`
    );
    const voiceKey=String(sonuc?.voiceKey||'').trim();
    const gecerliAnahtarlar=['huzunlu','romantik','dramatik','sakin','tutkulu'];
    const stability=Number(sonuc?.stability);
    const style=Number(sonuc?.style);
    return {
      voiceKey: gecerliAnahtarlar.includes(voiceKey) ? voiceKey : VARSAYILAN.voiceKey,
      // Şarkı gibi/aşırı melodik okumayı önlemek için değerler her zaman
      // 0.4–0.9 (stability) ve 0–0.6 (style) aralığına SIKIŞTIRILIR — Groq
      // bu aralığın dışında bir değer döndürse bile burada sınırlandırılır.
      stability: Number.isFinite(stability) ? Math.min(0.9,Math.max(0.4,stability)) : VARSAYILAN.stability,
      style: Number.isFinite(style) ? Math.min(0.6,Math.max(0,style)) : VARSAYILAN.style
    };
  }catch(err){
    console.warn('Groq ses yönlendirmesi oluşturamadı, varsayılan ses kullanılacak:',err);
    return VARSAYILAN;
  }
}

// Uygulama genelinde oluşturulan TÜM ses (Audio) nesnelerinin kaydı. new Audio()
// nesneleri DOM'a bağlı olmadan da çalabildiği için, render() tüm ekranı
// yeniden çizip (app.innerHTML='') eski kartları yok ettiğinde İÇİNDEKİ audio
// nesnesi hiçbir yerde durdurulmazsa ARKA PLANDA SESSİZCE ÇALMAYA DEVAM EDER.
// Bu yüzden her audio oluşturulduğunda buraya kaydedilir; render() ekranı
// yeniden çizmeden HEMEN ÖNCE bu kayıttaki TÜM sesleri durdurup listeyi temizler.
const TUM_SES_KAYITLARI = new Set();
// Aynı ses adresi için TEK Audio nesnesi: kart yeniden çizilse bile eski nesne
// arkada çalmaya devam edip çift ses oluşturmasın.
const SES_URL_HARITASI = new Map();

// Paylaşım detayında ve kaydırma modunda kullanılan ortak, mor-yeşil temalı
// ses oynatıcı: oynat/duraklat, durdur, ses seviyesi, süre çubuğu. new Audio()
// DOM'a hiç eklenmeden de çalabildiği için audio elemanı kontrol amaçlı dışarı
// (opts üzerinden çağırana) döndürülür; DOM'dan kaldırılması oynatmayı OTOMATİK
// durdurmaz — bu yüzden hem çağıran taraf (postCard / SwipeMode) sekme kapanırken
// veya bir sonraki şiire geçilirken audio.pause() çağırmalı, HEM DE global
// render() her ekranı yeniden çizmeden önce TUM_SES_KAYITLARI'nı durdurmalıdır
// (yukarıdaki not) — tek başına ikisi de yeterli değil, ikisi birlikte gerekli.
function sesOynaticiOlustur(audioUrl,opts={}){
  const platform=sesPlatformBilgisiGlobal(audioUrl);
  if(platform.type!=='direct'){
    const wrap=h('div',{style:{background:'#0f0a1a',border:'1px solid #2d1b52',borderRadius:'14px',padding:'8px',marginBottom:'14px'},onclick:e=>e.stopPropagation()});
    let src=''; let height='166px'; let etiket='';
    if(platform.type==='spotify'){
      const m=String(audioUrl).match(/open\.spotify\.com\/([^/?#]+)\/([^/?#]+)/i);
      if(m) src=`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator`; height='152px'; etiket='🟢 Spotify — dinlemek için tıkla';
    } else if(platform.type==='soundcloud'){
      src=`https://w.soundcloud.com/player/?url=${encodeURIComponent(audioUrl)}&auto_play=true&hide_related=true&show_comments=false&show_user=true&visual=true`;
      etiket='🟠 SoundCloud — dinlemek için tıkla';
    }
    // DÜZELTME: Spotify/SoundCloud iframe'leri de artık YouTube gibi tıklanana
    // kadar gömülmüyor (bkz. aşağıdaki YouTube notu — aynı WebGL/performans
    // gerekçesi burada da geçerli).
    if(src){
      const yerTutucu=h('div',{style:{position:'relative',width:'100%',height,borderRadius:'10px',overflow:'hidden',cursor:'pointer',background:'#1a0f2e',display:'flex',alignItems:'center',justifyContent:'center',color:'#a78bfa',fontSize:'.82rem',textAlign:'center',padding:'0 10px'},
        onclick:(e)=>{
          e.stopPropagation();
          const ifr=h('iframe',{src,style:{width:'100%',height,border:'0',borderRadius:'10px'},allow:'autoplay; encrypted-media; fullscreen; picture-in-picture',allowFullscreen:true});
          yerTutucu.replaceWith(ifr);
        }
      },'▶️ '+etiket);
      wrap.appendChild(yerTutucu);
    }
    if(platform.type==='youtube'){
      // DÜZELTME: burada eskiden YouTube <iframe>'i HER kart oluştuğunda hemen
      // gömülüyordu (kullanıcı oynatmasa bile) — her gömülü YouTube oynatıcısı
      // kendi WebGL bağlamını açtığı için art arda çok sayıda kart görüntülenince
      // (kaydırma modunda hızlı geçişlerde) tarayıcının "Too many active WebGL
      // contexts" uyarısı vermesine ve donma hissine yol açıyordu. Artık ana
      // paylaşım önizlemesindeki gibi sadece bir kapak görseli + oynat ikonu
      // gösteriyoruz; gerçek <iframe> SADECE kullanıcı tıklayınca oluşturuluyor.
      const id=ytId(audioUrl);
      if(id){
        const height2='180px';
        const thumb=h('div',{style:{position:'relative',width:'100%',height:height2,borderRadius:'10px',overflow:'hidden',cursor:'pointer',background:'#000'},
          onclick:(e)=>{
            e.stopPropagation();
            const ifr=h('iframe',{src:`https://www.youtube.com/embed/${id}?playsinline=1&rel=0&autoplay=1`,style:{width:'100%',height:height2,border:'0',borderRadius:'10px'},allow:'autoplay; encrypted-media; fullscreen; picture-in-picture',allowFullscreen:true});
            thumb.replaceWith(ifr);
          }
        },[
          h('img',{src:`https://img.youtube.com/vi/${id}/mqdefault.jpg`,style:{width:'100%',height:'100%',objectFit:'cover',opacity:'.8',display:'block'}}),
          h('div',{style:{position:'absolute',inset:'0',display:'flex',alignItems:'center',justifyContent:'center'}},[h('span',{style:{fontSize:'2.2rem'}},'▶️')])
        ]);
        wrap.appendChild(thumb);
      }
    }
    return {el:wrap,audio:null};
  }
  let audio=SES_URL_HARITASI.get(audioUrl);
  if(!audio){
    audio=new Audio(audioUrl);
    SES_URL_HARITASI.set(audioUrl,audio);
  }
  TUM_SES_KAYITLARI.add(audio);
  audio.preload='none'; // Akıştaki onlarca oynatıcı aynı anda indirmeye başlayıp telefonu kilitliyordu
  audio.volume=0.9;
  const etiketMetni=opts.label||'🎙️ Dinle';
  const gradyan=opts.gradient||'linear-gradient(135deg,#7c3aed,#34d399)';
  const wrap=h('div',{style:{display:'flex',alignItems:'center',flexWrap:'wrap',gap:'8px',background:'#0f0a1a',border:'1px solid #2d1b52',borderRadius:'14px',padding:'8px 12px',marginBottom:'14px'},onclick:(e)=>e.stopPropagation()});
  const label=h('span',{style:{fontSize:'.72rem',color:'#a78bfa',flexShrink:'0',whiteSpace:'nowrap',width:'100%'}},etiketMetni);
  const playBtn=h('button',{class:'btn',style:{background:gradyan,border:'none',borderRadius:'50%',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:'.95rem',flexShrink:'0',padding:'0',lineHeight:'1'},
    onclick:(e)=>{e.stopPropagation(); if(!audio.paused){ audio.pause(); return; } if(audio.error||audio.networkState===audio.NETWORK_NO_SOURCE){ try{audio.load();}catch(_){} } const p=audio.play(); if(p&&p.catch) p.catch((err)=>{ if(err&&err.name==='AbortError') return; try{audio.load(); audio.play().catch(()=>{});}catch(_){} });}
  },'▶️');
  const stopBtn=h('button',{class:'btn',style:{background:'#1a0f2e',border:'1px solid #3d1f6e',borderRadius:'50%',width:'28px',height:'28px',display:'flex',alignItems:'center',justifyContent:'center',color:'#a78bfa',fontSize:'.75rem',flexShrink:'0',padding:'0',lineHeight:'1'},
    onclick:(e)=>{e.stopPropagation(); audio.pause(); audio.currentTime=0;}
  },'⏹️');
  const suretMetniFormatla=(s)=>{ if(!Number.isFinite(s)||s<0) return '0:00'; const m=Math.floor(s/60); const sn=Math.floor(s%60); return m+':'+String(sn).padStart(2,'0'); };
  const gecenSure=h('span',{style:{fontSize:'.66rem',color:'#a78bfa',flexShrink:'0',minWidth:'30px',textAlign:'right'}},'0:00');
  let siruklemedeMi=false;
  const seekSlider=h('input',{type:'range',min:'0',max:'0',step:'0.1',value:'0',style:{flex:'1',minWidth:'60px',accentColor:'#7c3aed',cursor:'pointer'},
    onpointerdown:(e)=>{e.stopPropagation(); siruklemedeMi=true;},
    onpointerup:(e)=>{e.stopPropagation(); siruklemedeMi=false;},
    oninput:(e)=>{e.stopPropagation(); const v=parseFloat(e.target.value); audio.currentTime=v; gecenSure.textContent=suretMetniFormatla(v);},
    onclick:(e)=>e.stopPropagation()
  });
  const toplamSure=h('span',{style:{fontSize:'.66rem',color:'#6b5b8a',flexShrink:'0',minWidth:'30px'}},'0:00');
  const volIcon=h('span',{style:{fontSize:'.75rem',flexShrink:'0'}},'🔊');
  const volSlider=h('input',{type:'range',min:'0',max:'1',step:'0.05',value:String(audio.volume),style:{width:'42px',flexShrink:'0',accentColor:'#34d399',cursor:'pointer'},
    oninput:(e)=>{e.stopPropagation(); audio.volume=parseFloat(e.target.value); volIcon.textContent=audio.volume===0?'🔇':(audio.volume<0.5?'🔉':'🔊');},
    onclick:(e)=>e.stopPropagation()
  });
  const sureBilgisiGuncelle=()=>{
    if(Number.isFinite(audio.duration) && audio.duration>0){
      seekSlider.max=String(audio.duration);
      toplamSure.textContent=suretMetniFormatla(audio.duration);
    }
  };
  audio.addEventListener('loadedmetadata',sureBilgisiGuncelle);
  audio.addEventListener('durationchange',sureBilgisiGuncelle);
  audio.addEventListener('timeupdate',()=>{
    if(siruklemedeMi) return;
    seekSlider.value=String(audio.currentTime);
    gecenSure.textContent=suretMetniFormatla(audio.currentTime);
  });
  audio.addEventListener('play',()=>{playBtn.textContent='⏸️';});
  audio.addEventListener('pause',()=>{playBtn.textContent='▶️';});
  audio.addEventListener('ended',()=>{playBtn.textContent='▶️'; seekSlider.value='0'; gecenSure.textContent='0:00';});
  if(!audio.paused) playBtn.textContent='⏸️';
  sureBilgisiGuncelle();
  seekSlider.value=String(audio.currentTime||0);
  gecenSure.textContent=suretMetniFormatla(audio.currentTime||0);
  wrap.appendChild(label);
  wrap.appendChild(playBtn);
  wrap.appendChild(stopBtn);
  wrap.appendChild(gecenSure);
  wrap.appendChild(seekSlider);
  wrap.appendChild(toplamSure);
  wrap.appendChild(volIcon);
  wrap.appendChild(volSlider);
  // opts.onDelete verilirse (yetki varsa) sona bir 🗑️ kaldırma tuşu eklenir.
  if(typeof opts.onDelete==='function'){
    const delBtn=h('button',{class:'btn',title:'Kaldır',style:{background:'#2a0f14',border:'1px solid #7f1d1d',borderRadius:'50%',width:'28px',height:'28px',display:'flex',alignItems:'center',justifyContent:'center',color:'#fca5a5',fontSize:'.75rem',flexShrink:'0',padding:'0',lineHeight:'1'},
      onclick:async(e)=>{
        e.stopPropagation();
        if(!confirm(`${etiketMetni} kaldırılsın mı? Bu işlem geri alınamaz.`)) return;
        delBtn.disabled=true; delBtn.textContent='⏳';
        try{
          audio.pause(); audio.currentTime=0;
          await opts.onDelete();
        }catch(err){
          alert('Kaldırılamadı: '+err.message);
          delBtn.disabled=false; delBtn.textContent='🗑️';
        }
      }
    },'🗑️');
    wrap.appendChild(delBtn);
  }
  return { el:wrap, audio };
}
// Otomatik bulunmuş bir GIF'in (post.autoGif) üzerine, varsa post.gifCaption metnini
// alt kısımda okunaklı bir gradyan üzerinde bindirir. imgEl'i saran, position:relative
// bir wrapper döndürür; caption yoksa imgEl aynen (değişmeden) geri döner.
// opts.marginBottom / opts.borderRadius, imgEl'in ORİJİNAL inline stilinden wrapper'a taşınır
// (imgEl kendisi marginBottom:0 olur), böylece dış görünüm/aralıklar bozulmaz.
function gifUzeriAforizmaBindir(imgEl, post, opts={}){
  if(!post?.autoGif || !post?.gifCaption) return imgEl;
  const marginBottom = opts.marginBottom || '0';
  const borderRadius = opts.borderRadius || '0';
  imgEl.style.marginBottom = '0';
  imgEl.style.display = 'block';
  const wrap = h('div',{style:{position:'relative',width:'100%',marginBottom,borderRadius,overflow:'hidden'}});
  wrap.appendChild(imgEl);
  const capBox = h('div',{style:{
    position:'absolute',left:'0',right:'0',bottom:'0',
    padding:'26px 16px 12px',
    background:'linear-gradient(to top, rgba(10,7,20,.92), rgba(10,7,20,.05) 80%, transparent)',
    pointerEvents:'none'
  }});
  const capText = h('p',{style:{
    fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontWeight:'700',
    color:'#f5edff',fontSize:'.92rem',lineHeight:'1.45',textAlign:'center',
    textShadow:'0 2px 10px rgba(0,0,0,.7)'
  }});
  capText.textContent = `"${post.gifCaption}"`;
  capBox.appendChild(capText);
  wrap.appendChild(capBox);
  return wrap;
}

A.addPost = async function(pd){
    if(!S.me) return;
    // Güvenlik ağı: normalde bu limit paylaşım modalındaki "Paylaş" tuşunda zaten
    // engelleniyor (bkz. Compose modal), ama A.addPost başka bir yerden çağrılırsa
    // diye burada da aynı günlük limit tekrar kontrol ediliyor.
    if(bugunkuPaylasimSayisi(S.me.id)>=3){
      alert('Depolama ve zeka kotalarımız dolduğu için yarın paylaşım rica ederiz, aynı gün içinde sadece 3 paylaşabilirsiniz.');
      go('feed');
      return;
    }
    const hasText=pd.text&&pd.text.trim().length>10;

    // Şiiri önce hiçbir AI/bot puanı olmadan kaydet (hızlı görünüm için)
    const np={...pd,id:uid(),authorId:S.me.id,ts:Date.now(),
      userRatings:{},
      botYorumlar:{},
      aiScore:null,aiYorum:null,aiGuclu:null,aiOneri:null,
      comments:[],date:now()};
    S.posts.unshift(np);
    save();render();

    if(hasText){
      // DÜZELTME: Önceden ana puan ve 3 bot yorumu (duyu/katlı/arı) 4 AYRI istek
      // olarak gönderiliyordu — bu hem günlük kotayı 4 katına çıkarıyor hem de her
      // istek ayrı ayrı başarısız/başarılı olabildiği için (ör. Gemini ana isteği
      // geçse bile ardından atılan 2-3 bot isteği rate-limit'e takılabiliyordu)
      // TUTARSIZ sonuçlara yol açıyordu: ana yorum geliyor ama duyu/arı-yorum
      // gelmiyordu. Artık TEK istekte hem ana puan hem 3 bot yorumu birlikte
      // isteniyor (bkz. aiKullaniciPromptuOlustur) — 4 sonuç da HER ZAMAN aynı
      // tek API çağrısından, aynı modelden gelir; kota kullanımı da 4'te 1'e iner.
      const r = await scorePoem(pd.text, 'auto');
      const kullanilanModel = groqKota.sonKaynak==='yerel' ? 'yerel' : (groqKota.sonModel||groqKota.sonKaynak);
      const {b1,b2,b3} = botlariBirlesikSonuctanCikar(r);

      const idx=S.posts.findIndex(p=>p.id===np.id);
      if(idx>-1){
        const yeniRatings={...S.posts[idx].userRatings};
        const yeniBotYorumlar={...S.posts[idx].botYorumlar};
        if(b1){yeniRatings[b1.kullanici]=b1.puan;yeniBotYorumlar[b1.kullanici]={yorum:b1.yorum,ad:b1.ad};}
        if(b2){yeniRatings[b2.kullanici]=b2.puan;yeniBotYorumlar[b2.kullanici]={yorum:b2.yorum,ad:b2.ad};}
        if(b3){yeniRatings[b3.kullanici]=b3.puan;yeniBotYorumlar[b3.kullanici]={yorum:b3.yorum,ad:b3.ad};}
        if(r){yeniRatings['bot_ai_yorum']=r.score;}
        S.posts[idx].userRatings=yeniRatings;
        S.posts[idx].botYorumlar=yeniBotYorumlar;
        if(r){
          S.posts[idx].aiScore=r.score;
          S.posts[idx].aiYorum=r.yorum;
          S.posts[idx].aiGuclu=r.gucluYonler;
          S.posts[idx].aiOneri=r.gelistirmeOnerisi;
          S.posts[idx].aiModel=kullanilanModel;
        }
        save();
        refreshCard(np.id);
        // DÜZELTME: Burada önceden ayrıca bir db.collection("posts").doc(np.id).update({...})
        // çağrısı da vardı. Ama bu satıra gelindiğinde belge Firestore'da HENÜZ
        // OLUŞMAMIŞ oluyordu — belgeyi yaratan .set(np) çağrısı bundan sonraki
        // satırda (if bloğunun dışında). Yani bu update() her zaman "No document
        // to update" hatasıyla başarısız oluyordu (bkz. konsol hatası). Veri kaybı
        // yoktu çünkü S.posts[idx] (np ile aynı referans) burada zaten güncellendiği
        // için aşağıdaki .set(np) tüm AI alanlarını da (userRatings/aiScore/...)
        // içeriyor — bu yüzden ayrı update() çağrısı gereksizdi, kaldırıldı.
      }
    }
    db.collection("posts").doc(np.id).set(np).catch(err=>console.error("Kaydetme hatası:",err));
    facebookOnizlemeyiTazele(np.id);
    otomatikGifUygulaGerekirse(np.id, np.title, np.text, np.image, np.youtube);
    // Kullanıcı "🎙️ Ses Ekle" ile kendi ses linkini zaten girdiyse, otomatik
    // TTS onun üzerine yazmasın diye ATLANIR.
    if(!np.audioUrl){
      otomatikSesUygulaGerekirse(np.id, np.title, np.text);
    }

    // Takipçilere yeni paylaşım bildirimi gönder
    const takipciler = Object.keys(S.follows).filter(uid => (S.follows[uid]||[]).includes(S.me.id));
    if(takipciler.length){
      const baslik = np.title || np.text?.slice(0,20) || 'yeni bir şiir';
      const paylasan = S.me.name||S.me.username;
      takipciler.forEach(fid => A.addNotif(fid, `${paylasan} yeni bir şiir paylaştı: "${baslik}"`, {postId:np.id}));
    }
};

// Şiir sahibi kendi paylaşımının başlığını/metnini/görselini/YouTube linkini düzenler.
// AI puanı ve mevcut yorumlar korunur (yeniden değerlendirme yapılmaz), sadece
// "(düzenlendi)" ibaresi eklenir.
A.editPost = function(pid, updates){
    if(!S.me) return;
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex<0) return;
    const post = S.posts[pIndex];
    const isAdmin = S.me.username === ADMIN_USERNAME;
    if(post.authorId !== S.me.id && !isAdmin) return;
    const eskiGorsel = post.image;
    const eskiAudioUrl = post.audioUrl;
    S.posts[pIndex] = {...post, ...updates, edited:true};
    save();
    refreshCard(pid);
    db.collection("posts").doc(pid).update({...updates, edited:true}).catch(err=>console.error("Düzenleme hatası:",err));
    facebookOnizlemeyiTazele(pid);
    // Görsel veya ses değiştirildi/kaldırıldıysa, artık kullanılmayan eski
    // dosyayı depodan temizle (musicUrl kasıtlı olarak burada da yok —
    // paylaşılan sabit müzik kütüphanesine işaret ediyor, silinmemeli).
    if(Object.prototype.hasOwnProperty.call(updates,'image') && eskiGorsel && eskiGorsel!==updates.image){
      eskiMedyaTemizle([eskiGorsel]);
    }
    if(Object.prototype.hasOwnProperty.call(updates,'audioUrl') && eskiAudioUrl && eskiAudioUrl!==updates.audioUrl){
      eskiMedyaTemizle([eskiAudioUrl]);
    }
    const guncelPost = S.posts[pIndex];
    // Düzenleme sırasında image alanı özellikle gönderildiyse (yeni resim seçildi
    // veya mevcut resim kaldırıldı) otomatik GIPHY çalıştırma. Kullanıcının seçimini
    // ezip tekrar GIF getirmemeli. Yeni paylaşım akışındaki otomatik GIF mantığı
    // A.addPost içinde aynen devam eder.
    if(!Object.prototype.hasOwnProperty.call(updates,'image')){
      otomatikGifUygulaGerekirse(pid, guncelPost.title, guncelPost.text, guncelPost.image, guncelPost.youtube);
    }
};

// tur: 'like' | 'dislike' | 'heart'. like/dislike birbirini dışlar (biri seçilince öteki kalkar),
// kalp bunlardan bağımsızdır. Aynı butona tekrar basmak tepkiyi kaldırır (toggle).
A.react = function(pid, tur){
    if(!S.me) return;
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex<0) return;
    const post = S.posts[pIndex];
    if(!post.reactions) post.reactions = {like:[],dislike:[],heart:[]};
    ['like','dislike','heart'].forEach(t=>{ if(!post.reactions[t]) post.reactions[t]=[]; });
    const meId = S.me.id;
    const zatenVar = post.reactions[tur].includes(meId);
    if(zatenVar){
      post.reactions[tur] = post.reactions[tur].filter(id=>id!==meId);
    } else {
      post.reactions[tur] = [...post.reactions[tur], meId];
      if(tur==='like')    post.reactions.dislike = post.reactions.dislike.filter(id=>id!==meId);
      if(tur==='dislike') post.reactions.like    = post.reactions.like.filter(id=>id!==meId);
      if(tur!=='dislike'){
        const postTitle=post.title||post.text?.slice(0,20)||'şiirinize';
        const eylem = tur==='like' ? 'beğendi' : 'kalp attı';
        A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinizi ${eylem}.`, {postId:post.id});
      }
    }
    save();
    refreshCard(pid);
    db.collection("posts").doc(pid).update({reactions:post.reactions}).catch(err=>console.error("Tepki hatası:",err));
};

A.addComment = function(pid,text,parentId=null,media=null){
    if(!S.me) return;
    const pIndex = S.posts.findIndex(p=>p.id===pid);
    if(pIndex > -1) {
      const post=S.posts[pIndex];
      let gercekParentId = null;
      if(parentId){
        const parentYorum = (post.comments||[]).find(c=>c.id===parentId);
        gercekParentId = parentYorum ? (parentYorum.parentId || parentYorum.id) : null;
      }
      const newComment = {id:uid(),authorId:S.me.id,text:(text||'').trim(),date:now(),parentId:gercekParentId};
      if(media) newComment.media=media;
      const updatedComments = [...(post.comments || []), newComment];
      S.posts[pIndex].comments = updatedComments;
      save();
      refreshCard(pid);
      const postTitle=post.title||post.text?.slice(0,20)||'şiirinize';
      if(gercekParentId){
        const asilYorum = (post.comments||[]).find(c=>c.id===gercekParentId);
        if(asilYorum){
          A.addNotif(asilYorum.authorId, `Sizin "${postTitle}" şiirine yazdığınız yoruma ${S.me.name||S.me.username} yanıt verdi.`, {postId:post.id,tur:'yanit',commentId:gercekParentId});
        }
      } else {
        A.addNotif(post.authorId, `${S.me.name||S.me.username} sizin "${postTitle}" başlıklı şiirinize yorum yaptı.`, {postId:post.id,tur:'yorum',commentId:newComment.id});
      }
      db.collection("posts").doc(pid).update({ comments: updatedComments }).catch(err=>console.error("Yorum kaydetme hatası:",err));
    }
};
